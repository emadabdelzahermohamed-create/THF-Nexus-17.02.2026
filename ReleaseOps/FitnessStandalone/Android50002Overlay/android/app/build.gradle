plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.topherofit.thf.pulse'
    compileSdk 36
    defaultConfig {
        applicationId 'com.topherofit.thf.pulse'
        minSdk 26
        targetSdk 36
        versionCode 50002
        versionName '5.0.0-standalone-rc3'
        def baseUrl = project.findProperty('THF_BASE_URL') ?: ''
        def passUrl = project.findProperty('THF_PASS_URL') ?: ''
        buildConfigField 'String', 'THF_BASE_URL', '"' + baseUrl.replace('\\','\\\\').replace('"','\\"') + '"'
        buildConfigField 'String', 'THF_PASS_URL', '"' + passUrl.replace('\\','\\\\').replace('"','\\"') + '"'
        buildConfigField 'String', 'THF_APP_SLUG', '"pulse"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
