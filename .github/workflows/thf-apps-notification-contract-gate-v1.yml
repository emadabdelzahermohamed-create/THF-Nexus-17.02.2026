name: THF Apps Notification Contract Gate V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/apps_factory/contracts/thf_notifications_v1.json'
      - 'ReleaseOps/validators/validate_thf_notifications_contract.py'
      - 'ReleaseOps/validators/test_validate_thf_notifications_contract.py'
      - '.github/workflows/thf-apps-notification-contract-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Validate contract
        run: python ReleaseOps/validators/validate_thf_notifications_contract.py
      - name: Regression tests
        run: python -m pytest -q ReleaseOps/validators/test_validate_thf_notifications_contract.py
