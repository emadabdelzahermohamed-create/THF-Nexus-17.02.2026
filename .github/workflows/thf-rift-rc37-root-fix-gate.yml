name: THF Rift RC37 Root Fix Gate
on:
  push:
    branches: ['r/r37']
    paths: ['.github/workflows/thf-rift-rc37-root-fix-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  FULL_NAME: THF_Rift_v4.7.1_RC37_HUMAN_RELOAD_TIMING_PARITY_CUMULATIVE_SOURCE.zip
  FULL_SHA: 3e2407d4aa76d4d23f4f0a0c3ccb02f02f1a9522b42518a38c03e0f01775e914
jobs:
  root-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Run RC37 gate from discovered Godot project root
        shell: bash
        run: |
          set -uo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command="FULL_NAME='$FULL_NAME' FULL_SHA='$FULL_SHA' bash -s" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/rift-root-fix.log"
          set -Eeuo pipefail
          BASE_HOME="$HOME"; ROOT="$BASE_HOME/thf-rift-rc37-gate"; INPUT="$ROOT/input"; WORK="$ROOT/work-fix"; OUT="$ROOT/out-fix"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT/android"
          echo "$FULL_SHA  $INPUT/$FULL_NAME" | sha256sum -c -
          unzip -q "$INPUT/$FULL_NAME" -d "$WORK"
          PROJECT_GODOT="$(find "$WORK" -maxdepth 3 -type f -name project.godot -print -quit)"
          test -n "$PROJECT_GODOT"; PROJECT="$(dirname "$PROJECT_GODOT")"
          test -f "$PROJECT/export_presets.cfg"
          PRESET="$(sed -n 's/^name="\([^"]*\)"/\1/p' "$PROJECT/export_presets.cfg" | head -1)"; test -n "$PRESET"
          GODOT="$BASE_HOME/thf-tools/godot/4.7.2-stable/godot"; test -x "$GODOT"
          SDK="$BASE_HOME/thf-builder-rc16-build/android-sdk"; test -x "$SDK/build-tools/36.0.0/aapt2"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ISO_HOME="$ROOT/godot-home-fix"; rm -rf "$ISO_HOME"; mkdir -p "$ISO_HOME/.config/godot"
          cat > "$ISO_HOME/.config/godot/editor_settings-4.7.tres" <<EOF
[gd_resource format=3]

[resource]
export/android/android_sdk_path = "$SDK"
export/android/java_sdk_path = "$JAVA_HOME_REAL"
EOF
          export HOME="$ISO_HOME" ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK" JAVA_HOME="$JAVA_HOME_REAL"
          export PATH="$JAVA_HOME/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"
          set +e
          timeout 15m "$GODOT" --headless --editor --path "$PROJECT" --quit --verbose >"$OUT/editor-import.log" 2>&1; import_rc=$?
          timeout 5m "$GODOT" --headless --path "$PROJECT" --quit-after 30 --verbose >"$OUT/headless-boot.log" 2>&1; boot_rc=$?
          export_rc=99
          if [ "$import_rc" -eq 0 ] && [ "$boot_rc" -eq 0 ]; then timeout 20m "$GODOT" --headless --path "$PROJECT" --export-debug "$PRESET" "$OUT/android/THF-Rift-RC37-test.aab" >"$OUT/android-export.log" 2>&1; export_rc=$?; fi
          set -e
          aab=''; [ -f "$OUT/android/THF-Rift-RC37-test.aab" ] && aab="$(sha256sum "$OUT/android/THF-Rift-RC37-test.aab" | awk '{print $1}')"
          status=FAIL; [ "$import_rc" -eq 0 ] && [ "$boot_rc" -eq 0 ] && [ "$export_rc" -eq 0 ] && [ -n "$aab" ] && status=PASS
          printf 'status=%s\nproject_root=%s\npreset=%s\ncanonical_sha256=%s\nimport_rc=%s\nboot_rc=%s\nandroid_export_rc=%s\naab_sha256=%s\nproduction_signing=false\ncanonical_archive_mutated=false\nwave_untouched=true\n' "$status" "$PROJECT" "$PRESET" "$FULL_SHA" "$import_rc" "$boot_rc" "$export_rc" "$aab" | tee "$OUT/TRUTH.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -czf "$ROOT/root-fix-evidence.tgz" -C "$ROOT" out-fix
          [ "$status" = PASS ]
          REMOTE
          rc=${PIPESTATUS[0]}; echo "RIFT_ROOT_FIX_RC=$rc" >> "$GITHUB_ENV"; exit 0
      - name: Retrieve evidence
        if: always()
        shell: bash
        run: |
          set -e; mkdir -p rift-root-fix-evidence
          gcloud compute scp "$GCP_BUILDER:~/thf-rift-rc37-gate/root-fix-evidence.tgz" rift-root-fix-evidence/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          cp "$RUNNER_TEMP/rift-root-fix.log" rift-root-fix-evidence/ || true
          printf 'canonical_sha256=%s\nremote_rc=%s\nproduction_signing=false\nwave_untouched=true\n' "$FULL_SHA" "${RIFT_ROOT_FIX_RC:-missing}" > rift-root-fix-evidence/RUNNER_SUMMARY.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Rift-RC37-root-fix-evidence
          path: rift-root-fix-evidence/
          retention-days: 14
      - name: Final gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail; [ "${RIFT_ROOT_FIX_RC:-missing}" = 0 ]; echo RIFT_RC37_ROOT_FIX_GATE=PASS; echo PRODUCTION_SIGNING=NOT_PERFORMED; echo WAVE_UNTOUCHED=TRUE
