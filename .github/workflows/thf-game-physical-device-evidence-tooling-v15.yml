name: THF Game Physical Device Evidence Tooling V15
on:
  push:
    paths:
      - 'ReleaseOps/mobile/validate_game_device_evidence_v15.py'
      - 'ReleaseOps/mobile/test_validate_game_device_evidence_v15.py'
      - '.github/workflows/thf-game-physical-device-evidence-tooling-v15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V7-V15 validators and tests
        run: |
          for v in 7 8 9 10 11 12 13 14 15; do python -m py_compile ReleaseOps/mobile/validate_game_device_evidence_v${v}.py; done
          python -m py_compile ReleaseOps/mobile/test_validate_game_device_evidence_v14.py ReleaseOps/mobile/test_validate_game_device_evidence_v15.py
      - name: Preserve V14 regression chain
        run: python ReleaseOps/mobile/test_validate_game_device_evidence_v14.py -v
      - name: Run V15 foreground process regressions
        run: python ReleaseOps/mobile/test_validate_game_device_evidence_v15.py -v
      - name: Assert V15 remains non-promotional
        run: |
          grep -q 'FINAL_OR_PLAY_READY=FALSE' ReleaseOps/mobile/validate_game_device_evidence_v15.py
          ! grep -q 'FINAL_OR_PLAY_READY=TRUE' ReleaseOps/mobile/validate_game_device_evidence_v15.py
          grep -q 'THF_FOREGROUND_PACKAGE' ReleaseOps/mobile/validate_game_device_evidence_v15.py
          grep -q 'THF_FOREGROUND_PID' ReleaseOps/mobile/validate_game_device_evidence_v15.py
          grep -q 'THF_GAMEPLAY_EVIDENCE_SHA256' ReleaseOps/mobile/validate_game_device_evidence_v15.py
