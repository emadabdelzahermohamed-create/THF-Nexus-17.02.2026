name: RuinsCiv Play Metadata Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync canonical RuinsCiv bilingual listing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json,google.auth
          from googleapiclient.discovery import build
          package='com.topherofit.ruins.civ'
          meta={
            'ar':{
              'title':'RuinsCiv',
              'shortDescription':'عالم اجتماعي ثلاثي الأبعاد للاستكشاف والمهام والتقدم واللعب المحلي.',
              'fullDescription':'RuinsCiv عالم اجتماعي ثلاثي الأبعاد مبني للاستكشاف والتفاعل والتقدم داخل بيئة حية. تحرك بشخصيتك داخل العالم باستخدام تحكم مخصص للهاتف، وجّه الكاميرا، وتفاعل مع البيئة والشخصيات والمهام والأنشطة. يركز الإصدار الحالي على ثبات الحركة والكاميرا وتجربة العالم والأداء الحقيقي على الهاتف، مع مسارات لعب محلية لا تعتمد على اتصال دائم بالشبكة ووظائف اجتماعية متصلة عند الحاجة. يتم توسيع العالم والمحتوى تدريجيًا مع الحفاظ على اختبارات فعلية للأداء والتحكم والجودة.'
            },
            'en-US':{
              'title':'RuinsCiv',
              'shortDescription':'Explore a living 3D social world with quests, progression and local play.',
              'fullDescription':'RuinsCiv is a living 3D social world built around exploration, interaction and progression. Move through the world with mobile-first character and camera controls, interact with the environment, characters, quests and activities, and use local-play paths that do not require a permanent network connection. Connected social features use the network when needed. The current release focuses on reliable movement, camera control, world interaction and real-device performance while the world and its activities continue to expand.'
            }
          }
          for lang,x in meta.items():
            assert len(x['title'])<=30 and len(x['shortDescription'])<=80 and len(x['fullDescription'])<=4000
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher']); api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']; out={'package':package,'committed':False}
          try:
            details=api.edits().details().get(packageName=package,editId=edit).execute(); details['defaultLanguage']='ar'; details['contactEmail']='TopHeroFit@gmail.com'; api.edits().details().update(packageName=package,editId=edit,body=details).execute()
            for lang,body in meta.items(): api.edits().listings().update(packageName=package,editId=edit,language=lang,body={'language':lang,**body}).execute()
            v=api.edits().validate(packageName=package,editId=edit).execute(); out['validationId']=v.get('id'); c=api.edits().commit(packageName=package,editId=edit).execute(); out['committed']=True; out['committedEditId']=c.get('id'); edit=None
          finally:
            if edit:
              try: api.edits().delete(packageName=package,editId=edit).execute()
              except Exception: pass
          print(json.dumps(out,indent=2)); open('ruinsciv-play-metadata-sync.json','w').write(json.dumps(out,indent=2))
          if not out['committed']: raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruinsciv-play-metadata-sync
          path: ruinsciv-play-metadata-sync.json
          if-no-files-found: error
          retention-days: 30
