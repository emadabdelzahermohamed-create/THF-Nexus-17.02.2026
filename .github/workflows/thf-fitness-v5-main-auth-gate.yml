name: THF Fitness V5 Main Auth Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-v5-main-auth-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FITNESS_BRANCH: release/fitness-standalone-v1-20260918
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  SOURCE_DRIVE_FILE_ID: 1gcOkJ-EXnCEbCHMcBSUWAwVcQxj4j40-
  SOURCE_SHA256: 2290c5897eab827dd778204de03f6f70c49fd162a32d187e4844172ececf7b74
  AVATAR_SHA256: 4f556086e1b7149f6c958f1f399f4368f6ad9b76afd3503d6f848eeeb7bea24f
  THF_FITNESS_BASE_URL: https://thf-fitness-pulse-ul26f1.v2.appdeploy.ai/

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical Fitness release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FITNESS_BRANCH }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Download exact V5 RC2 source from Drive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${SOURCE_DRIVE_FILE_ID}?alt=media&supportsAllDrives=true" \
            -o fitness-source.zip
          echo "$SOURCE_SHA256  fitness-source.zip" | sha256sum -c -
          mkdir -p build/fitness
          unzip -q fitness-source.zip -d build/fitness

      - name: Verify release authority and canonical human
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/fitness
          test -f "$ROOT/STANDALONE_IDENTITY_V5.json"
          grep -q '"version": "5.0.0-standalone-rc2"' "$ROOT/STANDALONE_IDENTITY_V5.json"
          grep -q "targetSdk 36" "$ROOT/android/app/build.gradle"
          grep -q "applicationId 'com.topherofit.thf.pulse'" "$ROOT/android/app/build.gradle"
          grep -q "versionCode 50001" "$ROOT/android/app/build.gradle"
          test -f "$ROOT/static/assets/avatar/thf_mpfb_stage16a_ual12_animated.glb"
          echo "$AVATAR_SHA256  $ROOT/static/assets/avatar/thf_mpfb_stage16a_ual12_animated.glb" | sha256sum -c -
          ! grep -RniE --exclude='*.glb' 'thf_humanoid_v[1-6]|stage15j_ual1_animated\.glb' "$ROOT/app" "$ROOT/templates" "$ROOT/static" "$ROOT/android"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd build/fitness
          python -m pip install -r requirements.txt
          python -m compileall -q app
          pytest -q

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Materialize production signing inputs from Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thf-signing"
          gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-keystore-b64 | base64 -d > "$RUNNER_TEMP/thf-signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/thf-signing/upload.jks"
          echo "THF_UPLOAD_KEYSTORE=$RUNNER_TEMP/thf-signing/upload.jks" >> "$GITHUB_ENV"
          for spec in \
            THF_UPLOAD_STORE_PASSWORD:thf-fitness-upload-store-password \
            THF_UPLOAD_KEY_ALIAS:thf-fitness-upload-key-alias \
            THF_UPLOAD_KEY_PASSWORD:thf-fitness-upload-key-password; do
            var="${spec%%:*}"; secret="${spec#*:}"
            value="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret "$secret")"
            echo "::$'add-mask'::$value" | sed "s/\$'add-mask'/add-mask/"
            printf '%s=%s\n' "$var" "$value" >> "$GITHUB_ENV"
          done
          keytool -list -keystore "$RUNNER_TEMP/thf-signing/upload.jks" -storepass "$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-store-password)" >/dev/null
          python ReleaseOps/FitnessStandalone/apply_android_signing.py build/fitness/android/app/build.gradle

      - name: Android API 36 signed release gate
        shell: bash
        env:
          THF_FITNESS_BASE_URL: ${{ env.THF_FITNESS_BASE_URL }}
          THF_PASS_URL: ${{ vars.THF_PASS_URL }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          cd build/fitness/android
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon clean assembleDebug bundleRelease -PTHF_BASE_URL="$THF_FITNESS_BASE_URL" -PTHF_PASS_URL="$THF_PASS_URL"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/artifacts/THF-Fitness-V5-RC2-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/artifacts/THF-Fitness-V5-RC2-signed.aab"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum THF-Fitness-V5-RC2-debug.apk THF-Fitness-V5-RC2-signed.aab > SHA256SUMS.txt
          {
            echo "source_sha256=$SOURCE_SHA256"
            echo "avatar_sha256=$AVATAR_SHA256"
            echo "base_url=$THF_FITNESS_BASE_URL"
            echo "base_url_configured=yes"
            echo "pass_url_configured=$([[ -n "$THF_PASS_URL" ]] && echo yes || echo no)"
            echo "standalone_identity_mode=yes"
            echo "release_signed=yes"
            echo "play_publish_ready=no"
            echo "reason=Play upload and physical-device acceptance remain separate gated steps"
          } > BUILD_GATE.txt

      - name: Upload signed V5 RC2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-v5-rc2-signed-release
          path: |
            artifacts/THF-Fitness-V5-RC2-debug.apk
            artifacts/THF-Fitness-V5-RC2-signed.aab
            artifacts/SHA256SUMS.txt
            artifacts/BUILD_GATE.txt
          retention-days: 14
