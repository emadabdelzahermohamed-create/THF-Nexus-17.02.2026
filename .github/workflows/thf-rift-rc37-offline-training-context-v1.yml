name: THF Rift RC37 Process Context V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-rift-rc37-offline-training-context-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  RIFT_SHA256: 3e2407d4aa76d4d23f4f0a0c3ccb02f02f1a9522b42518a38c03e0f01775e914

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Extract process/session/camera blocks from exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command="RIFT_SHA256='$RIFT_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          SRC="$HOME/thf-rift-rc37-gate/input/THF_Rift_v4.7.1_RC37_HUMAN_RELOAD_TIMING_PARITY_CUMULATIVE_SOURCE.zip"
          test "$(sha256sum "$SRC"|awk '{print $1}')" = "$RIFT_SHA256"
          ROOT=$(mktemp -d "$HOME/rift-process.XXXXXX"); trap 'rm -rf "$ROOT"' EXIT
          unzip -q "$SRC" -d "$ROOT"
          F=$(find "$ROOT" -type f -path '*/native/arena/ArenaMain.gd' -print -quit); test -n "$F"
          python3 - "$F" <<'PY'
          import pathlib,re,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for name in ('_process','_sync_session','_update_camera'):
            start=next(i for i,l in enumerate(lines) if re.match(r'^func\s+'+re.escape(name)+r'\s*\(',l))
            end=len(lines)
            for j in range(start+1,len(lines)):
              if re.match(r'^func\s+[A-Za-z0-9_]+\s*\(',lines[j]): end=j; break
            print(f'===== {name} {start+1}-{end} =====')
            for k in range(start,end): print(f'{k+1:05d}: {lines[k]}')
          PY
          REMOTE
