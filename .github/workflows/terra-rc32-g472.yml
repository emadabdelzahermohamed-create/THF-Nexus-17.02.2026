name: Terra RC32 G472 Gate
on:
  push:
    branches: ['terra/rc32-g472-20260912']
    paths: ['.github/workflows/terra-rc32-g472.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  P0: 1unN6-iLtu_nypKIqo-m_m8ZaLbSsGlk3
  P1: 17ZvxPPh0JPInELSnm2ziaPIXuEnrZxo8
  P0SHA: 4bfe9989563b8da1822e74b79531a2dd218131981277c05e01a712eabf0866c5
  P1SHA: 4a00574c817f41a9492da20e19a023ebd39c7ba41f4573efea841c8a57b39cdc
  ARCSHA: 389ca92b1b2675340f2bf7128f2cf6470bce0af5ea89602d33da2ae6c99b3695
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Stage exact RC32
        env: { ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}' }
        shell: bash
        run: |
          set -Eeuo pipefail; mkdir -p /tmp/t/project
          curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://www.googleapis.com/drive/v3/files/${P0}?alt=media" -o /tmp/t/p0
          curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://www.googleapis.com/drive/v3/files/${P1}?alt=media" -o /tmp/t/p1
          echo "${P0SHA}  /tmp/t/p0"|sha256sum -c -; echo "${P1SHA}  /tmp/t/p1"|sha256sum -c -
          cat /tmp/t/p0 /tmp/t/p1 >/tmp/t/a.zip; echo "${ARCSHA}  /tmp/t/a.zip"|sha256sum -c -; unzip -q /tmp/t/a.zip -d /tmp/t/project
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          j="$(curl -fsSL https://api.github.com/repos/godotengine/godot-builds/releases/tags/4.7.2-stable)"; a=Godot_v4.7.2-stable_linux.x86_64.zip
          u="$(printf '%s' "$j"|jq -r --arg a "$a" '.assets[]|select(.name==$a)|.browser_download_url')"; d="$(printf '%s' "$j"|jq -r --arg a "$a" '.assets[]|select(.name==$a)|.digest')"
          curl -fsSL "$u" -o /tmp/t/g.zip; echo "${d#sha256:}  /tmp/t/g.zip"|sha256sum -c -; unzip -q /tmp/t/g.zip -d /tmp/t/g
          b="$(find /tmp/t/g -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"; chmod +x "$b"; ln -s "$b" /tmp/t/godot; /tmp/t/godot --version | tee /tmp/t/version.txt
      - name: Clean import
        shell: bash
        run: |
          set -o pipefail; cd /tmp/t/project; rm -rf .godot
          /tmp/t/godot --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/t/import.log
          if grep -E -n 'SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot get class|Could not resolve class' /tmp/t/import.log; then exit 31; fi
      - name: 30-frame headless
        shell: bash
        run: |
          set -o pipefail; cd /tmp/t/project
          /tmp/t/godot --headless --path . --quit-after 30 --verbose 2>&1 | tee /tmp/t/headless.log
          if grep -E -n 'SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot get class|Could not resolve class' /tmp/t/headless.log; then exit 32; fi
      - name: Evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/t/evidence; cp /tmp/t/version.txt /tmp/t/import.log /tmp/t/headless.log /tmp/t/evidence/ 2>/dev/null || true
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          d=pathlib.Path('/tmp/t/evidence'); bad=('SCRIPT ERROR:','Parse Error:','Failed to load script','Cannot get class','Could not resolve class')
          def rd(n): p=d/n; return p.read_text(errors='replace') if p.exists() else ''
          r={'release':'TERRA-RC32','source_sha256':os.environ['ARCSHA'],'godot_version':rd('version.txt').strip() or None,'clean_import_no_script_signatures':bool(rd('import.log')) and not any(x in rd('import.log') for x in bad),'headless_30_no_script_signatures':bool(rd('headless.log')) and not any(x in rd('headless.log') for x in bad),'gpu_device_visual_qa':'NOT_EXECUTED','production_signed_aab':'NOT_CLAIMED'}
          p=d/'result.json';p.write_text(json.dumps(r,indent=2)+'\n');(d/'result.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  result.json\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: terra-rc32-g472-evidence, path: /tmp/t/evidence, if-no-files-found: error}
