name: Fitness 51016 Internal Promote

on:
  push:
    branches:
      - agent/codex/fitness-recovery/20261023
    paths:
      - '.github/workflows/fitness-51008-internal-promote.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: fitness-google-play-internal
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  EXPECTED_FITNESS_UPLOAD_SHA1: D8:BB:CA:BC:17:78:03:43:2E:5D:95:7B:19:61:D2:03:6A:3A:03:06
  SOURCE_RUN_ID: '40388541018'
  EXPECTED_VERSION: '51016'
  PACKAGE_NAME: com.topherofit.thf.pulse

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exact green 51016 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion' | grep -x success
          mkdir -p candidate evidence
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" -n fitness-activity-candidate-51016 -D candidate
          AAB="$(find candidate -type f -path '*/bundle/release/app-release.aab' | head -n1)"
          BUILD_INFO="$(find candidate -type f -name candidate-51016-build.txt | head -n1)"
          test -s "$AAB"; test -s "$BUILD_INFO"
          grep -F 'VERSION_CODE=51016' "$BUILD_INFO"
          grep -F 'GIT_SHA=e0e8e785fdcb0c672205e7f041ccd99bbd71ac22' "$BUILD_INFO"
          echo "a80fd62d68e0e565793521f6e1c00e7687e8729a546793e6dec81d5bd27ab98c  $AAB" | sha256sum -c -
          sha256sum "$AAB" | tee evidence/aab-before-sign.sha256
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
      - name: Authenticate for upload key and Android Publisher
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Sign exact AAB with Play-bound upload key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/thf-fitness-upload.jks"
          gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-keystore-b64 | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          STORE_PASSWORD="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-store-password)"
          KEY_ALIAS="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-key-alias)"
          KEY_PASSWORD="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-key-password)"
          echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > evidence/upload-key.txt
          grep -F "SHA1: $EXPECTED_FITNESS_UPLOAD_SHA1" evidence/upload-key.txt
          jarsigner -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_PATH" "$KEY_ALIAS"
          rm -f "$KEYSTORE"; unset STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          jarsigner -verify -verbose -certs "$AAB_PATH" > evidence/aab-jarsigner.txt 2>&1
          grep -F 'jar verified.' evidence/aab-jarsigner.txt
          keytool -printcert -jarfile "$AAB_PATH" > evidence/aab-signer-cert.txt
          grep -F "SHA1: $EXPECTED_FITNESS_UPLOAD_SHA1" evidence/aab-signer-cert.txt
          sha256sum "$AAB_PATH" | tee evidence/aab-signed.sha256
      - name: Validate bundle identity
        shell: bash
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.3
          BUNDLETOOL_SHA256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          curl -fsSL "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" -o "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB_PATH" | tee evidence/bundletool-validate.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB_PATH" --module=base > evidence/manifest.xml
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse('evidence/manifest.xml').getroot(); a='{http://schemas.android.com/apk/res/android}'
          uses=root.find('uses-sdk'); package=root.attrib.get('package'); version=root.attrib.get(a+'versionCode')
          target=uses.attrib.get(a+'targetSdkVersion') if uses is not None else None
          if package != os.environ['PACKAGE_NAME'] or version != os.environ['EXPECTED_VERSION'] or target != '36':
              raise SystemExit(f'identity mismatch package={package} version={version} target={target}')
          print(f'IDENTITY_OK package={package} versionCode={version} targetSdk={target}')
          PY
      - name: Publish exact 51016 to Google Play Internal
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json, os
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          package=os.environ['PACKAGE_NAME']; expected=os.environ['EXPECTED_VERSION']; track='internal'; aab=os.environ['AAB_PATH']
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          result={'package':package,'expectedVersionCode':expected,'track':track,'sourceRunId':os.environ['SOURCE_RUN_ID'],'sourceSha':'e0e8e785fdcb0c672205e7f041ccd99bbd71ac22','committed':False}
          edit=None
          try:
              edit=api.edits().insert(packageName=package,body={}).execute()['id']
              tracks=api.edits().tracks().list(packageName=package,editId=edit).execute().get('tracks',[]) or []
              versions=set(); internal_has=False
              for item in tracks:
                  for release in item.get('releases',[]) or []:
                      codes={str(v) for v in (release.get('versionCodes',[]) or [])}; versions.update(codes)
                      if item.get('track') == track and expected in codes: internal_has=True
              if internal_has:
                  result.update({'alreadyPublished':True,'versionCode':expected,'committed':True})
                  api.edits().delete(packageName=package,editId=edit).execute(); edit=None
              elif expected in versions:
                  raise RuntimeError(f'versionCode {expected} exists on another track')
              else:
                  bundle=api.edits().bundles().upload(packageName=package,editId=edit,media_body=MediaFileUpload(aab,mimetype='application/octet-stream',resumable=True)).execute()
                  uploaded=str(bundle['versionCode'])
                  if uploaded != expected: raise RuntimeError(f'uploaded {uploaded} != {expected}')
                  api.edits().tracks().update(packageName=package,editId=edit,track=track,body={'releases':[{'versionCodes':[uploaded],'status':'completed','name':'THF Fitness 51016 Internal'}]}).execute()
                  api.edits().commit(packageName=package,editId=edit).execute(); edit=None
                  result.update({'versionCode':uploaded,'committed':True})
          finally:
              if edit:
                  try: api.edits().delete(packageName=package,editId=edit).execute()
                  except Exception: pass
          print(json.dumps(result,indent=2))
          with open('evidence/PLAY_INTERNAL_UPLOAD.json','w') as fh: json.dump(result,fh,indent=2)
          if not result.get('committed'): raise SystemExit(3)
          PY
      - name: Apply reviewed bilingual Play listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          package='com.topherofit.thf.pulse'
          reviewed={
            'ar': {
              'title':'Top Hero Fit: لياقة ونشاط',
              'shortDescription':'تمارين أوفلاين، خطوات، جري ودراجات بـGPS، خطط تدريب وتكامل Health Connect.',
              'fullDescription':'''Top Hero Fit يجمع التمارين وتتبع النشاط اليومي في تطبيق واحد يعمل بالعربية والإنجليزية.

الميزات الحالية:
• تتبع المشي والجري وركوب الدراجة باستخدام GPS.
• عرض الوقت والمسافة والسرعة والوتيرة والخطوات والسعرات التقديرية بحسب النشاط والبيانات المتاحة.
• استمرار جلسة النشاط في الخلفية مع إشعار دائم للتحكم والمتابعة.
• مكتبة تمارين وبرامج تدريب متاحة دون اتصال بعد تثبيت التطبيق.
• تعليمات للحركة والتنفس والسلامة مع إرشاد صوتي بالعربية والإنجليزية.
• تكامل Health Connect عند تفعيل الميزة ومنح الصلاحيات المناسبة، مع الحفاظ على مصدر البيانات عند توفره.
• واجهة عربية RTL وإنجليزية LTR وإعداد لتقليل الحركة.

Top Hero Fit مصمم لمساعدتك على بناء عادة تدريب ومتابعة نشاطك بوضوح دون خلط جلسات المشي والجري والدراجة مع برامج التمارين.

ملاحظات مهمة:
السعرات والقيم المشتقة تقديرات لياقة وليست قياسات طبية. جودة GPS تعتمد على الهاتف والموقع والبيئة المحيطة. التطبيق لا يقدم تشخيصًا طبيًا أو بديلًا عن نصيحة المختص.'''
            },
            'en-US': {
              'title':'Top Hero Fit: Fitness & GPS',
              'shortDescription':'Offline workouts, GPS activity, steps, training plans and Health Connect.',
              'fullDescription':'''Top Hero Fit brings workouts and everyday activity tracking together in one Arabic- and English-ready fitness app.

Current features include:
• GPS activity sessions for walking, running and cycling.
• Time, distance, speed, pace, steps and estimated calories when supported by the activity and available data.
• Background activity sessions with an ongoing notification for status and controls.
• An offline-ready exercise library and structured training programs after the app is installed.
• Movement, breathing and safety guidance with Arabic and English voice cues.
• Health Connect integration when enabled and granted, preserving data source information where available.
• Arabic RTL and English LTR interfaces, plus a reduced-motion preference.

Top Hero Fit is designed to help you build a consistent training habit while keeping real walking, running and cycling sessions separate from workout programs.

Important notes:
Calories and derived fitness metrics are estimates, not medical measurements. GPS quality depends on your device, location and surroundings. Top Hero Fit does not provide medical diagnosis or replace professional medical advice.'''
            }
          }
          for lang,item in reviewed.items():
              if len(item['title']) > 30: raise SystemExit(f'{lang} title too long')
              if len(item['shortDescription']) > 80: raise SystemExit(f'{lang} short description too long')
              if len(item['fullDescription']) > 4000: raise SystemExit(f'{lang} full description too long')
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']
          try:
              before=api.edits().listings().list(packageName=package,editId=edit).execute().get('listings',[]) or []
              for lang,item in reviewed.items():
                  api.edits().listings().update(packageName=package,editId=edit,language=lang,body=item).execute()
              api.edits().commit(packageName=package,editId=edit).execute(); edit=None
              verify=api.edits().insert(packageName=package,body={}).execute()['id']
              try:
                  after=api.edits().listings().list(packageName=package,editId=verify).execute().get('listings',[]) or []
              finally:
                  api.edits().delete(packageName=package,editId=verify).execute()
          finally:
              if edit:
                  api.edits().delete(packageName=package,editId=edit).execute()
          def compact(items):
              return [{'language':x.get('language'),'title':x.get('title'),'shortDescription':x.get('shortDescription'),'fullDescription':x.get('fullDescription')} for x in items]
          result={'package':package,'committed':True,'before':compact(before),'after':compact(after)}
          expected={k:(v['title'],v['shortDescription'],v['fullDescription']) for k,v in reviewed.items()}
          actual={x.get('language'):(x.get('title'),x.get('shortDescription'),x.get('fullDescription')) for x in after}
          for lang,value in expected.items():
              if actual.get(lang) != value: raise SystemExit(f'listing readback mismatch: {lang}')
          with open('evidence/PLAY_LISTING_SYNC.json','w',encoding='utf-8') as fh: json.dump(result,fh,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-51016-internal-promote-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/
            candidate/**/candidate-51016-build.txt
