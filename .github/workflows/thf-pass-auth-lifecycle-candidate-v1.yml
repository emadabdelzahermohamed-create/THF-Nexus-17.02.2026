name: THF Pass Auth Lifecycle Candidate V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-pass-auth-lifecycle-candidate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build and test lifecycle candidate in disposable copy
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='bash -s' <<'REMOTE' > out/candidate.log
          set -Eeuo pipefail
          ROOT="$HOME/thf-runtime-s1/runtime/THF_NEXUS_6_FINAL"
          test -d "$ROOT"
          ORIG_APP=$(sha256sum "$ROOT/src/thf/app.py" | awk '{print $1}')
          ORIG_ID=$(sha256sum "$ROOT/src/thf/identity/service.py" | awk '{print $1}')
          WORK=$(mktemp -d "$HOME/thf-pass-auth-candidate-v1.XXXXXX")
          trap 'rm -rf "$WORK"' EXIT
          cp -a "$ROOT/." "$WORK/"
          python - "$WORK" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          identity=root/'src/thf/identity/service.py'
          text=identity.read_text()
          anchor="""    def user_from_token(self, token: str|None) -> dict|None:\n"""
          if anchor not in text: raise SystemExit('identity anchor missing')
          insert="""    def refresh_session(self, token: str|None) -> dict:\n        if not token: raise PermissionError('authentication required')\n        row=self.db.one(\"SELECT s.user_id,s.expires_at,u.username FROM sessions s JOIN users u ON u.id=s.user_id WHERE s.token=?\",(token,))\n        if not row: raise PermissionError('invalid session')\n        if row['expires_at'] < utcnow():\n            self.db.execute(\"DELETE FROM sessions WHERE token=?\",(token,))\n            raise PermissionError('expired session')\n        # Rotate the bearer token: a refresh token may be used only once.\n        self.db.execute(\"DELETE FROM sessions WHERE token=?\",(token,))\n        new_token=self._new_session(int(row['user_id']))\n        return {'id':row['user_id'],'username':row['username'],'token':new_token,'rotated':True}\n\n    def logout_session(self, token: str|None) -> dict:\n        if not token: raise PermissionError('authentication required')\n        existed=self.db.one(\"SELECT 1 ok FROM sessions WHERE token=?\",(token,)) is not None\n        self.db.execute(\"DELETE FROM sessions WHERE token=?\",(token,))\n        return {'ok':True,'revoked':existed}\n\n    def revoke_all(self, uid:int) -> dict:\n        self.db.execute(\"DELETE FROM sessions WHERE user_id=?\",(uid,))\n        return {'ok':True,'all_sessions_revoked':True}\n\n"""
          text=text.replace(anchor,insert+anchor,1)
          identity.write_text(text)

          app=root/'src/thf/app.py'
          text=app.read_text()
          anchor="""        if path=='/api/auth/login' and method=='POST':\n            b=self._body();return self._send(rt.identity.login(str(b.get('username','')),str(b.get('password',''))))\n"""
          if anchor not in text: raise SystemExit('app auth anchor missing')
          routes=anchor+"""        if path=='/api/auth/refresh' and method=='POST':\n            return self._send(rt.identity.refresh_session(self._token()))\n        if path=='/api/auth/logout' and method=='POST':\n            return self._send(rt.identity.logout_session(self._token()))\n        if path=='/api/auth/revoke-all' and method=='POST':\n            return self._send(rt.identity.revoke_all(self._need_user()['id']))\n"""
          app.write_text(text.replace(anchor,routes,1))

          test=root/'tests/test_auth_lifecycle_candidate.py'
          test.write_text(r'''import json, os, tempfile, threading, time, unittest, urllib.error, urllib.request\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nfrom thf.app import Runtime, make_server\n\nclass AuthLifecycleServiceTests(unittest.TestCase):\n    def setUp(self):\n        self.t=tempfile.TemporaryDirectory(); self.root=Path(self.t.name)\n        self.rt=Runtime(self.root,str(self.root/'db.sqlite'))\n        self.u=self.rt.identity.register('lifeuser','strong-pass-123')\n    def tearDown(self): self.t.cleanup()\n    def test_refresh_rotates_and_invalidates_old(self):\n        old=self.u['token']; fresh=self.rt.identity.refresh_session(old)['token']\n        self.assertIsNone(self.rt.identity.user_from_token(old)); self.assertIsNotNone(self.rt.identity.user_from_token(fresh))\n        with self.assertRaises(PermissionError): self.rt.identity.refresh_session(old)\n    def test_expired_cannot_refresh(self):\n        old=self.u['token']; past=(datetime.now(timezone.utc)-timedelta(minutes=1)).isoformat().replace('+00:00','Z')\n        self.rt.db.execute('UPDATE sessions SET expires_at=? WHERE token=?',(past,old))\n        with self.assertRaises(PermissionError): self.rt.identity.refresh_session(old)\n        self.assertIsNone(self.rt.identity.user_from_token(old))\n    def test_logout_and_revoke_all(self):\n        first=self.u['token']; second=self.rt.identity.login('lifeuser','strong-pass-123')['token']\n        self.assertTrue(self.rt.identity.logout_session(first)['revoked']); self.assertIsNone(self.rt.identity.user_from_token(first))\n        self.rt.identity.revoke_all(self.u['id']); self.assertIsNone(self.rt.identity.user_from_token(second))\n\nclass AuthLifecycleHttpTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.t=tempfile.TemporaryDirectory(); cls.root=Path(__file__).resolve().parents[1]; os.environ['THF_QUIET']='1'\n        cls.srv=make_server('127.0.0.1',0,cls.root,str(Path(cls.t.name)/'http.db')); cls.port=cls.srv.server_address[1]\n        cls.th=threading.Thread(target=cls.srv.serve_forever,daemon=True); cls.th.start(); time.sleep(.05)\n    @classmethod\n    def tearDownClass(cls): cls.srv.shutdown(); cls.srv.server_close(); cls.t.cleanup()\n    def req(self,path,method='GET',body=None,token=None,expect=None):\n        h={'Content-Type':'application/json'}\n        if token: h['Authorization']='Bearer '+token\n        data=json.dumps(body).encode() if body is not None else None\n        req=urllib.request.Request(f'http://127.0.0.1:{self.port}{path}',data=data,method=method,headers=h)\n        try:\n            r=urllib.request.urlopen(req,timeout=3); status=r.status; raw=r.read()\n        except urllib.error.HTTPError as e:\n            status=e.code; raw=e.read()\n        obj=json.loads(raw) if raw else {}\n        if expect is not None: self.assertEqual(status,expect,(status,obj))\n        return status,obj\n    def test_http_refresh_logout_revoke(self):\n        _,u=self.req('/api/auth/register','POST',{'username':'http-life','password':'http-pass-123'},expect=201); old=u['token']\n        _,r=self.req('/api/auth/refresh','POST',token=old,expect=200); fresh=r['token']; self.assertTrue(r['rotated'])\n        self.req('/api/profile',token=old,expect=403); self.req('/api/profile',token=fresh,expect=200)\n        self.req('/api/auth/logout','POST',token=fresh,expect=200); self.req('/api/profile',token=fresh,expect=403)\n        _,a=self.req('/api/auth/login','POST',{'username':'http-life','password':'http-pass-123'},expect=200)\n        _,b=self.req('/api/auth/login','POST',{'username':'http-life','password':'http-pass-123'},expect=200)\n        self.req('/api/auth/revoke-all','POST',token=a['token'],expect=200)\n        self.req('/api/profile',token=a['token'],expect=403); self.req('/api/profile',token=b['token'],expect=403)\n\nif __name__=='__main__': unittest.main()\n''')
          PY
          cd "$WORK"
          export PYTHONPATH="$WORK/src"
          python -m py_compile src/thf/identity/service.py src/thf/app.py tests/test_auth_lifecycle_candidate.py
          python -m unittest -v tests.test_auth_lifecycle_candidate tests.test_unified_runtime tests.test_security_boundaries
          grep -q "'/api/auth/refresh'" src/thf/app.py
          grep -q "'/api/auth/logout'" src/thf/app.py
          grep -q "'/api/auth/revoke-all'" src/thf/app.py
          grep -q 'def refresh_session' src/thf/identity/service.py
          grep -q 'def logout_session' src/thf/identity/service.py
          grep -q 'def revoke_all' src/thf/identity/service.py
          diff -u "$ROOT/src/thf/identity/service.py" "$WORK/src/thf/identity/service.py" > "$WORK/identity.patch" || true
          diff -u "$ROOT/src/thf/app.py" "$WORK/src/thf/app.py" > "$WORK/app.patch" || true
          NEW_APP=$(sha256sum "$WORK/src/thf/app.py" | awk '{print $1}')
          NEW_ID=$(sha256sum "$WORK/src/thf/identity/service.py" | awk '{print $1}')
          NOW_APP=$(sha256sum "$ROOT/src/thf/app.py" | awk '{print $1}')
          NOW_ID=$(sha256sum "$ROOT/src/thf/identity/service.py" | awk '{print $1}')
          test "$ORIG_APP" = "$NOW_APP"
          test "$ORIG_ID" = "$NOW_ID"
          test "$NEW_APP" != "$ORIG_APP"
          test "$NEW_ID" != "$ORIG_ID"
          echo "ORIGINAL_APP_SHA=$ORIG_APP"
          echo "ORIGINAL_IDENTITY_SHA=$ORIG_ID"
          echo "CANDIDATE_APP_SHA=$NEW_APP"
          echo "CANDIDATE_IDENTITY_SHA=$NEW_ID"
          echo 'AUTH_LIFECYCLE_CANDIDATE_TESTS=PASS'
          echo 'REFRESH_ROTATION=PASS'
          echo 'EXPIRED_REFRESH_REJECTION=PASS'
          echo 'LOGOUT_INVALIDATION=PASS'
          echo 'REVOKE_ALL_INVALIDATION=PASS'
          echo 'ORIGINAL_RUNTIME_UNCHANGED=TRUE'
          echo 'DEPLOYMENT_PERFORMED=FALSE'
          echo 'WAVE_UNTOUCHED=TRUE'
          echo 'PRODUCTION_CREDENTIALS_USED=FALSE'
          echo 'FINAL_OR_PLAY_READY=FALSE'
          printf '\n--- identity.patch ---\n'; cat "$WORK/identity.patch"
          printf '\n--- app.patch ---\n'; cat "$WORK/app.patch"
          REMOTE
          grep -q 'AUTH_LIFECYCLE_CANDIDATE_TESTS=PASS' out/candidate.log
          grep -q 'ORIGINAL_RUNTIME_UNCHANGED=TRUE' out/candidate.log
          grep -q 'DEPLOYMENT_PERFORMED=FALSE' out/candidate.log
          grep -q 'FINAL_OR_PLAY_READY=FALSE' out/candidate.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-PASS-AUTH-LIFECYCLE-CANDIDATE-V1
          path: out/
          retention-days: 14
