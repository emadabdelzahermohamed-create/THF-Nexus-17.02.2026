name: THF Apps Scoped Phone Fundamentals V1

on:
  pull_request:
    branches: [main]
    paths:
      - tools/thf_apps_phone_resources_v1.py
      - tests/test_thf_apps_phone_resources_v1.py
      - .github/workflows/thf-apps-scoped-phone-fundamentals-v1.yml
  push:
    branches: [main]
    paths:
      - tools/thf_apps_phone_resources_v1.py
      - tests/test_thf_apps_phone_resources_v1.py
      - .github/workflows/thf-apps-scoped-phone-fundamentals-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  phone-fundamentals:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Unit-test reversible phone resource tooling
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests/test_thf_apps_phone_resources_v1.py
          python3 -m compileall -q tools/thf_apps_phone_resources_v1.py

      - name: Authenticate to exact-source builder
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Copy scoped tooling to builder
        run: |
          set -Eeuo pipefail
          gcloud compute scp --quiet --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            tools/thf_apps_phone_resources_v1.py \
            ReleaseOps/validators/validate_mobile_real_function_source.py \
            "$GCP_BUILDER:/tmp/"

      - name: Build exact-lineage resource candidates and verify fundamentals
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/thf_scoped_phone_batch.sh <<'REMOTE'
          set -Eeuo pipefail
          OUT="$HOME/thf-scoped-phone-fundamentals-v1"
          rm -rf "$OUT" && mkdir -p "$OUT/out" "$OUT/work" "$OUT/candidates"
          cat > "$OUT/matrix.tsv" <<'EOF'
          core	THF Hub	com.topherofit.thf.core	6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a
          forge	THF Market	com.topherofit.thf.forge	0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51
          echo	THF Community	com.topherofit.thf.echo	40a197b60563e560cab93ba0a64c859d9b650da222fdaec933993977d63902ab
          codex	THF Learn	com.topherofit.thf.codex	3d60cc550732468c89fe120f552def53ac798646d065e94efa153f8979e15b1e
          vault	THF Wallet	com.topherofit.thf.vault	052e2c55c6066c15eee63528218b8eab9711bec9de71335c67c7e1692a5b5432
          signal	THF Publisher	com.topherofit.thf.signal	f78890c3bf036d80a568ec39baac4a665d6092b9bbc8c4f080f2651785c1a275
          command	THF Admin	com.topherofit.thf.command	f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408
          EOF

          python3 - "$OUT" <<'PY'
          import hashlib,json,os,pathlib,sys
          out=pathlib.Path(sys.argv[1]); home=pathlib.Path.home()
          specs=[]
          for line in (out/'matrix.tsv').read_text().splitlines():
              app,name,pkg,sha=line.split('\t'); specs.append((app,name,pkg,sha))
          wanted={x[3]:x for x in specs}; hits={k:[] for k in wanted}
          skip={'.git','node_modules','.gradle','.venv','venv','cache','caches','Library','Temp'}
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          for root,dirs,files in os.walk(home):
              dirs[:]=[d for d in dirs if d not in skip]
              if any(x in root.lower() for x in ('wave-mawja','/terra','/rift','arena','tokenops','solana')):
                  dirs[:]=[]; continue
              for n in files:
                  if not n.lower().endswith('.zip'): continue
                  p=pathlib.Path(root)/n
                  try:
                      if not (0 < p.stat().st_size <= 500_000_000): continue
                      d=digest(p)
                  except OSError: continue
                  if d in hits: hits[d].append(str(p))
          rows=[]
          for app,name,pkg,sha in specs:
              paths=hits[sha]
              rows.append({'app':app,'display_name':name,'package_id':pkg,'source_sha256':sha,'paths':paths,'status':'EXACT_SOURCE_PRESENT' if paths else 'EXACT_SOURCE_MISSING'})
          (out/'out/source-resolution.json').write_text(json.dumps(rows,indent=2))
          missing=[x['app'] for x in rows if not x['paths']]
          if missing: raise SystemExit('EXACT_SOURCE_MISSING='+','.join(missing))
          print('LATEST_LINEAGE_EXACT_SOURCE_RESOLUTION=PASS')
          PY

          printf 'app\tname\tpackage\tinput_source_sha256\tcandidate_source_sha256\tapk_sha256\tpackage_ok\ttarget36_ok\tbuild\tsource_gate\tunit_tests\n' > "$OUT/out/results.tsv"
          while IFS=$'\t' read -r app name pkg expected; do
            src=$(python3 - "$OUT/out/source-resolution.json" "$app" <<'PY'
          import json,sys
          print(next(x for x in json.load(open(sys.argv[1])) if x['app']==sys.argv[2])['paths'][0])
          PY
            )
            got=$(sha256sum "$src" | awk '{print $1}'); test "$got" = "$expected"
            mkdir -p "$OUT/work/$app" && unzip -q "$src" -d "$OUT/work/$app"
            build=$(find "$OUT/work/$app" -type f \( -path '*/android/app/build.gradle' -o -path '*/android/app/build.gradle.kts' \) | head -1)
            test -n "$build"
            root=$(dirname "$(dirname "$(dirname "$build")")")
            grep -RqsF "$pkg" "$root/android/app" "$root/android/settings.gradle" "$root/android/settings.gradle.kts" 2>/dev/null

            python3 /tmp/thf_apps_phone_resources_v1.py --root "$root" --app "$app" --package "$pkg" --name "$name" --report "$OUT/out/$app.resources.json"
            python3 /tmp/validate_mobile_real_function_source.py "$root" --package "$pkg" --json-out "$OUT/out/$app.source-gate.json" > "$OUT/out/$app.source-gate.log"

            python3 - "$root" "$OUT/candidates/THF_${app^^}_PHONE_RESOURCES_V1_SOURCE.zip" <<'PY'
          import os,pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          skip_parts={'.gradle','build','.git','node_modules','__pycache__','.pytest_cache'}
          skip_names={'local.properties'}
          files=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.name in skip_names or any(x in skip_parts for x in p.relative_to(root).parts): continue
              if p.suffix.lower() in {'.jks','.keystore','.p12','.pem','.key'}: continue
              files.append(p)
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(files,key=lambda q:q.relative_to(root).as_posix()):
                  rel=p.relative_to(root).as_posix(); info=zipfile.ZipInfo(rel,(2020,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes())
          bad=zipfile.ZipFile(target).testzip()
          if bad: raise SystemExit('candidate zip corrupt: '+bad)
          PY
            csha=$(sha256sum "$OUT/candidates/THF_${app^^}_PHONE_RESOURCES_V1_SOURCE.zip" | awk '{print $1}')

            unit=NO_TESTS
            if [ -d "$root/tests" ] && find "$root/tests" -type f -name 'test_*.py' | grep -q .; then
              set +e
              (cd "$root" && python3 -m pytest -q) > "$OUT/out/$app.pytest.log" 2>&1
              rc=$?; set -e
              if [ $rc -eq 0 ]; then unit=PASS; else unit=FAIL; fi
            fi
            python3 -m compileall -q "$root"

            printf 'sdk.dir=%s\n' "${ANDROID_HOME:-$HOME/Android/Sdk}" > "$root/android/local.properties"
            set +e
            (cd "$root/android" && gradle --no-daemon clean assembleRelease) > "$OUT/out/$app.gradle.log" 2>&1
            rc=$?; set -e
            status=PASS; [ $rc -eq 0 ] || status=FAIL
            apk=''; ah=''; pok=false; t36=false
            if [ "$status" = PASS ]; then
              apk=$(find "$root/android" -type f -path '*/build/outputs/apk/release/*.apk' | head -1 || true)
              test -n "$apk" || status=FAIL
            fi
            if [ "$status" = PASS ]; then
              cp "$apk" "$OUT/candidates/THF_${app^^}_PHONE_RESOURCES_V1_UNSIGNED.apk"
              ah=$(sha256sum "$OUT/candidates/THF_${app^^}_PHONE_RESOURCES_V1_UNSIGNED.apk" | awk '{print $1}')
              AAPT=$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -type f \( -name aapt2 -o -name aapt \) | sort -V | tail -1)
              badging=$($AAPT dump badging "$apk" 2>/dev/null || true)
              grep -q "package: name='$pkg'" <<<"$badging" && pok=true
              grep -q "targetSdkVersion:'36'" <<<"$badging" && t36=true
              [ "$pok" = true ] && [ "$t36" = true ] || status=FAIL
            fi
            sg=$(python3 -c "import json;print(json.load(open('$OUT/out/$app.source-gate.json'))['source_gate'])")
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$name" "$pkg" "$expected" "$csha" "$ah" "$pok" "$t36" "$status" "$sg" "$unit" >> "$OUT/out/results.tsv"
          done < "$OUT/matrix.tsv"

          python3 - "$OUT" <<'PY'
          import csv,json,pathlib,sys
          out=pathlib.Path(sys.argv[1]); rows=list(csv.DictReader(open(out/'out/results.tsv'),delimiter='\t'))
          private={'signal','command'}
          findings={}
          markers={
            'auth_session':['auth','session'], 'logout':['logout','signOut','sign_out'], 'account_deletion':['deleteAccount','delete_account','account/delete'],
            'loading_error_offline':['loading','offline','error'], 'notifications':['notification','POST_NOTIFICATIONS'],
            'data_saver':['restrictBackground','Data Saver','isActiveNetworkMetered'], 'accessibility':['contentDescription','accessibility','importantForAccessibility'],
          }
          for row in rows:
              app=row['app']; root=out/'work'/app
              texts=[]
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.py','.java','.kt','.xml','.js','.ts','.tsx','.html'} and 'build' not in p.parts:
                      try: texts.append(p.read_text(errors='ignore'))
                      except OSError: pass
              blob='\n'.join(texts)
              findings[app]={k:any(x.lower() in blob.lower() for x in vals) for k,vals in markers.items()}
              findings[app]['private_internal_required']=app in private
          summary={'schema':'thf-apps-scoped-phone-fundamentals-v1','rows':rows,'source_findings':findings,
                   'scope':['core','forge','echo','codex','vault','signal','command'],
                   'excluded':['pulse','games','wave'],
                   'truth_boundary':{'physical_device_pass':False,'final_or_play_ready':False,'production_signing':False,'public_rollout':False}}
          json.dump(summary,open(out/'out/summary.json','w'),indent=2)
          bad=[r['app'] for r in rows if r['build']!='PASS' or r['source_gate']!='PASS' or r['unit_tests']=='FAIL' or r['package_ok']!='true' or r['target36_ok']!='true']
          if bad: raise SystemExit('SCOPED_PHONE_CANDIDATE_FAIL='+','.join(bad))
          print('SCOPED_PHONE_CANDIDATES=PASS')
          print('PHYSICAL_DEVICE_PASS=FALSE')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
          REMOTE
          gcloud compute scp --quiet --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" /tmp/thf_scoped_phone_batch.sh "$GCP_BUILDER:/tmp/"
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=60m --quiet --command='bash /tmp/thf_scoped_phone_batch.sh'
          rm -rf scoped-out && mkdir scoped-out
          gcloud compute scp --quiet --recurse --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" "$GCP_BUILDER:$HOME/thf-scoped-phone-fundamentals-v1/out" scoped-out/
          gcloud compute scp --quiet --recurse --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" "$GCP_BUILDER:$HOME/thf-scoped-phone-fundamentals-v1/candidates" scoped-out/

      - name: Verify no excluded stream was synthesized
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=next(pathlib.Path('scoped-out').rglob('summary.json'))
          d=json.load(open(p))
          assert d['scope']==['core','forge','echo','codex','vault','signal','command']
          assert d['excluded']==['pulse','games','wave']
          assert not any(d['truth_boundary'].values())
          for a in ('signal','command'):
              assert d['source_findings'][a]['private_internal_required'] is True
          print('SCOPED_EXCLUSIONS_AND_TRUTH_BOUNDARY=PASS')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-APPS-SCOPED-PHONE-FUNDAMENTALS-V1
          path: scoped-out/
          retention-days: 14
          compression-level: 0
