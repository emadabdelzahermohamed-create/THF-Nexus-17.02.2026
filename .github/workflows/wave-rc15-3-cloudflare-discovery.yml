name: WAVE RC15.3 Cloudflare Discovery

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-3-cloudflare-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare token and discover WAVE resources
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN=MISSING'; exit 10; }
          [ -n "${CF_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID=MISSING'; exit 11; }

          auth="Authorization: Bearer ${CF_TOKEN}"
          json="$(curl -fsS -H "$auth" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$json" | jq -e '.success == true and .result.status == "active"' >/dev/null
          echo 'TOKEN_VERIFY=PASS'

          d1="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database?per_page=100")"
          echo "$d1" | jq -e '.success == true' >/dev/null
          count="$(echo "$d1" | jq '.result | length')"
          echo "D1_LIST=PASS count=${count}"
          echo "$d1" | jq -r '.result[]?.name' | sed 's/^/D1_NAME=/'

          db_id="$(echo "$d1" | jq -r '.result[] | select(.name == "wave-mawja-prod") | .uuid' | head -n1)"
          if [ -z "$db_id" ] || [ "$db_id" = null ]; then
            db_id="$(echo "$d1" | jq -r '.result[] | select((.name|ascii_downcase|contains("wave")) or (.name|ascii_downcase|contains("mawja"))) | .uuid' | head -n1)"
          fi
          if [ -n "$db_id" ] && [ "$db_id" != null ]; then
            echo 'WAVE_D1=FOUND'
          else
            echo 'WAVE_D1=NOT_FOUND'
          fi

          workers="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts" || true)"
          if echo "$workers" | jq -e '.success == true' >/dev/null 2>&1; then
            echo 'WORKERS_LIST=PASS'
            echo "$workers" | jq -r '.result[]?.id' | grep -Ei 'wave|mawja|stream' | sed 's/^/WAVE_WORKER_CANDIDATE=/' || true
            echo "$workers" | jq -r '.result[]?.id' | grep -E '^wave-mawja$' >/dev/null && echo 'WAVE_WORKER_EXACT=FOUND' || echo 'WAVE_WORKER_EXACT=NOT_FOUND'
          else
            echo 'WORKERS_LIST=UNAVAILABLE'
          fi

          subdomain="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" || true)"
          if echo "$subdomain" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "WORKERS_SUBDOMAIN=$(echo "$subdomain" | jq -r '.result.subdomain // ""')"
          fi
