name: THF RC17 Runtime Contract Inspect

on:
  push:
    branches: ['releaseops/**']
    paths: ['.github/workflows/thf-rc17-runtime-contract-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read packaging contract and entrypoints
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=15m --quiet \
            --command='set -Eeuo pipefail
          ROOT="$HOME/thf-builder-rc17-build/work"
          for spec in "terra:$ROOT/terra" "rift:$ROOT/rift/THF_Nexus_Arena_Core"; do
            slug="${spec%%:*}"; p="${spec#*:}"
            echo "===== $slug PROJECT.GODOT ====="; cat "$p/project.godot"
            echo "===== $slug NATIVE EXPORT SPEC ====="; find "$p" -type f -name "ANDROID_NATIVE_EXPORT_SPEC.json" -exec sh -c '"'"'echo --- $1; cat "$1"'"'"' _ {} \; || true
            echo "===== $slug ANDROID BUILD CHECK ====="; find "$p" -type f \( -name "android_build_check.py" -o -name "android_arena_build_check.py" \) -exec sh -c '"'"'echo --- $1; sed -n "1,280p" "$1"'"'"' _ {} \;
            echo "===== $slug SOURCE WORKFLOW ====="; find "$p/.github/workflows" -type f -iname "*android*aab*.yml" -exec sh -c '"'"'echo --- $1; sed -n "1,320p" "$1"'"'"' _ {} \; 2>/dev/null || true
            echo "===== $slug ANDROID MAINACTIVITY ====="; find "$p" -path "*/app/src/main/java/*" -type f -name "MainActivity.java" -exec sh -c '"'"'echo --- $1; sed -n "1,360p" "$1"'"'"' _ {} \;
            echo "===== $slug GODOT FILE TREE ====="; find "$p/native" -maxdepth 4 -type f -printf "%p\t%s\n" 2>/dev/null | sort | head -300 || true
            echo "===== $slug PROJECT ROOT RUNTIME FILES ====="; find "$p" -maxdepth 2 -type f \( -name "*.gd" -o -name "*.tscn" -o -name "*.tres" -o -name "*.json" \) -printf "%p\t%s\n" | sort | head -300
          done
          echo THF_RC17_RUNTIME_CONTRACT_INSPECT=PASS
          echo WAVE_UNTOUCHED=TRUE'
