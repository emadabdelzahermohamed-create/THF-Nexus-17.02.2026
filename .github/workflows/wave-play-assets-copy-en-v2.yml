name: WAVE Play Assets Copy EN V2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror approved Arabic assets to English listing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth requests pillow
          mkdir -p evidence/assets
          python - <<'PY'
          import hashlib,io,json
          from pathlib import Path
          from PIL import Image
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          package='com.wave.mawja'; src='ar'; dst='en-US'
          expected_counts={'icon':1,'featureGraphic':1,'phoneScreenshots':4}
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          session=AuthorizedSession(creds)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']
          out={'package':package,'sourceLanguage':src,'destinationLanguage':dst,'committed':False,'types':{}}
          try:
            for typ,expected in expected_counts.items():
              source=api.edits().images().list(packageName=package,editId=edit,language=src,imageType=typ).execute().get('images',[]) or []
              if len(source)!=expected: raise RuntimeError(f'{typ}: expected {expected}, got {len(source)}')
              try: api.edits().images().deleteall(packageName=package,editId=edit,language=dst,imageType=typ).execute()
              except Exception: pass
              entries=[]
              for i,img in enumerate(source):
                r=session.get(img['url'],timeout=30); r.raise_for_status(); data=r.content
                im=Image.open(io.BytesIO(data)).convert('RGB'); source_size=list(im.size)
                if typ=='icon' and im.size!=(512,512):
                  im=im.resize((512,512),Image.Resampling.LANCZOS)
                elif typ=='featureGraphic' and im.size!=(1024,500):
                  im=im.resize((1024,500),Image.Resampling.LANCZOS)
                elif typ=='phoneScreenshots':
                  w,h=im.size
                  if min(w,h)<320:
                    scale=320/min(w,h); im=im.resize((round(w*scale),round(h*scale)),Image.Resampling.LANCZOS)
                  w,h=im.size
                  if max(w,h)>3840:
                    scale=3840/max(w,h); im=im.resize((round(w*scale),round(h*scale)),Image.Resampling.LANCZOS)
                  w,h=im.size
                  if max(w,h)>2*min(w,h):
                    if h>w:
                      tw=(h+1)//2; canvas=Image.new('RGB',(tw,h),(0,0,0)); canvas.paste(im,((tw-w)//2,0)); im=canvas
                    else:
                      th=(w+1)//2; canvas=Image.new('RGB',(w,th),(0,0,0)); canvas.paste(im,(0,(th-h)//2)); im=canvas
                p=Path('evidence/assets')/f'{typ}-{i}.png'; im.save(p,'PNG')
                api.edits().images().upload(packageName=package,editId=edit,language=dst,imageType=typ,media_body=MediaFileUpload(str(p),mimetype='image/png',resumable=False)).execute()
                entries.append({'sourcePlaySha1':img.get('sha1'),'downloadSha256':hashlib.sha256(data).hexdigest(),'sourceSize':source_size,'uploadSize':list(im.size),'uploadSha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              target=api.edits().images().list(packageName=package,editId=edit,language=dst,imageType=typ).execute().get('images',[]) or []
              if len(target)!=expected: raise RuntimeError(f'{typ}: destination count {len(target)} != {expected}')
              out['types'][typ]={'count':expected,'entries':entries,'targetSha1s':[x.get('sha1') for x in target]}
            v=api.edits().validate(packageName=package,editId=edit).execute(); out['validationId']=v.get('id')
            c=api.edits().commit(packageName=package,editId=edit).execute(); out['committed']=True; out['committedEditId']=c.get('id'); edit=None
          finally:
            if edit:
              try: api.edits().delete(packageName=package,editId=edit).execute()
              except Exception: pass
          Path('evidence/result.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if not out['committed']: raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-play-assets-copy-en-v2
          path: evidence/
          if-no-files-found: error
          retention-days: 30
