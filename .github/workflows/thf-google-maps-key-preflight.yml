name: THF Google Maps Key Preflight

on:
  push:
    branches:
      - agent/codex/gps-map-quality-20261030
    paths:
      - '.github/workflows/thf-google-maps-key-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15

jobs:
  inspect-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to existing THF Google Cloud project
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Confirm Maps SDK and API Keys API status
        run: |
          set -euo pipefail
          gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectId)' | grep -x "$GCP_PROJECT_ID"
          gcloud services list --enabled --project "$GCP_PROJECT_ID" --filter='config.name=maps-android-backend.googleapis.com' --format='value(config.name)' | grep -x 'maps-android-backend.googleapis.com'
          echo 'MAPS_ANDROID_BACKEND_API=ENABLED'
          apikeys_enabled="$(gcloud services list --enabled --project "$GCP_PROJECT_ID" --filter='config.name=apikeys.googleapis.com' --format='value(config.name)')"
          if [[ "$apikeys_enabled" == "apikeys.googleapis.com" ]]; then
            echo 'API_KEYS_API=ENABLED'
            if gcloud services api-keys list --project "$GCP_PROJECT_ID" --format='table(displayName,name,restrictions.apiTargets[].service,restrictions.androidKeyRestrictions.allowedApplications[].packageName)'; then
              echo 'API_KEYS_LIST=READABLE'
            else
              echo 'API_KEYS_LIST=PERMISSION_DENIED'
            fi
          else
            echo 'API_KEYS_API=NOT_ENABLED'
          fi
          if gcloud secrets describe thf-google-maps-android-api-key --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'MAPS_KEY_SECRET=EXISTS_AND_VISIBLE'
          else
            echo 'MAPS_KEY_SECRET=MISSING_OR_NOT_VISIBLE_TO_BUILDER'
          fi
          echo 'NO_BILLING_CONFIGURATION_CHANGED=TRUE'
