name: THF Godot 4.7.2 Export Templates Install

on:
  push:
    branches:
      - 'releaseops/godot472-templates'
    paths:
      - '.github/workflows/thf-godot472-template-install.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  GODOT_TPZ_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TPZ_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Install verified Godot 4.7.2 templates on builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=10m --quiet \
            --command="set -Eeuo pipefail
          URL='$GODOT_TPZ_URL'
          EXPECTED='$GODOT_TPZ_SHA256'
          CACHE=\"\$HOME/.cache/thf-releaseops/godot/Godot_v4.7.2-stable_export_templates.tpz\"
          DEST=\"\$HOME/.local/share/godot/export_templates/4.7.2.stable\"
          mkdir -p \"\$(dirname \"\$CACHE\")\"
          if [ ! -f \"\$CACHE\" ] || ! echo \"\$EXPECTED  \$CACHE\" | sha256sum -c - >/dev/null 2>&1; then
            rm -f \"\$CACHE.part\"
            curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 1800 \"\$URL\" -o \"\$CACHE.part\"
            echo \"\$EXPECTED  \$CACHE.part\" | sha256sum -c -
            mv \"\$CACHE.part\" \"\$CACHE\"
          fi
          echo \"\$EXPECTED  \$CACHE\" | sha256sum -c -
          TMP=\"\$(mktemp -d)\"
          unzip -q \"\$CACHE\" -d \"\$TMP\"
          SRC=\"\$TMP/templates\"
          test -f \"\$SRC/android_source.zip\"
          test -f \"\$SRC/android_debug.apk\"
          test -f \"\$SRC/android_release.apk\"
          NEW=\"\$DEST.new.\$\$\"
          mkdir -p \"\$NEW\"
          cp -a \"\$SRC/.\" \"\$NEW/\"
          if [ -d \"\$DEST\" ]; then mv \"\$DEST\" \"\$DEST.prev.\$(date +%Y%m%d%H%M%S)\"; fi
          mv \"\$NEW\" \"\$DEST\"
          rm -rf \"\$TMP\"
          printf 'GODOT_VERSION='; godot --version || true
          echo TEMPLATE_SHA256=\$EXPECTED
          echo TEMPLATE_DIR=\$DEST
          sha256sum \"\$DEST/android_source.zip\" \"\$DEST/android_debug.apk\" \"\$DEST/android_release.apk\"
          echo GODOT_472_EXPORT_TEMPLATES_INSTALL=PASS
          echo WAVE_UNTOUCHED=TRUE"
