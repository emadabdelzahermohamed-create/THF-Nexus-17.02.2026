name: THF Terra V4 Installability Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-terra-v4-installability-gate.yml
      - ReleaseOps/scripts/verify_terra_v4_installability.sh
      - ReleaseOps/THF_RELEASE_LATEST_NO_REGRESSION_POLICY.md
      - ReleaseOps/THF_TERRA_PHONE_V3_REJECTED_20260914.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage verifier
        run: |
          set -Eeuo pipefail
          chmod +x ReleaseOps/scripts/verify_terra_v4_installability.sh
          gcloud compute scp ReleaseOps/scripts/verify_terra_v4_installability.sh "$GCP_BUILDER:/tmp/verify_terra_v4_installability.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Verify exact latest Terra V4 APK identity and signature
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='chmod +x /tmp/verify_terra_v4_installability.sh && /tmp/verify_terra_v4_installability.sh'
