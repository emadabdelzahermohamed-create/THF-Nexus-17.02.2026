name: THF Open Test Eligibility Probe

on:
  push:
    branches:
      - fitness/motion-runtime-api36-gate-20261018
    paths:
      - '.github/workflows/thf-open-test-eligibility-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate beta/open-test release edits without commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          apps = [
              ('com.topherofit.thf.pulse', '51004', 'THF Fitness 51004 Open Test Validation'),
              ('com.topherofit.thf.core', '62200', 'THF Core 62200 Open Test Validation'),
              ('com.topherofit.thf.echo', '21102', 'THF Community 21102 Open Test Validation'),
          ]
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          out={'track':'beta','commitsAttempted':False,'apps':[]}
          for package, version, name in apps:
              item={'package':package,'versionCode':version,'editInserted':False,'trackUpdated':False,'validated':False,'editDeleted':False}
              edit_id=None
              try:
                  edit_id=api.edits().insert(packageName=package,body={}).execute()['id']
                  item['editInserted']=True
                  api.edits().tracks().update(
                      packageName=package,
                      editId=edit_id,
                      track='beta',
                      body={'releases':[{'name':name,'versionCodes':[version],'status':'completed'}]},
                  ).execute()
                  item['trackUpdated']=True
                  validation=api.edits().validate(packageName=package,editId=edit_id).execute()
                  item['validated']=True
                  item['validationId']=validation.get('id')
              except HttpError as exc:
                  item['httpStatus']=exc.resp.status
                  item['error']=str(exc)[:1800]
              except Exception as exc:
                  item['error']=str(exc)[:1800]
              finally:
                  if edit_id:
                      try:
                          api.edits().delete(packageName=package,editId=edit_id).execute()
                          item['editDeleted']=True
                      except Exception as exc:
                          item['deleteError']=str(exc)[:800]
              out['apps'].append(item)
          print(json.dumps(out,indent=2))
          with open('thf-open-test-eligibility.json','w') as fh: json.dump(out,fh,indent=2)
          if not all(x.get('editDeleted') for x in out['apps']): raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-open-test-eligibility
          path: thf-open-test-eligibility.json
          if-no-files-found: ignore
          retention-days: 14
