name: THF Core RC6 Runtime-Configured Staging V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-core-rc6-runtime-configured-staging-v1.yml'
      - 'ReleaseOps/scripts/core_runtime_configured_staging_v1.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build-runtime-configured:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build Core with verified HTTPS staging endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=35m --quiet \
            --command='bash -s' < ReleaseOps/scripts/core_runtime_configured_staging_v1.sh
      - name: Retrieve runtime-configured APK
        shell: bash
        run: |
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-core-rc6-runtime-configured-v1/out/*" out/ \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Core-RC6-RUNTIME-CONFIGURED-STAGING
          path: out/
          retention-days: 14
          compression-level: 0
      - name: Final Core runtime config gate
        run: |
          grep -q '^status=PASS$' out/TRUTH.txt
          grep -q '^service_url_embedded=true$' out/TRUTH.txt
          grep -q '^service_health=PASS$' out/TRUTH.txt
          grep -q '^wave_untouched=true$' out/TRUTH.txt
