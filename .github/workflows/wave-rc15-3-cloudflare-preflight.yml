name: WAVE RC15.3 Cloudflare Preflight

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-3-cloudflare-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DRIVE_FILE_ID: 1B35W6nyNlhpJCv0wjRXleNRXWuoVOn16
  EXPECTED_RC15_SHA256: 71965ff9ed3405304743b4014cbbac269b96d83533557f28381781e67520d41f
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  CLOUDFLARE_WORKER_NAME: wave-mawja
  CLOUDFLARE_D1_DATABASE_NAME: wave-mawja-prod

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Download locked WAVE baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import os, requests, google.auth
          from google.auth.transport.requests import Request
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          fid=os.environ['DRIVE_FILE_ID']
          r=requests.get(f'https://www.googleapis.com/drive/v3/files/{fid}?alt=media',headers={'Authorization':f'Bearer {creds.token}'},timeout=120)
          r.raise_for_status()
          open('WAVE_RC15_BASE.zip','wb').write(r.content)
          print('BASELINE_DOWNLOAD=PASS bytes='+str(len(r.content)))
          PY
          echo "$EXPECTED_RC15_SHA256  WAVE_RC15_BASE.zip" | sha256sum -c -
          mkdir wave-src
          unzip -q WAVE_RC15_BASE.zip -d wave-src
          test -f wave-src/package.json
          test -d wave-src/android

      - name: Apply RC15.1 carry-forward and RC15.3 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd wave-src
          git init -q
          git add .
          git -c user.name=wave-builder -c user.email=wave-builder@example.invalid commit -qm baseline
          git apply --check ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply --check ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          cp -a ../ReleaseOps/WAVE/RC15_3/overlay/. .
          sha256sum -c RC15_3_CRITICAL_SHA256SUMS.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wave-src/package-lock.json

      - name: Discover WAVE D1 safely
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          d1="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
          echo "$d1" | jq -e '.success == true' >/dev/null
          db_id="$(echo "$d1" | jq -r '.result[] | select(.name == "wave-mawja-prod") | .uuid' | head -n1)"
          [ -n "$db_id" ] && [ "$db_id" != null ]
          echo "CLOUDFLARE_D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"
          echo 'WAVE_D1_DISCOVERY=PASS'

      - name: Install and validate source
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m compileall -q media-server tests scripts
          python3 -m unittest discover -s tests -p '*_test.py'
          node --test tests/multi-ingest-source.test.mjs tests/service-worker.test.mjs
          npm run typecheck
          npm run build

      - name: Verify generated Cloudflare config
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/server/wrangler.json
          jq empty dist/server/wrangler.json
          jq -e --arg id "$CLOUDFLARE_D1_DATABASE_ID" '
            .name == "wave-mawja"
            and any(.d1_databases[]?; .binding == "DB" and .database_name == "wave-mawja-prod" and .database_id == $id)
            and .browser.binding == "BROWSER"
          ' dist/server/wrangler.json >/dev/null
          echo 'GENERATED_CONFIG=PASS'

      - name: Inspect remote D1 migration state and schema read-only
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler@4.119.0 d1 migrations list "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json | tee ../WAVE_RC15_3_MIGRATIONS_PREFLIGHT.txt
          npx wrangler@4.119.0 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" | tee ../WAVE_RC15_3_TABLES_PREFLIGHT.txt
          echo 'D1_READONLY_PREFLIGHT=PASS'

      - name: Confirm wave-mawja worker name is create-only
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          workers="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          echo "$workers" | jq -e '.success == true' >/dev/null
          if echo "$workers" | jq -r '.result[]?.id' | grep -Fxq 'wave-mawja'; then
            echo 'WAVE_WORKER_EXISTING=YES'
          else
            echo 'WAVE_WORKER_EXISTING=NO_CREATE_ONLY'
          fi

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-RC15-3-CLOUDFLARE-PREFLIGHT
          retention-days: 7
          if-no-files-found: error
          path: |
            WAVE_RC15_3_MIGRATIONS_PREFLIGHT.txt
            WAVE_RC15_3_TABLES_PREFLIGHT.txt
