name: THF Phone Bridge Build

on:
  workflow_dispatch:
  push:
    branches: [ops/phone-bridge-20261019]
    paths:
      - 'tools/thf-phone-bridge/**'
      - '.github/workflows/phone-bridge-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install API 36 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build scoped QA bridge
        run: gradle --no-daemon -p tools/thf-phone-bridge :app:assembleDebug
      - name: Inspect bridge package
        shell: bash
        run: |
          set -euo pipefail
          APK=tools/thf-phone-bridge/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee bridge-badging.txt
          grep -F "package: name='com.topherofit.phonebridge'" bridge-badging.txt
          sha256sum "$APK" | tee bridge.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thf-phone-bridge-debug
          retention-days: 2
          if-no-files-found: error
          path: |
            tools/thf-phone-bridge/app/build/outputs/apk/debug/app-debug.apk
            bridge-badging.txt
            bridge.sha256
