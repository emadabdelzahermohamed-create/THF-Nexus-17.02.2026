name: THF Play Sensitive Permission Usage V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-play-sensitive-permission-usage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  permission_usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect exact THF native usage paths
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=10m --quiet \
            --command='set -Eeuo pipefail
          ROOT="$HOME/thf-runtime-s1/outer/01_THF_NEXUS_SUITE/ANDROID_PLAY_SOURCE"
          test -d "$ROOT"
          cd "$ROOT"
          echo THF_PLAY_SENSITIVE_PERMISSION_USAGE_V1_BEGIN
          echo "SOURCE_ROOT_SHA256=$(find . -type f -not -path "*/build/*" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk "{print \$1}")"
          echo DECLARED_PERMISSION_USAGE_EVIDENCE_BEGIN
          grep -RInE --exclude-dir=.git --exclude-dir=build --exclude='*.class' --exclude='*.jar' \
            'requestPermissions|checkSelfPermission|ActivityCompat|Manifest\.permission|ACCESS_(FINE|COARSE)_LOCATION|RECORD_AUDIO|CAMERA|onPermissionRequest|PermissionRequest|WebChromeClient|GeolocationPermissions|getUserMedia|mediaDevices|navigator\.geolocation|capture=' \
            . 2>/dev/null | head -300 || true
          echo DECLARED_PERMISSION_USAGE_EVIDENCE_END
          echo WEBVIEW_SECURITY_EVIDENCE_BEGIN
          grep -RInE --exclude-dir=.git --exclude-dir=build \
            'setJavaScriptEnabled|setAllowFileAccess|setAllowContentAccess|setMixedContentMode|addJavascriptInterface|setWebContentsDebuggingEnabled|shouldOverrideUrlLoading|onReceivedSslError|proceed\(' \
            . 2>/dev/null | head -200 || true
          echo WEBVIEW_SECURITY_EVIDENCE_END
          echo ENDPOINT_EVIDENCE_BEGIN
          grep -RInE --exclude-dir=.git --exclude-dir=build \
            'https?://|API_URL|BASE_URL|WebView|loadUrl' . 2>/dev/null | head -200 || true
          echo ENDPOINT_EVIDENCE_END
          if find . -path "*wave-mawja*" -o -path "*WAVE_MAWJA*" | grep -q .; then
            echo THF_WAVE_SOURCE_ISOLATION=FAIL
            exit 9
          fi
          echo THF_WAVE_SOURCE_ISOLATION=PASS
          echo MUTATION_PERFORMED=FALSE
          echo PRODUCTION_SIGNING_PERFORMED=FALSE
          echo PLAY_UPLOAD_PERFORMED=FALSE
          echo CLOUDFLARE_PRODUCTION_CUTOVER_PERFORMED=FALSE
          echo SOLANA_FINANCIAL_ACTION_PERFORMED=FALSE
          echo WAVE_UNTOUCHED=TRUE
          echo THF_PLAY_SENSITIVE_PERMISSION_USAGE_V1_END'
