name: Wave Play State Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-play-state-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  PACKAGE_NAME: com.wave.mobile

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate with WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Probe Google Play package access
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          HTTP_CODE="$(curl --silent --show-error -o /tmp/wave-play-probe.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $ACCESS_TOKEN"             -H 'Content-Type: application/json'             -d '{}'             "$API/edits")"

          python3 - "$HTTP_CODE" <<'PY'
          import json, sys
          code = sys.argv[1]
          data = json.load(open('/tmp/wave-play-probe.json', encoding='utf-8'))
          print('HTTP=' + code)
          if 'id' in data:
              print('RESULT=PACKAGE_EXISTS_AND_SERVICE_ACCOUNT_HAS_ACCESS')
              print('EDIT_ID=' + data['id'])
          else:
              err = data.get('error', {})
              print('RESULT=PACKAGE_NOT_ACCESSIBLE')
              print('STATUS=' + str(err.get('status', '')))
              print('MESSAGE=' + str(err.get('message', ''))[:500])
          PY

          if [[ "$HTTP_CODE" == "200" ]]; then
            EDIT_ID="$(python3 -c 'import json; print(json.load(open("/tmp/wave-play-probe.json"))["id"])')"
            curl --fail --silent --show-error               -X DELETE               -H "Authorization: Bearer $ACCESS_TOKEN"               "$API/edits/$EDIT_ID"
            echo "EDIT_DELETED=yes"
          fi
