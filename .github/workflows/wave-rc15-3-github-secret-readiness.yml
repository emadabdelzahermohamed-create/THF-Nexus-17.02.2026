name: WAVE RC15.3 GitHub Secret Readiness

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-3-github-secret-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_SECRET: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      D1_VAR: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      WAVE_D1_SECRET: ${{ secrets.WAVE_D1_DATABASE_ID }}
      WAVE_D1_VAR: ${{ vars.WAVE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check presence only; never print values
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${CF_TOKEN:-}" ] && echo CLOUDFLARE_API_TOKEN=PRESENT || echo CLOUDFLARE_API_TOKEN=MISSING
          [ -n "${CF_ACCOUNT_SECRET:-}${CF_ACCOUNT_VAR:-}" ] && echo CLOUDFLARE_ACCOUNT_ID=PRESENT || echo CLOUDFLARE_ACCOUNT_ID=MISSING
          [ -n "${D1_SECRET:-}${D1_VAR:-}${WAVE_D1_SECRET:-}${WAVE_D1_VAR:-}" ] && echo D1_DATABASE_ID=PRESENT || echo D1_DATABASE_ID=MISSING
