name: THF Terra Rift Staging APK V1 — SUPERSEDED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-terra-rift-staging-apk-v1.yml'
      - 'ReleaseOps/games/LATEST_GAME_AUTHORITY_V1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Refuse stale V1 candidate generation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('ReleaseOps/games/LATEST_GAME_AUTHORITY_V1.json').read_text())
          terra=d['games']['terra']; rift=d['games']['rift']
          assert terra['authoritative_source_sha256']=='eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68'
          assert terra['eligible_candidate_apk_sha256']=='e0ac997e1cdb0145b765884d8a59a70403821d1d1e19fbf6a05adcc4640cfbec'
          assert rift['authoritative_version']=='4.7.5-rc41'
          assert rift['authoritative_source_sha256']=='29edaa0eb594a25d0960cb176765663f9bab3d91a60fd98016474ff5695cb95d'
          assert rift['eligible_candidate_apk_sha256'] is None
          assert d['final_or_play_ready'] is False
          print('TERRA_RIFT_STAGING_V1=RETIRED_SUPERSEDED')
          print('TERRA_CURRENT_CANDIDATE=e0ac997e1cdb0145b765884d8a59a70403821d1d1e19fbf6a05adcc4640cfbec')
          print('RIFT_LATEST_AUTHORITY=4.7.5-rc41')
          print('RIFT_RC41_CANDIDATE_APK=NONE')
          print('PHYSICAL_DEVICE_STATUS=PENDING')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
