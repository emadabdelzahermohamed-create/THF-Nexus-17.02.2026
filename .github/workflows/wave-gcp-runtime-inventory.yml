name: WAVE GCP Runtime Inventory

on:
  push:
    branches:
      - releaseops/wave-recover-20260916
    paths:
      - '.github/workflows/wave-gcp-runtime-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read-only runtime inventory
        shell: bash
        run: |
          set -u
          echo '=== COMPUTE ==='
          gcloud compute instances list --project "$GCP_PROJECT_ID" --format='table(name,zone.basename(),status,machineType.basename(),networkInterfaces[0].accessConfigs[0].natIP)' || true
          echo '=== CLOUD RUN ==='
          gcloud run services list --project "$GCP_PROJECT_ID" --platform managed --format='table(metadata.name,location,status.url)' || true
          echo '=== STORAGE ==='
          gcloud storage buckets list --project "$GCP_PROJECT_ID" --format='table(name,location,storageClass)' || true
          echo '=== ARTIFACT REGISTRY ==='
          gcloud artifacts repositories list --project "$GCP_PROJECT_ID" --format='table(name.basename(),format,location)' || true
