name: THF TokenOps Review Replay Guard

on:
  push:
    branches:
      - 'tokenops/**'
    paths:
      - 'ReleaseOps/TokenOps/review_replay_guard.py'
      - 'ReleaseOps/TokenOps/test_review_replay_guard.py'
      - '.github/workflows/thf-tokenops-review-replay-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run replay and rollback fail-closed tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ReleaseOps/TokenOps
          python3 -m unittest -v test_review_replay_guard.py 2>&1 | tee review-replay-guard-tests.log

      - name: Assert non-execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^OK$' ReleaseOps/TokenOps/review-replay-guard-tests.log
          ! grep -R -nE 'sendTransaction|send_transaction|broadcast_transaction|Keypair\.from|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ReleaseOps/TokenOps/review_replay_guard.py \
            ReleaseOps/TokenOps/test_review_replay_guard.py
          printf '%s\n' \
            'THF_TOKENOPS_REVIEW_REPLAY_GUARD=PASS' \
            'ONE_TIME_REVIEW_TOKEN=TRUE' \
            'PRIOR_LEDGER_HEAD_CONTINUITY=TRUE' \
            'GITHUB_METADATA_BOUND=TRUE' \
            'SIMULATION_REVIEW_ONLY=TRUE' \
            'EXECUTION_AUTHORIZED=FALSE' \
            'TRANSACTION_CREATED=FALSE' \
            'TRANSACTION_SIGNED=FALSE' \
            'TRANSACTION_SUBMITTED=FALSE' \
            'BROADCAST_ALLOWED=FALSE' \
            'PRIVATE_KEY_USED=FALSE' \
            'FINANCIAL_EFFECT=FALSE' \
            'WAVE_UNTOUCHED=TRUE'

      - name: Produce evidence hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tokenops-review-replay-guard
          sha256sum \
            ReleaseOps/TokenOps/review_replay_guard.py \
            ReleaseOps/TokenOps/test_review_replay_guard.py \
            .github/workflows/thf-tokenops-review-replay-guard.yml \
            > tokenops-review-replay-guard/SHA256SUMS.txt
          cp ReleaseOps/TokenOps/review-replay-guard-tests.log tokenops-review-replay-guard/
          printf '%s\n' \
            'THF_TOKENOPS_REVIEW_REPLAY_GUARD=PASS' \
            'ONE_TIME_REVIEW_TOKEN=TRUE' \
            'PRIOR_LEDGER_HEAD_CONTINUITY=TRUE' \
            'GITHUB_METADATA_BOUND=TRUE' \
            'SIMULATION_REVIEW_ONLY=TRUE' \
            'EXECUTION_AUTHORIZED=FALSE' \
            'TRANSACTION_CREATED=FALSE' \
            'TRANSACTION_SIGNED=FALSE' \
            'TRANSACTION_SUBMITTED=FALSE' \
            'BROADCAST_ALLOWED=FALSE' \
            'PRIVATE_KEY_USED=FALSE' \
            'FINANCIAL_EFFECT=FALSE' \
            'WAVE_UNTOUCHED=TRUE' \
            > tokenops-review-replay-guard/SAFETY.txt

      - name: Upload replay-guard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Review-Replay-Guard
          path: tokenops-review-replay-guard/
          if-no-files-found: error
          retention-days: 90
