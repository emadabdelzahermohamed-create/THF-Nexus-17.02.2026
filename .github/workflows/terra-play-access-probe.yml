name: RuinsCiv Play Access Probe

on:
  push:
    branches: ['t/**']
    paths: ['.github/workflows/terra-play-access-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  PACKAGE_NAME: com.topherofit.ruins.civ

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Read-only Android Publisher permission probe
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          test -n "$ACCESS_TOKEN"
          URL="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/monetization/subscriptions?pageSize=1"
          CODE="$(curl -sS -o response.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$URL")"
          BYTES="$(wc -c < response.json | tr -d ' ')"
          echo "ANDROID_PUBLISHER_HTTP=$CODE"
          echo "ANDROID_PUBLISHER_RESPONSE_BYTES=$BYTES"
          if [ "$BYTES" -gt 0 ]; then
            python3 -c 'import json,pathlib; raw=pathlib.Path("response.json").read_text(errors="replace"); d=json.loads(raw) if raw.strip() else {}; e=d.get("error",{}) if isinstance(d,dict) else {}; print("ANDROID_PUBLISHER_ERROR_CODE="+str(e.get("code",""))) if e else None; print("ANDROID_PUBLISHER_ERROR_STATUS="+str(e.get("status",""))) if e else None; print("ANDROID_PUBLISHER_ERROR_MESSAGE="+str(e.get("message","")).replace("\\n"," ")[:400]) if e else None'
          fi
          case "$CODE" in
            200)
              echo "ANDROID_PUBLISHER_PACKAGE_READ_ACCESS=PASS"
              ;;
            401)
              echo "ANDROID_PUBLISHER_AUTH=FAIL"
              exit 41
              ;;
            403)
              echo "ANDROID_PUBLISHER_PACKAGE_READ_ACCESS=DENIED"
              echo "ANDROID_PUBLISHER_ACTION=Grant the WIF service account Play Console access to this app/package."
              ;;
            404)
              echo "ANDROID_PUBLISHER_PACKAGE_VISIBILITY=NOT_FOUND_OR_NOT_VISIBLE"
              echo "ANDROID_PUBLISHER_ACTION=Create/confirm the Play Console app with this package, then grant the WIF service account app access."
              ;;
            5*)
              echo "ANDROID_PUBLISHER_SERVICE=ERROR"
              exit 50
              ;;
            *)
              echo "ANDROID_PUBLISHER_CLASSIFICATION=UNEXPECTED_HTTP_$CODE"
              ;;
          esac
