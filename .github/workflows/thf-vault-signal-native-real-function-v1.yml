name: THF Vault Signal Native Real-Function V1 Superseded Guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-vault-signal-native-real-function-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-stale-v1-build-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Enforce superseded candidate policy
        run: |
          set -Eeuo pipefail
          test -s .github/workflows/thf-vault-signal-canonical-native-v2.yml
          test -s ReleaseOps/apps/THF_APPS_DURABLE_CANDIDATE_REGISTRY_V1.json
          grep -Fq 'THF Vault Signal Canonical Native Source V2' .github/workflows/thf-vault-signal-canonical-native-v2.yml
          python3 - <<'PY'
          import json
          p='ReleaseOps/apps/THF_APPS_DURABLE_CANDIDATE_REGISTRY_V1.json'
          data=json.load(open(p,encoding='utf-8'))
          for app in ('vault','signal'):
              c=data['candidates'][app]
              assert c['authority']=='CANONICAL_QA_CANDIDATE_NOT_FINAL'
              assert c['target_sdk']==36
              assert c['final_or_play_ready'] is False
          print('PASS: V1 build lane is superseded; no stale APK rebuild is authorized')
          PY
          {
            echo 'V1_BUILD_AUTHORITY=SUPERSEDED_REJECTED'
            echo 'CURRENT_BUILD_AUTHORITY=THF_VAULT_SIGNAL_CANONICAL_NATIVE_SOURCE_V2'
            echo 'STALE_SOURCE_REBUILD=FALSE'
            echo 'FINAL_OR_PLAY_READY=FALSE'
          } >> "$GITHUB_STEP_SUMMARY"
