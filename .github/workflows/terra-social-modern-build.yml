name: Terra Social Modern Human Build

on:
  push:
    branches:
      - 't/**'
      - 'releaseops/**'
    paths:
      - '.github/workflows/terra-social-modern-build.yml'
      - 'ReleaseOps/scripts/build_terra_rc34_compact_phone.sh'
      - 'ReleaseOps/scripts/verify_terra_modern_human_only.sh'
      - 'ReleaseOps/scripts/verify_terra_uploaded_asset_lineage.sh'
      - 'ReleaseOps/scripts/patch_terra_modern_human_current_source.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build-terra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - id: auth
        name: Authenticate with existing WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Prepare isolated Terra execution directory
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_OPS="/tmp/terra-social-ops-${GITHUB_RUN_ID}"
          REMOTE_BUILD="/tmp/terra-social-build-${GITHUB_RUN_ID}"
          echo "REMOTE_OPS=$REMOTE_OPS" >> "$GITHUB_ENV"
          echo "REMOTE_BUILD=$REMOTE_BUILD" >> "$GITHUB_ENV"
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="set -Eeuo pipefail; test -d \"\$HOME/thf-terra-rift-staging-apk-v1/terra/work\"; rm -rf '$REMOTE_OPS' '$REMOTE_BUILD'; mkdir -p '$REMOTE_OPS'; echo TERRA_SOURCE_PRESENT=PASS; echo WAVE_UNTOUCHED=TRUE"

      - name: Copy only Terra release scripts to builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute scp \
            ReleaseOps/scripts/build_terra_rc34_compact_phone.sh \
            ReleaseOps/scripts/verify_terra_modern_human_only.sh \
            ReleaseOps/scripts/verify_terra_uploaded_asset_lineage.sh \
            ReleaseOps/scripts/patch_terra_modern_human_current_source.py \
            "$GCP_BUILDER:$REMOTE_OPS/" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet

      - name: Execute real Godot 4.7.2 and Android API 36 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="set -Eeuo pipefail; chmod +x '$REMOTE_OPS'/*.sh '$REMOTE_OPS'/*.py; THF_TERRA_SOURCE=\"\$HOME/thf-terra-rift-staging-apk-v1/terra/work\" THF_TERRA_BUILD_ROOT='$REMOTE_BUILD' bash '$REMOTE_OPS/build_terra_rc34_compact_phone.sh'"

      - name: Pull build evidence and APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p terra-artifacts
          gcloud compute scp --recurse \
            "$GCP_BUILDER:$REMOTE_BUILD/out" \
            terra-artifacts/ \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet
          test -s terra-artifacts/out/EVIDENCE.json
          test -s terra-artifacts/out/THF-TERRA-4.6.8-RC34-MODERN-HUMAN-TEST.apk
          grep -q '"status": "PASS_BUILD_AND_ENGINE_GATES"' terra-artifacts/out/EVIDENCE.json
          grep -q '"uploaded_visual16a_lineage_gate": "PASS"' terra-artifacts/out/EVIDENCE.json
          echo WAVE_UNTOUCHED=TRUE
          cat terra-artifacts/out/EVIDENCE.json

      - name: Upload Terra build artifact
        uses: actions/upload-artifact@v4
        with:
          name: THF-Terra-RC34-Modern-Human-Test-${{ github.run_id }}
          retention-days: 14
          path: terra-artifacts/out/
          if-no-files-found: error

      - name: Cleanup isolated remote run directory
        if: always()
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="rm -rf '$REMOTE_OPS' '$REMOTE_BUILD'" >/dev/null 2>&1
          exit 0
