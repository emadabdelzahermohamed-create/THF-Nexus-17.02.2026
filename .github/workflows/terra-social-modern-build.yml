name: Terra Social Modern Human Build

on:
  push:
    branches:
      - 'releaseops/**'
    paths:
      - '.github/workflows/terra-social-modern-build.yml'
      - 'ReleaseOps/scripts/build_terra_rc34_compact_phone.sh'
      - 'ReleaseOps/scripts/verify_terra_modern_human_only.sh'
      - 'ReleaseOps/Terra/TERRA_ACTIVE_ASSET_POLICY_V1_20260917.json'
      - 'ReleaseOps/Terra/TERRA_UNIFIED_BACKLOG_V1_20260917.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build-terra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - id: auth
        name: Authenticate with existing WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Prepare isolated Terra execution directory
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command='set -Eeuo pipefail; test -d "$HOME/thf-terra-rift-staging-apk-v1/terra/work"; rm -rf /tmp/terra-social-releaseops; mkdir -p /tmp/terra-social-releaseops; echo TERRA_SOURCE_PRESENT=PASS; echo WAVE_UNTOUCHED=TRUE'

      - name: Copy only Terra release scripts to builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute scp \
            ReleaseOps/scripts/build_terra_rc34_compact_phone.sh \
            ReleaseOps/scripts/verify_terra_modern_human_only.sh \
            "$GCP_BUILDER:/tmp/terra-social-releaseops/" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet

      - name: Execute real Godot 4.7.2 and Android API 36 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command='set -Eeuo pipefail; chmod +x /tmp/terra-social-releaseops/*.sh; THF_TERRA_SOURCE="$HOME/thf-terra-rift-staging-apk-v1/terra/work" THF_TERRA_BUILD_ROOT="$HOME/thf-terra-social-modern-build" bash /tmp/terra-social-releaseops/build_terra_rc34_compact_phone.sh'

      - name: Pull build evidence and APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p terra-artifacts
          gcloud compute scp --recurse \
            "$GCP_BUILDER:$HOME/thf-terra-social-modern-build/out" \
            terra-artifacts/ \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet
          test -s terra-artifacts/out/EVIDENCE.json
          test -s terra-artifacts/out/THF-TERRA-4.6.8-RC34-MODERN-HUMAN-TEST.apk
          grep -q '"status": "PASS_BUILD_AND_ENGINE_GATES"' terra-artifacts/out/EVIDENCE.json
          echo WAVE_UNTOUCHED=TRUE
          cat terra-artifacts/out/EVIDENCE.json

      - name: Upload Terra build artifact
        uses: actions/upload-artifact@v4
        with:
          name: THF-Terra-RC34-Modern-Human-Test
          retention-days: 14
          path: terra-artifacts/out/
          if-no-files-found: error
