name: THF RC16 Gradle Structure Inspect

on:
  push:
    branches: ['releaseops/**']
    paths: ['.github/workflows/thf-rc16-gradle-structure-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect Gradle metadata in exact RC16 archives
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command='python3 - <<"PY"
          from pathlib import Path
          import zipfile
          base=Path.home()/"thf-builder"/"inputs-direct"
          names=[
            "THF_Core_RC6_ANDROID_NATIVE_I18N_RELEASE_CUMULATIVE_SOURCE.zip",
            "THF_Terra_v4.5.5_RC21_NATIVE_FACIAL_MICROEXPRESSIONS_CUMULATIVE_SOURCE.zip",
            "THF_Rift_v4.5.8_RC24_ATTACHMENT_HYSTERESIS_SIGHT_CALIBRATION_CUMULATIVE_SOURCE.zip",
          ]
          for name in names:
            p=base/name
            print("===ARCHIVE",name,"EXISTS",p.exists(),"===")
            with zipfile.ZipFile(p) as z:
              gradle=[n for n in z.namelist() if n.endswith(("settings.gradle","settings.gradle.kts","build.gradle","build.gradle.kts","gradle.properties")) and "/build/" not in n]
              for n in gradle:
                print("PATH",n)
                if n.endswith(("settings.gradle","settings.gradle.kts","build.gradle","build.gradle.kts")):
                  try:
                    text=z.read(n).decode("utf-8","replace")
                    for line in text.splitlines():
                      if any(k in line for k in ("com.android.tools.build:gradle","com.android.application","compileSdk","targetSdk","applicationId","namespace","include")):
                        print("  ",line[:500])
                  except Exception as e: print("READ_ERROR",e)
          print("THF_RC16_GRADLE_STRUCTURE_INSPECT=PASS")
          print("WAVE_UNTOUCHED=TRUE")
          PY'
