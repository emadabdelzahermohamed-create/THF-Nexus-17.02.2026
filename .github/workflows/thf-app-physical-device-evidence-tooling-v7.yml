name: THF App Physical Device Evidence Tooling V7

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/mobile/validate_app_device_evidence_v2.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v2.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v3.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v3.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v4.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v4.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v5.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v5.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v6.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v6.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v7.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v7.py'
      - 'ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json'
      - '.github/workflows/thf-app-physical-device-evidence-tooling-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tooling-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile fail-closed app evidence tooling V2-V7
        run: |
          for v in 2 3 4 5 6 7; do
            python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v${v}.py
            python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v${v}.py
          done
      - name: Run complete V2 through V7 evidence regressions
        working-directory: ReleaseOps/mobile
        run: |
          for v in 2 3 4 5 6 7; do
            python -m unittest -v test_validate_app_device_evidence_v${v}.py
          done
      - name: Verify V7 preserves authoritative pending truth
        env:
          PYTHONPATH: ReleaseOps/mobile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from validate_app_device_evidence_v7 import REQUIRED_EXACT_KEYS
          p=Path('ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['truth_boundary']['all_pending'] is True
          assert d['truth_boundary']['final_or_play_ready'] is False
          assert len(d['candidates']) == 10
          assert all(row['status'] == 'PENDING_PHYSICAL_PHONE' for row in d['candidates'])
          assert 'THF_DEVICE_FINGERPRINT_SHA256' in REQUIRED_EXACT_KEYS
          assert 'THF_OBS_STARTED_AT_UTC' in REQUIRED_EXACT_KEYS
          assert 'THF_OBS_ENDED_AT_UTC' in REQUIRED_EXACT_KEYS
          print('APP_CANDIDATES=10')
          print('LIFECYCLE_EXACT_KEY_VALUE_BINDING=TRUE')
          print('DEVICE_FINGERPRINT_TRANSCRIPT_BINDING=TRUE')
          print('OBSERVATION_INTERVAL_TRANSCRIPT_BINDING=TRUE')
          print('DUPLICATE_REQUIRED_KEYS_REJECTED=TRUE')
          print('PHYSICAL_DEVICE_STATUS=PENDING')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
