name: WAVE Cloudflare Auth Gate
on:
  workflow_dispatch:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-cloudflare-auth-gate.yml'
      - 'ReleaseOps/WAVE/**'
permissions:
  contents: read
jobs:
  auth-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WAVE Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "BLOCKER=CLOUDFLARE_API_TOKEN_MISSING"; exit 21; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "BLOCKER=CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 22; }
          body="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True and d.get("result",{}).get("status")=="active"' <<<"$body"
          echo "WAVE_CLOUDFLARE_TOKEN=PASS"
      - name: Verify live WAVE origin
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/wave.html -w '%{http_code}' https://wave-mawja.p-my.workers.dev/)"
          test "$code" = "200"
          test -s /tmp/wave.html
          echo "WAVE_LIVE_ORIGIN=PASS"
