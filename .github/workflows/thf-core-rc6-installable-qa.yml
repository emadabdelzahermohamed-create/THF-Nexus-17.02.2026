name: THF Core RC6 Installable QA APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-core-rc6-installable-qa.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build-installable-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build isolated canonical Core RC6 QA APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-core-rc6-gate"
          SRC="$HOME/thf-builder/inputs-rc17/THF_Core_RC6_ANDROID_NATIVE_I18N_RELEASE_CUMULATIVE_SOURCE.zip"
          EXPECTED="6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a"
          SDK="$HOME/thf-builder-rc16-build/android-sdk"
          CACHE="$HOME/thf-builder-rc16-build/cache"
          WORK="$ROOT/work-installable-v1"
          OUT="$ROOT/out-installable-v1"
          FINAL="$OUT/THF-Core-RC6-INSTALLABLE-QA.apk"

          test -f "$SRC"
          BEFORE=$(sha256sum "$SRC" | awk '{print $1}')
          echo CORE_RC6_SOURCE_SHA256="$BEFORE"
          test "$BEFORE" = "$EXPECTED"
          unzip -tq "$SRC" >/dev/null
          test -d "$SDK"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT" "$ROOT/gradle-home"
          unzip -q "$SRC" -d "$WORK"
          PROJ="$WORK/android"
          test -f "$PROJ/app/build.gradle"
          test -f "$PROJ/settings.gradle"

          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK" GRADLE_USER_HOME="$ROOT/gradle-home"
          printf "sdk.dir=%s\n" "$SDK" > "$PROJ/local.properties"
          unset THF_KEYSTORE_PATH THF_KEY_ALIAS THF_KEYSTORE_PASSWORD THF_KEY_PASSWORD

          DIST="$CACHE/gradle-dist-8.11.1/gradle-8.11.1/bin/gradle"
          test -x "$DIST"
          cd "$PROJ"
          "$DIST" --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin >/dev/null
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          echo RAW_APK="$APK"

          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"
          ZIPALIGN="$BT/zipalign"
          test -x "$AAPT" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"

          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,8p'
          grep -q "package: name='com.topherofit.thf.core'" <<<"$BADGING"
          grep -q "versionCode='62200'" <<<"$BADGING"
          grep -q "targetSdkVersion:'36'" <<<"$BADGING"

          TMP="$OUT/core-rc6-aligned-unsigned.apk"
          if "$ZIPALIGN" -c -p 4 "$APK" >/dev/null 2>&1; then
            cp "$APK" "$TMP"
          else
            "$ZIPALIGN" -f -p 4 "$APK" "$TMP"
          fi

          KS="$ROOT/qa-debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=THF QA,C=US" -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          fi
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$FINAL" "$TMP"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL"
          "$ZIPALIGN" -c -p 4 "$FINAL"

          FINAL_BADGING=$("$AAPT" dump badging "$FINAL")
          printf '%s\n' "$FINAL_BADGING" | tee "$OUT/THF-Core-RC6-INSTALLABLE-QA.badging.txt"
          grep -q "package: name='com.topherofit.thf.core'" <<<"$FINAL_BADGING"
          grep -q "versionCode='62200'" <<<"$FINAL_BADGING"
          grep -q "targetSdkVersion:'36'" <<<"$FINAL_BADGING"
          sha256sum "$FINAL" | tee "$OUT/THF-Core-RC6-INSTALLABLE-QA.sha256"
          stat -c 'CORE_QA_APK_SIZE_BYTES=%s' "$FINAL"

          AFTER=$(sha256sum "$SRC" | awk '{print $1}')
          echo CORE_RC6_SOURCE_SHA256_AFTER="$AFTER"
          test "$AFTER" = "$EXPECTED"
          if find "$WORK" -path '*wave-mawja*' -o -path '*WAVE_MAWJA*' | grep -q .; then
            echo CORE_WAVE_ISOLATION=FAIL
            exit 41
          fi
          echo CORE_WAVE_ISOLATION=PASS
          echo CORE_QA_SIGNING=THF_QA_DEBUG_KEYSTORE
          echo CANONICAL_SOURCE_MUTATION=FALSE
          echo PRODUCTION_SIGNING_PERFORMED=FALSE
          echo PLAY_UPLOAD_PERFORMED=FALSE
          echo CLOUDFLARE_PRODUCTION_CUTOVER_PERFORMED=FALSE
          echo SOLANA_FINANCIAL_ACTION_PERFORMED=FALSE
          echo CORE_RC6_INSTALLABLE_QA=PASS
          REMOTE

      - name: Retrieve Core QA evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p core-rc6-installable
          for f in THF-Core-RC6-INSTALLABLE-QA.apk THF-Core-RC6-INSTALLABLE-QA.badging.txt THF-Core-RC6-INSTALLABLE-QA.sha256; do
            gcloud compute scp "$GCP_BUILDER:~/thf-core-rc6-gate/out-installable-v1/$f" core-rc6-installable/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          done
          sha256sum core-rc6-installable/THF-Core-RC6-INSTALLABLE-QA.apk

      - name: Upload Core installable QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: THF-Core-RC6-INSTALLABLE-QA
          path: core-rc6-installable/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
