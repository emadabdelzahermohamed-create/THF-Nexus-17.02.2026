name: THF Apps Latest Exact Candidate Hosted V2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-apps-latest-exact-candidate-hosted-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Stage exact current sources
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          rm -rf src work out && mkdir -p src work out
          cat > src/matrix.tsv <<'EOF'
          pulse	RC3	71a16804e7c138535bb373263ae4374d8a5eef410ffe83b165472c684b6c8b10	com.topherofit.thf.pulse	1AbcoAGpkhtOTiwxVIPaDFgOL8ZSs02KF
          forge	RC3	0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51	com.topherofit.thf.forge	1hoq_PHHAKihrUYeJ6DXsBjAleAkc1LwQ
          echo	RC4	87c6a532fc56870b9a4c1039ac1f44b43e1a2f4c5c4518caf0d6537c61704226	com.topherofit.thf.echo	113ncXza3VjYjGHv9-5HSFXAXFJjGLP8T
          codex	RC4	c5108b257b5e9af6849c43df7b7aa671e586bb4a9c91964566c85b1a6329e83d	com.topherofit.thf.codex	1d5l5TcI0gphbs6O9F8_kpYkCayrmV9hZ
          spark	RC3	dc312dc65e681e914c3421a20362cd0fba0c1e692a7becdb66d7d17a0b6299a0	com.topherofit.thf.spark	1FFOkrjtEhKz_Ubj-MErw5UB7tQzZHZ7k
          rush	RC3	bd7e365ded07fd569020fff1c699d74322fd5c767b16ac6336f2bc99f8b5958b	com.topherofit.thf.rush	1AX9eoqi8I8SJRKmJSb6czFyjIif-JFxD
          vault	RC3	7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793	com.topherofit.thf.vault	1OuR6dm89A3aIu0UwcaUVs_VYQJxbReac
          signal	RC3	51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0	com.topherofit.thf.signal	1WtqjtPgPxyOPGk5T9FHQTF7lyAzPLBXA
          command	RC3	f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408	com.topherofit.thf.command	1eOdaj9IYsExCgzV0evwkW2hTpRie1Yke
          EOF
          printf 'app\tcheckpoint\tpackage\tsha256\n' > out/source-verified.tsv
          while IFS=$'\t' read -r app cp sha pkg fid; do
            f="src/$app.zip"
            code=$(curl -sSLo "$f" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$fid?alt=media&supportsAllDrives=true")
            [ "$code" = 200 ]
            unzip -tq "$f" >/dev/null
            actual=$(sha256sum "$f" | awk '{print $1}')
            [ "$actual" = "$sha" ]
            mkdir -p "work/$app" && unzip -q "$f" -d "work/$app"
            printf '%s\t%s\t%s\t%s\n' "$app" "$cp" "$pkg" "$actual" >> out/source-verified.tsv
          done < src/matrix.tsv
          echo EXACT_SOURCE_STAGE=PASS

      - name: Provision shared Python test dependencies
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/thf-test-venv"
          . "$RUNNER_TEMP/thf-test-venv/bin/activate"
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          req="$RUNNER_TEMP/combined-requirements.txt"
          : > "$req"
          find work -type f -name requirements.txt -print0 | xargs -0 cat | sed '/^[[:space:]]*$/d' | sort -u > "$req"
          python -m pip install -r "$req"

      - name: Compile unit-test and source-policy all apps
        run: |
          set -Eeuo pipefail
          . "$RUNNER_TEMP/thf-test-venv/bin/activate"
          printf 'app\tcheckpoint\tpackage\tcompileall\tpytest\tsource_policy\n' > out/source-tests.tsv
          overall=0
          while IFS=$'\t' read -r app cp sha pkg fid; do
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            test -n "$root"
            comp=PASS; python -m compileall -q "$root" || comp=FAIL
            py=NO_TESTS
            if [ -d "$root/tests" ] && find "$root/tests" -type f -name 'test_*.py' | grep -q .; then
              set +e; (cd "$root" && python -m pytest -q) >"out/$app.pytest.log" 2>&1; r=$?; set -e
              py=PASS; [ $r -eq 0 ] || py=FAIL
            fi
            set +e; python ReleaseOps/validators/validate_mobile_real_function_source.py "$root" --package "$pkg" --json-out "out/$app.source-policy.json" >"out/$app.source-policy.log" 2>&1; s=$?; set -e
            pol=PASS; [ $s -eq 0 ] || pol=FAIL
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$cp" "$pkg" "$comp" "$py" "$pol" >> out/source-tests.tsv
            [ "$comp" = PASS ] && [ "$py" != FAIL ] && [ "$pol" = PASS ] || overall=1
          done < src/matrix.tsv
          cat out/source-tests.tsv
          echo "SOURCE_TEST_OVERALL=$overall" | tee out/source-test-overall.txt

      - name: Build QA-sign and inspect every candidate
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"; ZIPALIGN="$BT/zipalign"
          KS="$RUNNER_TEMP/qa.keystore"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=THF QA,C=US' -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          printf 'app\tcheckpoint\tpackage\tsource_sha256\tbuild_status\tapk_sha256\tpackage_ok\ttarget36_ok\tsignature_ok\tdebuggable\tmin_sdk\tversion_code\tversion_name\n' > out/results.tsv
          while IFS=$'\t' read -r app cp sha pkg fid; do
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$root/android/local.properties"
            set +e; (cd "$root/android" && gradle --no-daemon clean assembleRelease) >"out/$app.gradle.log" 2>&1; rc=$?; set -e
            if [ $rc -ne 0 ]; then printf '%s\t%s\t%s\t%s\tBUILD_FAIL\t\tfalse\tfalse\tfalse\t\t\t\t\n' "$app" "$cp" "$pkg" "$sha" >> out/results.tsv; continue; fi
            raw=$(find "$root/android" -type f -name '*.apk' -path '*/build/outputs/apk/release/*' | head -1 || true)
            if [ -z "$raw" ]; then printf '%s\t%s\t%s\t%s\tBUILD_NO_APK\t\tfalse\tfalse\tfalse\t\t\t\t\n' "$app" "$cp" "$pkg" "$sha" >> out/results.tsv; continue; fi
            aligned="out/$app-aligned.apk"; final="out/THF-${app^^}-${cp}-EXACT-QA.apk"
            "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$final" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$final" >"out/$app.signature.txt"
            badging=$("$AAPT" dump badging "$final"); printf '%s\n' "$badging" >"out/$app.badging.txt"
            p=false; grep -q "package: name='$pkg'" <<<"$badging" && p=true
            t=false; grep -q "targetSdkVersion:'36'" <<<"$badging" && t=true
            sig=false; "$APKSIGNER" verify "$final" >/dev/null 2>&1 && sig=true
            dbg=false; grep -q application-debuggable <<<"$badging" && dbg=true
            min=$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vc=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vn=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            ah=$(sha256sum "$final" | awk '{print $1}')
            st=APK_INSPECTION_FAIL; [ "$p" = true ] && [ "$t" = true ] && [ "$sig" = true ] && [ "$dbg" = false ] && st=APK_INSPECTION_PASS
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$cp" "$pkg" "$sha" "$st" "$ah" "$p" "$t" "$sig" "$dbg" "$min" "$vc" "$vn" >> out/results.tsv
            rm -f "$aligned"
          done < src/matrix.tsv
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('out/results.tsv'),delimiter='\t'))
          src=list(csv.DictReader(open('out/source-tests.tsv'),delimiter='\t'))
          d={'schema':2,'mode':'QA_ONLY_REVERSIBLE','production_signing':False,'public_rollout':False,'apps':rows,'source_tests':src}
          d['counts']={'total':len(rows),'inspection_pass':sum(x['build_status']=='APK_INSPECTION_PASS' for x in rows),'build_fail':sum(x['build_status']!='APK_INSPECTION_PASS' for x in rows),'source_test_fail':sum(x['compileall']!='PASS' or x['pytest']=='FAIL' or x['source_policy']!='PASS' for x in src)}
          d['final_readiness']='NOT_FINAL_PHYSICAL_DEVICE_AND_LIVE_BACKEND_GATES_REQUIRED'
          json.dump(d,open('out/summary.json','w'),indent=2)
          print(json.dumps(d['counts']))
          PY
          cat out/results.tsv

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-APPS-LATEST-EXACT-QA-HOSTED-V2
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Fail closed on source or package regression
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('out/summary.json'))
          assert d['counts']['total']==9, d['counts']
          assert d['counts']['source_test_fail']==0, d['counts']
          assert d['counts']['inspection_pass']==9 and d['counts']['build_fail']==0, d['counts']
          print('THF_APPS_LATEST_EXACT_QA_HOSTED_V2=PASS')
          PY
