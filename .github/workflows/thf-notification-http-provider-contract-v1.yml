name: THF Notification HTTP Provider Contract V1

on:
  push:
    paths:
      - 'ReleaseOps/apps_factory/notification_lifecycle.py'
      - 'ReleaseOps/apps_factory/notification_http_contract.py'
      - 'ReleaseOps/apps_factory/notification_provider_contract.py'
      - 'ReleaseOps/apps_factory/notification_dispatch.py'
      - 'ReleaseOps/apps_factory/pass_notification_bridge.py'
      - 'ReleaseOps/apps_factory/tests/test_notification_lifecycle.py'
      - 'ReleaseOps/apps_factory/tests/test_notification_http_contract.py'
      - 'ReleaseOps/apps_factory/tests/test_notification_provider_contract.py'
      - 'ReleaseOps/apps_factory/tests/test_notification_dispatch.py'
      - 'ReleaseOps/apps_factory/tests/test_pass_notification_bridge.py'
      - 'ReleaseOps/apps_factory/THF_NOTIFICATION_DEVICE_EVIDENCE_TEMPLATE_V1.json'
      - '.github/workflows/thf-notification-http-provider-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile candidates
        run: |
          python -m py_compile ReleaseOps/apps_factory/notification_lifecycle.py
          python -m py_compile ReleaseOps/apps_factory/notification_http_contract.py
          python -m py_compile ReleaseOps/apps_factory/notification_provider_contract.py
          python -m py_compile ReleaseOps/apps_factory/notification_dispatch.py
          python -m py_compile ReleaseOps/apps_factory/pass_notification_bridge.py
      - name: Run notification and live Pass session regressions
        env:
          PYTHONPATH: ReleaseOps/apps_factory
        run: |
          python -m pytest -q \
            ReleaseOps/apps_factory/tests/test_notification_lifecycle.py \
            ReleaseOps/apps_factory/tests/test_notification_http_contract.py \
            ReleaseOps/apps_factory/tests/test_notification_provider_contract.py \
            ReleaseOps/apps_factory/tests/test_notification_dispatch.py \
            ReleaseOps/apps_factory/tests/test_pass_notification_bridge.py
      - name: Enforce device evidence fail-closed template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ReleaseOps/apps_factory/THF_NOTIFICATION_DEVICE_EVIDENCE_TEMPLATE_V1.json')
          d=json.loads(p.read_text())
          t=d['truth_boundary']
          assert t['template_only'] is True
          assert t['physical_device_pass'] is False
          assert t['push_ready'] is False
          assert t['final_or_play_ready'] is False
          assert all(v == 'PENDING' for v in d['required_observations'].values())
          required={'app_name','package_id','apk_sha256','source_sha256','device_model','android_version','test_timestamp_utc'}
          assert required == set(d['required_binding'])
          print('NOTIFICATION_PASS_SESSION_CONTRACT=PASS')
          print('PHYSICAL_DEVICE_PASS=FALSE')
          print('PUSH_READY=FALSE')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
