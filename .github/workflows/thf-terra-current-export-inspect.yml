name: THF Terra Current Export Inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-terra-current-export-inspect.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect exact current Terra native runtime
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='set -Eeuo pipefail
          ROOT="$HOME/thf-terra-rift-staging-apk-v1/terra/work"
          echo "=== ROOT ==="; test -d "$ROOT"; pwd; du -sh "$ROOT" || true
          echo "=== PROJECT ==="; sed -n "1,220p" "$ROOT/project.godot" 2>/dev/null || true
          echo "=== EXPORT PRESETS ==="; sed -n "1,320p" "$ROOT/export_presets.cfg" 2>/dev/null || true
          echo "=== MANIFESTS ==="; find "$ROOT" -maxdepth 2 -type f \( -iname "*release*manifest*" -o -iname "*validation*" -o -iname "*final*gate*" \) -printf "%TY-%Tm-%Td %TH:%TM %s %p\n" | sort -r | head -100 || true
          echo "=== MAIN SCRIPTS ==="; find "$ROOT" -maxdepth 4 -type f \( -name "*.gd" -o -name "*.tscn" \) -printf "%p\n" | head -160 || true
          echo "=== AVATAR ASSET SIZES ==="; find "$ROOT/web/static/assets" -type f \( -iname "*mpfb*.glb" -o -iname "*humanoid*.glb" -o -iname "casual_*.glb" -o -iname "sport_*.glb" \) -printf "%s %p\n" 2>/dev/null | sort -nr | head -60 || true
          echo "=== APK LARGE ENTRIES ==="; APK="$HOME/thf-terra-rift-staging-apk-v1/out/terra/THF-TERRA-STAGING-QA.apk"; test -s "$APK"; unzip -lv "$APK" | sort -k1,1nr | head -80 || true
          echo "=== APK LIBS ==="; unzip -l "$APK" | grep -E "lib/[^/]+/.*\\.so$" | head -100 || true
          '
