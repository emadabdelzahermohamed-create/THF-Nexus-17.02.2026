name: THF Apps RC2 Exact Candidate Large Batch V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-apps-rc2-exact-candidate-large-batch-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  exact-candidate-large-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Download and verify exact APPS-RC2 sources from private Drive
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source-staging
          cat > source-staging/expected.tsv <<'EOF'
          pulse	ef4d82dc1e3fff0d0bcdf0b7b31b9820aa9c958d846e9b1fd8ee6a19430ab6f8	com.topherofit.thf.pulse	1HNr30eMTncOwDHVqDrIPIJkUeCFHCf8J
          forge	8f6bf74b15146bc0a895912c40b9946ef5c3cc8df99fdcae39fa615ce4f03eed	com.topherofit.thf.forge	1x5CkF0QsrV79XhOu63sgvulHrz6HfpqO
          echo	09773a4c3890fc43ee8e15b37267555f9db0e471fe8cbdcefa3886d2a2def73a	com.topherofit.thf.echo	1goVTAJ3Eyb9pomzyU8Mo2XlrV0l7fK12
          codex	d8cf35346e244c141c65d4a5ce10e07f7fb2d4d6b831a0a63dd0b517d3ae0b83	com.topherofit.thf.codex	1lKDkYYyBkAJpfal_n1FEMCnX0i6nz7ep
          spark	6b74f8d75df8c0b7f74d8c2fee8be7e3517f3803cb42968735bc7a10939bc18c	com.topherofit.thf.spark	1j_4XEjaRmFW3VaicsVghAMkwrLC5MWac
          rush	bb6ff035186b13cdde853145f42e66259c205889de2a7b368da34c9cb0582ba7	com.topherofit.thf.rush	1ODroBDz4aN_gk2NR5HoWlCxQhAnjBk6p
          vault	e53d0cb62296581b1d8b52ce040b10ac896607adcc049b78f06a75bc8c28f6c7	com.topherofit.thf.vault	1E_J4zDHMLeMcV8eulk3d-QmCvWlw6E8t
          signal	87e199ff2c174990b6e0e4e4ddd8accc0d585d2675343067395ccdf9490e9fb1	com.topherofit.thf.signal	1P2IqNhk-h1wdJF-hkbYdh-AKqC4GmFKJ
          command	7dc686a9ad78ef90eec7cb2f7e65495356b3d513d9fc152c7ee8e3d20f91e487	com.topherofit.thf.command	1AD746APenK7t-yY-rrLAI4Jx57MwiYe9
          EOF
          : > source-staging/verified.tsv
          while IFS=$'\t' read -r app expected pkg drive_id; do
            f="source-staging/${app}.zip"
            code=$(curl --silent --show-error --location \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -o "$f" -w '%{http_code}' \
              "https://www.googleapis.com/drive/v3/files/${drive_id}?alt=media&supportsAllDrives=true")
            [ "$code" = 200 ]
            unzip -tq "$f" >/dev/null
            actual=$(sha256sum "$f" | awk '{print $1}')
            [ "$actual" = "$expected" ]
            printf '%s\t%s\t%s\t%s\n' "$app" "$pkg" "$actual" "$drive_id" >> source-staging/verified.tsv
          done < source-staging/expected.tsv
          echo APPS_RC2_DRIVE_SOURCE_STAGING=PASS

      - name: Stage exact sources to isolated builder workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=60m --quiet --command='rm -rf "$HOME/thf-apps-rc2-exact-candidate-v2" && mkdir -p "$HOME/thf-apps-rc2-exact-candidate-v2/source"'
          gcloud compute scp source-staging/*.zip source-staging/expected.tsv \
            "$GCP_BUILDER:~/thf-apps-rc2-exact-candidate-v2/source/" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet

      - name: Build, QA-sign and inspect exact-package API36 candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=60m --quiet --command='bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-apps-rc2-exact-candidate-v2"
          SRC="$ROOT/source"
          WORK="$ROOT/work"
          OUT="$ROOT/out"
          SDK="$HOME/thf-builder-rc16-build/android-sdk"
          rm -rf "$WORK" "$OUT" && mkdir -p "$WORK" "$OUT"
          test -d "$SDK"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"; ZIPALIGN="$BT/zipalign"
          test -x "$AAPT"; test -x "$APKSIGNER"; test -x "$ZIPALIGN"
          GRADLE=$(find "$HOME/.gradle/wrapper/dists" -type f -path '*/bin/gradle' -perm -u+x 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$GRADLE" ]; then GRADLE=$(command -v gradle || true); fi
          test -n "$GRADLE"
          "$GRADLE" --version | sed -n '1,8p' > "$OUT/gradle-version.txt"
          KS="$ROOT/qa-debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android \
              -dname 'CN=Android Debug,O=THF QA,C=US' -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          fi
          printf 'app\tpackage\tsource_sha256\tbuild_status\tapk_sha256\tpackage_ok\ttarget36_ok\tsignature_ok\tdebuggable\tmin_sdk\tversion_code\tversion_name\tnote\n' > "$OUT/results.tsv"

          while IFS=$'\t' read -r app expected pkg drive_id; do
            z="$SRC/$app.zip"
            actual=$(sha256sum "$z" | awk '{print $1}')
            [ "$actual" = "$expected" ]
            d="$WORK/$app"; mkdir -p "$d"
            unzip -q "$z" -d "$d"
            root=$(find "$d" -type f -path '*/android/settings.gradle' -printf '%h\n' | head -1 || true)
            [ -n "$root" ] || { printf '%s\t%s\t%s\tNO_ANDROID_ROOT\t\tfalse\tfalse\tfalse\t\t\t\t\tno android root\n' "$app" "$pkg" "$expected" >> "$OUT/results.tsv"; continue; }
            printf 'sdk.dir=%s\n' "$SDK" > "$root/local.properties"
            set +e
            (cd "$root" && "$GRADLE" --no-daemon clean assembleRelease) >"$OUT/$app.gradle.log" 2>&1
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              printf '%s\t%s\t%s\tBUILD_FAIL\t\tfalse\tfalse\tfalse\t\t\t\t\tassembleRelease failed\n' "$app" "$pkg" "$expected" >> "$OUT/results.tsv"
              continue
            fi
            raw=$(find "$root" -type f -name '*.apk' -path '*/build/outputs/apk/release/*' | head -1 || true)
            [ -n "$raw" ] || { printf '%s\t%s\t%s\tBUILD_NO_APK\t\tfalse\tfalse\tfalse\t\t\t\t\tno release APK\n' "$app" "$pkg" "$expected" >> "$OUT/results.tsv"; continue; }
            aligned="$OUT/$app-aligned-unsigned.apk"
            final="$OUT/THF-${app^^}-APPS-RC2-EXACT-QA.apk"
            "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$final" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$final" > "$OUT/$app.signature.txt"
            "$ZIPALIGN" -c -p 4 "$final"
            badging=$("$AAPT" dump badging "$final")
            printf '%s\n' "$badging" > "$OUT/$app.badging.txt"
            p_ok=false; grep -q "package: name='$pkg'" <<<"$badging" && p_ok=true
            t_ok=false; grep -q "targetSdkVersion:'36'" <<<"$badging" && t_ok=true
            sig_ok=false; "$APKSIGNER" verify "$final" >/dev/null 2>&1 && sig_ok=true
            debug=false; grep -q 'application-debuggable' <<<"$badging" && debug=true
            min_sdk=$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vc=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vn=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            apksha=$(sha256sum "$final" | awk '{print $1}')
            printf '%s  %s\n' "$apksha" "$(basename "$final")" > "$OUT/$app.sha256"
            status=APK_INSPECTION_FAIL
            [ "$p_ok" = true ] && [ "$t_ok" = true ] && [ "$sig_ok" = true ] && [ "$debug" = false ] && status=APK_INSPECTION_PASS
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$pkg" "$expected" "$status" "$apksha" "$p_ok" "$t_ok" "$sig_ok" "$debug" "$min_sdk" "$vc" "$vn" 'QA signature only; runtime endpoint/device gates pending' >> "$OUT/results.tsv"
            rm -f "$aligned"
          done < "$SRC/expected.tsv"

          python3 - "$OUT/results.tsv" "$OUT/summary.json" <<'PY'
          import csv,json,sys
          rows=list(csv.DictReader(open(sys.argv[1]),delimiter='\t'))
          d={'schema':2,'mode':'QA_ONLY_REVERSIBLE','exact_source_required':True,'production_signing':False,'public_rollout':False,'physical_device_gate':'REQUIRED_BEFORE_FINAL','runtime_endpoint_gate':'REQUIRED_BEFORE_FINAL','apps':rows}
          d['counts']={'total':len(rows),'inspection_pass':sum(x['build_status']=='APK_INSPECTION_PASS' for x in rows),'build_fail':sum(x['build_status']=='BUILD_FAIL' for x in rows),'other_fail':sum(x['build_status'] not in ('APK_INSPECTION_PASS','BUILD_FAIL') for x in rows)}
          json.dump(d,open(sys.argv[2],'w'),indent=2)
          PY
          cat "$OUT/summary.json"
          REMOTE

      - name: Retrieve exact candidate evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf out && mkdir out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-apps-rc2-exact-candidate-v2/out/*" out/ \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          python3 -m json.tool out/summary.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-APPS-RC2-EXACT-QA-CANDIDATES-V2
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Truth and safety gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('out/summary.json'))
          assert d['mode']=='QA_ONLY_REVERSIBLE'
          assert d['exact_source_required'] is True
          assert d['production_signing'] is False and d['public_rollout'] is False
          assert d['physical_device_gate']=='REQUIRED_BEFORE_FINAL'
          assert d['runtime_endpoint_gate']=='REQUIRED_BEFORE_FINAL'
          assert d['counts']['total']==9
          for a in d['apps']:
              if a['build_status']=='APK_INSPECTION_PASS':
                  assert a['package_ok']=='true' and a['target36_ok']=='true' and a['signature_ok']=='true'
                  assert a['debuggable']=='false' and len(a['apk_sha256'])==64
          print('THF_APPS_RC2_EXACT_CANDIDATE_LARGE_BATCH=PASS')
          PY
