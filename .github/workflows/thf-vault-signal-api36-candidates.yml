name: THF Vault Signal API36 QA Superseded Guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-vault-signal-api36-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-superseded-wrapper-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Reject stale wrapper build authority
        run: |
          set -Eeuo pipefail
          test -s .github/workflows/thf-vault-signal-canonical-native-v2.yml
          test -s ReleaseOps/scripts/build_vault_signal_canonical_native_v2.sh
          grep -Fq 'THF Vault Signal Canonical Native Source V2' .github/workflows/thf-vault-signal-canonical-native-v2.yml
          grep -Fq 'THF_NATIVE_REAL_FUNCTION_V2' ReleaseOps/scripts/build_vault_signal_canonical_native_v2.sh
          {
            echo 'WRAPPER_LANE_BUILD_AUTHORITY=SUPERSEDED_REJECTED'
            echo 'CURRENT_AUTHORITY=THF_VAULT_SIGNAL_CANONICAL_NATIVE_SOURCE_V2'
            echo 'STALE_WRAPPER_REBUILD=FALSE'
            echo 'FINAL_OR_PLAY_READY=FALSE'
          } >> "$GITHUB_STEP_SUMMARY"
