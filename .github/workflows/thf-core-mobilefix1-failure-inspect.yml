name: THF Core MobileFix1 Failure Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-core-mobilefix1-failure-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - name: Read v2 failed verification evidence
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='set -u
          ROOT="$HOME/thf-core-mobilefix1-live-v2"; OUT="$ROOT/out"; APK="$OUT/THF-CORE-RC6-MOBILEFIX1-LIVE-QA.apk"
          echo "=== public url ==="; cat "$OUT/PUBLIC_URL.txt" 2>/dev/null || true
          echo "=== pids/ports ==="; cat "$ROOT/backend.pid" 2>/dev/null || true; cat "$ROOT/cloudflared.pid" 2>/dev/null || true; ss -ltnp 2>/dev/null | grep ":18181" || true
          echo "=== local health ==="; cat "$OUT/local-health.json" 2>/dev/null || true
          echo "=== public health ==="; cat "$OUT/public-health.json" 2>/dev/null || true
          echo "=== backend tail ==="; tail -80 "$OUT/backend.log" 2>/dev/null || true
          echo "=== cloudflared tail ==="; tail -60 "$OUT/cloudflared.log" 2>/dev/null || true
          echo "=== gradle tail ==="; tail -120 "$OUT/gradle.log" 2>/dev/null || true
          echo "=== badging ==="; cat "$OUT/badging.txt" 2>/dev/null || true
          echo "=== signer ==="; cat "$OUT/apksigner.txt" 2>/dev/null || true
          echo "=== generated build config ==="; BC=$(find "$ROOT/app/android/app/build/generated" -type f -name BuildConfig.java 2>/dev/null | head -1 || true); echo "$BC"; [ -n "$BC" ] && cat "$BC" || true
          echo "=== dex url occurrences ==="; if [ -f "$APK" ]; then for d in $(zipinfo -1 "$APK" "classes*.dex" 2>/dev/null); do echo "DEX=$d"; unzip -p "$APK" "$d" | strings | grep -E "https://.*trycloudflare\.com|THF_BASE_URL|THF_PASS_URL" | head -20 || true; done; fi
          echo "=== outputs ==="; find "$OUT" -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          echo "=== apk sha ==="; [ -f "$APK" ] && sha256sum "$APK" || true
          '
