name: THF Core Phone UI1 Local APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/thf-core-phone-ui1-local-apk.yml
      - ReleaseOps/scripts/build_core_phone_ui1_local.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage isolated build script
        run: |
          chmod +x ReleaseOps/scripts/build_core_phone_ui1_local.sh
          gcloud compute scp ReleaseOps/scripts/build_core_phone_ui1_local.sh "$GCP_BUILDER:/tmp/build_core_phone_ui1_local.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Build on prepared Android builder
        run: |
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='chmod +x /tmp/build_core_phone_ui1_local.sh && /tmp/build_core_phone_ui1_local.sh'
      - name: Retrieve verified APK
        run: |
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-core-phone-ui1-local/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          grep -q '^THF_CORE_PHONE_UI1=PASS$' out/EVIDENCE.txt
          test -s out/THF-CORE-RC6-PHONE-UI1-LOCAL-QA.apk
          cat out/EVIDENCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-CORE-RC6-PHONE-UI1-LOCAL-QA
          path: out/
          retention-days: 14
          compression-level: 0
