name: WAVE Admin Production Bootstrap

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-admin-production-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WAVE_URL: https://wave-mawja.p-my.workers.dev
  WAVE_WORKER: wave-mawja
  WAVE_ADMIN_EMAIL: TopHeroFit@gmail.com

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install admin secrets and run authenticated live E2E
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          access_key="$(openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_')"
          session_secret="$(openssl rand -hex 48)"
          test "${#access_key}" -ge 48
          test "${#session_secret}" -ge 64
          echo "::add-mask::$access_key"
          echo "::add-mask::$session_secret"

          printf '%s' "$WAVE_ADMIN_EMAIL" | npx --yes wrangler@4 secret put WAVE_ADMIN_EMAILS --name "$WAVE_WORKER"
          printf '%s' "$access_key" | npx --yes wrangler@4 secret put WAVE_ADMIN_ACCESS_KEY --name "$WAVE_WORKER"
          printf '%s' "$session_secret" | npx --yes wrangler@4 secret put WAVE_SESSION_SECRET --name "$WAVE_WORKER"

          mkdir -p admin-bootstrap
          jar=admin-bootstrap/cookies.txt
          login_json="$(python3 - "$WAVE_ADMIN_EMAIL" "$access_key" <<'PY'
          import json,sys
          print(json.dumps({"email":sys.argv[1],"accessKey":sys.argv[2],"displayName":"WAVE Administrator"}))
          PY
          )"

          login_code=""
          for attempt in 1 2 3 4 5 6; do
            login_code="$(curl -sS -o admin-bootstrap/login.json -D admin-bootstrap/login.headers -w '%{http_code}'               -c "$jar" -b "$jar" -X POST -H 'content-type: application/json'               --data-binary "$login_json" "$WAVE_URL/api/auth/admin-login" || true)"
            echo "ADMIN_LOGIN_ATTEMPT=$attempt HTTP=$login_code"
            if [ "$login_code" = 200 ]; then break; fi
            sleep "$((attempt * 2))"
          done
          test "$login_code" = 200
          python3 - <<'PY'
          import json
          d=json.load(open("admin-bootstrap/login.json"))
          assert d.get("ok") is True, d
          PY

          api_code="$(curl -sS -o admin-bootstrap/control.json -w '%{http_code}' -c "$jar" -b "$jar" "$WAVE_URL/api/control")"
          echo "ADMIN_CONTROL_GET_HTTP=$api_code"
          test "$api_code" = 200
          python3 - "$WAVE_ADMIN_EMAIL" <<'PY'
          import json,sys
          d=json.load(open("admin-bootstrap/control.json"))
          account=d.get("account") or {}
          caps=d.get("capabilities") or {}
          assert account.get("email","").lower()==sys.argv[1].lower(), account
          assert account.get("role")=="admin", account
          assert caps.get("canAdmin") is True, caps
          assert caps.get("canEdit") is True, caps
          assert caps.get("adminAllowlistConfigured") is True, caps
          print("ADMIN_ROLE=admin")
          print("ADMIN_CAN_EDIT=true")
          print("ADMIN_CAN_ADMIN=true")
          PY

          page_code="$(curl -L -sS -o admin-bootstrap/control.html -w '%{http_code}' -c "$jar" -b "$jar" "$WAVE_URL/control")"
          echo "ADMIN_CONTROL_PAGE_HTTP=$page_code"
          test "$page_code" = 200
          grep -Eq 'مركز الإدارة|WAVE CONTROL' admin-bootstrap/control.html

          probe_code="$(curl -sS -o admin-bootstrap/post-probe.json -w '%{http_code}' -c "$jar" -b "$jar"             -X POST -H 'content-type: application/json' --data-binary '{"action":"__readiness_probe__"}'             "$WAVE_URL/api/control")"
          echo "ADMIN_CONTROL_POST_PROBE_HTTP=$probe_code"
          test "$probe_code" = 400
          python3 - <<'PY'
          import json
          d=json.load(open("admin-bootstrap/post-probe.json"))
          assert d.get("error")=="invalid_action", d
          PY

          printf '%s' "$access_key" > /tmp/wave-admin-access-key.txt
          printf '%s' '' | base64 -d > /tmp/wave-admin-public.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/wave-admin-public.pem             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256             -in /tmp/wave-admin-access-key.txt -out WAVE_ADMIN_ACCESS_KEY.enc
          rm -f /tmp/wave-admin-access-key.txt /tmp/wave-admin-public.pem

          {
            echo "WAVE_ADMIN_PRODUCTION_BOOTSTRAP=PASS"
            echo "admin_email=$WAVE_ADMIN_EMAIL"
            echo "admin_login=PASS"
            echo "control_get=PASS"
            echo "control_page=PASS"
            echo "control_post_guard=PASS"
            echo "admin_role=admin"
          } | tee WAVE_ADMIN_BOOTSTRAP_RESULT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WAVE-ADMIN-BOOTSTRAP-CREDENTIAL
          retention-days: 1
          path: |
            WAVE_ADMIN_ACCESS_KEY.enc
            WAVE_ADMIN_BOOTSTRAP_RESULT.txt
            admin-bootstrap/login.json
            admin-bootstrap/control.json
            admin-bootstrap/post-probe.json
