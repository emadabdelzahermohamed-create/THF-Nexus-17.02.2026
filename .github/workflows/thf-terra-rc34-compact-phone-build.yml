name: THF Terra RC34 Compact Phone Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-terra-rc34-compact-phone-build.yml
      - ReleaseOps/scripts/build_terra_rc34_compact_phone.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thf-terra-rc34-compact-phone-build
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage isolated Terra builder
        run: |
          set -Eeuo pipefail
          chmod +x ReleaseOps/scripts/build_terra_rc34_compact_phone.sh
          gcloud compute scp ReleaseOps/scripts/build_terra_rc34_compact_phone.sh "$GCP_BUILDER:/tmp/build_terra_rc34_compact_phone.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Build compact native RC34
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='chmod +x /tmp/build_terra_rc34_compact_phone.sh && /tmp/build_terra_rc34_compact_phone.sh'
      - name: Retrieve verified candidate
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-terra-rc34-compact-phone-v2/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          grep -q '^THF_TERRA_RC34_PHONE_V2=BUILT$' out/EVIDENCE.txt
          grep -q '^package_from_apk=PASS$' out/EVIDENCE.txt
          grep -q '^target_sdk=36$' out/EVIDENCE.txt
          grep -q '^target_sdk_from_apk=PASS$' out/EVIDENCE.txt
          grep -q '^android_api_36_installed=PASS$' out/EVIDENCE.txt
          grep -q '^under_100MiB=PASS$' out/EVIDENCE.txt
          grep -q '^physical_device_status=PENDING$' out/EVIDENCE.txt
          grep -q '^final_or_play_ready=FALSE$' out/EVIDENCE.txt
          test -s out/apk_badging.txt
          test -s out/THF-TERRA-4.6.8-RC34-PHONE-V2.apk
          cat out/EVIDENCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TERRA-4.6.8-RC34-PHONE-V2
          path: out/
          retention-days: 14
          compression-level: 0
