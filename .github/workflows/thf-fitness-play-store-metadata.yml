name: THF Fitness Play Store Metadata

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Probe or apply Top Hero Fit store metadata'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe or apply store metadata
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json, os
          import google.auth
          from googleapiclient.discovery import build

          package='com.topherofit.thf.pulse'
          mode=os.environ.get('MODE','probe')
          website='https://thf-fitness-pulse-ul26f1.v2.appdeploy.ai/'
          email='topherofit@gmail.com'
          listings={
            'ar': {
              'title':'Top Hero Fit',
              'shortDescription':'تمارين وخطط وخطوات وHealth Connect في تطبيق لياقة عملي يعمل أوفلاين.',
              'fullDescription':'''Top Hero Fit تطبيق لياقة عملي يساعدك على التدريب بوضوح ومتابعة نشاطك من مكان واحد.\n\n• مكتبة تمارين منظمة مع صور توضيحية متاحة داخل التطبيق دون إنترنت.\n• برامج تدريب وخطط جلسات لمستويات وأهداف رياضية مختلفة.\n• تسجيل الجلسات ومتابعة الاستمرارية والحجم التدريبي.\n• قراءة الخطوات والمسافة والسعرات النشطة وجلسات التمرين من Health Connect بعد منح الأذونات المناسبة.\n• حفظ جلسات Top Hero Fit المكتملة في Health Connect عند منح إذن الكتابة.\n• تتبع الخطوات من حساس الهاتف عند توفره ومنح إذن التعرّف على النشاط.\n• واجهة عربية وإنجليزية ووضع أوفلاين للوظائف الأساسية.\n\nالبيانات الصحية تظل تحت تحكمك: يمكنك رفض الأذونات أو سحبها من إعدادات Health Connect في أي وقت. لا يطلب التطبيق بيانات النبض أو النوم أو الوزن ضمن التكامل الحالي.\n\nTop Hero Fit لا يستبدل الاستشارة الطبية. استخدم التمارين بما يناسب حالتك ومستواك.'''
            },
            'en-US': {
              'title':'Top Hero Fit',
              'shortDescription':'Workouts, steps, training plans and Health Connect in one offline-ready app.',
              'fullDescription':'''Top Hero Fit is a practical fitness app for clear training and measurable progress.\n\n• Structured exercise library with visual guidance available offline.\n• Training programs and session plans for different goals and experience levels.\n• Workout history, consistency and training-volume tracking.\n• Reads steps, distance, active calories and exercise sessions from Health Connect after you grant the relevant permissions.\n• Writes completed Top Hero Fit exercise sessions to Health Connect when write permission is granted.\n• Uses the phone step sensor when available and Activity Recognition permission is granted.\n• Arabic and English interface with core offline functionality.\n\nYour health data stays under your control. You can deny or revoke Health Connect permissions at any time. The current integration does not request heart rate, sleep or weight data.\n\nTop Hero Fit does not replace professional medical advice. Train within your abilities and circumstances.'''
            }
          }
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit_id=api.edits().insert(packageName=package,body={}).execute()['id']
          out={'package':package,'mode':mode,'editId':edit_id,'committed':False}
          try:
            if mode == 'apply':
              api.edits().details().update(
                packageName=package, editId=edit_id,
                body={'defaultLanguage':'ar','contactEmail':email,'contactWebsite':website}
              ).execute()
              for language, body in listings.items():
                api.edits().listings().update(
                  packageName=package, editId=edit_id, language=language, body=body
                ).execute()
              api.edits().commit(packageName=package,editId=edit_id).execute()
              edit_id=None
              out['committed']=True
            verify_id=api.edits().insert(packageName=package,body={}).execute()['id']
            try:
              out['details']=api.edits().details().get(packageName=package,editId=verify_id).execute()
              values=api.edits().listings().list(packageName=package,editId=verify_id).execute().get('listings',[]) or []
              out['listings']=[{
                'language':v.get('language'),'title':v.get('title'),
                'shortDescription':v.get('shortDescription'),
                'fullDescriptionLength':len(v.get('fullDescription') or '')
              } for v in values]
            finally:
              api.edits().delete(packageName=package,editId=verify_id).execute()
          finally:
            if edit_id:
              api.edits().delete(packageName=package,editId=edit_id).execute()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          with open('fitness-play-store-metadata.json','w') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          if mode=='apply':
            langs={x.get('language') for x in out.get('listings',[])}
            if not out.get('committed') or not {'ar','en-US'}.issubset(langs): raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-fitness-play-store-metadata
          path: fitness-play-store-metadata.json
          if-no-files-found: error
          retention-days: 14
