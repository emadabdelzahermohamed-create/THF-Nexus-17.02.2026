name: THF Fitness Competition Backend CI

on:
  push:
    branches:
      - agent/codex/competition-authority-20261106-r1
    paths:
      - 'fitness-v2/backend/**'
      - '.github/workflows/thf-fitness-competition-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test the Fitness V2 backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q fitness-v2/backend
          python -m unittest discover -s fitness-v2/backend/tests -v
