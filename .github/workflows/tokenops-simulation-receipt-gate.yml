name: TokenOps Simulation Receipt Gate
on:
  push:
    paths:
      - 'ReleaseOps/TokenOps/simulation_receipt_gate.py'
      - 'ReleaseOps/TokenOps/test_simulation_receipt_gate.py'
      - '.github/workflows/tokenops-simulation-receipt-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile ReleaseOps/TokenOps/simulation_receipt_gate.py ReleaseOps/TokenOps/test_simulation_receipt_gate.py
      - name: Regression tests
        working-directory: ReleaseOps/TokenOps
        run: python -m unittest -v test_simulation_receipt_gate.py
      - name: Financial non-execution assertions
        run: |
          grep -q '"sign":False' ReleaseOps/TokenOps/simulation_receipt_gate.py
          grep -q '"broadcast":False' ReleaseOps/TokenOps/simulation_receipt_gate.py
          grep -q '"financial_execution":False' ReleaseOps/TokenOps/simulation_receipt_gate.py
