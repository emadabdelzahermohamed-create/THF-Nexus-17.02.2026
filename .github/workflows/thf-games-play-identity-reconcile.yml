name: THF Games Play Identity Reconcile

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile legacy names and probe canonical game packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json,google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher']); api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          legacy={
            'com.topherofit.thf.terra':{
              'ar':{'title':'عالم THF','shortDescription':'سجل Play تاريخي لهوية THF World السابقة.','fullDescription':'THF World هو سجل Play تاريخي سابق لمسار اللعبة الاجتماعية. الإصدار الحالي RuinsCiv يستخدم هوية وحزمة مستقلة، لذلك لا يمثل هذا السجل إصدار RuinsCiv الحالي.'},
              'en-US':{'title':'THF World','shortDescription':'Historical Play record for the previous THF World identity.','fullDescription':'THF World is a historical Play record from the earlier social-world identity. The current RuinsCiv release uses a separate identity and package, so this record does not represent the current RuinsCiv release.'}},
            'com.topherofit.thf.rift':{
              'ar':{'title':'ساحة THF','shortDescription':'سجل Play تاريخي لهوية THF Arena السابقة.','fullDescription':'THF Arena هو سجل Play تاريخي سابق لمسار لعبة القتال. الإصدار الحالي EndCiv يستخدم هوية وحزمة مستقلة، لذلك لا يمثل هذا السجل إصدار EndCiv الحالي.'},
              'en-US':{'title':'THF Arena','shortDescription':'Historical Play record for the previous THF Arena identity.','fullDescription':'THF Arena is a historical Play record from the earlier combat-game identity. The current EndCiv release uses a separate identity and package, so this record does not represent the current EndCiv release.'}}
          }
          out={'legacy':[],'canonical':[]}
          for package,langs in legacy.items():
            item={'package':package,'committed':False}; edit=None
            try:
              edit=api.edits().insert(packageName=package,body={}).execute()['id']
              for lang,body in langs.items(): api.edits().listings().update(packageName=package,editId=edit,language=lang,body={'language':lang,**body}).execute()
              v=api.edits().validate(packageName=package,editId=edit).execute(); item['validationId']=v.get('id'); c=api.edits().commit(packageName=package,editId=edit).execute(); item['committed']=True; item['committedEditId']=c.get('id'); edit=None
            finally:
              if edit:
                try: api.edits().delete(packageName=package,editId=edit).execute()
                except Exception: pass
            out['legacy'].append(item)
          for name,package in [('RuinsCiv','com.topherofit.ruins.civ'),('EndCiv','com.endciv.game')]:
            item={'name':name,'package':package,'accessible':False}; edit=None
            try:
              edit=api.edits().insert(packageName=package,body={}).execute()['id']; item['accessible']=True
              item['details']=api.edits().details().get(packageName=package,editId=edit).execute()
              listings=api.edits().listings().list(packageName=package,editId=edit).execute().get('listings',[]) or []; item['listings']=[{'language':x.get('language'),'title':x.get('title')} for x in listings]
              tracks=api.edits().tracks().list(packageName=package,editId=edit).execute().get('tracks',[]) or []; item['tracks']=[{'track':t.get('track'),'releases':t.get('releases',[])} for t in tracks if t.get('releases')]
            except HttpError as exc:
              item['httpStatus']=exc.resp.status; item['error']=str(exc)[:1200]
            finally:
              if edit:
                try: api.edits().delete(packageName=package,editId=edit).execute(); item['cleanup']='PASS'
                except Exception as exc: item['cleanup']='FAIL'; item['cleanupError']=str(exc)[:800]
            out['canonical'].append(item)
          print(json.dumps(out,indent=2,ensure_ascii=False)); open('games-play-identity.json','w').write(json.dumps(out,indent=2,ensure_ascii=False))
          if not all(x.get('committed') for x in out['legacy']): raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-games-play-identity
          path: games-play-identity.json
          if-no-files-found: error
          retention-days: 30
