name: AI Swarm - Gemini Worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Bounded task for Gemini. GitHub remains source of truth.'
        required: true
        type: string
  issue_comment:
    types: [created]

concurrency:
  group: ai-swarm-gemini-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gemini:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source of truth
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check free Gemini lane is configured
        id: keycheck
        shell: bash
        run: |
          if [[ -n "${GEMINI_API_KEY}" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'GEMINI_API_KEY is not configured; worker remains dormant without failing the project.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report dormant lane on issue
        if: steps.keycheck.outputs.ready != 'true' && github.event_name == 'issue_comment'
        shell: bash
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body 'Gemini lane is prepared but dormant: repository secret `GEMINI_API_KEY` is not configured. The swarm should route this task to the next READY provider instead of waiting.'

      - name: Run Gemini CLI specialist worker
        if: steps.keycheck.outputs.ready == 'true'
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          workflow_name: ai-swarm-gemini
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {"maxSessionTurns": 20},
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run","-i","--rm","-e","GITHUB_PERSONAL_ACCESS_TOKEN","ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"}
                }
              }
            }
          prompt: |-
            Read GEMINI.md and all referenced AI_SWARM policy/state files before acting.
            Treat this as one bounded specialist task. Never push to main or a canonical release branch, never merge, never expose secrets, and never duplicate active work for the same task/base SHA.
            Use a dedicated agent/gemini branch, run appropriate tests/build/runtime checks, and open or update a PR with evidence when code changes are justified.
            If the task is review/analysis only, report evidence and recommendations without unnecessary code changes.
            Incoming request:
            ${{ env.REQUEST }}

      - name: Persist Gemini summary
        if: steps.keycheck.outputs.ready == 'true'
        shell: bash
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          {
            echo '## Gemini worker result'
            echo
            printf '%s\n' "${GEMINI_SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment result on issue
        if: steps.keycheck.outputs.ready == 'true' && github.event_name == 'issue_comment'
        shell: bash
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          if [[ -n "${GEMINI_SUMMARY}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${GEMINI_SUMMARY}"
          fi
