name: THF Fitness Play Assets Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Play store image inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          package='com.topherofit.thf.pulse'
          languages=['ar','en-US']
          image_types=['icon','featureGraphic','phoneScreenshots','sevenInchScreenshots','tenInchScreenshots','tvScreenshots','wearScreenshots','tvBanner']
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']
          out={'package':package,'languages':{}}
          try:
            for language in languages:
              inv={}
              for typ in image_types:
                try:
                  images=api.edits().images().list(packageName=package,editId=edit,language=language,imageType=typ).execute().get('images',[]) or []
                  inv[typ]={'count':len(images),'urls':[i.get('url') for i in images]}
                except Exception as e:
                  inv[typ]={'error':str(e)}
              out['languages'][language]=inv
          finally:
            api.edits().delete(packageName=package,editId=edit).execute()
          print(json.dumps(out,indent=2,ensure_ascii=False))
          with open('fitness-play-assets.json','w') as f: json.dump(out,f,indent=2,ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-play-assets
          path: fitness-play-assets.json
          if-no-files-found: error
          retention-days: 14
