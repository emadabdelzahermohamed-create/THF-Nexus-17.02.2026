name: THF Terra RC34 Export Fix Gate
on:
  push:
    branches: ['t/r34']
    paths: ['.github/workflows/thf-terra-rc34-export-fix-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  FULL_NAME: THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip
  FULL_SHA: eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68
jobs:
  export-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Re-run verified RC34 export with isolated Godot settings
        shell: bash
        run: |
          set -uo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command="FULL_NAME='$FULL_NAME' FULL_SHA='$FULL_SHA' bash -s" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/terra-export-fix.log"
          set -Eeuo pipefail
          BASE_HOME="$HOME"
          ROOT="$BASE_HOME/thf-terra-rc34-gate"
          INPUT="$ROOT/input"; WORK="$ROOT/work"; OUT="$ROOT/out-fix"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT/android"
          echo "$FULL_SHA  $INPUT/$FULL_NAME" | sha256sum -c -
          unzip -q "$INPUT/$FULL_NAME" -d "$WORK"
          test -f "$WORK/project.godot"; test -f "$WORK/export_presets.cfg"
          grep -q 'name="Android AAB Candidate"' "$WORK/export_presets.cfg"
          GODOT="$BASE_HOME/thf-tools/godot/4.7.2-stable/godot"; test -x "$GODOT"
          SDK="$BASE_HOME/thf-builder-rc16-build/android-sdk"
          test -x "$SDK/build-tools/36.0.0/aapt2"; test -f "$SDK/platforms/android-36/android.jar"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ISO_HOME="$ROOT/godot-home"; rm -rf "$ISO_HOME"; mkdir -p "$ISO_HOME/.config/godot"
          cat > "$ISO_HOME/.config/godot/editor_settings-4.7.tres" <<EOF
[gd_resource format=3]

[resource]
export/android/android_sdk_path = "$SDK"
export/android/java_sdk_path = "$JAVA_HOME_REAL"
EOF
          export HOME="$ISO_HOME" ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK" JAVA_HOME="$JAVA_HOME_REAL"
          export PATH="$JAVA_HOME/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"
          set +e
          timeout 15m "$GODOT" --headless --editor --path "$WORK" --quit --verbose >"$OUT/editor-import.log" 2>&1; import_rc=$?
          timeout 5m "$GODOT" --headless --path "$WORK" --quit-after 30 --verbose >"$OUT/headless-boot.log" 2>&1; boot_rc=$?
          export_rc=99
          if [ "$import_rc" -eq 0 ] && [ "$boot_rc" -eq 0 ]; then
            timeout 20m "$GODOT" --headless --path "$WORK" --export-debug "Android AAB Candidate" "$OUT/android/THF-Terra-RC34-test.aab" >"$OUT/android-export.log" 2>&1; export_rc=$?
          fi
          set -e
          aab=''; [ -f "$OUT/android/THF-Terra-RC34-test.aab" ] && aab="$(sha256sum "$OUT/android/THF-Terra-RC34-test.aab" | awk '{print $1}')"
          status=FAIL; [ "$import_rc" -eq 0 ] && [ "$boot_rc" -eq 0 ] && [ "$export_rc" -eq 0 ] && [ -n "$aab" ] && status=PASS
          printf 'status=%s\ncanonical_sha256=%s\nimport_rc=%s\nboot_rc=%s\nandroid_export_rc=%s\naab_sha256=%s\nandroid_sdk=%s\npreset=Android AAB Candidate\nproduction_signing=false\ncanonical_archive_mutated=false\nwave_untouched=true\n' "$status" "$FULL_SHA" "$import_rc" "$boot_rc" "$export_rc" "$aab" "$SDK" | tee "$OUT/TRUTH.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -czf "$ROOT/export-fix-evidence.tgz" -C "$ROOT" out-fix
          [ "$status" = PASS ]
          REMOTE
          rc=${PIPESTATUS[0]}
          echo "TERRA_EXPORT_RC=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Retrieve evidence
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p terra-export-fix-evidence
          gcloud compute scp "$GCP_BUILDER:~/thf-terra-rc34-gate/export-fix-evidence.tgz" terra-export-fix-evidence/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          cp "$RUNNER_TEMP/terra-export-fix.log" terra-export-fix-evidence/ || true
          printf 'canonical_sha256=%s\nremote_rc=%s\nproduction_signing=false\nwave_untouched=true\n' "$FULL_SHA" "${TERRA_EXPORT_RC:-missing}" > terra-export-fix-evidence/RUNNER_SUMMARY.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Terra-RC34-export-fix-evidence
          path: terra-export-fix-evidence/
          retention-days: 14
      - name: Final gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "${TERRA_EXPORT_RC:-missing}" = 0 ]
          echo TERRA_RC34_EXPORT_FIX_GATE=PASS
          echo PRODUCTION_SIGNING=NOT_PERFORMED
          echo WAVE_UNTOUCHED=TRUE
