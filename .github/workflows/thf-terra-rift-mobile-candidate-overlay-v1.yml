name: THF Terra Mobile Candidate Overlay V2

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/scripts/thf_terra_rift_mobile_overlay_v1.py'
      - 'ReleaseOps/scripts/thf_game_real_function_audit_v2.py'
      - 'ReleaseOps/scripts/validate_latest_game_authority_v1.py'
      - 'ReleaseOps/games/LATEST_GAME_AUTHORITY_V1.json'
      - 'ReleaseOps/tests/test_thf_terra_rift_mobile_overlay_v1.py'
      - '.github/workflows/thf-terra-rift-mobile-candidate-overlay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  TERRA_SHA: eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68

concurrency:
  group: thf-terra-mobile-candidate-overlay-v2
  cancel-in-progress: false

jobs:
  overlay-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Latest authority guard
        run: |
          set -Eeuo pipefail
          python3 ReleaseOps/scripts/validate_latest_game_authority_v1.py > latest-authority.txt
          grep -q '^terra_source_sha256=eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68$' latest-authority.txt
          grep -q '^rift_version=4.7.5-rc41$' latest-authority.txt
          grep -q '^rift_candidate_apk_sha256=NONE$' latest-authority.txt
          grep -q '^FINAL_OR_PLAY_READY=FALSE$' latest-authority.txt
      - name: Regression tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ReleaseOps/scripts/thf_terra_rift_mobile_overlay_v1.py ReleaseOps/scripts/thf_game_real_function_audit_v2.py ReleaseOps/scripts/validate_latest_game_authority_v1.py
          python3 -m unittest ReleaseOps/tests/test_thf_terra_rift_mobile_overlay_v1.py
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage Terra validation tools
        run: |
          set -Eeuo pipefail
          gcloud compute scp ReleaseOps/scripts/thf_terra_rift_mobile_overlay_v1.py ReleaseOps/scripts/thf_game_real_function_audit_v2.py \
            "$GCP_BUILDER:/tmp/" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Validate exact Terra mobile source on Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=35m --quiet --command='bash -s' > out/summary.txt <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-terra-mobile-overlay-v2"
          GODOT="$HOME/thf-tools/godot/4.7.2-stable/godot"
          SRC="$HOME/thf-terra-rc34-gate/input/THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip"
          EXPECTED="eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68"
          rm -rf "$ROOT"; mkdir -p "$ROOT/work" "$ROOT/out"
          test -x "$GODOT"
          "$GODOT" --version | tee "$ROOT/out/godot-version.txt"
          test -f "$SRC"
          actual=$(sha256sum "$SRC" | awk '{print $1}')
          test "$actual" = "$EXPECTED"
          echo "terra_source_sha256=$actual"
          python3 - "$SRC" "$ROOT/work" <<'PY'
          import pathlib, shutil, sys, zipfile
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  rel = pathlib.PurePosixPath(info.filename)
                  if rel.is_absolute() or '..' in rel.parts: raise SystemExit('unsafe zip member')
                  target = (dst / pathlib.Path(*rel.parts)).resolve()
                  if target != dst and dst not in target.parents: raise SystemExit('zip escape')
                  if info.is_dir(): target.mkdir(parents=True, exist_ok=True); continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as r, open(target, 'wb') as w: shutil.copyfileobj(r, w)
          PY
          python3 /tmp/thf_terra_rift_mobile_overlay_v1.py "$ROOT/work" --kind terra --json-out "$ROOT/out/overlay.json" > "$ROOT/out/overlay.txt"
          set +e
          python3 /tmp/thf_game_real_function_audit_v2.py "$ROOT/work" --kind terra --json-out "$ROOT/out/audit.json" > "$ROOT/out/audit.txt"
          audit_rc=$?
          set -e
          python3 - "$ROOT/out/audit.json" "$ROOT/out/overlay.json" <<'PY'
          import json,sys
          audit=json.load(open(sys.argv[1])); overlay=json.load(open(sys.argv[2]))
          checks={x['name']:x['status'] for x in audit['checks']}
          for name in ('sensor_landscape','expandable_aspect','no_desktop_window_override'):
              if checks.get(name) != 'PASS': raise SystemExit(f'mobile gate failed: {name}={checks.get(name)}')
          failures=audit['summary']['required_failures']
          forbidden={'sensor_landscape','expandable_aspect','no_desktop_window_override'} & set(failures)
          if forbidden: raise SystemExit('mobile remediation did not clear: '+','.join(sorted(forbidden)))
          print('source_contract_status='+audit['source_contract_status'])
          print('remaining_required_failures='+','.join(failures))
          print('network_authority_gate='+overlay['network']['network_authority_gate'])
          print('placeholder_marker_count='+str(overlay['network']['placeholder_marker_count']))
          print('endpoint_values_redacted='+str(overlay['network']['endpoint_values_redacted']).lower())
          PY
          PG=$(find "$ROOT/work" -type f -name project.godot -print -quit); test -n "$PG"; PROJECT=$(dirname "$PG")
          timeout 15m "$GODOT" --headless --editor --path "$PROJECT" --quit --verbose > "$ROOT/out/import.log" 2>&1
          timeout 5m "$GODOT" --headless --path "$PROJECT" --quit-after 30 --verbose > "$ROOT/out/boot.log" 2>&1
          echo 'godot_import=PASS'
          echo 'godot_headless_boot=PASS'
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECTED"
          echo 'canonical_archive_unchanged=true'
          echo 'rift_superseded_source_used=false'
          echo 'wave_files_read_or_changed=false'
          echo 'production_signing=false'
          echo 'device_status=PENDING'
          echo 'final_status=NOT_FINAL'
          REMOTE
      - name: Retrieve evidence
        run: |
          set -Eeuo pipefail
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-terra-mobile-overlay-v2/out/*" out/ \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          cat out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TERRA-MOBILE-CANDIDATE-OVERLAY-V2
          path: out/
          retention-days: 14
      - name: Safety and truth assertions
        run: |
          set -Eeuo pipefail
          grep -q '^canonical_archive_unchanged=true$' out/summary.txt
          grep -q '^rift_superseded_source_used=false$' out/summary.txt
          grep -q '^wave_files_read_or_changed=false$' out/summary.txt
          grep -q '^production_signing=false$' out/summary.txt
          grep -q '^device_status=PENDING$' out/summary.txt
          grep -q '^final_status=NOT_FINAL$' out/summary.txt
