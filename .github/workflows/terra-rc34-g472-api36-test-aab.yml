name: Terra RC34 G472 API36 Test AAB

on:
  push:
    branches: ['terra/rc32-g472-20260912']
    paths: ['.github/workflows/terra-rc34-g472-api36-test-aab.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  P0: 1unN6-iLtu_nypKIqo-m_m8ZaLbSsGlk3
  P1: 17ZvxPPh0JPInELSnm2ziaPIXuEnrZxo8
  P0SHA: 4bfe9989563b8da1822e74b79531a2dd218131981277c05e01a712eabf0866c5
  P1SHA: 4a00574c817f41a9492da20e19a023ebd39c7ba41f4573efea841c8a57b39cdc
  RC32SHA: 389ca92b1b2675340f2bf7128f2cf6470bce0af5ea89602d33da2ae6c99b3695
  RC34SHA: 77e425ccd77ffba49edc726617a5e2ebfff86b963632abca5dc1f5054fa0e59e
  GODOT_DIR: 4.7.2.stable

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: terra/rc32-g472-20260912
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Stage RC32 and construct exact RC34 changed files
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/terra34; mkdir -p "$r/project" "$r/out" "$r/evidence"
          curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://www.googleapis.com/drive/v3/files/${P0}?alt=media" -o "$r/p0"
          curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://www.googleapis.com/drive/v3/files/${P1}?alt=media" -o "$r/p1"
          echo "${P0SHA}  $r/p0" | sha256sum -c -; echo "${P1SHA}  $r/p1" | sha256sum -c -
          cat "$r/p0" "$r/p1" > "$r/rc32.zip"; echo "${RC32SHA}  $r/rc32.zip" | sha256sum -c -
          unzip -q "$r/rc32.zip" -d "$r/project"; cd "$r/project"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.godot'); s=p.read_text(); s=s.replace('; THF Terra — RC29 Native Godot Export Readiness','; THF Terra — RC34 Android Export Blocker Fix',1); s=s.replace('config/features=PackedStringArray("4.7")','config/features=PackedStringArray("4.7")\nconfig/icon="res://web/static/icons/icon-512.png"',1); s=s.replace('textures/default_filters/use_nearest_mipmap_filter=false','textures/default_filters/use_nearest_mipmap_filter=false\ntextures/vram_compression/import_etc2_astc=true',1); s=s.replace('stage="RC29"','stage="RC34"',1); p.write_text(s)
          p=Path('export_presets.cfg'); s=p.read_text().replace('export_path="build/android/THF-Terra-rc29-test.aab"','export_path="build/android/THF-Terra-rc34-test.aab"',1).replace('version/code=42063','version/code=42068',1).replace('version/name="4.6.3-rc29"','version/name="4.6.8-rc34"',1); p.write_text(s)
          p=Path('android/app/build.gradle'); s=p.read_text().replace('versionCode 42066','versionCode 42068',1).replace("versionName '4.6.6-rc32'","versionName '4.6.8-rc34'",1); p.write_text(s)
          p=Path('tests/test_terra_rc34_android_export_blocker_fix.py'); p.write_text('''from pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nPROJECT=(ROOT/"project.godot").read_text(encoding="utf-8")\nPRESET=(ROOT/"export_presets.cfg").read_text(encoding="utf-8")\nGRADLE=(ROOT/"android/app/build.gradle").read_text(encoding="utf-8")\nICON=ROOT/"web/static/icons/icon-512.png"\n\ndef test_native_project_has_exportable_app_icon():\n    assert 'config/icon="res://web/static/icons/icon-512.png"' in PROJECT\n    assert ICON.is_file() and ICON.stat().st_size > 0\n\ndef test_rc34_stage_and_android_api36_metadata():\n    assert 'stage="RC34"' in PROJECT\n    assert 'gradle_build/target_sdk="36"' in PRESET\n    assert 'version/code=42068' in PRESET\n    assert 'version/name="4.6.8-rc34"' in PRESET\n    assert 'package/unique_name="com.topherofit.thf.terra"' in PRESET\n    assert 'export_path="build/android/THF-Terra-rc34-test.aab"' in PRESET\n\ndef test_fallback_gradle_metadata_matches_rc34_api36():\n    assert 'compileSdk 36' in GRADLE\n    assert 'targetSdk 36' in GRADLE\n    assert 'versionCode 42068' in GRADLE\n    assert "versionName '4.6.8-rc34'" in GRADLE\n\ndef test_android_texture_export_readiness_retained():\n    assert 'textures/vram_compression/import_etc2_astc=true' in PROJECT\n''')
          PY
          echo '68a898a5f8105ad487043d559629d6029f17f1f614f3c648d1ece185138ded4c  project.godot' | sha256sum -c -
          echo '710722dd013c1bf1f893cb7c2fc23d7d10ffb11e1ed4db944f1f192519a3d29b  export_presets.cfg' | sha256sum -c -
          echo 'ecfd81ddde29fb5715a1faf410f5401826155b542668788602a856d76cc1d509  android/app/build.gradle' | sha256sum -c -
          echo '2319135b92f9df918348ac7e10e2085a265726d19387717e2e53e0452aa95a20  tests/test_terra_rc34_android_export_blocker_fix.py' | sha256sum -c -
          echo '71fc59e338a08cabe6e060cc7738042bb9e9dad21ce19f9e9af4f004fc14cc53  web/static/icons/icon-512.png' | sha256sum -c -
          python3 -m pytest -q tests/test_terra_rc34_android_export_blocker_fix.py | tee "$r/evidence/focused.txt"
      - name: Install exact Godot 4.7.2 and templates
        shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/terra34; j="$(curl -fsSL https://api.github.com/repos/godotengine/godot-builds/releases/tags/4.7.2-stable)"; ed=Godot_v4.7.2-stable_linux.x86_64.zip; tp=Godot_v4.7.2-stable_export_templates.tpz
          eu="$(printf '%s' "$j"|jq -r --arg a "$ed" '.assets[]|select(.name==$a)|.browser_download_url')"; eh="$(printf '%s' "$j"|jq -r --arg a "$ed" '.assets[]|select(.name==$a)|.digest')"; tu="$(printf '%s' "$j"|jq -r --arg a "$tp" '.assets[]|select(.name==$a)|.browser_download_url')"; th="$(printf '%s' "$j"|jq -r --arg a "$tp" '.assets[]|select(.name==$a)|.digest')"
          curl -fsSL "$eu" -o "$r/g.zip"; curl -fsSL "$tu" -o "$r/t.tpz"; echo "${eh#sha256:}  $r/g.zip"|sha256sum -c -; echo "${th#sha256:}  $r/t.tpz"|sha256sum -c -
          mkdir -p "$r/g" "$r/t" "$HOME/.local/share/godot/export_templates/${GODOT_DIR}"; unzip -q "$r/g.zip" -d "$r/g"; unzip -q "$r/t.tpz" -d "$r/t"
          tr="$(find "$r/t" -type f -name android_source.zip -printf '%h\n'|head -1)"; test -n "$tr"; cp -a "$tr"/. "$HOME/.local/share/godot/export_templates/${GODOT_DIR}/"
          b="$(find "$r/g" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"; chmod +x "$b"; ln -sf "$b" "$r/godot"; "$r/godot" --version | tee "$r/evidence/godot-version.txt"
      - name: Fresh RC34 clean import and 30-frame headless
        shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/terra34; cd "$r/project"; rm -rf .godot
          "$r/godot" --headless --editor --path . --quit --verbose 2>&1 | tee "$r/evidence/import.log"
          ! grep -E -n 'SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot get class|Could not resolve class' "$r/evidence/import.log"
          "$r/godot" --headless --path . --quit-after 30 --verbose 2>&1 | tee "$r/evidence/headless.log"
          ! grep -E -n 'SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot get class|Could not resolve class' "$r/evidence/headless.log"
      - name: Install Android Gradle build template contract and API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/terra34; mkdir -p "$r/project/android/build"
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_DIR}/android_source.zip" -d "$r/project/android/build"
          printf '%s\n' "$GODOT_DIR" > "$r/project/android/.build_version"
          test "$(cat "$r/project/android/.build_version")" = "$GODOT_DIR"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          mkdir -p "$HOME/.android" "$HOME/.config/godot"; keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1 || true
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          printf 'gradle_build_version=%s\nsdk=%s\njava=%s\n' "$(cat "$r/project/android/.build_version")" "$sdk" "$JAVA_HOME" | tee "$r/evidence/android-toolchain.txt"
      - name: Export RC34 debug test-only AAB
        shell: bash
        run: |
          set +e
          r=/tmp/terra34; cd "$r/project"; preset="$(awk '/^\[preset\.[0-9]+\]/{name=""}/^name=/{gsub(/^name="|"$/, "");name=$0}/^platform=/{gsub(/^platform="|"$/, "");if($0=="Android"){print name;exit}}' export_presets.cfg)"; export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          "$r/godot" --headless --path . --export-debug "$preset" "$r/out/THF_Terra_RC34_TEST_ONLY.aab" > "$r/evidence/export.log" 2>&1; rc=$?; echo "$rc" > "$r/evidence/export.rc"; set -e
          if [ "$rc" != 0 ]; then tail -100 "$r/evidence/export.log"; exit "$rc"; fi
          test -s "$r/out/THF_Terra_RC34_TEST_ONLY.aab"; sha256sum "$r/out/THF_Terra_RC34_TEST_ONLY.aab" | tee "$r/evidence/aab.sha256"; unzip -t "$r/out/THF_Terra_RC34_TEST_ONLY.aab" > "$r/evidence/aab.ziptest" 2>&1
      - name: Emit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/terra34/evidence
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('/tmp/terra34');e=r/'evidence';a=r/'out/THF_Terra_RC34_TEST_ONLY.aab';rd=lambda n:(e/n).read_text(errors='replace').strip() if (e/n).exists() else None; bad=('SCRIPT ERROR:','Parse Error:','Failed to load script','Cannot get class','Could not resolve class'); imp=rd('import.log') or ''; head=rd('headless.log') or ''
          d={'stream':'THF_TERRA','release':'TERRA-RC34','version':'4.6.8-rc34','version_code':42068,'source_sha256':'77e425ccd77ffba49edc726617a5e2ebfff86b963632abca5dc1f5054fa0e59e','godot_version':rd('godot-version.txt'),'clean_import_no_script_signatures':bool(imp) and not any(x in imp for x in bad),'headless_30_no_script_signatures':bool(head) and not any(x in head for x in bad),'android_export_rc':rd('export.rc'),'aab_exists':a.exists(),'aab_size_bytes':a.stat().st_size if a.exists() else None,'aab_sha256':hashlib.sha256(a.read_bytes()).hexdigest() if a.exists() else None,'package_expected':'com.topherofit.thf.terra','target_sdk_expected':36,'signing_scope':'DEBUG_TEST_ONLY_NOT_PRODUCTION','gpu_device_visual_qa':'NOT_EXECUTED','perfect_photo_likeness':'NOT_CLAIMED','production_signed_aab':'NOT_CLAIMED','play_approval':'NOT_CLAIMED','production_deployment':'NOT_CLAIMED'};p=e/'result.json';p.write_text(json.dumps(d,indent=2)+'\n');(e/'result.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  result.json\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-rc34-g472-api36-test-aab-evidence
          path: /tmp/terra34/evidence
          if-no-files-found: error
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terra-rc34-test-only-aab
          path: /tmp/terra34/out/THF_Terra_RC34_TEST_ONLY.aab
          if-no-files-found: error
