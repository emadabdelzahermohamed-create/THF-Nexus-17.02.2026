name: THF Game Canonical Source Inventory V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-game-canonical-source-inventory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read-only THF game source discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='bash -s' > out/THF_GAME_SOURCE_INVENTORY.txt <<'REMOTE'
          set -Eeuo pipefail
          echo 'schema=thf-game-source-inventory-v1'
          echo 'mode=READ_ONLY'
          echo 'wave_workspace_scanned=false'
          echo '--- archives ---'
          find "$HOME" -maxdepth 6 -type f \( \
            -iname '*terra*.zip' -o -iname '*rift*.zip' -o -iname '*spark*.zip' -o -iname '*rush*.zip' -o \
            -iname '*learn*game*.zip' -o -iname '*fitness*game*.zip' -o -iname '*nexus*world*.zip' -o -iname '*nexus*arena*.zip' \
          \) ! -path '*/wave-mawja/*' ! -path '*/.cache/*' -print0 | sort -z | while IFS= read -r -d '' f; do
            printf 'archive=%q\n' "$f"
            sha256sum "$f"
          done
          echo '--- godot-projects ---'
          find "$HOME" -maxdepth 7 -type f -name project.godot \
            ! -path '*/wave-mawja/*' ! -path '*/.cache/*' ! -path '*/godot/export_templates/*' -print | sort
          echo '--- explicit-current-canonicals ---'
          test -f "$HOME/thf-terra-rc34-gate/input/THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip" && echo terra_rc34_present=true || echo terra_rc34_present=false
          test -f "$HOME/thf-rift-rc37-gate/input/THF_Rift_v4.7.1_RC37_HUMAN_RELOAD_TIMING_PARITY_CUMULATIVE_SOURCE.zip" && echo rift_rc37_present=true || echo rift_rc37_present=false
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-GAME-CANONICAL-SOURCE-INVENTORY
          path: out/THF_GAME_SOURCE_INVENTORY.txt
          retention-days: 14
