name: RuinsCiv Android Candidate V5
on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/RuinsCiv/prepare_ruinsciv_android_candidate_v5.sh'
      - '.github/workflows/ruinsciv-android-candidate-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with: {persist-credentials: false}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - name: Copy V5 migration helper
        run: gcloud compute scp ReleaseOps/RuinsCiv/prepare_ruinsciv_android_candidate_v5.sh "$GCP_BUILDER:/tmp/prepare_ruinsciv_android_candidate_v5.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Prepare isolated RuinsCiv candidate V5 on builder
        id: remote_prepare
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command='set -o pipefail; chmod +x /tmp/prepare_ruinsciv_android_candidate_v5.sh; bash -x /tmp/prepare_ruinsciv_android_candidate_v5.sh'
          rc=$?
          set -e
          echo "remote_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "RUINSCIV_V5_REMOTE_RC=$rc"
          # Deliberately succeed here so diagnostics collection is unconditional.
          exit 0
      - name: Collect V5 diagnostics from builder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ruinsciv-v5-diagnostics"
          scp_rc=0
          gcloud compute scp --recurse "$GCP_BUILDER:ruinsciv-candidate-evidence-v5" "$RUNNER_TEMP/ruinsciv-v5-diagnostics/" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || scp_rc=$?
          printf 'remote_rc=%s\nscp_rc=%s\n' '${{ steps.remote_prepare.outputs.remote_rc }}' "$scp_rc" > "$RUNNER_TEMP/ruinsciv-v5-diagnostics/run_status.txt"
          find "$RUNNER_TEMP/ruinsciv-v5-diagnostics" -maxdepth 3 -type f -print || true
          cat "$RUNNER_TEMP/ruinsciv-v5-diagnostics/ruinsciv-candidate-evidence-v5/v5_failure.txt" 2>/dev/null || true
          tail -n 200 "$RUNNER_TEMP/ruinsciv-v5-diagnostics/ruinsciv-candidate-evidence-v5/v5_trace.log" 2>/dev/null || true
      - name: Upload V5 diagnostics artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruinsciv-v5-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ruinsciv-v5-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce V5 remote result
        shell: bash
        run: |
          rc='${{ steps.remote_prepare.outputs.remote_rc }}'
          echo "RUINSCIV_V5_REMOTE_RC=$rc"
          test -n "$rc"
          test "$rc" = "0"
