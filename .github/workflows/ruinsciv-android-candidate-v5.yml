name: RuinsCiv Android Candidate V5
on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/RuinsCiv/prepare_ruinsciv_android_candidate_v5.sh'
      - '.github/workflows/ruinsciv-android-candidate-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with: {persist-credentials: false}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - name: Copy V5 migration helper
        run: gcloud compute scp ReleaseOps/RuinsCiv/prepare_ruinsciv_android_candidate_v5.sh "$GCP_BUILDER:/tmp/prepare_ruinsciv_android_candidate_v5.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Prepare isolated RuinsCiv candidate V5 on builder with diagnostics
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command='set -o pipefail; chmod +x /tmp/prepare_ruinsciv_android_candidate_v5.sh; bash -x /tmp/prepare_ruinsciv_android_candidate_v5.sh'
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "RUINSCIV_V5_REMOTE_RC=$rc"
            gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command='echo ===V5_FAILURE===; cat "$HOME/ruinsciv-candidate-evidence-v5/v5_failure.txt" 2>/dev/null || true; echo ===V5_TRACE_TAIL===; tail -n 160 "$HOME/ruinsciv-candidate-evidence-v5/v5_trace.log" 2>/dev/null || true; echo ===V5_EVIDENCE===; cat "$HOME/ruinsciv-candidate-evidence-v5/RUINSCIV_CANDIDATE_PREP_EVIDENCE.txt" 2>/dev/null || true'
            exit "$rc"
          fi
# ssh-mode-repair: reuse the same metadata SSH key behavior that succeeded for SCP
