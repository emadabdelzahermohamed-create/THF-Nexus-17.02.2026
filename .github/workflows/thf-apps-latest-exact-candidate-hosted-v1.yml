name: THF Apps Latest Exact Candidate Hosted V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-apps-latest-exact-candidate-hosted-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  latest-exact-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'

      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          java -version
          gradle --version
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BT/aapt" && test -x "$BT/apksigner" && test -x "$BT/zipalign"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "BUILD_TOOLS=$BT"

      - name: Download and SHA-verify latest authoritative sources
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source-staging work out && mkdir -p source-staging work out
          cat > source-staging/expected.tsv <<'EOF'
          pulse	RC3	71a16804e7c138535bb373263ae4374d8a5eef410ffe83b165472c684b6c8b10	com.topherofit.thf.pulse	1AbcoAGpkhtOTiwxVIPaDFgOL8ZSs02KF
          forge	RC3	0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51	com.topherofit.thf.forge	1hoq_PHHAKihrUYeJ6DXsBjAleAkc1LwQ
          echo	RC4	87c6a532fc56870b9a4c1039ac1f44b43e1a2f4c5c4518caf0d6537c61704226	com.topherofit.thf.echo	113ncXza3VjYjGHv9-5HSFXAXFJjGLP8T
          codex	RC4	c5108b257b5e9af6849c43df7b7aa671e586bb4a9c91964566c85b1a6329e83d	com.topherofit.thf.codex	1d5l5TcI0gphbs6O9F8_kpYkCayrmV9hZ
          spark	RC3	dc312dc65e681e914c3421a20362cd0fba0c1e692a7becdb66d7d17a0b6299a0	com.topherofit.thf.spark	1FFOkrjtEhKz_Ubj-MErw5UB7tQzZHZ7k
          rush	RC3	bd7e365ded07fd569020fff1c699d74322fd5c767b16ac6336f2bc99f8b5958b	com.topherofit.thf.rush	1AX9eoqi8I8SJRKmJSb6czFyjIif-JFxD
          vault	RC3	7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793	com.topherofit.thf.vault	1OuR6dm89A3aIu0UwcaUVs_VYQJxbReac
          signal	RC3	51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0	com.topherofit.thf.signal	1WtqjtPgPxyOPGk5T9FHQTF7lyAzPLBXA
          command	RC3	f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408	com.topherofit.thf.command	1eOdaj9IYsExCgzV0evwkW2hTpRie1Yke
          EOF
          printf 'app\tcheckpoint\tpackage\tsha256\tdrive_id\n' > out/source-verified.tsv
          while IFS=$'\t' read -r app checkpoint expected pkg drive_id; do
            f="source-staging/${app}.zip"
            code=$(curl --silent --show-error --location -H "Authorization: Bearer ${ACCESS_TOKEN}" -o "$f" -w '%{http_code}' "https://www.googleapis.com/drive/v3/files/${drive_id}?alt=media&supportsAllDrives=true")
            if [ "$code" != 200 ]; then echo "Drive download failed app=$app http=$code" >&2; exit 2; fi
            unzip -tq "$f" >/dev/null
            actual=$(sha256sum "$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "SHA mismatch app=$app expected=$expected actual=$actual" >&2; exit 3; }
            printf '%s\t%s\t%s\t%s\t%s\n' "$app" "$checkpoint" "$pkg" "$actual" "$drive_id" >> out/source-verified.tsv
          done < source-staging/expected.tsv
          [ "$(wc -l < out/source-verified.tsv)" -eq 10 ]
          echo LATEST_SOURCE_DOWNLOAD_SHA=PASS

      - name: Clean-extract, source-policy gate, compile/unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'app\tcheckpoint\tpackage\tcompileall\tpytest\tsource_policy\n' > out/source-tests.tsv
          while IFS=$'\t' read -r app checkpoint expected pkg drive_id; do
            d="work/$app"; mkdir -p "$d"; unzip -q "source-staging/$app.zip" -d "$d"
            root=$(find "$d" -mindepth 1 -maxdepth 2 -type f \( -name 'FINAL_IDENTITY.json' -o -name 'ANDROID_HOST_IDENTITY_STAGE16Q.json' \) -printf '%h\n' | head -1)
            [ -n "$root" ] || root=$(find "$d" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            test -n "$root"
            python3 -m compileall -q "$root"
            py=PASS
            if [ -d "$root/tests" ] && find "$root/tests" -type f -name 'test_*.py' | grep -q .; then
              set +e; (cd "$root" && python3 -m pytest -q) >"out/$app.pytest.log" 2>&1; prc=$?; set -e
              [ $prc -eq 0 ] || py=FAIL
            else
              py=NO_TESTS
            fi
            set +e
            python3 ReleaseOps/validators/validate_mobile_real_function_source.py "$root" --package "$pkg" --json-out "out/$app.source-policy.json" >"out/$app.source-policy.log" 2>&1
            src_rc=$?
            set -e
            source_policy=PASS; [ $src_rc -eq 0 ] || source_policy=FAIL
            printf '%s\t%s\t%s\tPASS\t%s\t%s\n' "$app" "$checkpoint" "$pkg" "$py" "$source_policy" >> out/source-tests.tsv
            [ "$py" != FAIL ] && [ "$source_policy" = PASS ] || exit 4
          done < source-staging/expected.tsv
          echo CLEAN_EXTRACT_SOURCE_POLICY=PASS

      - name: Build, QA-sign and exact-package inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"; ZIPALIGN="$BT/zipalign"
          KS="$RUNNER_TEMP/thf-apps-qa.keystore"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=THF QA,C=US' -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          printf 'app\tcheckpoint\tpackage\tsource_sha256\tbuild_status\tapk_sha256\tpackage_ok\ttarget36_ok\tsignature_ok\tdebuggable\tmin_sdk\tversion_code\tversion_name\n' > out/results.tsv
          while IFS=$'\t' read -r app checkpoint expected pkg drive_id; do
            d="work/$app"
            root=$(find "$d" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            test -n "$root"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$root/android/local.properties"
            set +e
            (cd "$root/android" && gradle --no-daemon clean assembleRelease) >"out/$app.gradle.log" 2>&1
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              printf '%s\t%s\t%s\t%s\tBUILD_FAIL\t\tfalse\tfalse\tfalse\t\t\t\t\n' "$app" "$checkpoint" "$pkg" "$expected" >> out/results.tsv
              continue
            fi
            raw=$(find "$root/android" -type f -name '*.apk' -path '*/build/outputs/apk/release/*' | head -1 || true)
            if [ -z "$raw" ]; then
              printf '%s\t%s\t%s\t%s\tBUILD_NO_APK\t\tfalse\tfalse\tfalse\t\t\t\t\n' "$app" "$checkpoint" "$pkg" "$expected" >> out/results.tsv
              continue
            fi
            aligned="out/$app-aligned.apk"; final="out/THF-${app^^}-APPS-${checkpoint}-EXACT-QA.apk"
            "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$final" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$final" > "out/$app.signature.txt"
            "$ZIPALIGN" -c -p 4 "$final"
            badging=$("$AAPT" dump badging "$final"); printf '%s\n' "$badging" > "out/$app.badging.txt"
            p_ok=false; grep -q "package: name='$pkg'" <<<"$badging" && p_ok=true
            t_ok=false; grep -q "targetSdkVersion:'36'" <<<"$badging" && t_ok=true
            sig_ok=false; "$APKSIGNER" verify "$final" >/dev/null 2>&1 && sig_ok=true
            debug=false; grep -q 'application-debuggable' <<<"$badging" && debug=true
            min_sdk=$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vc=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vn=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            apksha=$(sha256sum "$final" | awk '{print $1}')
            status=APK_INSPECTION_FAIL
            [ "$p_ok" = true ] && [ "$t_ok" = true ] && [ "$sig_ok" = true ] && [ "$debug" = false ] && status=APK_INSPECTION_PASS
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$checkpoint" "$pkg" "$expected" "$status" "$apksha" "$p_ok" "$t_ok" "$sig_ok" "$debug" "$min_sdk" "$vc" "$vn" >> out/results.tsv
            rm -f "$aligned"
          done < source-staging/expected.tsv
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('out/results.tsv'),delimiter='\t'))
          source=list(csv.DictReader(open('out/source-tests.tsv'),delimiter='\t'))
          d={'schema':1,'candidate_lane':'hosted-v1','mode':'QA_ONLY_REVERSIBLE','production_signing':False,'public_rollout':False,'apps':rows,'source_tests':source}
          d['counts']={'total':len(rows),'inspection_pass':sum(r['build_status']=='APK_INSPECTION_PASS' for r in rows),'fail':sum(r['build_status']!='APK_INSPECTION_PASS' for r in rows)}
          d['truth_boundary']=['Exact package inspection is not physical-device acceptance','Network-required flows still require reachable HTTPS/WSS health/auth','FINAL/PLAY_READY remains prohibited without device evidence']
          json.dump(d,open('out/summary.json','w'),indent=2)
          print(json.dumps(d['counts']))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-APPS-LATEST-EXACT-QA-HOSTED-V1
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Fail closed unless all current exact candidates pass package inspection
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('out/summary.json'))
          assert d['counts']['total']==9, d['counts']
          assert d['counts']['inspection_pass']==9 and d['counts']['fail']==0, d['counts']
          for a in d['apps']:
              assert a['build_status']=='APK_INSPECTION_PASS', a
              assert a['package_ok']=='true' and a['target36_ok']=='true' and a['signature_ok']=='true'
              assert a['debuggable']=='false' and len(a['apk_sha256'])==64
          print('THF_APPS_LATEST_EXACT_QA_HOSTED_V1=PASS')
          PY
