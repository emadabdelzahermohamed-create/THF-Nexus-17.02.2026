name: THF GCP Stable HTTPS Preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-gcp-stable-https-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect external-IP and HTTPS feasibility read-only
        run: |
          set -Eeuo pipefail
          echo '=== INSTANCE NETWORK ==='
          gcloud compute instances describe "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --format='yaml(name,networkInterfaces,metadata.items,tags.items)'
          echo '=== FIREWALL RULES (read only) ==='
          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format='table(name,network,direction,disabled,allowed,sourceRanges,targetTags)' || true
          echo '=== LISTENERS / EXISTING SERVERS ==='
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=15m --quiet --command='set -Eeuo pipefail; ss -lntup || true; command -v caddy || true; command -v nginx || true; command -v cloudflared || true; find "$HOME" -maxdepth 5 -type f \( -name "app.py" -o -name "main.py" -o -name "docker-compose.yml" \) -print 2>/dev/null | grep -iE "core|pulse|nexus" | head -80 || true'
