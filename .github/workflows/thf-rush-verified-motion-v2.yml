name: THF Rush Verified Motion V2

# Covers both the HTML/local-practice contract and the native Android SensorManager overlay.
on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/scripts/thf_spark_rush_verified_motion_overlay_v2.py'
      - 'ReleaseOps/scripts/test_spark_rush_verified_motion_overlay_v2.py'
      - 'ReleaseOps/games_factory/strengthen_rush_native_motion_v2.py'
      - '.github/workflows/thf-rush-verified-motion-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-motion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile ReleaseOps/scripts/thf_spark_rush_verified_motion_overlay_v2.py
          python3 -m py_compile ReleaseOps/scripts/test_spark_rush_verified_motion_overlay_v2.py
          python3 -m py_compile ReleaseOps/games_factory/strengthen_rush_native_motion_v2.py
      - name: Run synthetic clean-tree regression
        run: python3 ReleaseOps/scripts/test_spark_rush_verified_motion_overlay_v2.py
      - name: Assert HTML verified-motion authority boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ReleaseOps/scripts/thf_spark_rush_verified_motion_overlay_v2.py').read_text()
          assert 'manual_activity_values_accepted=false' in s
          assert 'verified_motion_required=true' in s
          assert 'online_motion_reward_authority=BACKEND_REQUIRED_NOT_IMPLEMENTED_HERE' in s
          assert 'server_verifiable_health_evidence_claimed=false' in s
          assert "document.getElementById('title').textContent='THF Motion Games'" in s
          assert "document.getElementById('title').textContent='THF Learn Games'" in s
          print('THF_RUSH_VERIFIED_MOTION_STATIC_GATE=PASS')
          PY
      - name: Assert native SensorManager, identity and reward boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ReleaseOps/games_factory/strengthen_rush_native_motion_v2.py').read_text()
          required = [
              "e.sensor != accel",
              "e.values.length < 3",
              "Float.isFinite(x)",
              "e.timestamp <= lastSensorTimestampNs",
              "trustedSensorEvents++",
              "manual_activity_values_accepted=false",
              "touch_repetition_increment=false",
              "local_repetitions_reward_authorized=false",
              "reward_bearing_health_evidence=BACKEND_REQUIRED",
              "user_facing_name=THF Motion Games",
              "canonical_package_id=com.topherofit.thf.rush",
              "@drawable/thf_motion_games_icon",
              "launcher_icon_sha256=",
              "product_specific_icon=true",
              "canonical_archive_mutated=false",
              "final_status=NOT_FINAL",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing native verified-motion/identity contracts: {missing}'
          assert "app.set(f'{{{ANDROID_NS}}}icon','@drawable/thf_motion_games_icon')" in s
          assert "app.set(f'{{{ANDROID_NS}}}roundIcon','@drawable/thf_motion_games_icon')" in s
          print('THF_RUSH_NATIVE_SENSOR_MANAGER_GATE=PASS')
          print('THF_RUSH_PRODUCT_IDENTITY_GATE=PASS')
          print('THF_RUSH_REWARD_AUTHORITY=BACKEND_REQUIRED')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
