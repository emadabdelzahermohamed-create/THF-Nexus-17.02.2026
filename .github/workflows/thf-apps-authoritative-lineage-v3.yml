name: THF Apps Authoritative Lineage V3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/thf-apps-authoritative-lineage-v3.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-apps-authoritative-lineage-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  lineage-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Resolve package-bound lineage without mutating builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=20m \
            --quiet \
            --command='python3 - <<'"'"'PY'"'"'
          import hashlib, json, os, pathlib, re, shutil, subprocess, zipfile

          home=pathlib.Path.home().resolve()
          excluded=re.compile(r"(^|[/_.-])(terra|rift|arena|nexus[-_ ]?world|token|solana|finance)([/_.-]|$)",re.I)
          apps={
            "core":{"package":"com.topherofit.thf.core","source":"6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a","apk":"262e1ee0dc4436f60de1f871c1a9a8fb633058ef87d8d4ab46d282a6fb3236ba"},
            "pulse":{"package":"com.topherofit.thf.pulse","source":"71a16804e7c138535bb373263ae4374d8a5eef410ffe83b165472c684b6c8b10","apk":"66c04169a40b574f0f26b0a90b999f95a9702b1154a80dc43d2de236a47673a3"},
            "forge":{"package":"com.topherofit.thf.forge","source":"0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51","apk":"e27b2dfa8d5bc382d2fa2439deafe98eaeba84ec30acd02a8c4f02dca8ec08ba"},
            "echo":{"package":"com.topherofit.thf.echo","source":"40a197b60563e560cab93ba0a64c859d9b650da222fdaec933993977d63902ab","apk":"794f16dd2ccb7f5907690326522c018649b650268380f270fa2156ec508b308b"},
            "codex":{"package":"com.topherofit.thf.codex","source":"3d60cc550732468c89fe120f552def53ac798646d065e94efa153f8979e15b1e","apk":"58c5491058d286b76e89e177df00db55b589d55a3e5e76921a6565f790da307f"},
            "spark":{"package":"com.topherofit.thf.spark","source":None,"apk":"9fffc4d97e64faf1d92ec6900968902570e2739d6751d752377ebde2589165ea"},
            "rush":{"package":"com.topherofit.thf.rush","source":None,"apk":"3e9aabaebdf1b321430abb3286156aeeaf8cf0174f2abff593a3ee3dc50d0e3a"},
            "vault":{"package":"com.topherofit.thf.vault","source":"7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793","apk":None},
            "signal":{"package":"com.topherofit.thf.signal","source":"51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0","apk":None},
            "command":{"package":"com.topherofit.thf.command","source":"f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408","apk":"b5886da7c053d2063d792c0b7d47316afa3b63ea0e951bfa60863c4aa526947f"}
          }

          def sha256(p):
            h=hashlib.sha256()
            with p.open("rb") as f:
              for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
            return h.hexdigest()

          def source_contains_package(p, package):
            try:
              with zipfile.ZipFile(p) as z:
                seen=0
                for info in z.infolist():
                  if info.is_dir() or info.file_size>2_000_000: continue
                  low=info.filename.lower()
                  if not low.endswith((".gradle",".kts",".xml",".properties",".toml",".json",".kt",".java",".txt")): continue
                  seen += 1
                  if seen>5000: break
                  try: data=z.read(info).decode("utf-8","ignore")
                  except Exception: continue
                  if package in data: return True
            except (zipfile.BadZipFile,OSError): pass
            return False

          def find_apk_tool():
            for name in ("aapt2","aapt","apkanalyzer"):
              p=shutil.which(name)
              if p: return name,p
            for root in (home/"Android"/"Sdk"/"build-tools",home/"android-sdk"/"build-tools",pathlib.Path("/opt/android-sdk/build-tools")):
              if root.exists():
                for v in sorted(root.iterdir(),reverse=True):
                  for name in ("aapt2","aapt"):
                    p=v/name
                    if p.exists() and os.access(p,os.X_OK): return name,str(p)
            return None,None

          tool_name,tool=find_apk_tool()
          def apk_identity(p):
            if not tool: return {"package":None,"target_sdk":None,"tool":None,"error":"NO_APK_INSPECTOR"}
            try:
              if tool_name in ("aapt","aapt2"):
                cp=subprocess.run([tool,"dump","badging",str(p)],capture_output=True,text=True,timeout=30,check=True)
                text=cp.stdout+cp.stderr
                pm=re.search(r"package: name='([^']+)'",text)
                tm=re.search(r"targetSdkVersion:'([^']+)'",text)
              else:
                cp=subprocess.run([tool,"manifest","print",str(p)],capture_output=True,text=True,timeout=30,check=True)
                text=cp.stdout+cp.stderr
                pm=re.search(r'package="([^"]+)"',text)
                tm=re.search(r'android:targetSdkVersion="([^"]+)"',text)
              return {"package":pm.group(1) if pm else None,"target_sdk":int(tm.group(1)) if tm and tm.group(1).isdigit() else None,"tool":tool_name,"error":None}
            except Exception as e:
              return {"package":None,"target_sdk":None,"tool":tool_name,"error":type(e).__name__}

          name_rx={a:re.compile(rf"(^|[^a-z0-9]){re.escape(a)}([^a-z0-9]|$)",re.I) for a in apps}
          inventory=[]
          for root,dirs,names in os.walk(home):
            try: rel=pathlib.Path(root).resolve().relative_to(home)
            except Exception: continue
            if len(rel.parts)>10: dirs[:]=[]; continue
            dirs[:]=[d for d in dirs if d not in {".git","node_modules",".gradle",".venv","venv","Library","Temp","cache","caches"}]
            if excluded.search(root): dirs[:]=[]; continue
            for n in names:
              low=n.lower()
              if not (low.endswith(".apk") or low.endswith(".zip")): continue
              p=pathlib.Path(root)/n
              if excluded.search(str(p)): continue
              try:
                size=p.stat().st_size
                if size<=0 or size>500_000_000: continue
                matched=[a for a,rx in name_rx.items() if rx.search(str(p))]
                if not matched: continue
                digest=sha256(p)
              except OSError: continue
              row={"path":str(p),"name":n,"sha256":digest,"size":size,"apps":matched,"mtime":p.stat().st_mtime,"kind":"apk" if low.endswith(".apk") else "zip"}
              if row["kind"]=="apk": row["identity"]=apk_identity(p)
              inventory.append(row)

          rows=[]
          for app,want in apps.items():
            pkg=want["package"]
            related=[x for x in inventory if app in x["apps"]]
            source_candidates=[]
            apk_candidates=[]
            for x in related:
              if x["kind"]=="zip" and source_contains_package(pathlib.Path(x["path"]),pkg): source_candidates.append(x)
              if x["kind"]=="apk" and x.get("identity",{}).get("package")==pkg and x.get("identity",{}).get("target_sdk")==36: apk_candidates.append(x)
            source_exact=[x for x in source_candidates if want["source"] and x["sha256"]==want["source"]]
            apk_exact=[x for x in apk_candidates if want["apk"] and x["sha256"]==want["apk"]]
            proposed_source=source_candidates[0] if want["source"] is None and len(source_candidates)==1 else None
            proposed_apk=apk_candidates[0] if want["apk"] is None and len(apk_candidates)==1 else None
            if want["source"] and want["apk"] and source_exact and apk_exact: status="COMPLETE_EXACT_SHA_PACKAGE_BOUND"
            elif want["source"] is None and apk_exact and proposed_source: status="PROPOSE_UNIQUE_SOURCE_AUTHORITY"
            elif want["apk"] is None and source_exact and proposed_apk: status="PROPOSE_UNIQUE_APK_AUTHORITY"
            elif (want["source"] is None and len(source_candidates)>1) or (want["apk"] is None and len(apk_candidates)>1): status="AMBIGUOUS_FAIL_CLOSED"
            else: status="UNRESOLVED_FAIL_CLOSED"
            rows.append({
              "app":app,"package":pkg,"status":status,"expected":want,
              "source_exact_count":len(source_exact),"apk_exact_count":len(apk_exact),
              "package_bound_source_candidates":sorted(source_candidates,key=lambda x:x["mtime"],reverse=True)[:8],
              "package_bound_api36_apk_candidates":sorted(apk_candidates,key=lambda x:x["mtime"],reverse=True)[:8],
              "proposed_source_sha256":proposed_source["sha256"] if proposed_source else None,
              "proposed_apk_sha256":proposed_apk["sha256"] if proposed_apk else None
            })

          out={
            "schema":"thf-apps-authoritative-lineage-v3",
            "mode":"READ_ONLY_PACKAGE_BOUND_DISCOVERY",
            "excluded_streams":["dedicated-native-games","token-finance"],
            "apk_inspector":tool_name,
            "rows":rows,
            "release_truth":{"final_or_play_ready":False,"physical_phone_evidence_required":True,"network_release_ready":False,"production_signing_performed":False},
            "policy_notes":[
              "A proposed unique authority is discovery evidence only and MUST NOT promote FINAL/PLAY_READY.",
              "Source authority requires exact package text inside the source archive; APK authority requires exact package plus targetSdk 36 from an APK inspector.",
              "Multiple package-bound candidates remain ambiguous and fail closed.",
              "Dedicated native games and token finance are excluded from scanning and authority decisions."
            ]
          }
          print("THF_APPS_AUTHORITATIVE_LINEAGE_V3_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True))
          print("THF_APPS_AUTHORITATIVE_LINEAGE_V3_END")
          print("FINAL_OR_PLAY_READY=FALSE")
          print("PHYSICAL_PHONE_EVIDENCE_REQUIRED=TRUE")
          print("NETWORK_RELEASE_READY=FALSE")
          # The discovery gate itself fails only if a previously complete exact pair drifted.
          drift=[r["app"] for r in rows if r["expected"]["source"] and r["expected"]["apk"] and r["status"]!="COMPLETE_EXACT_SHA_PACKAGE_BOUND"]
          if drift:
            raise SystemExit("EXACT_AUTHORITY_DRIFT="+",".join(drift))
          PY'