name: THF Apps Authoritative Lineage V3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/thf-apps-authoritative-lineage-v3.yml
      - ReleaseOps/apps_factory/THF_APPS_LINEAGE_RECONCILIATION_20260914_1745_EET.json
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-apps-authoritative-lineage-v3.yml
      - ReleaseOps/apps_factory/THF_APPS_LINEAGE_RECONCILIATION_20260914_1745_EET.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  lineage-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Validate reconciliation truth
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('ReleaseOps/apps_factory/THF_APPS_LINEAGE_RECONCILIATION_20260914_1745_EET.json').read_text())
          assert d['policy']=='MOBILE_REAL_FUNCTION_RELEASE_POLICY'
          assert len(d['apps'])==10
          tb=d['truth_boundary']
          assert all(tb[k] is False for k in ('final_or_play_ready','physical_device_pass','network_release_ready','push_ready','production_signing_performed','public_rollout_performed','token_finance_touched','dedicated_native_game_streams_touched'))
          by={x['name']:x for x in d['apps']}
          assert set(by)=={'core','pulse','forge','echo','codex','spark','rush','vault','signal','command'}
          assert by['spark']['source_sha256'] is None and by['rush']['source_sha256'] is None
          assert by['vault']['apk_sha256'] is None and by['signal']['apk_sha256'] is None
          assert all(x['target_sdk']==36 for x in d['apps'])
          print('RECONCILIATION_TRUTH=PASS')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
      - name: Resolve package-bound lineage without mutating builder
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/lineage_v3.py <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,zipfile
          home=pathlib.Path.home().resolve()
          excluded=re.compile(r'(^|[/_.-])(terra|rift|arena|nexus[-_ ]?world|token|solana|finance)([/_.-]|$)',re.I)
          known={
           'core':('com.topherofit.thf.core','6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a','262e1ee0dc4436f60de1f871c1a9a8fb633058ef87d8d4ab46d282a6fb3236ba'),
           'pulse':('com.topherofit.thf.pulse','71a16804e7c138535bb373263ae4374d8a5eef410ffe83b165472c684b6c8b10','66c04169a40b574f0f26b0a90b999f95a9702b1154a80dc43d2de236a47673a3'),
           'forge':('com.topherofit.thf.forge','0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51','e27b2dfa8d5bc382d2fa2439deafe98eaeba84ec30acd02a8c4f02dca8ec08ba'),
           'echo':('com.topherofit.thf.echo','40a197b60563e560cab93ba0a64c859d9b650da222fdaec933993977d63902ab','794f16dd2ccb7f5907690326522c018649b650268380f270fa2156ec508b308b'),
           'codex':('com.topherofit.thf.codex','3d60cc550732468c89fe120f552def53ac798646d065e94efa153f8979e15b1e','58c5491058d286b76e89e177df00db55b589d55a3e5e76921a6565f790da307f'),
           'command':('com.topherofit.thf.command','f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408','b5886da7c053d2063d792c0b7d47316afa3b63ea0e951bfa60863c4aa526947f')}
          candidates={
           'spark':('com.topherofit.thf.spark','58a32690ea69b6fd62a977145079e0ad6e75061724a786d5db9276b95ec48d43','9fffc4d97e64faf1d92ec6900968902570e2739d6751d752377ebde2589165ea','source'),
           'rush':('com.topherofit.thf.rush','766936c25700643bcf813d4e754b287f79810eebe859bd45388391bf57bf771c','3e9aabaebdf1b321430abb3286156aeeaf8cf0174f2abff593a3ee3dc50d0e3a','source'),
           'vault':('com.topherofit.thf.vault','7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793','76e20915e4bc6dee23adf43fdfcca9705815cf990164ccb8649032118dd42ce0','apk'),
           'signal':('com.topherofit.thf.signal','51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0','9d370142a251c2515fe19e7598a35213e8285fab4ed74f804d88ea6b5a21f05a','apk')}
          target_hashes={v for row in known.values() for v in row[1:]}|{v for row in candidates.values() for v in row[1:3]}
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
            return h.hexdigest()
          def package_in_zip(p,pkg):
            try:
              with zipfile.ZipFile(p) as z:
                for i,info in enumerate(z.infolist()):
                  if i>6000: break
                  if info.is_dir() or info.file_size>2_000_000: continue
                  if not info.filename.lower().endswith(('.gradle','.kts','.xml','.properties','.toml','.json','.kt','.java','.txt')): continue
                  try: data=z.read(info).decode('utf-8','ignore')
                  except Exception: continue
                  if pkg in data:return True
            except Exception: pass
            return False
          tools=[]
          for root in [home/'Android'/'Sdk'/'build-tools',home/'android-sdk'/'build-tools',pathlib.Path('/opt/android-sdk/build-tools'),pathlib.Path('/usr/local/lib/android/sdk/build-tools')]:
            if root.exists():
              for p in root.glob('*/aapt2'): tools.append(p)
              for p in root.glob('*/aapt'): tools.append(p)
          tool=str(sorted(tools)[-1]) if tools else None
          def apk_id(p):
            if not tool:return None
            try:
              t=subprocess.run([tool,'dump','badging',str(p)],capture_output=True,text=True,timeout=30,check=True).stdout
              m=re.search("package: name='([^']+)'",t); s=re.search("targetSdkVersion:'([^']+)'",t)
              return (m.group(1) if m else None,int(s.group(1)) if s and s.group(1).isdigit() else None)
            except Exception:return None
          hits={h:[] for h in target_hashes}
          for root,dirs,names in os.walk(home):
            try: rel=pathlib.Path(root).resolve().relative_to(home)
            except Exception: continue
            if len(rel.parts)>10:dirs[:]=[];continue
            dirs[:]=[d for d in dirs if d not in {'.git','node_modules','.gradle','.venv','venv','Library','Temp','cache','caches'}]
            if excluded.search(root):dirs[:]=[];continue
            for n in names:
              low=n.lower()
              if not low.endswith(('.apk','.zip')):continue
              p=pathlib.Path(root)/n
              try:
                if p.stat().st_size<=0 or p.stat().st_size>500_000_000:continue
                d=sha(p)
              except OSError:continue
              if d in hits:hits[d].append(str(p))
          rows=[]; drift=[]
          for app,(pkg,src,apk) in known.items():
            src_ok=bool(hits[src]); apk_ok=bool(hits[apk])
            status='COMPLETE_EXACT_SHA_PRESENT' if src_ok and apk_ok else 'EXACT_AUTHORITY_DRIFT'
            if status!='COMPLETE_EXACT_SHA_PRESENT':drift.append(app)
            rows.append({'app':app,'status':status,'source_sha256':src,'source_paths':hits[src],'apk_sha256':apk,'apk_paths':hits[apk]})
          for app,(pkg,src,apk,missing) in candidates.items():
            src_paths=hits[src]; apk_paths=hits[apk]
            src_bound=bool(src_paths) and any(package_in_zip(pathlib.Path(p),pkg) for p in src_paths)
            apk_identity=[{'path':p,'identity':apk_id(pathlib.Path(p))} for p in apk_paths]
            apk_bound=any(x['identity']==(pkg,36) for x in apk_identity)
            if missing=='source':
              status='PROPOSE_EXACT_SOURCE_AUTHORITY' if src_bound and apk_paths else ('SOURCE_CANDIDATE_NOT_PACKAGE_BOUND' if src_paths else 'SOURCE_CANDIDATE_NOT_FOUND')
            else:
              status='PROPOSE_EXACT_APK_AUTHORITY' if src_bound and apk_bound else ('APK_INSPECTOR_UNAVAILABLE_FAIL_CLOSED' if apk_paths and not tool else 'APK_CANDIDATE_NOT_BOUND_FAIL_CLOSED')
            rows.append({'app':app,'status':status,'candidate_source_sha256':src,'source_paths':src_paths,'source_package_bound':src_bound,'candidate_apk_sha256':apk,'apk_paths':apk_paths,'apk_identity':apk_identity})
          out={'schema':'thf-apps-authoritative-lineage-v3','mode':'READ_ONLY','apk_inspector':tool,'rows':rows,'release_truth':{'final_or_play_ready':False,'physical_device_pass':False,'network_release_ready':False,'push_ready':False}}
          print('THF_APPS_AUTHORITATIVE_LINEAGE_V3_BEGIN');print(json.dumps(out,indent=2,sort_keys=True));print('THF_APPS_AUTHORITATIVE_LINEAGE_V3_END')
          print('FINAL_OR_PLAY_READY=FALSE');print('PHYSICAL_DEVICE_PASS=FALSE');print('NETWORK_RELEASE_READY=FALSE');print('PUSH_READY=FALSE')
          if drift:raise SystemExit('EXACT_AUTHORITY_DRIFT='+','.join(drift))
          PY
          PAYLOAD="$(base64 -w0 /tmp/lineage_v3.py)"
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command="printf '%s' '$PAYLOAD' | base64 -d | python3"