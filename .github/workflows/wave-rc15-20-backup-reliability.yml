name: WAVE RC15.20 Backup Reliability Gate

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-rc15-20-backup-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  backup-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Authenticate to GCP with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate newest WAVE backup and perform read-only restore drill
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/wave-backup-verify.sh <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          base="$HOME/wave-backups"
          if [[ ! -d "$base" ]]; then
            echo "RESULT=FAIL"
            echo "REASON=backup_base_missing"
            exit 1
          fi
          mapfile -t candidates < <(find "$base" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn)
          if (( ${#candidates[@]} == 0 )); then
            echo "RESULT=FAIL"
            echo "REASON=no_backup_sets"
            exit 1
          fi
          root="${candidates[0]#* }"
          echo "BACKUP_SET=$(basename "$root")"
          echo "BACKUP_MTIME_UTC=$(date -u -r "$root" +%Y-%m-%dT%H:%M:%SZ)"
          file_count=$(find "$root" -type f | wc -l)
          total_bytes=$(find "$root" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "FILE_COUNT=$file_count"
          echo "TOTAL_BYTES=$total_bytes"
          if (( file_count == 0 || total_bytes == 0 )); then
            echo "RESULT=FAIL"
            echo "REASON=empty_backup_set"
            exit 1
          fi
          if find "$root" -type f -size 0 -print -quit | grep -q .; then
            echo "RESULT=FAIL"
            echo "REASON=zero_byte_file"
            find "$root" -type f -size 0 -printf 'ZERO_BYTE=%P\n'
            exit 1
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          validated=0
          while IFS= read -r -d '' file; do
            rel="${file#"$root"/}"
            case "$file" in
              *.tar.gz|*.tgz)
                gzip -t "$file"
                mkdir -p "$tmp/extract"
                tar -xzf "$file" -C "$tmp/extract"
                rm -rf "$tmp/extract"
                echo "RESTORE_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
              *.tar)
                mkdir -p "$tmp/extract"
                tar -xf "$file" -C "$tmp/extract"
                rm -rf "$tmp/extract"
                echo "RESTORE_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
              *.zip)
                unzip -tq "$file" >/dev/null
                mkdir -p "$tmp/extract"
                unzip -q "$file" -d "$tmp/extract"
                rm -rf "$tmp/extract"
                echo "RESTORE_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
              *.gz)
                gzip -t "$file"
                echo "COMPRESSED_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
              *.json)
                python3 -m json.tool "$file" >/dev/null
                echo "JSON_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
              *.sqlite|*.sqlite3|*.db)
                if command -v sqlite3 >/dev/null 2>&1; then
                  test "$(sqlite3 "$file" 'PRAGMA quick_check;')" = "ok"
                  echo "SQLITE_QUICK_CHECK_OK=$rel"
                  validated=$((validated + 1))
                else
                  dd if="$file" of=/dev/null bs=1M status=none
                  echo "BINARY_READ_OK=$rel"
                  validated=$((validated + 1))
                fi
                ;;
              *)
                dd if="$file" of=/dev/null bs=1M status=none
                echo "FILE_READ_OK=$rel"
                validated=$((validated + 1))
                ;;
            esac
          done < <(find "$root" -type f -print0)
          echo "VALIDATED_FILES=$validated"
          if (( validated != file_count )); then
            echo "RESULT=FAIL"
            echo "REASON=validation_count_mismatch"
            exit 1
          fi
          echo "SHA256_MANIFEST_BEGIN"
          (
            cd "$root"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          )
          echo "SHA256_MANIFEST_END"
          echo "RESULT=PASS"
          REMOTE_SCRIPT
          remote_script_b64=$(base64 -w0 /tmp/wave-backup-verify.sh)
          {
            echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SOURCE_HOST=${GCP_BUILDER}"
            echo "SOURCE_BASE=~/wave-backups"
            gcloud compute ssh "${GCP_BUILDER}" \
              --project "${GCP_PROJECT_ID}" \
              --zone "${GCP_ZONE}" \
              --tunnel-through-iap \
              --ssh-key-expire-after=10m \
              --quiet \
              --command "echo '${remote_script_b64}' | base64 -d | bash"
          } 2>&1 | tee wave-backup-reliability-evidence.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -Fxq 'RESULT=PASS' wave-backup-reliability-evidence.txt
          sha256sum wave-backup-reliability-evidence.txt | tee wave-backup-reliability-evidence.sha256

      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WAVE-RC15-20-BACKUP-RELIABILITY-EVIDENCE
          path: |
            wave-backup-reliability-evidence.txt
            wave-backup-reliability-evidence.sha256
          if-no-files-found: error
          retention-days: 30
