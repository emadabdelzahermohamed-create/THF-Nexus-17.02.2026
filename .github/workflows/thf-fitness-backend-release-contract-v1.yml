name: THF Fitness Backend Release Contract V1

on:
  push:
    branches:
      - automation/fitness-swarm-backend-20260924
    paths:
      - '.github/workflows/thf-fitness-backend-release-contract-v1.yml'
      - 'ReleaseOps/FitnessStandalone/backend_release_contract.py'
      - 'ReleaseOps/FitnessStandalone/backend_openapi_contract.py'
      - 'tests/releaseops/test_fitness_backend_release_contract.py'
      - 'tests/releaseops/test_fitness_backend_openapi_contract.py'
      - 'tests/releaseops/fitness_backend_v52_http_e2e.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  SOURCE_DRIVE_FILE_ID: 17De4XMcHKAENViMN4QZkNd7yqHf4lyt_
  SOURCE_SHA256: babfbcb997e7b5347da1141e1455aa290e1e143bac8d00c48fa65a0f6d02d1f6
  SOURCE_RECORDED_AT: '2026-09-27T14:40:46Z'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run release-auditor regressions
        run: |
          python3 -m unittest \
            tests.releaseops.test_fitness_backend_release_contract \
            tests.releaseops.test_fitness_backend_openapi_contract -v

      - name: Authenticate read-only source retrieval through WIF
        id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Download immutable Fitness Backend V52 successor
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "${ACCESS_TOKEN}"
          mkdir -p build/fitness out
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${SOURCE_DRIVE_FILE_ID}?alt=media&supportsAllDrives=true" \
            -o out/fitness-source.zip
          echo "${SOURCE_SHA256}  out/fitness-source.zip" | tee out/source.sha256 | sha256sum -c -
          unzip -q out/fitness-source.zip -d build/fitness

      - name: Verify successor provenance manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/fitness/BACKEND_SUCCESSOR_V52.json").read_text())
          assert manifest["schema"] == "thf-fitness-backend-successor-v2"
          assert manifest["parent_source_sha256"] == "2290c5897eab827dd778204de03f6f70c49fd162a32d187e4844172ececf7b74"
          assert manifest["predecessor_source_sha256"] == "bd9676075750beafcfba5e2262cb505eaf1920b2f42b1965b2dbae05bfe0b428"
          assert manifest["scope"] == "backend_only"
          PY

      - name: Run exact-source backend tests
        run: |
          set -euo pipefail
          cd build/fitness
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m compileall -q app
          pytest -q | tee "$GITHUB_WORKSPACE/out/pytest.txt"

      - name: Run ephemeral production-mode HTTPS E2E
        run: |
          set -euo pipefail
          python3 tests/releaseops/fitness_backend_v52_http_e2e.py \\
            --source-root build/fitness \\
            --source-sha256 "${SOURCE_SHA256}" \\
            --output out/backend-https-e2e.json

      - name: Inventory release-critical backend contracts
        run: |
          set -euo pipefail
          python3 ReleaseOps/FitnessStandalone/backend_release_contract.py build/fitness \
            --source-sha256 "${SOURCE_SHA256}" \
            --recorded-at "${SOURCE_RECORDED_AT}" \
            --output out/backend-release-contract.json \
            --expect PROGRESS
          grep -q '"server_authority_contract_present": true' out/backend-release-contract.json
          grep -q '"set_sequence_contract_complete": true' out/backend-release-contract.json
          grep -q 'health_provenance_dedup_present' out/backend-release-contract.json

      - name: Audit exact-source runtime OpenAPI contract
        run: |
          set -euo pipefail
          python3 ReleaseOps/FitnessStandalone/backend_openapi_contract.py \
            --source-root build/fitness \
            --source-sha256 "${SOURCE_SHA256}" \
            --recorded-at "${SOURCE_RECORDED_AT}" \
            --output out/backend-openapi-contract.json \
            --expect PROGRESS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-FITNESS-BACKEND-V52-RELEASE-CONTRACT
          path: |
            out/backend-release-contract.json
            out/backend-openapi-contract.json
            out/backend-https-e2e.json
            out/pytest.txt
            out/source.sha256
          retention-days: 30
