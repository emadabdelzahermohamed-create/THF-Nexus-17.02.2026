name: THF Fitness Android Emulator Release Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FITNESS_BRANCH: release/fitness-standalone-v1-20260918
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  SOURCE_DRIVE_FILE_ID: 1gcOkJ-EXnCEbCHMcBSUWAwVcQxj4j40-
  SOURCE_SHA256: 2290c5897eab827dd778204de03f6f70c49fd162a32d187e4844172ececf7b74
  AVATAR_SHA256: 4f556086e1b7149f6c958f1f399f4368f6ad9b76afd3503d6f848eeeb7bea24f
  THF_FITNESS_BASE_URL: https://thf-fitness-pulse-ul26f1.v2.appdeploy.ai/

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Fitness release operations
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FITNESS_BRANCH }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download exact RC2 source
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${SOURCE_DRIVE_FILE_ID}?alt=media&supportsAllDrives=true" \
            -o fitness-source.zip
          echo "$SOURCE_SHA256  fitness-source.zip" | sha256sum -c -
          mkdir -p build/fitness
          unzip -q fitness-source.zip -d build/fitness
          echo "$AVATAR_SHA256  build/fitness/static/assets/avatar/thf_mpfb_stage16a_ual12_animated.glb" | sha256sum -c -

      - name: Verify live production web
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 "$THF_FITNESS_BASE_URL" -o /tmp/fitness-live.html
          test -s /tmp/fitness-live.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK against production backend
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          cd build/fitness/android
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon clean assembleDebug -PTHF_BASE_URL="$THF_FITNESS_BASE_URL" -PTHF_PASS_URL=""
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/artifacts/THF-Fitness-live-backend-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/THF-Fitness-live-backend-debug.apk" > "$GITHUB_WORKSPACE/artifacts/APK_SHA256.txt"

      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ReleaseOps/FitnessStandalone/android_emulator_smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-android-emulator-smoke
          path: |
            artifacts/
          retention-days: 14
