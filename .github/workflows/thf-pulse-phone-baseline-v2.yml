name: THF Pulse Phone Baseline QA2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-pulse-phone-baseline-v2.yml
      - ReleaseOps/Pulse/verify_phone_candidate.py
      - ReleaseOps/scripts/build_pulse_phone_baseline_v2.sh
      - ReleaseOps/scripts/run_pulse_phone_baseline_v2_diagnostic.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thf-pulse-phone-baseline-v2
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  PULSE_SRC: /home/sa_115575029018678177962/thf-apps-rc3-exact-candidate-v2/work/pulse/THF_Pulse_APPS_RC2_SOURCE
  PULSE_SOURCE_SHA: 6a180cf6599f8827e824431caf4566f520cc3796d9366c30abc197b4aeb6ba34

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage isolated Pulse-only builder
        run: |
          set -Eeuo pipefail
          chmod +x ReleaseOps/scripts/build_pulse_phone_baseline_v2.sh ReleaseOps/scripts/run_pulse_phone_baseline_v2_diagnostic.sh
          gcloud compute scp ReleaseOps/scripts/build_pulse_phone_baseline_v2.sh "$GCP_BUILDER:/tmp/build_pulse_phone_baseline_v2.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          gcloud compute scp ReleaseOps/scripts/run_pulse_phone_baseline_v2_diagnostic.sh "$GCP_BUILDER:/tmp/run_pulse_phone_baseline_v2_diagnostic.sh" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command="set -Eeuo pipefail; \
            python3 - <<'PY'
from pathlib import Path
import shutil
src=Path('$PULSE_SRC')
dst=Path('/tmp/thf-pulse-authoritative-clean')
if not src.is_dir(): raise SystemExit('authoritative Pulse source missing')
shutil.rmtree(dst, ignore_errors=True)
shutil.copytree(src,dst,ignore=shutil.ignore_patterns('__pycache__','.pytest_cache','*.pyc'))
PY
            CLEAN_SHA=\$(cd /tmp/thf-pulse-authoritative-clean && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print \$1}'); \
            test \"\$CLEAN_SHA\" = '$PULSE_SOURCE_SHA'; \
            python3 - <<'PY'
from pathlib import Path
p=Path('/tmp/build_pulse_phone_baseline_v2.sh')
s=p.read_text()
old='SRC="$HOME/thf-apps-rc3-exact-candidate-v2/work/pulse/THF_Pulse_APPS_RC2_SOURCE"'
new='SRC="/tmp/thf-pulse-authoritative-clean"'
if old not in s: raise SystemExit('Pulse source anchor missing in builder')
p.write_text(s.replace(old,new,1))
PY"
      - name: Build Pulse phone baseline with diagnostics
        id: remote_build
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='chmod +x /tmp/build_pulse_phone_baseline_v2.sh /tmp/run_pulse_phone_baseline_v2_diagnostic.sh && /tmp/run_pulse_phone_baseline_v2_diagnostic.sh'
      - name: Retrieve Pulse candidate and diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          rm -rf out && mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-pulse-phone-baseline-v2/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          find out -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          if test -s out/DIAGNOSTIC.txt; then cat out/DIAGNOSTIC.txt; fi
      - name: Fail-closed gate candidate and moving-human runtime
        if: steps.remote_build.outcome == 'success'
        run: |
          set -Eeuo pipefail
          E=out/EVIDENCE.txt
          grep -q '^THF_PULSE_PHONE_BASELINE_QA2=BUILT$' "$E"
          grep -q '^source_tree_sha256=6a180cf6599f8827e824431caf4566f520cc3796d9366c30abc197b4aeb6ba34$' "$E"
          grep -q '^source_authoritative_gate=PASS$' "$E"
          grep -q '^non_pulse_code_modified=false$' "$E"
          grep -q '^motion_runtime_local=true$' "$E"
          grep -q '^runtime_asset_extract_integrity=PASS$' "$E"
          grep -q '^onboarding_persistence=IMPLEMENTED$' "$E"
          grep -q '^identity_handoff=THF_PASS_BOUNDARY_IMPLEMENTED_ENDPOINT_REQUIRED$' "$E"
          grep -q '^identity_ticket_persisted=false$' "$E"
          grep -q '^backend_offline_local_motion=IMPLEMENTED$' "$E"
          grep -q '^health_connect_permission_bridge=IMPLEMENTED$' "$E"
          grep -q '^health_connect_device_record_read=BOUNDARY_READY_DEVICE_TEST_PENDING$' "$E"
          grep -q '^samsung_health_adapter=BOUNDARY_READY_SDK_BINARY_NOT_BUNDLED$' "$E"
          grep -q '^provider_provenance_dedup=IMPLEMENTED_SHA256$' "$E"
          grep -q '^pose_motion_verification_hook=IMPLEMENTED_NOT_PROOF_BY_ITSELF$' "$E"
          grep -q '^arabic_english_rtl=IMPLEMENTED$' "$E"
          grep -q '^targetSdk=36$' "$E"
          grep -q '^physical_device_status=PENDING$' "$E"
          grep -q '^visible_moving_human_phone_validation=PENDING$' "$E"
          grep -q '^final_or_play_ready=FALSE$' "$E"
          test -s out/THF-PULSE-PHONE-BASELINE-QA2.apk
          APK_SHA_ACTUAL=$(sha256sum out/THF-PULSE-PHONE-BASELINE-QA2.apk | awk '{print $1}')
          APK_SHA_RECORDED=$(sed -n 's/^apk_sha256=//p' "$E")
          AVATAR_SHA=$(sed -n 's/^avatar_sha256=//p' "$E")
          CONTRACT_SHA=$(sed -n 's/^health_contract_sha256=//p' "$E")
          [[ "$APK_SHA_RECORDED" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AVATAR_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONTRACT_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$APK_SHA_ACTUAL" = "$APK_SHA_RECORDED"
          grep -q 'avatar.glb' out/runtime-assets.sha256
          grep -q 'health-contracts.json' out/runtime-assets.sha256
          python3 ReleaseOps/Pulse/verify_phone_candidate.py \
            out/THF-PULSE-PHONE-BASELINE-QA2.apk \
            --out out/MOTION_SEMANTIC_EVIDENCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/MOTION_SEMANTIC_EVIDENCE.json')
          d = json.loads(p.read_text())
          assert d['package_semantic_gate'] == 'PASS_PHONE_VALIDATION_STILL_REQUIRED'
          assert d['physical_phone_visible_motion'] == 'PENDING_REQUIRED'
          assert d['legacy_text_workout_console_active'] is False
          assert d['motion_runtime_semantic_bone_driver'] == 'PASS'
          assert d['motion_runtime_render_loop'] == 'PASS'
          assert d['avatar_skins'] >= 1
          assert d['avatar_max_joint_count'] >= 60
          assert d['avatar_animation_count'] >= 10
          assert d['avatar_ual_animation_count'] >= 1
          PY
          cat "$E"
          cat out/MOTION_SEMANTIC_EVIDENCE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-PULSE-PHONE-BASELINE-QA2-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Propagate remote build failure
        if: steps.remote_build.outcome != 'success'
        run: |
          echo 'Remote Pulse QA2 build failed; diagnostics were preserved above and in the artifact.' >&2
          exit 1
