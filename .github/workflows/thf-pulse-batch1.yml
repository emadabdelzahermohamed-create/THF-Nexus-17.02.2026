name: THF Pulse Batch1 APK

on:
  push:
    branches:
      - batch1/pulse-offline-final-20260916
    paths:
      - 'mobile/pulse-batch1/**'
      - 'mobile/pulse-batch1-source.zip'
      - '.github/workflows/thf-pulse-batch1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 toolchain using runner SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Expand exact Pulse source
        run: |
          rm -rf mobile/pulse-batch1
          mkdir -p mobile/pulse-batch1
          unzip -q mobile/pulse-batch1-source.zip -d mobile/pulse-batch1

      - name: Source safety gate
        working-directory: mobile/pulse-batch1
        run: |
          set -euxo pipefail
          test -f app/src/main/assets/pulse/index.html
          test -f app/src/main/java/com/topherofit/thf/pulse/MainActivity.java
          ! grep -RIE --exclude='MainActivity.java' 'trycloudflare\.com|ngrok|127\.0\.0\.1|localhost' .
          ! grep -RIE --exclude='MainActivity.java' '\.local([/:]|$)' .
          grep -q 'file:///android_asset/pulse/index.html' app/src/main/java/com/topherofit/thf/pulse/MainActivity.java
          grep -q 'OFFLINE READY' app/src/main/assets/pulse/index.html
          grep -q 'targetSdk 36' app/build.gradle

      - name: Build exact debug APK and unsigned release AAB
        working-directory: mobile/pulse-batch1
        run: |
          gradle --no-daemon --stacktrace :app:clean :app:assembleDebug :app:bundleRelease

      - name: Inspect Android outputs
        working-directory: mobile/pulse-batch1
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" > apk-zip-test.txt
          unzip -t "$AAB" > aab-zip-test.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.topherofit.thf.pulse'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          unzip -l "$APK" > apk-files.txt
          grep -q 'assets/pulse/index.html' apk-files.txt
          sha256sum "$APK" "$AAB" > SHA256SUMS.txt
          cp "$APK" THF-Pulse-4.2.0-BATCH1-OFFLINE-TEST.apk
          cp "$AAB" THF-Pulse-4.2.0-BATCH1-UNSIGNED.aab

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: THF-Pulse-4.2.0-BATCH1
          if-no-files-found: error
          retention-days: 30
          path: |
            mobile/pulse-batch1/THF-Pulse-4.2.0-BATCH1-OFFLINE-TEST.apk
            mobile/pulse-batch1/THF-Pulse-4.2.0-BATCH1-UNSIGNED.aab
            mobile/pulse-batch1/SHA256SUMS.txt
            mobile/pulse-batch1/apk-badging.txt
            mobile/pulse-batch1/apk-files.txt
            mobile/pulse-batch1/apk-zip-test.txt
            mobile/pulse-batch1/aab-zip-test.txt
