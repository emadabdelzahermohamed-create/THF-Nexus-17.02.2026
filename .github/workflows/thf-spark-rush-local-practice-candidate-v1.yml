name: THF Spark Rush Local Practice Candidate V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/scripts/thf_spark_rush_local_practice_overlay_v1.py'
      - '.github/workflows/thf-spark-rush-local-practice-candidate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build-local-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Syntax gate
        run: python3 -m py_compile ReleaseOps/scripts/thf_spark_rush_local_practice_overlay_v1.py
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage candidate overlay
        run: gcloud compute scp ReleaseOps/scripts/thf_spark_rush_local_practice_overlay_v1.py "$GCP_BUILDER:/tmp/" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Build and inspect disposable candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=35m --quiet --command='bash -s' > out/summary.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-spark-rush-local-practice-candidate-v1"; rm -rf "$ROOT"; mkdir -p "$ROOT/out"
          SDK="$HOME/thf-builder-rc16-build/android-sdk"; DIST="$HOME/thf-builder-rc16-build/cache/gradle-dist-8.11.1/gradle-8.11.1/bin/gradle"
          test -d "$SDK"; test -x "$DIST"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1); test -x "$BT/aapt"; test -x "$BT/apksigner"
          safe_extract(){ python3 - "$1" "$2" <<'PY'
          import pathlib,shutil,sys,zipfile
          src,dst=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]).resolve();dst.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(src) as z:
              for i in z.infolist():
                  r=pathlib.PurePosixPath(i.filename)
                  if r.is_absolute() or '..' in r.parts: raise SystemExit('unsafe zip')
                  t=(dst/pathlib.Path(*r.parts)).resolve()
                  if t!=dst and dst not in t.parents: raise SystemExit('zip escape')
                  if i.is_dir(): t.mkdir(parents=True,exist_ok=True);continue
                  t.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(i) as a,open(t,'wb') as b: shutil.copyfileobj(a,b)
          PY
          }
          run_one(){
            kind="$1";src="$2";expected="$3";pkg="$4";tag="$5"
            work="$ROOT/$tag/work";ev="$ROOT/out/$tag";mkdir -p "$work" "$ev"
            test "$(sha256sum "$src"|awk '{print $1}')" = "$expected"
            safe_extract "$src" "$work"
            python3 /tmp/thf_spark_rush_local_practice_overlay_v1.py "$work" --kind "$kind" --evidence-out "$ev/overlay.txt"
            asset=$(find "$work" -path '*/android/app/src/main/assets/offline.html' -type f -print -quit);test -n "$asset"
            grep -q 'Local offline practice only' "$asset"
            grep -q "addEventListener('pointerdown'" "$asset"
            grep -q 'requestAnimationFrame(gameLoop)' "$asset"
            grep -q 'ranked, social, wallet, economy, rewards, or fitness-evidence' "$asset"
            if [ "$kind" = spark ]; then grep -q 'newLearningRound' "$asset"; else grep -q 'nextFitnessTarget' "$asset"; fi
            proj=$(dirname "$(find "$work" -path '*/android/settings.gradle' -type f -print -quit)");test -n "$proj"
            export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK" GRADLE_USER_HOME="$ROOT/gradle-home-$tag";mkdir -p "$GRADLE_USER_HOME"
            printf 'sdk.dir=%s\n' "$SDK" > "$proj/local.properties"
            (cd "$proj" && "$DIST" --no-daemon :app:assembleDebug > "$ev/gradle.log" 2>&1)
            apk=$(find "$proj/app/build/outputs/apk" -type f -name '*.apk' -print -quit);test -s "$apk"
            "$BT/apksigner" verify --verbose "$apk" > "$ev/apksigner.txt"
            badging=$("$BT/aapt" dump badging "$apk");printf '%s\n' "$badging" > "$ev/badging.txt"
            grep -q "package: name='$pkg'" <<<"$badging";grep -q "targetSdkVersion:'36'" <<<"$badging"
            unzip -p "$apk" assets/offline.html > "$ev/offline-from-apk.html"
            grep -q 'Local offline practice only' "$ev/offline-from-apk.html"
            grep -q "addEventListener('pointerdown'" "$ev/offline-from-apk.html"
            cp "$apk" "$ev/$tag-debug.apk"
            apksha=$(sha256sum "$ev/$tag-debug.apk"|awk '{print $1}')
            python3 - "$ev/offline-from-apk.html" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text(errors='strict')
          required=['playerState','loadLocalAvatar','movePlayerTowardTarget','requestAnimationFrame(gameLoop)',"addEventListener('pointerdown'",'Local offline practice only']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing runtime markers: '+','.join(missing))
          if 'localStorage.setItem("rank' in s or 'wallet' in s and 'wallet, economy' not in s: raise SystemExit('unexpected online-state write marker')
          print('packaged_local_game_contract=PASS')
          PY
            test "$(sha256sum "$src"|awk '{print $1}')" = "$expected"
            echo "=== $kind ===";echo "source_sha256=$expected";echo "candidate_apk_sha256=$apksha";echo 'target_sdk=36';echo 'offline_local_game=PASS';echo 'touch_input=PASS';echo 'player_state=PASS';echo 'game_loop=PASS';echo 'ranked_state_written=false';echo 'economy_state_written=false';echo 'fitness_evidence_written=false';echo 'canonical_archive_unchanged=true';echo 'device_status=PENDING';echo 'final_status=NOT_FINAL'
          }
          run_one spark "$HOME/thf-apps-rc2-exact-candidate-v2/source/spark.zip" 6b74f8d75df8c0b7f74d8c2fee8be7e3517f3803cb42968735bc7a10939bc18c com.topherofit.thf.spark THF-Spark-RC2-Local-Practice
          run_one rush "$HOME/thf-apps-rc2-exact-candidate-v2/source/rush.zip" bb6ff035186b13cdde853145f42e66259c205889de2a7b368da34c9cb0582ba7 com.topherofit.thf.rush THF-Rush-RC2-Local-Practice
          echo 'online_authority_status=BLOCKED_PENDING_REAL_HTTPS_ENDPOINT';echo 'wave_files_read_or_changed=false';echo 'production_signing=false';echo 'canonical_archives_mutated=false'
          REMOTE
          rc=$?
          set -e
          printf '\nremote_exit_code=%s\n' "$rc" >> out/summary.txt
      - name: Retrieve candidate evidence
        if: always()
        shell: bash
        run: |
          set +e
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-spark-rush-local-practice-candidate-v1/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          set -e
          cat out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-SPARK-RUSH-LOCAL-PRACTICE-CANDIDATE-V1
          path: out/
          retention-days: 14
          compression-level: 0
      - name: Safety truth gate
        run: |
          grep -q '^remote_exit_code=0$' out/summary.txt
          grep -q '^online_authority_status=BLOCKED_PENDING_REAL_HTTPS_ENDPOINT$' out/summary.txt
          grep -q '^wave_files_read_or_changed=false$' out/summary.txt
          grep -q '^production_signing=false$' out/summary.txt
          grep -q '^canonical_archives_mutated=false$' out/summary.txt
          test "$(grep -c '^offline_local_game=PASS$' out/summary.txt)" -eq 2
          test "$(grep -c '^device_status=PENDING$' out/summary.txt)" -eq 2
          test "$(grep -c '^final_status=NOT_FINAL$' out/summary.txt)" -eq 2
