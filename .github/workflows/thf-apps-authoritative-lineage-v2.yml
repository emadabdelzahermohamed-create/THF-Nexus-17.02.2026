name: THF Apps Authoritative Lineage V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-apps-authoritative-lineage-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Resolve exact SHA anchors without mutating builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=20m \
            --quiet \
            --command='python3 - <<'"'"'PY'"'"'
          import hashlib, json, os, pathlib, re
          home=pathlib.Path.home().resolve()
          excluded=re.compile(r"(^|[/_.-])(terra|rift|arena|nexus[-_ ]?world|token|solana|finance)([/_.-]|$)",re.I)
          anchors={
            "core":{"source":"6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a","apk":"262e1ee0dc4436f60de1f871c1a9a8fb633058ef87d8d4ab46d282a6fb3236ba"},
            "pulse":{"source":"71a16804e7c138535bb373263ae4374d8a5eef410ffe83b165472c684b6c8b10","apk":"66c04169a40b574f0f26b0a90b999f95a9702b1154a80dc43d2de236a47673a3"},
            "forge":{"source":"0f7a416a9e14af9dbb3cdcb26bfb891e0c680d4a33a73d60601eda215e697e51","apk":"e27b2dfa8d5bc382d2fa2439deafe98eaeba84ec30acd02a8c4f02dca8ec08ba"},
            "echo":{"source":"40a197b60563e560cab93ba0a64c859d9b650da222fdaec933993977d63902ab","apk":"794f16dd2ccb7f5907690326522c018649b650268380f270fa2156ec508b308b"},
            "codex":{"source":"3d60cc550732468c89fe120f552def53ac798646d065e94efa153f8979e15b1e","apk":"58c5491058d286b76e89e177df00db55b589d55a3e5e76921a6565f790da307f"},
            "spark":{"source":None,"apk":"9fffc4d97e64faf1d92ec6900968902570e2739d6751d752377ebde2589165ea"},
            "rush":{"source":None,"apk":"3e9aabaebdf1b321430abb3286156aeeaf8cf0174f2abff593a3ee3dc50d0e3a"},
            "vault":{"source":"7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793","apk":None},
            "signal":{"source":"51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0","apk":None},
            "command":{"source":"f7da9039041b8142d795e96934b95f00b83ac8fb5e3d6f5d9bfbff0aeb2eb408","apk":"b5886da7c053d2063d792c0b7d47316afa3b63ea0e951bfa60863c4aa526947f"}
          }
          def sha(p):
            h=hashlib.sha256()
            with p.open("rb") as f:
              for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
            return h.hexdigest()
          app_rx={a:re.compile(rf"(^|[^a-z0-9]){re.escape(a)}([^a-z0-9]|$)",re.I) for a in anchors}
          files=[]
          for root,dirs,names in os.walk(home):
            depth=len(pathlib.Path(root).relative_to(home).parts)
            if depth>9: dirs[:]=[]; continue
            dirs[:]=[d for d in dirs if d not in {".git","node_modules",".gradle",".venv","venv","Library","Temp"}]
            if excluded.search(root): dirs[:]=[]; continue
            for n in names:
              low=n.lower()
              if not (low.endswith(".apk") or (low.endswith(".zip") and ("source" in low or "src" in low))): continue
              p=pathlib.Path(root)/n
              if excluded.search(str(p)): continue
              if p.stat().st_size>500_000_000: continue
              apps=[a for a,rx in app_rx.items() if rx.search(str(p))]
              if not apps: continue
              try: digest=sha(p)
              except OSError: continue
              files.append({"path":str(p),"name":n,"sha256":digest,"size":p.stat().st_size,"apps":apps,"mtime":p.stat().st_mtime})
          rows=[]
          for app,want in anchors.items():
            source_matches=[f for f in files if want["source"] and f["sha256"]==want["source"]]
            apk_matches=[f for f in files if want["apk"] and f["sha256"]==want["apk"]]
            app_sources=[f for f in files if app in f["apps"] and f["name"].lower().endswith(".zip")]
            app_apks=[f for f in files if app in f["apps"] and f["name"].lower().endswith(".apk")]
            status="COMPLETE_EXACT_SHA" if want["source"] and want["apk"] and source_matches and apk_matches else (
              "NEEDS_SOURCE_AUTHORITY" if want["source"] is None and apk_matches else
              "NEEDS_APK_AUTHORITY" if want["apk"] is None and source_matches else
              "ANCHOR_NOT_FOUND")
            rows.append({
              "app":app,"status":status,"expected":want,
              "source_anchor_matches":source_matches,"apk_anchor_matches":apk_matches,
              "all_app_source_candidates":sorted(app_sources,key=lambda x:x["mtime"],reverse=True)[:12],
              "all_app_apk_candidates":sorted(app_apks,key=lambda x:x["mtime"],reverse=True)[:12]
            })
          pass_hits=[]
          pass_rx=re.compile(r"(^|[^a-z0-9])thf[-_ ]*pass([^a-z0-9]|$)|(^|[/_.-])pass([/_.-]|$)",re.I)
          for root,dirs,names in os.walk(home):
            depth=len(pathlib.Path(root).relative_to(home).parts)
            if depth>6: dirs[:]=[]; continue
            dirs[:]=[d for d in dirs if d not in {".git","node_modules",".gradle","build","dist",".venv","venv"}]
            if excluded.search(root): dirs[:]=[]; continue
            for n in names:
              p=pathlib.Path(root)/n
              if pass_rx.search(str(p)) and n.lower().endswith((".py",".json",".yml",".yaml",".zip",".apk",".aab")):
                pass_hits.append(str(p))
          out={
            "schema":"thf-apps-authoritative-lineage-v2","mode":"READ_ONLY",
            "excluded_streams":["dedicated-native-games","token-finance"],
            "rows":rows,"thf_pass_named_hits":sorted(pass_hits)[:100],
            "final_or_play_ready":False,"physical_phone_evidence_required":True,
            "network_release_ready":False,
            "notes":["COMPLETE_EXACT_SHA is lineage discovery only; it does not replace physical-phone or reachable backend evidence.","Spark/Rush source authority and Vault/Signal APK authority remain fail-closed until uniquely bound."]
          }
          print("THF_APPS_AUTHORITATIVE_LINEAGE_V2_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True))
          print("THF_APPS_AUTHORITATIVE_LINEAGE_V2_END")
          print("FINAL_OR_PLAY_READY=FALSE")
          print("PHYSICAL_PHONE_EVIDENCE_REQUIRED=TRUE")
          print("NETWORK_RELEASE_READY=FALSE")
          PY'
