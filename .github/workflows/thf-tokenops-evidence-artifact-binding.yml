name: THF TokenOps Evidence Artifact Binding Gate

on:
  push:
    branches:
      - 'tokenops/**'
    paths:
      - 'ReleaseOps/TokenOps/evidence_artifact_binding.py'
      - 'ReleaseOps/TokenOps/test_evidence_artifact_binding.py'
      - '.github/workflows/thf-tokenops-evidence-artifact-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-binding-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run fail-closed evidence binding tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ReleaseOps/TokenOps
          python3 -m unittest -v test_evidence_artifact_binding.py 2>&1 | tee evidence-artifact-binding-tests.log

      - name: Assert no execution primitives or secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^OK$' ReleaseOps/TokenOps/evidence-artifact-binding-tests.log
          ! grep -R -nE 'sendTransaction|send_transaction|broadcast_transaction|Keypair\.from|seed phrase|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ReleaseOps/TokenOps/evidence_artifact_binding.py \
            ReleaseOps/TokenOps/test_evidence_artifact_binding.py
          echo THF_TOKENOPS_EVIDENCE_BINDING_GATE=PASS
          echo TRANSACTION_CREATED=FALSE
          echo TRANSACTION_SIGNED=FALSE
          echo TRANSACTION_SUBMITTED=FALSE
          echo PRIVATE_KEY_USED=FALSE
          echo FINANCIAL_EFFECT=FALSE
          echo WAVE_UNTOUCHED=TRUE

      - name: Produce evidence hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tokenops-evidence-binding
          sha256sum \
            ReleaseOps/TokenOps/evidence_artifact_binding.py \
            ReleaseOps/TokenOps/test_evidence_artifact_binding.py \
            .github/workflows/thf-tokenops-evidence-artifact-binding.yml \
            > tokenops-evidence-binding/SHA256SUMS.txt
          cp ReleaseOps/TokenOps/evidence-artifact-binding-tests.log tokenops-evidence-binding/
          printf '%s\n' \
            'THF_TOKENOPS_EVIDENCE_BINDING_GATE=PASS' \
            'TRANSACTION_CREATED=FALSE' \
            'TRANSACTION_SIGNED=FALSE' \
            'TRANSACTION_SUBMITTED=FALSE' \
            'PRIVATE_KEY_USED=FALSE' \
            'FINANCIAL_EFFECT=FALSE' \
            'WAVE_UNTOUCHED=TRUE' \
            > tokenops-evidence-binding/SAFETY.txt

      - name: Upload gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Evidence-Artifact-Binding-Gate
          path: tokenops-evidence-binding/
          if-no-files-found: error
          retention-days: 90
