name: Fitness Activity Candidate Build

on:
  push:
    branches:
      - feature/fitness-activity-tracking-51009-code
      - agent/codex/fitness-recovery/20261023
      - agent/codex/gps-integrity/20261024
      - agent/codex/live-notification/20261024
      - agent/codex/fitness-release-51013-play-safe-20261026
    paths:
      - 'fitness-v2/**'
      - '.github/workflows/fitness-sensor-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-activity-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test lint and build candidate 51013
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p fitness-v2/evidence
          set +e
          gradle --no-daemon -p fitness-v2/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease 2>&1 | tee fitness-v2/evidence/candidate-51013-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            grep -E '(^e: |^w: |FAILURE:|FAILED|error:|Lint found)' fitness-v2/evidence/candidate-51013-build.log | tail -120 > fitness-v2/evidence/candidate-51013-errors.txt || true
            exit "$build_status"
          fi
          APK=fitness-v2/android/app/build/outputs/apk/debug/app-debug.apk
          AAB=fitness-v2/android/app/build/outputs/bundle/release/app-release.aab
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK" && test -s "$AAB"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.topherofit.thf.pulse' versionCode='51013'" /tmp/badging.txt
          grep -F "versionName='5.0.0-v2-alpha13-debug'" /tmp/badging.txt
          sha256sum "$APK" "$AAB" | tee fitness-v2/candidate-51013.sha256
          printf 'GIT_SHA=%s\nVERSION_CODE=51013\n' "$GITHUB_SHA" | tee fitness-v2/candidate-51013-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-activity-candidate-51013
          if-no-files-found: warn
          retention-days: 14
          path: |
            fitness-v2/android/app/build/outputs/apk/debug/app-debug.apk
            fitness-v2/android/app/build/outputs/bundle/release/app-release.aab
            fitness-v2/android/app/build/reports/
            fitness-v2/evidence/candidate-51013-build.log
            fitness-v2/evidence/candidate-51013-errors.txt
            fitness-v2/candidate-51013.sha256
            fitness-v2/candidate-51013-build.txt
