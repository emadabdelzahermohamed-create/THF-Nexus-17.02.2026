name: Fitness Sensor Candidate Build

on:
  push:
    branches:
      - feature/fitness-trust-core-20261022
    paths:
      - 'fitness-v2/**'
      - '.github/workflows/fitness-sensor-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-sensor-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test lint and build candidate 51008
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p fitness-v2/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
          APK=fitness-v2/android/app/build/outputs/apk/debug/app-debug.apk
          AAB=fitness-v2/android/app/build/outputs/bundle/release/app-release.aab
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK" && test -s "$AAB"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.topherofit.thf.pulse' versionCode='51008'" /tmp/badging.txt
          grep -F "versionName='5.0.0-v2-alpha8-debug'" /tmp/badging.txt
          sha256sum "$APK" "$AAB" | tee fitness-v2/candidate-51008.sha256
          printf 'GIT_SHA=%s\nVERSION_CODE=51008\n' "$GITHUB_SHA" | tee fitness-v2/candidate-51008-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-sensor-candidate-51008
          if-no-files-found: error
          retention-days: 14
          path: |
            fitness-v2/android/app/build/outputs/apk/debug/app-debug.apk
            fitness-v2/android/app/build/outputs/bundle/release/app-release.aab
            fitness-v2/android/app/build/reports/
            fitness-v2/candidate-51008.sha256
            fitness-v2/candidate-51008-build.txt
