name: THF Learn Fitness Source Structure V1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-learn-fitness-source-structure-v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify SHAs and inventory disposable clean extracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='python3 -' > out/source-structure.json <<'PY'
          import hashlib,json,pathlib,tempfile,zipfile,collections,re
          home=pathlib.Path.home()
          cases={
            'learn':(home/'thf-small-learn-games/source.zip','ce8547851c9573db02603ea6f11e020a1b7d346af0cac51e07947304f1a7c1f9'),
            'fitness':(home/'thf-small-fitness-games/source.zip','cf5d73c3a03ab503dbd7c36a2d4db3ec1449ec8281304627b9463e2cb8732a25')}
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          out={'schema':'thf-learn-fitness-source-structure-v1','read_only':True,'wave_files_read_or_changed':False,'cases':{}}
          for name,(zp,expected) in cases.items():
            assert zp.is_file(); actual=sha(zp); assert actual==expected,(name,actual)
            with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); assert bad is None,(name,bad)
              names=[n for n in z.namelist() if not n.endswith('/')]
              # Path-only inventory: no arbitrary source contents, URLs, tokens or credentials are emitted.
              ext=collections.Counter(pathlib.PurePosixPath(n).suffix.lower() or '<none>' for n in names)
              safe=[]
              for n in names:
                ln=n.lower()
                if any(k in ln for k in ('build.gradle','settings.gradle','androidmanifest.xml','gradlew','project.godot','export_presets.cfg','package.json','pyproject.toml','requirements.txt','mainactivity','src/main')):
                  safe.append(n[:240])
              out['cases'][name]={
                'outer_sha256':actual,'zip_integrity':'PASS','file_count':len(names),
                'extensions':dict(ext.most_common(20)),'build_markers':sorted(set(safe))[:120],
                'has_android_gradle':any('build.gradle' in n.lower() for n in names),
                'has_android_manifest':any('androidmanifest.xml' in n.lower() for n in names),
                'has_godot_project':any(n.lower().endswith('project.godot') for n in names),
                'has_web_package':any(n.lower().endswith('package.json') for n in names),
                'engineering_promotion':'NO','device_status':'PENDING','final_status':'NOT_FINAL'}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          x=json.load(open('out/source-structure.json'))
          assert x['read_only'] and not x['wave_files_read_or_changed']
          for n,c in x['cases'].items():
            assert c['zip_integrity']=='PASS'
            print(n,'files=',c['file_count'],'android_gradle=',c['has_android_gradle'],'godot=',c['has_godot_project'],'web=',c['has_web_package'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-LEARN-FITNESS-SOURCE-STRUCTURE-V1
          path: out/
          retention-days: 14
