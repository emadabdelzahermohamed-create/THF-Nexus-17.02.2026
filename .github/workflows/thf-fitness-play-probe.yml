name: THF Fitness Google Play Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-play-probe.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only probe or publish validated Fitness 51007 to Play Internal'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - publish_internal
      source_run_id:
        description: 'GitHub Actions run containing fitness-v2-51007-package-gate (required for publish_internal)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  EXPECTED_FITNESS_UPLOAD_SHA1: D8:BB:CA:BC:17:78:03:43:2E:5D:95:7B:19:61:D2:03:6A:3A:03:06

jobs:
  play-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google with existing WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current Android Publisher state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'probe' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          package='com.topherofit.thf.pulse'
          expected='51007'
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']
          out={'package':package,'expectedVersionCode':expected,'tracks':[]}
          try:
            tracks=api.edits().tracks().list(packageName=package,editId=edit).execute().get('tracks',[]) or []
            versions=set()
            for track in tracks:
              releases=[]
              for r in track.get('releases',[]) or []:
                codes=[str(v) for v in (r.get('versionCodes',[]) or [])]
                versions.update(codes)
                releases.append({'name':r.get('name'),'status':r.get('status'),'versionCodes':codes})
              if releases: out['tracks'].append({'track':track.get('track'),'releases':releases})
            out['existingVersionCodes']=sorted(versions,key=int)
            out['version_51007_already_present']=expected in versions
          finally:
            api.edits().delete(packageName=package,editId=edit).execute()
          print(json.dumps(out,indent=2))
          with open('fitness-play-probe.json','w') as f: json.dump(out,f,indent=2)
          PY
      - name: Download and validate exact Fitness 51007 artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish_internal' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          mkdir -p candidate play-evidence
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" -n fitness-v2-51007-package-gate -D candidate
          AAB="$(find candidate -type f -path '*/bundle/release/app-release.aab' | head -n1)"
          SIGNING_STATUS="$(find candidate -type f -name aab-signing-status.txt | head -n1)"
          BADGING="$(find candidate -type f -name badging.txt | head -n1)"
          test -s "$AAB"; test -s "$SIGNING_STATUS"; test -s "$BADGING"
          grep -F "versionCode='51007'" "$BADGING"
          grep -F "targetSdkVersion:'36'" "$BADGING"
          grep -Eq '^PRODUCTION_SIGNING=PASS_(PLAY_BOUND_FITNESS_UPLOAD_KEY|EXISTING_UPLOAD_KEY)$' "$SIGNING_STATUS"
          jarsigner -verify -verbose -certs "$AAB" > play-evidence/aab-jarsigner.txt 2>&1
          grep -F 'jar verified.' play-evidence/aab-jarsigner.txt
          keytool -printcert -jarfile "$AAB" > play-evidence/aab-signer-cert.txt
          grep -F "SHA1: $EXPECTED_FITNESS_UPLOAD_SHA1" play-evidence/aab-signer-cert.txt
          sha256sum "$AAB" | tee play-evidence/aab.sha256
          BUNDLETOOL_VERSION=1.18.3
          BUNDLETOOL_SHA256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          curl -fsSL "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" -o "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB" | tee play-evidence/bundletool-validate.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > play-evidence/manifest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('play-evidence/manifest.xml').getroot(); a='{http://schemas.android.com/apk/res/android}'
          package=root.attrib.get('package'); vc=root.attrib.get(a+'versionCode'); uses=root.find('uses-sdk'); target=uses.attrib.get(a+'targetSdkVersion') if uses is not None else None
          if package!='com.topherofit.thf.pulse' or vc!='51007' or target!='36': raise SystemExit(f'identity mismatch package={package} vc={vc} target={target}')
          PY
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          printf 'candidate_package=com.topherofit.thf.pulse\ncandidate_versionCode=51007\ncandidate_targetSdk=36\nsource_run_id=%s\n' "$SOURCE_RUN_ID" > play-evidence/candidate-gate.txt
      - name: Publish validated Fitness 51007 to Google Play Internal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish_internal' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AAB_PATH"
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json,os
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          package='com.topherofit.thf.pulse'; expected_version='51007'; track_name='internal'; aab=os.environ['AAB_PATH']
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          result={'package':package,'expected_versionCode':expected_version,'track':track_name,'committed':False}
          edit=None
          try:
            edit=api.edits().insert(packageName=package,body={}).execute()['id']
            tracks=api.edits().tracks().list(packageName=package,editId=edit).execute().get('tracks',[]) or []
            all_versions=set(); internal_has=False
            for t in tracks:
              for r in t.get('releases',[]) or []:
                codes={str(v) for v in (r.get('versionCodes',[]) or [])}; all_versions.update(codes)
                if t.get('track')==track_name and expected_version in codes: internal_has=True
            if internal_has:
              result.update({'already_published':True,'versionCode':expected_version,'committed':True})
              api.edits().delete(packageName=package,editId=edit).execute(); edit=None
            elif expected_version in all_versions:
              raise RuntimeError(f'versionCode {expected_version} exists on another track')
            else:
              bundle=api.edits().bundles().upload(packageName=package,editId=edit,media_body=MediaFileUpload(aab,mimetype='application/octet-stream',resumable=True)).execute()
              uploaded=str(bundle['versionCode'])
              if uploaded!=expected_version: raise RuntimeError(f'uploaded {uploaded} != {expected_version}')
              api.edits().tracks().update(packageName=package,editId=edit,track=track_name,body={'releases':[{'versionCodes':[uploaded],'status':'completed','name':'THF Fitness 51007 Internal'}]}).execute()
              api.edits().commit(packageName=package,editId=edit).execute(); edit=None
              result.update({'versionCode':uploaded,'committed':True})
          finally:
            if edit:
              try: api.edits().delete(packageName=package,editId=edit).execute()
              except Exception: pass
          print(json.dumps(result,indent=2))
          with open('play-evidence/PLAY_INTERNAL_UPLOAD.json','w') as f: json.dump(result,f,indent=2)
          if not result.get('committed'): raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-fitness-play-gate-evidence
          path: |
            fitness-play-probe.json
            play-evidence/
          if-no-files-found: ignore
          retention-days: 14
