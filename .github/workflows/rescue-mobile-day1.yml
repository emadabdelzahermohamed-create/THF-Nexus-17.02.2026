name: One Day Mobile Rescue
on:
  push:
    branches: ['rescue/one-day-mobile-20261014']
    paths:
      - 'rescue-mobile/**'
      - '.github/workflows/rescue-mobile-day1.yml'
      - 'ReleaseOps/RESCUE_MOBILE_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prove Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Unit tests
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:testHubDebugUnitTest
      - name: Build all phone-test APKs
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify expected APK count, launchers, and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf phone-test
          mkdir -p phone-test
          find rescue-mobile/app/build/outputs/apk -type f -name '*.apk' -exec cp {} phone-test/ \;
          count=$(find phone-test -maxdepth 1 -name '*.apk' | wc -l)
          test "$count" -eq 9
          for apk in phone-test/*.apk; do
            echo "VERIFY $apk"
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "package: name='com.topherofit." <<<"$badging"
            grep -q "launchable-activity:" <<<"$badging"
          done
          (cd phone-test && sha256sum *.apk > SHA256SUMS.txt)
          cat phone-test/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: THF-one-day-mobile-rescue-phone-test
          path: phone-test/
          retention-days: 30

  canonical-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
      GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prove Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Fetch exact canonical sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p canonical-input canonical-work canonical-out evidence
          cat > specs <<'EOF'
          Forge THF_Forge_PHONE_FUNDAMENTALS_SRC3.zip 1Fdx6knYWGLAQ7dYnDH5dGu-j8qF32A6E 75c3744af31f16273a174bdac53b9e812613e4d9ef8c2fa260521c7f7c40cbf8
          Echo THF_Echo_PHONE_FUNDAMENTALS_SRC3.zip 1YnRTB_CSUwd7q6myLKkG2Pi_3qJ_A3Vw 3c90b53009d34e9c391bc8f977daf70195a041ba6c0098eca82709932b8734e9
          Codex THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip 1wHhUcCZKvUmxIFOkzSFwqc8QDslW2brn 44ff76cca12b6b13febc53e9e0b8748a01949eb07c40b020d76b82f45a094950
          Vault THF_Vault_PHONE_FUNDAMENTALS_SRC3.zip 1gqG6UVCA4CkpEJpF7fDO5kq2kF-o6cJ7 e33c7c7f1f6d7f913dfe6ca5d674aff2883f7a230c2a323724088c30c4497585
          Signal THF_Signal_PHONE_FUNDAMENTALS_SRC3.zip 10qPO33KG8lL7KWKmoRO2nxJDZSj4eSw4 3b6ba96076decd62e31a90c60d91a101806d6a6e9be329a58baa55ece82227ef
          Command THF_Command_PHONE_FUNDAMENTALS_SRC3.zip 1JtABZ7SNGuJ5jKoYc2xlj5f2nSvdBs2y 314a89f33f62d754edc9cc369fcc35b019d6081c6be0dcfbffa0fe5801ce0ffc
          EOF
          token=$(gcloud auth print-access-token)
          : > evidence/source-verification.txt
          while read -r app name id want; do
            code=$(curl -sS -L --retry 2 --connect-timeout 15 -o "canonical-input/$name" -w '%{http_code}' -H "Authorization: Bearer $token" "https://www.googleapis.com/drive/v3/files/${id}?alt=media" || true)
            got=$(sha256sum "canonical-input/$name" | awk '{print $1}')
            echo "$app http=$code expected=$want actual=$got" | tee -a evidence/source-verification.txt
            test "$code" = 200
            test "$got" = "$want"
            unzip -tq "canonical-input/$name" >/dev/null
          done < specs
      - name: Compile every canonical Android source
        shell: bash
        run: |
          set -u
          : > evidence/build-report.txt
          while read -r app name id want; do
            work="canonical-work/$app"
            out="canonical-out/$app"
            rm -rf "$work" "$out"
            mkdir -p "$work" "$out"
            unzip -q "canonical-input/$name" -d "$work"
            wrapper=$(find "$work" -type f -name gradlew -print -quit || true)
            build=$(find "$work" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit || true)
            status=NO_BUILD_ENTRYPOINT
            if [[ -n "$wrapper" ]]; then
              project=$(dirname "$wrapper")
              chmod +x "$wrapper"
              (cd "$project" && ./gradlew --no-daemon test assembleDebug)
              rc=$?
              [[ $rc -eq 0 ]] && status=BUILD_OK || status=BUILD_FAILED
            elif [[ -n "$build" ]]; then
              project=$(dirname "$build")
              (cd "$project" && gradle --no-daemon test assembleDebug)
              rc=$?
              [[ $rc -eq 0 ]] && status=BUILD_OK || status=BUILD_FAILED
            fi
            find "$work" -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | while IFS= read -r -d '' f; do cp "$f" "$out/$(basename "$f")"; done
            count=$(find "$out" -type f \( -name '*.apk' -o -name '*.aab' \) | wc -l)
            echo "$app status=$status outputs=$count wrapper=${wrapper:-none} build=${build:-none}" | tee -a evidence/build-report.txt
          done < specs
          true
      - name: Verify recovered packages and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          : > evidence/package-verification.txt
          outputs=0
          while IFS= read -r -d '' file; do
            outputs=$((outputs+1))
            sha=$(sha256sum "$file" | awk '{print $1}')
            if [[ "$file" == *.apk ]]; then
              badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$file")
              package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)
              launcher=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)
              test -n "$package"
              test -n "$launcher"
              echo "APK file=$file package=$package launcher=$launcher sha256=$sha" | tee -a evidence/package-verification.txt
            else
              unzip -tq "$file" >/dev/null
              echo "AAB file=$file sha256=$sha" | tee -a evidence/package-verification.txt
            fi
          done < <(find canonical-out -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          echo "TOTAL_OUTPUTS=$outputs" | tee -a evidence/package-verification.txt
          test "$outputs" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THF-canonical-legacy-android-artifacts
          path: |
            canonical-out/
            evidence/
          if-no-files-found: warn
          retention-days: 30
