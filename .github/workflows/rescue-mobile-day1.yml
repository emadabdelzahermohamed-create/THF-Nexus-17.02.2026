name: One Day Mobile Rescue
on:
  push:
    branches: ['rescue/one-day-mobile-20261014']
    paths:
      - 'rescue-mobile/**'
      - '.github/workflows/rescue-mobile-day1.yml'
      - 'ReleaseOps/RESCUE_MOBILE_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prove Android SDK and install API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Unit tests
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:testHubDebugUnitTest
      - name: Build all phone-test APKs
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify expected APK count and checksums
        run: |
          set -Eeuo pipefail
          mkdir -p phone-test
          find rescue-mobile/app/build/outputs/apk -type f -name '*.apk' -exec cp {} phone-test/ \;
          count=$(find phone-test -maxdepth 1 -name '*.apk' | wc -l)
          test "$count" -eq 9
          (cd phone-test && sha256sum *.apk > SHA256SUMS.txt)
          cat phone-test/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: THF-one-day-mobile-rescue-phone-test
          path: phone-test/
          retention-days: 30
