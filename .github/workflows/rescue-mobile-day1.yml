name: One Day Mobile Rescue
on:
  push:
    branches: ['rescue/one-day-mobile-20261014']
    paths:
      - 'rescue-mobile/**'
      - '.github/workflows/rescue-mobile-day1.yml'
      - 'ReleaseOps/RESCUE_MOBILE_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prove Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Unit tests
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:testHubDebugUnitTest
      - name: Build all phone-test APKs
        working-directory: rescue-mobile
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify expected APK count, launchers, and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf phone-test
          mkdir -p phone-test
          find rescue-mobile/app/build/outputs/apk -type f -name '*.apk' -exec cp {} phone-test/ \;
          count=$(find phone-test -maxdepth 1 -name '*.apk' | wc -l)
          test "$count" -eq 9
          for apk in phone-test/*.apk; do
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "package: name='com.topherofit." <<<"$badging"
            grep -q "launchable-activity:" <<<"$badging"
          done
          (cd phone-test && sha256sum *.apk > SHA256SUMS.txt)
          cat phone-test/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: THF-one-day-mobile-rescue-phone-test
          path: phone-test/
          retention-days: 30

  canonical-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
      GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
      GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - id: gcp-auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/drive.readonly
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prove Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Fetch exact canonical sources
        shell: bash
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          mkdir -p canonical-input canonical-work canonical-out evidence
          cat > specs <<'EOF'
          Forge THF_Forge_PHONE_FUNDAMENTALS_SRC3.zip 1Fdx6knYWGLAQ7dYnDH5dGu-j8qF32A6E 75c3744af31f16273a174bdac53b9e812613e4d9ef8c2fa260521c7f7c40cbf8 launchable
          Echo THF_Echo_PHONE_FUNDAMENTALS_SRC3.zip 1YnRTB_CSUwd7q6myLKkG2Pi_3qJ_A3Vw 3c90b53009d34e9c391bc8f977daf70195a041ba6c0098eca82709932b8734e9 launchable
          Codex THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip 1wHhUcCZKvUmxIFOkzSFwqc8QDslW2brn 44ff76cca12b6b13febc53e9e0b8748a01949eb07c40b020d76b82f45a094950 launchable
          Vault THF_Vault_PHONE_FUNDAMENTALS_SRC3.zip 1gqG6UVCA4CkpEJpF7fDO5kq2kF-o6cJ7 e33c7c7f1f6d7f913dfe6ca5d674aff2883f7a230c2a323724088c30c4497585 launchable
          Signal THF_Signal_PHONE_FUNDAMENTALS_SRC3.zip 10qPO33KG8lL7KWKmoRO2nxJDZSj4eSw4 3b6ba96076decd62e31a90c60d91a101806d6a6e9be329a58baa55ece82227ef headless
          Command THF_Command_PHONE_FUNDAMENTALS_SRC3.zip 1JtABZ7SNGuJ5jKoYc2xlj5f2nSvdBs2y 314a89f33f62d754edc9cc369fcc35b019d6081c6be0dcfbffa0fe5801ce0ffc launchable
          EOF
          : > evidence/source-verification.txt
          while read -r app name id want mode; do
            code=$(curl -sS -L --retry 2 --connect-timeout 15 -o "canonical-input/$name" -w '%{http_code}' -H "Authorization: Bearer $DRIVE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/${id}?alt=media" || true)
            got=$(sha256sum "canonical-input/$name" | awk '{print $1}')
            echo "$app http=$code expected=$want actual=$got mode=$mode" | tee -a evidence/source-verification.txt
            test "$code" = 200
            test "$got" = "$want"
            unzip -tq "canonical-input/$name" >/dev/null
          done < specs
      - name: Compile every canonical Android source
        shell: bash
        run: |
          set -Eeuo pipefail
          : > evidence/build-report.txt
          while read -r app name id want mode; do
            work="canonical-work/$app"; out="canonical-out/$app"
            rm -rf "$work" "$out"; mkdir -p "$work" "$out"
            unzip -q "canonical-input/$name" -d "$work"
            wrapper=$(find "$work" -type f -name gradlew -print -quit || true)
            build=$(find "$work" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit || true)
            test -n "$wrapper$build"
            if [[ -n "$wrapper" ]]; then project=$(dirname "$wrapper"); chmod +x "$wrapper"; (cd "$project" && ./gradlew --no-daemon test assembleDebug); else project=$(dirname "$build"); (cd "$project" && gradle --no-daemon test assembleDebug); fi
            find "$work" -type f -name '*.apk' -print0 | while IFS= read -r -d '' f; do cp "$f" "$out/$(basename "$f")"; done
            count=$(find "$out" -type f -name '*.apk' | wc -l)
            test "$count" -gt 0
            echo "$app status=BUILD_OK outputs=$count mode=$mode" | tee -a evidence/build-report.txt
          done < specs
      - name: Verify recovered packages, component mode, target SDK and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          : > evidence/package-verification.txt
          while read -r app name id want mode; do
            apk=$(find "canonical-out/$app" -type f -name '*.apk' -print -quit)
            test -n "$apk"
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)
            launcher=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)
            target=$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)
            sha=$(sha256sum "$apk" | awk '{print $1}')
            test -n "$package"
            test "$target" = 36
            if [[ "$mode" = launchable ]]; then test -n "$launcher"; else test -z "$launcher"; fi
            echo "APK app=$app mode=$mode package=$package targetSdk=$target launcher=${launcher:-NONE} sha256=$sha" | tee -a evidence/package-verification.txt
          done < specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THF-canonical-legacy-android-artifacts
          path: |
            canonical-out/
            evidence/
          if-no-files-found: error
          retention-days: 30
