name: THF Game Backend Authority Static V2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-game-backend-authority-static-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  authority-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read-only mutation-handler authority signal audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='python3 -' > out/authority-static.raw <<'PY'
          import ast,hashlib,json,pathlib
          root=pathlib.Path.home()/"thf-runtime-s1/runtime/THF_NEXUS_6_FINAL/src"
          assert root.is_dir()
          mutation_methods={'POST','PUT','PATCH','DELETE'}
          sensitive=('world','arena','social','econom','wallet','leader','rank','inventory','avatar','fishing','competition','fitness')
          auth_words=('auth','token','session','user','identity','principal','claim','require','permission','scope','verify')
          files=[]; parsed=[]; defs={}
          def identifiers(node):
              ids=set()
              for x in ast.walk(node):
                  if isinstance(x,ast.Name): ids.add(x.id.lower())
                  elif isinstance(x,ast.Attribute): ids.add(x.attr.lower())
              return ids
          def markers_for(node):
              ids=identifiers(node)
              return sorted({w for w in auth_words if any(w in i for i in ids)})
          def dotted(node):
              if isinstance(node,ast.Name): return node.id
              if isinstance(node,ast.Attribute):
                  p=dotted(node.value); return (p+'.' if p else '')+node.attr
              return ''
          def const_str(node): return node.value if isinstance(node,ast.Constant) and isinstance(node.value,str) else None
          def method_list(node):
              if isinstance(node,(ast.List,ast.Tuple,ast.Set)):
                  return [x.value.upper() for x in node.elts if isinstance(x,ast.Constant) and isinstance(x.value,str)]
              s=const_str(node); return [s.upper()] if s else []
          for p in sorted(root.rglob('*.py')):
              rel=p.relative_to(root).as_posix()
              if 'wave' in rel.lower(): continue
              try: text=p.read_text(errors='ignore'); tree=ast.parse(text)
              except (OSError,SyntaxError): continue
              files.append((rel,text.encode())); parsed.append((rel,tree))
              for n in ast.walk(tree):
                  if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      defs.setdefault(n.name,[]).append((rel,n,markers_for(n)))
          rows=[]
          for rel,tree in parsed:
              # Decorator registrations: @app.post('/api/...')
              for fn in [n for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]:
                  local_markers=markers_for(fn)
                  for dec in fn.decorator_list:
                      if not isinstance(dec,ast.Call) or not dec.args: continue
                      method=getattr(dec.func,'attr','').upper()
                      path=const_str(dec.args[0])
                      if method not in mutation_methods or not path or not any(k in path.lower() for k in sensitive): continue
                      rows.append({'registration':'decorator','file':rel,'method':method,'path':path,'handler':fn.name,'handler_source_file':rel,'auth_guard_signal':bool(local_markers),'auth_marker_classes':local_markers})
              # Programmatic registrations: app.add_api_route('/api/...', handler, methods=['POST'])
              for call in [n for n in ast.walk(tree) if isinstance(n,ast.Call)]:
                  if getattr(call.func,'attr','') != 'add_api_route' or len(call.args)<2: continue
                  path=const_str(call.args[0]); handler=dotted(call.args[1]).split('.')[-1]
                  if not path or not handler or not any(k in path.lower() for k in sensitive): continue
                  methods=[]
                  for kw in call.keywords:
                      if kw.arg=='methods': methods=method_list(kw.value)
                  if not methods: methods=['GET']
                  registrations=markers_for(call)
                  candidates=defs.get(handler,[])
                  handler_markers=sorted(set(registrations).union(*(set(m) for _,_,m in candidates))) if candidates else registrations
                  handler_file=candidates[0][0] if candidates else 'imported_or_dynamic'
                  for method in methods:
                      if method not in mutation_methods: continue
                      rows.append({'registration':'add_api_route','file':rel,'method':method,'path':path,'handler':handler,'handler_source_file':handler_file,'auth_guard_signal':bool(handler_markers),'auth_marker_classes':handler_markers})
          uniq=[]; seen=set()
          for r in rows:
              key=(r['method'],r['path'],r['handler'])
              if key not in seen: seen.add(key); uniq.append(r)
          h=hashlib.sha256()
          for rel,b in files: h.update(rel.encode()+b'\0'+b)
          missing=[r for r in uniq if not r['auth_guard_signal']]
          out={'schema':'thf-game-backend-authority-static-v2','runtime_source_sha256':h.hexdigest(),'sensitive_mutation_route_count':len(uniq),'auth_guard_signal_count':len(uniq)-len(missing),'missing_handler_guard_signal_count':len(missing),'routes':uniq,'interpretation':'static handler/registration signal only; middleware/global dependencies may supply additional authority and dynamic proof remains required','read_only':True,'host_values_emitted':False,'secrets_emitted':False,'wave_files_read_or_changed':False}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json,pathlib
          raw=pathlib.Path('out/authority-static.raw').read_text(errors='ignore'); start=raw.find('{'); assert start>=0
          x=json.loads(raw[start:]); pathlib.Path('out/authority-static.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          assert x['read_only'] is True and x['host_values_emitted'] is False and x['secrets_emitted'] is False and x['wave_files_read_or_changed'] is False
          assert x['sensitive_mutation_route_count'] > 0, 'parser found no sensitive mutation routes; authority audit blind spot'
          print('SENSITIVE_MUTATION_ROUTES='+str(x['sensitive_mutation_route_count']))
          print('HANDLER_AUTH_GUARD_SIGNALS='+str(x['auth_guard_signal_count']))
          print('HANDLERS_WITHOUT_LOCAL_GUARD_SIGNAL='+str(x['missing_handler_guard_signal_count']))
          print('DYNAMIC_AUTHORITY_PROOF_REQUIRED=YES')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-GAME-BACKEND-AUTHORITY-STATIC-V2
          path: out/
          retention-days: 14
