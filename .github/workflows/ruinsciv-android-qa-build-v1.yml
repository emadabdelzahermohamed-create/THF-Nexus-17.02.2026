name: RuinsCiv Android QA Build V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ruinsciv-android-qa-build-v1.yml'
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  build:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with: {persist-credentials: false}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - name: Build and validate RuinsCiv QA APK on builder
        id: remote
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command='bash -s' <<'REMOTE'
          set -Eeuo pipefail
          C="$HOME/ruinsciv-candidate"; O="$HOME/ruinsciv-qa-build-v1"
          rm -rf "$O"; mkdir -p "$O"; cd "$C"
          GODOT="$(command -v godot4 || command -v godot || true)"
          if [[ -z "$GODOT" ]]; then
            while IFS= read -r x; do [[ -x "$x" ]] && "$x" --version 2>/dev/null | grep -q '^4\.7\.2' && { GODOT="$x"; break; }; done < <(find "$HOME" /opt /usr/local -maxdepth 7 -type f \( -name 'godot*' -o -name 'Godot*' \) -perm -111 2>/dev/null | sort)
          fi
          [[ -n "$GODOT" ]] || { echo GODOT_4_7_2_NOT_FOUND | tee "$O/build-failure.txt"; exit 61; }
          "$GODOT" --version | tee "$O/godot-version.txt"; grep -q '^4\.7\.2' "$O/godot-version.txt" || exit 62
          printf '%s\n' "$GODOT" > "$O/godot-path.txt"
          SDK=""
          for p in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" "$HOME/android-sdk" "$HOME/thf-builder-rc16-build/android-sdk" /opt/android-sdk /usr/local/lib/android/sdk; do [[ -n "$p" && -d "$p/platforms/android-36" ]] && { SDK="$p"; break; }; done
          [[ -n "$SDK" ]] || { echo ANDROID_API36_SDK_NOT_FOUND | tee "$O/build-failure.txt"; exit 72; }
          mkdir -p "$SDK/build-tools"
          if ! find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -111 | grep -q .; then
            OTHER_BT="$(find "$HOME" /opt /usr/local -type f -path '*/build-tools/*/apksigner' -perm -111 2>/dev/null | grep -v "^$SDK/" | sort -V | tail -1 || true)"
            if [[ -n "$OTHER_BT" ]]; then SRC_BT="$(dirname "$OTHER_BT")"; cp -a "$SRC_BT" "$SDK/build-tools/$(basename "$SRC_BT")"; else SDKMANAGER="$(find "$SDK" "$HOME" /opt /usr/local -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"; [[ -n "$SDKMANAGER" ]] || exit 76; yes | "$SDKMANAGER" --sdk_root="$SDK" 'platform-tools' 'build-tools;36.0.0' | tee "$O/sdkmanager-build-tools.log"; fi
          fi
          [[ -x "$SDK/platform-tools/adb" ]] || { echo ANDROID_PLATFORM_TOOLS_MISSING | tee "$O/build-failure.txt"; exit 79; }
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -1 || true)"; [[ -n "$APKSIGNER" ]] || exit 77
          AAPT="$(find "$SDK/build-tools" -type f \( -name aapt2 -o -name aapt \) -perm -111 2>/dev/null | sort -V | tail -1 || true)"; [[ -n "$AAPT" ]] || exit 77
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          JAVA="$(command -v javac || true)"; [[ -n "$JAVA" ]] || exit 74; JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVA")")")"; export JAVA_HOME
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"; mkdir -p "$(dirname "$SETTINGS")"
          timeout 30s "$GODOT" --headless --editor --quit >/dev/null 2>&1 || true
          [[ -f "$SETTINGS" ]] || { echo GODOT_EDITOR_SETTINGS_NOT_CREATED | tee "$O/build-failure.txt"; exit 80; }
          python3 - "$SETTINGS" "$SDK" "$JAVA_HOME" <<'PY'
          import sys,re
          p,sdk,jdk=sys.argv[1:]; t=open(p,encoding='utf-8').read()
          for k,v in [('export/android/android_sdk_path',sdk),('export/android/java_sdk_path',jdk)]:
              line=f'{k} = "{v}"'; t=re.sub(rf'(?m)^{re.escape(k)}\s*=.*$',line,t) if re.search(rf'(?m)^{re.escape(k)}\s*=',t) else t.rstrip()+'\n'+line+'\n'
          open(p,'w',encoding='utf-8').write(t)
          PY
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$SETTINGS" | tee "$O/godot-android-settings.txt"
          [[ -f export_presets.cfg ]] || exit 63; grep -q 'com.topherofit.ruins.civ.phoneqa' export_presets.cfg || exit 64; PRESET="$(awk -F'"' '/^name=/{print $2; exit}' export_presets.cfg)"; [[ -n "$PRESET" ]] || exit 65
          timeout 20m "$GODOT" --headless --path "$C" --editor --quit 2>&1 | tee "$O/godot-import.log" || exit ${PIPESTATUS[0]}
          if [[ ! -f "$C/android/build/build.gradle" && ! -f "$C/android/build/build.gradle.kts" ]]; then
            echo 'No RuinsCiv-local Android Gradle template; legacy THF/Terra/WAVE template reuse is forbidden.' | tee "$O/android-template-restore.log"
            TPL_ZIP="$(find "$HOME" /opt /usr/local -type f \( -iname '*android*template*.zip' -o -iname '*android*template*.tpz' -o -iname '*export*templates*.tpz' \) 2>/dev/null | grep -Ei '4[._-]?7[._-]?2|godot' | grep -Eiv 'terra|thf|wave' | head -1 || true)"
            if [[ -n "$TPL_ZIP" ]]; then
              rm -rf "$O/template-unpack"; mkdir -p "$O/template-unpack"; unzip -q "$TPL_ZIP" -d "$O/template-unpack" || true
              SRC="$(find "$O/template-unpack" -type f \( -name build.gradle -o -name build.gradle.kts \) | grep '/android/' | head -1 | xargs -r dirname)"
              if [[ -n "$SRC" ]]; then while [[ "$SRC" != "$O/template-unpack" && ! -f "$SRC/settings.gradle" && ! -f "$SRC/settings.gradle.kts" ]]; do SRC="$(dirname "$SRC")"; done; mkdir -p "$C/android/build"; cp -a "$SRC"/. "$C/android/build"/; echo "restored_archive=$TPL_ZIP" | tee -a "$O/android-template-restore.log"; fi
            fi
            [[ -f "$C/android/build/build.gradle" || -f "$C/android/build/build.gradle.kts" ]] || { echo GODOT_ANDROID_TEMPLATE_4_7_2_NOT_FOUND | tee "$O/build-failure.txt"; exit 78; }
          fi
          ! grep -REiq 'com\.topherofit\.thf\.terra|THF World|WAVE_MAWJA|wave-mawja' "$C/android/build" || { echo FORBIDDEN_LEGACY_ANDROID_TEMPLATE_IDENTITY | tee "$O/build-failure.txt"; exit 81; }
          timeout 45m "$GODOT" --headless --path "$C" --export-debug "$PRESET" "$O/RuinsCiv-QA-arm64.apk" 2>&1 | tee "$O/godot-export.log" || { rc=${PIPESTATUS[0]}; echo GODOT_EXPORT_FAILED_RC_$rc | tee "$O/build-failure.txt"; exit $rc; }
          [[ -s "$O/RuinsCiv-QA-arm64.apk" ]] || exit 66
          sha256sum "$O/RuinsCiv-QA-arm64.apk" | tee "$O/RuinsCiv-QA-arm64.apk.sha256"
          "$AAPT" dump badging "$O/RuinsCiv-QA-arm64.apk" > "$O/aapt-badging.txt"
          grep -q "package: name='com.topherofit.ruins.civ.phoneqa'" "$O/aapt-badging.txt" || exit 67; grep -q "targetSdkVersion:'36'" "$O/aapt-badging.txt" || exit 68; grep -q "native-code:.*'arm64-v8a'" "$O/aapt-badging.txt" || exit 69
          unzip -l "$O/RuinsCiv-QA-arm64.apk" > "$O/apk-file-list.txt"; ! grep -Eiq 'thf_humanoid_v[1-6]|com\.topherofit\.thf\.terra|THF World' "$O/apk-file-list.txt" || exit 70
          grep -Ei 'thf_mpfb_stage16a_ual12_animated|stage16e_avatar|wardrobe|shoe|hair|runtime_pbr' "$O/apk-file-list.txt" > "$O/required-asset-hits.txt" || true; [[ -s "$O/required-asset-hits.txt" ]] || exit 71
          printf 'RUINSCIV_QA_BUILD=PASS\npackage=com.topherofit.ruins.civ.phoneqa\ngodot=4.7.2\ntarget_sdk=36\nabi=arm64-v8a\nphysical_device_status=PENDING\nfinal_or_play_ready=FALSE\n' > "$O/RUINSCIV_QA_BUILD_EVIDENCE.txt"
          REMOTE
          rc=$?; set -e; echo "remote_rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Collect QA build evidence and APK
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ruinsciv-qa"
          gcloud compute scp --recurse "$GCP_BUILDER:ruinsciv-qa-build-v1" "$RUNNER_TEMP/ruinsciv-qa/" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
      - name: Upload QA APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RuinsCiv-QA-APK-V1-${{ github.run_id }}
          path: ${{ runner.temp }}/ruinsciv-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce remote build result
        if: always()
        run: |
          rc='${{ steps.remote.outputs.remote_rc }}'; echo "RUINSCIV_QA_REMOTE_RC=$rc"; test -n "$rc" && test "$rc" = 0
