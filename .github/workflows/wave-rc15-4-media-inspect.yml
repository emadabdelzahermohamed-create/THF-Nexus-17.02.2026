name: WAVE RC15.4 Media Pipeline Inspect

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-4-media-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DRIVE_FILE_ID: 1B35W6nyNlhpJCv0wjRXleNRXWuoVOn16
  EXPECTED_RC15_SHA256: 71965ff9ed3405304743b4014cbbac269b96d83533557f28381781e67520d41f
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Reconstruct exact deployed WAVE source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import os, requests, google.auth
          from google.auth.transport.requests import Request
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          r=requests.get(f"https://www.googleapis.com/drive/v3/files/{os.environ['DRIVE_FILE_ID']}?alt=media",headers={'Authorization':f'Bearer {creds.token}'},timeout=120)
          r.raise_for_status(); open('WAVE_RC15_BASE.zip','wb').write(r.content)
          PY
          echo "$EXPECTED_RC15_SHA256  WAVE_RC15_BASE.zip" | sha256sum -c -
          mkdir wave-src && unzip -q WAVE_RC15_BASE.zip -d wave-src
          cd wave-src
          git init -q && git add . && git -c user.name=wave-inspect -c user.email=wave-inspect@example.invalid commit -qm baseline
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          cp -a ../ReleaseOps/WAVE/RC15_3/overlay/. .

      - name: Print current VOD live and ingest integration source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd wave-src
          echo '===== media-server/worker/abr.py ====='
          sed -n '1,260p' media-server/worker/abr.py
          echo '===== media-server/worker/worker.py 220-325 ====='
          sed -n '220,325p' media-server/worker/worker.py
          echo '===== media-server/live-worker/live_worker.py ====='
          sed -n '1,340p' media-server/live-worker/live_worker.py
          echo '===== app/api/control/route.ts 1060-1225 ====='
          sed -n '1060,1225p' app/api/control/route.ts
          echo '===== media-server/api/main.py 1260-1425 ====='
          sed -n '1260,1425p' media-server/api/main.py
          echo '===== browser ingest route ====='
          sed -n '1,220p' app/api/browser-ingest/route.ts
