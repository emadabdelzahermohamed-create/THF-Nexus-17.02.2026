name: Spark RC4 API 36 release candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/spark-api36-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA256: 58a32690ea69b6fd62a977145079e0ad6e75061724a786d5db9276b95ec48d43
  SOURCE_FILE_ID: 1bwvy2huHjkpof3ZcH1QEJK23ep7SKKEm
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download and verify exact RC4 source
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source build/spark
          code="$(curl -sSLo source/spark-rc4.zip -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$SOURCE_FILE_ID?alt=media&supportsAllDrives=true")"
          test "$code" = 200
          echo "$SOURCE_SHA256  source/spark-rc4.zip" | sha256sum -c -
          unzip -tq source/spark-rc4.zip
          unzip -q source/spark-rc4.zip -d build/spark
          ANDROID_DIR="$(find build/spark -type f -path '*/android/settings.gradle' -printf '%h\n' | head -n1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
      - name: Build exact API 36 APK and AAB
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle -p "$ANDROID_DIR" --no-daemon clean assembleRelease bundleRelease
      - name: Verify identity and record hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/release" -name '*.apk' | head -n1)"
          AAB="$(find "$ANDROID_DIR/app/build/outputs/bundle/release" -name '*.aab' | head -n1)"
          test -s "$APK" && test -s "$AAB"
          mkdir -p release
          cp "$APK" release/THF-Spark-RC4-api36.apk
          cp "$AAB" release/THF-Spark-RC4-api36.aab
          sha256sum release/*.apk release/*.aab | tee release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/*.apk | tee release/APK_BADGING.txt
          grep -F "package: name='com.topherofit.thf.spark'" release/APK_BADGING.txt
          grep -F "targetSdkVersion:'36'" release/APK_BADGING.txt

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            release/THF-Spark-RC4-api36.apk | tee release/APK_SIGNING.txt
          if grep -qi 'Android Debug' release/APK_SIGNING.txt; then
            APK_PRODUCTION_SIGNED=FALSE
          else
            APK_PRODUCTION_SIGNED=UNVERIFIED
          fi
          if jarsigner -verify -verbose -certs release/THF-Spark-RC4-api36.aab \
              > release/AAB_SIGNING.txt 2>&1; then
            AAB_SIGNATURE_VALID=TRUE
          else
            AAB_SIGNATURE_VALID=FALSE
          fi

          cat > release/ROLLBACK.txt <<'EOF'
          Keep the immediately previous signed release and its SHA-256.
          Prefer Play staged rollout halt/rollback. Direct APK downgrade is not guaranteed;
          uninstalling can erase app data and therefore requires an explicit owner decision.
          EOF
          printf 'SOURCE_SHA256=%s\nAPK_PRODUCTION_SIGNED=%s\nAAB_SIGNATURE_VALID=%s\nPHYSICAL_PHONE_PASS=FALSE\nPLAY_READY=FALSE\n' \
            "$SOURCE_SHA256" "$APK_PRODUCTION_SIGNED" "$AAB_SIGNATURE_VALID" \
            > release/TRUTH_BOUNDARY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thf-spark-rc4-api36
          path: release/
          if-no-files-found: error
          retention-days: 30
