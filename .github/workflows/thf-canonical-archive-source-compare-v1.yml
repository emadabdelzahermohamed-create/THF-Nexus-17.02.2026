name: THF Canonical Archive Source Compare V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-canonical-archive-source-compare-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Compare runtime to canonical source archive through IAP
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command='set -Eeuo pipefail
            ROOT="$HOME/thf-runtime-s1/runtime/THF_NEXUS_6_FINAL"
            ARCHIVE="$HOME/thf-runtime-s1/outer/01_THF_NEXUS_SUITE/SOURCE/THF_NEXUS_6_FINAL_SOURCE_20260829.zip"
            test -d "$ROOT"; test -f "$ARCHIVE"
            TMP=$(mktemp -d /tmp/thf-canonical-compare-v1.XXXXXX)
            trap "rm -rf \"$TMP\"" EXIT
            echo THF_CANONICAL_ARCHIVE_SOURCE_COMPARE_V1_BEGIN
            echo ARCHIVE_BASENAME=$(basename "$ARCHIVE")
            echo ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk "{print \$1}")
            unzip -q "$ARCHIVE" -d "$TMP/extracted"
            APPFILE=$(find "$TMP/extracted" -type f -path "*/src/thf/app.py" -print -quit)
            test -n "$APPFILE"
            EXROOT=$(dirname "$(dirname "$(dirname "$APPFILE")")")
            test -d "$EXROOT/src"; test -d "$EXROOT/clients"
            make_manifest(){ BASE="$1"; OUT="$2"; : > "$OUT"; find "$BASE/src" "$BASE/clients" -type f -not -path "*/wave-mawja/*" -not -path "*/WAVE_MAWJA/*" -not -path "*/__pycache__/*" -not -name "*.pyc" -not -name "*.pyo" -print0 | while IFS= read -r -d "" f; do rel=${f#"$BASE/"}; printf "%s  %s\n" "$(sha256sum "$f" | awk "{print \$1}")" "$rel"; done | LC_ALL=C sort > "$OUT"; }
            make_manifest "$ROOT" "$TMP/runtime.manifest"
            make_manifest "$EXROOT" "$TMP/archive.manifest"
            RUNTIME_SHA=$(sha256sum "$TMP/runtime.manifest" | awk "{print \$1}")
            ARCHIVE_TREE_SHA=$(sha256sum "$TMP/archive.manifest" | awk "{print \$1}")
            echo RUNTIME_DETERMINISTIC_SOURCE_SHA256=$RUNTIME_SHA
            echo ARCHIVE_DETERMINISTIC_SOURCE_SHA256=$ARCHIVE_TREE_SHA
            if cmp -s "$TMP/runtime.manifest" "$TMP/archive.manifest"; then
              echo RUNTIME_MATCHES_ARCHIVE=TRUE
            else
              echo RUNTIME_MATCHES_ARCHIVE=FALSE
              echo SOURCE_DIFF_BEGIN
              diff -u "$TMP/archive.manifest" "$TMP/runtime.manifest" | grep -E "^[+-][0-9a-f]{64}  " | head -300 || true
              echo SOURCE_DIFF_END
            fi
            echo ARCHIVE_RELEASE_MARKERS_BEGIN
            grep -nE "(__version__|server_version|release.*6\.0\.0|version[[:space:]]*=)" "$EXROOT/pyproject.toml" "$EXROOT/src/thf/__init__.py" "$EXROOT/src/thf/app.py" 2>/dev/null || true
            echo ARCHIVE_RELEASE_MARKERS_END
            echo CHECKSUM_EVIDENCE_BEGIN
            for f in "$HOME/thf-runtime-s1/evidence/outer.sha256" "$HOME/thf-runtime-s1/evidence/inner.sha256"; do if [ -f "$f" ]; then echo FILE=$(basename "$f"); grep -F "$(basename "$ARCHIVE")" "$f" || true; fi; done
            echo CHECKSUM_EVIDENCE_END
            if find "$ROOT" \( -path "*wave-mawja*" -o -path "*WAVE_MAWJA*" \) -print -quit | grep -q .; then echo THF_RUNTIME_WAVE_ISOLATION=FAIL; exit 9; fi
            echo THF_RUNTIME_WAVE_ISOLATION=PASS
            echo CANONICAL_ARCHIVE_MUTATION=FALSE
            echo RUNTIME_MUTATION=FALSE
            echo PRODUCTION_DB_MUTATION=FALSE
            echo PRODUCTION_SIGNING_PERFORMED=FALSE
            echo PLAY_UPLOAD_PERFORMED=FALSE
            echo CLOUDFLARE_PRODUCTION_CUTOVER_PERFORMED=FALSE
            echo SOLANA_FINANCIAL_ACTION_PERFORMED=FALSE
            echo WAVE_UNTOUCHED=TRUE
            echo THF_CANONICAL_ARCHIVE_SOURCE_COMPARE_V1_END'
