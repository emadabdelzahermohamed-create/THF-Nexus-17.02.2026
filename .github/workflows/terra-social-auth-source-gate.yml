name: RuinsCiv Social Auth Source Gate

on:
  push:
    branches:
      - 't/**'
    paths:
      - '.github/workflows/terra-social-auth-source-gate.yml'
      - 'ReleaseOps/scripts/patch_ruinsciv_identity_v1.py'
      - 'ReleaseOps/scripts/patch_terra_social_auth_v1.py'
      - 'ReleaseOps/scripts/test_terra_social_auth_v1.py'
      - 'ReleaseOps/scripts/patch_terra_account_deletion_v1.py'
      - 'ReleaseOps/scripts/test_terra_account_deletion_v1.py'
      - 'ReleaseOps/Terra/social_auth_v1/**'
      - 'ReleaseOps/Terra/account_deletion_v1/**'
  workflow_dispatch:

concurrency:
  group: ruinsciv-gcp-builder-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Stage only Terra auth and account overlays
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_OPS="/tmp/terra-auth-ops-${GITHUB_RUN_ID}"
          REMOTE_TEST="/tmp/terra-auth-test-${GITHUB_RUN_ID}"
          REMOTE_VENV="/tmp/terra-auth-venv-${GITHUB_RUN_ID}"
          echo "REMOTE_OPS=$REMOTE_OPS" >> "$GITHUB_ENV"
          echo "REMOTE_TEST=$REMOTE_TEST" >> "$GITHUB_ENV"
          echo "REMOTE_VENV=$REMOTE_VENV" >> "$GITHUB_ENV"
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="rm -rf '$REMOTE_OPS' '$REMOTE_TEST' '$REMOTE_VENV'; mkdir -p '$REMOTE_OPS/overlay/app' '$REMOTE_OPS/delete-overlay/web/templates'"
          gcloud compute scp \
            ReleaseOps/scripts/patch_ruinsciv_identity_v1.py \
            ReleaseOps/scripts/patch_terra_social_auth_v1.py \
            ReleaseOps/scripts/test_terra_social_auth_v1.py \
            ReleaseOps/scripts/patch_terra_account_deletion_v1.py \
            ReleaseOps/scripts/test_terra_account_deletion_v1.py \
            ReleaseOps/scripts/patch_terra_modern_human_current_source.py \
            ReleaseOps/scripts/verify_terra_modern_human_only.sh \
            "$GCP_BUILDER:$REMOTE_OPS/" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet
          gcloud compute scp \
            ReleaseOps/Terra/social_auth_v1/app/auth_social.py \
            "$GCP_BUILDER:$REMOTE_OPS/overlay/app/auth_social.py" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet
          gcloud compute scp \
            ReleaseOps/Terra/account_deletion_v1/web/templates/account_delete.html \
            "$GCP_BUILDER:$REMOTE_OPS/delete-overlay/web/templates/account_delete.html" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet

      - name: Patch exact current Terra source copy and run source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="set -Eeuo pipefail; SRC=\"\$HOME/thf-terra-rift-staging-apk-v1/terra/work\"; TEST='$REMOTE_TEST'; OPS='$REMOTE_OPS'; VENV='$REMOTE_VENV'; cp -a \"\$SRC\" \"\$TEST\"; cd \"\$TEST\"; python3 \"\$OPS/patch_terra_modern_human_current_source.py\" > \"\$TEST/terra-modern-patch.log\"; THF_TERRA_SOCIAL_AUTH_OVERLAY=\"\$OPS/overlay\" python3 \"\$OPS/patch_terra_social_auth_v1.py\" > \"\$TEST/terra-social-auth-patch.log\"; THF_TERRA_ACCOUNT_DELETE_OVERLAY=\"\$OPS/delete-overlay\" python3 \"\$OPS/patch_terra_account_deletion_v1.py\" > \"\$TEST/terra-account-delete-patch.log\"; THF_TERRA_CANONICAL_AVATAR_SHA256=4f556086e1b7149f6c958f1f399f4368f6ad9b76afd3503d6f848eeeb7bea24f bash \"\$OPS/verify_terra_modern_human_only.sh\" \"\$TEST\"; python3 -m compileall -q app; if command -v node >/dev/null 2>&1; then node --check web/static/game2d.js; node --check web/static/game3d.js; fi; python3 -m venv \"\$VENV\"; \"\$VENV/bin/python\" -m pip install --disable-pip-version-check -q -r requirements.txt; rm -f data/social-auth-gate.db; PYTHONPATH=\"\$TEST\" THF_DATABASE_PATH=data/social-auth-gate.db THF_TOKEN_SECRET=gate-only-secret \"\$VENV/bin/python\" \"\$OPS/test_terra_social_auth_v1.py\"; PYTHONPATH=\"\$TEST\" THF_DATABASE_PATH=data/social-auth-gate.db THF_TOKEN_SECRET=gate-only-secret \"\$VENV/bin/python\" \"\$OPS/test_terra_account_deletion_v1.py\"; grep -q 'func _social_auth_pressed(provider: String)' native/world/WorldMain.gd; grep -q 'func _open_account_delete_page()' native/world/WorldMain.gd; grep -q 'socialProviders' web/templates/index.html; grep -q 'Delete account / حذف الحساب' web/static/game3d.js; GODOT=\"\$HOME/.local/bin/godot-4.7.2\"; test -x \"\$GODOT\"; \"\$GODOT\" --headless --path \"\$TEST\" --import > \"\$TEST/terra-social-auth-godot-import.log\" 2>&1; rc=0; timeout 40s \"\$GODOT\" --headless --path \"\$TEST\" --editor --quit-after 15 > \"\$TEST/terra-social-auth-godot-headless.log\" 2>&1 || rc=\$?; if [ \"\$rc\" -ne 0 ] && [ \"\$rc\" -ne 124 ]; then cat \"\$TEST/terra-social-auth-godot-headless.log\"; exit \"\$rc\"; fi; echo RUINSCIV_SOCIAL_AUTH_AND_ACCOUNT_DELETE_SOURCE_GATE=PASS; echo WAVE_UNTOUCHED=TRUE"

      - name: Cleanup isolated auth gate directories
        if: always()
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="rm -rf '$REMOTE_OPS' '$REMOTE_TEST' '$REMOTE_VENV'" >/dev/null 2>&1
          exit 0
