name: THF Core MobileFix Inspect

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-core-mobilefix-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  CORE_ARTIFACT: THF_Core_RC6_ANDROID_NATIVE_I18N_RELEASE_CUMULATIVE_SOURCE.zip
  CORE_SHA256: 6dab85e19f17e9d9c712cc1e588759bf826aa2ddd291fa361bbadaee014a045a

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: List existing compute targets
        run: |
          set -Eeuo pipefail
          echo '=== INSTANCES ==='
          gcloud compute instances list --project "$GCP_PROJECT_ID" --format='table(name,zone,status,machineType.basename(),networkInterfaces[0].networkIP,networkInterfaces[0].accessConfigs[0].natIP)' || true
          echo '=== FORWARDING RULES ==='
          gcloud compute forwarding-rules list --project "$GCP_PROJECT_ID" --format='table(name,IPAddress,IPProtocol,target)' || true
      - name: Inspect exact Core RC6 mobile source
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='set -Eeuo pipefail
          SRC="$HOME/thf-builder/inputs-rc17/'"$CORE_ARTIFACT"'"
          test -f "$SRC"
          echo "'"$CORE_SHA256"'  $SRC" | sha256sum -c -
          TMP=$(mktemp -d); trap "rm -rf $TMP" EXIT
          unzip -q "$SRC" -d "$TMP"
          echo "=== ANDROID FILES ==="
          find "$TMP/android" -maxdepth 5 -type f | sort
          echo "=== BUILD CONFIG DECLARATIONS ==="
          grep -RIn --exclude-dir=build -E "THF_BASE_URL|THF_PASS_URL|buildConfigField|resValue" "$TMP/android" || true
          echo "=== MAIN ACTIVITY ENDPOINT LOGIC ==="
          grep -RIn --exclude-dir=build -E "THF_BASE_URL|THF_PASS_URL|service_not_configured|offline.html|startsWith\(.*https|https://" "$TMP/android/app/src" || true
          echo "=== BACKEND START/HEALTH FILES ==="
          find "$TMP" -maxdepth 3 -type f \( -name "start.sh" -o -name "Dockerfile" -o -name "requirements.txt" -o -name "pyproject.toml" -o -name ".env.example" \) -print | sort
          '
