name: THF TokenOps Policy Governance Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/TokenOps/**'
      - '.github/workflows/thf-tokenops-policy-governance-gate-v1.yml'
  pull_request:
    paths:
      - 'ReleaseOps/TokenOps/**'
      - '.github/workflows/thf-tokenops-policy-governance-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thf-tokenops-policy-governance-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-governance-readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Compile governance control plane
        run: |
          set -euo pipefail
          python -m py_compile ReleaseOps/TokenOps/policy_change_control.py
          python -m py_compile ReleaseOps/TokenOps/financial_control_plane.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run policy governance tests
        run: python -m pytest ReleaseOps/TokenOps/test_policy_change_control.py -q

      - name: Produce current fail-closed policy mutation proof
        run: |
          set -euo pipefail
          mkdir -p out/tokenops-policy-governance
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from ReleaseOps.TokenOps.policy_change_control import build_current_failclosed_proof

          policy_path = Path('ReleaseOps/TokenOps/treasury_policy.json')
          policy = json.loads(policy_path.read_text())
          packet = build_current_failclosed_proof(policy)
          assert packet['status'] == 'FAIL_CLOSED'
          assert packet['policy_mutation_applied'] is False
          assert packet['execution_authorized'] is False
          assert packet['transaction_bytes_created'] is False
          assert packet['instruction_bytes_created'] is False
          assert packet['signed'] is False
          assert packet['submitted'] is False
          assert packet['broadcast'] is False
          assert packet['financial_effect'] is False
          assert packet['private_key_required'] is False
          assert packet['wave_touched'] is False
          out = Path('out/tokenops-policy-governance/policy-mutation-readiness.json')
          out.write_text(json.dumps(packet, sort_keys=True, indent=2) + '\n')
          print('POLICY_MUTATION_STATUS=' + packet['status'])
          print('POLICY_MUTATION_BLOCKERS=' + ','.join(packet['blockers']))
          print('POLICY_MUTATION_APPLIED=' + str(packet['policy_mutation_applied']))
          print('EXACT_NEXT_ACTION=' + packet['exact_next_action'])
          print('TREASURY_POLICY_SHA256=' + hashlib.sha256(policy_path.read_bytes()).hexdigest())
          PY

      - name: Create evidence manifest
        run: |
          set -euo pipefail
          cd out/tokenops-policy-governance
          sha256sum *.json | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '## THF TokenOps policy governance read-only evidence'
            echo ''
            echo "Source SHA: $GITHUB_SHA"
            echo ''
            echo 'No policy mutation, signing, submission, broadcast, transfer, burn, authority change, private-key handling, or WAVE mutation is performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce no executable or secret payloads
        run: |
          set -euo pipefail
          if find out/tokenops-policy-governance -type f \( -name '*.txn' -o -name '*.tx' -o -name '*.key' -o -name '*.keypair' -o -name '*.secret' \) | grep -q .; then
            echo 'Forbidden executable/sensitive payload file detected' >&2
            exit 2
          fi
          echo NON_BROADCAST_PAYLOAD_GATE=PASS

      - name: Upload immutable governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Policy-Governance-v1-${{ github.run_id }}
          path: out/tokenops-policy-governance/
          if-no-files-found: error
          retention-days: 30
