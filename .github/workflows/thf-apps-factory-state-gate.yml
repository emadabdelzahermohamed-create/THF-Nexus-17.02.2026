name: THF Apps Factory State Gate

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/apps_factory/**'
      - 'ReleaseOps/validators/validate_apps_factory_state.py'
      - 'ReleaseOps/validators/test_validate_apps_factory_state.py'
      - '.github/workflows/thf-apps-factory-state-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate authoritative factory state
        run: |
          python ReleaseOps/validators/validate_apps_factory_state.py \
            ReleaseOps/apps_factory/THF_APPS_FACTORY_STATE_20260913_2035_EET.json
      - name: Run validator regression tests
        run: python -m pytest -q ReleaseOps/validators/test_validate_apps_factory_state.py
