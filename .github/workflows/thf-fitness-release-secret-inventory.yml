name: THF Fitness Release Secret Inventory
# read-only inventory; never reads secret values

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-release-secret-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  read-only-secret-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: List Secret Manager names only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' > evidence/secret-names.txt 2> evidence/secret-list-error.txt; then
            echo "secret_manager_list=PASS" > evidence/RESULT.txt
            grep -Ei 'fitness|pulse|android|play|sign|upload|keystore' evidence/secret-names.txt > evidence/relevant-secret-names.txt || true
          else
            echo "secret_manager_list=BLOCKED" > evidence/RESULT.txt
          fi
          echo "No secret values were read." >> evidence/RESULT.txt

      - name: Upload read-only inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-release-secret-inventory
          path: evidence/
          retention-days: 7
