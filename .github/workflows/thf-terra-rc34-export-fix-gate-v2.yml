name: THF Terra RC34 Godot Engine Gate
on:
  push:
    branches: ['t/r34']
    paths: ['.github/workflows/thf-terra-rc34-export-fix-gate-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  FULL_NAME: THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip
  FULL_SHA: eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68
jobs:
  engine-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Run exact RC34 Godot 4.7.2 clean engine gate
        shell: bash
        run: |
          set -uo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=25m --quiet --command="FULL_NAME='$FULL_NAME' FULL_SHA='$FULL_SHA' bash -s" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/gate.log"
          set -Eeuo pipefail
          BASE_HOME="$HOME"; ROOT="$BASE_HOME/thf-terra-rc34-gate"; INPUT="$ROOT/input"; WORK="$ROOT/work-engine"; OUT="$ROOT/out-engine"
          rm -rf "$WORK" "$OUT"; rm -f "$ROOT/engine-evidence.tgz"; mkdir -p "$WORK" "$OUT"
          echo "$FULL_SHA  $INPUT/$FULL_NAME" | sha256sum -c -
          unzip -qo "$INPUT/$FULL_NAME" -d "$WORK"
          test -f "$WORK/project.godot"
          GODOT="$BASE_HOME/thf-tools/godot/4.7.2-stable/godot"; test -x "$GODOT"
          ISO_HOME="$ROOT/godot-home-engine"; rm -rf "$ISO_HOME"; mkdir -p "$ISO_HOME/.config/godot" "$ISO_HOME/.local/share/godot"
          export HOME="$ISO_HOME"
          set +e
          timeout 15m "$GODOT" --headless --editor --path "$WORK" --quit --verbose >"$OUT/editor-import.log" 2>&1; import_rc=$?
          timeout 5m "$GODOT" --headless --path "$WORK" --quit-after 30 --verbose >"$OUT/headless-boot.log" 2>&1; boot_rc=$?
          set -e
          status=FAIL; [ "$import_rc" -eq 0 ] && [ "$boot_rc" -eq 0 ] && status=PASS
          printf 'status=%s\nengine_gate=%s\ncanonical_sha256=%s\nimport_rc=%s\nboot_rc=%s\ngodot=4.7.2-stable\nexport_templates=SEPARATE_GATE\nandroid_export=NOT_EXECUTED_IN_ENGINE_GATE\nproduction_signing=false\ncanonical_archive_mutated=false\nwave_untouched=true\n' "$status" "$status" "$FULL_SHA" "$import_rc" "$boot_rc" | tee "$OUT/TRUTH.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -czf "$ROOT/engine-evidence.tgz" -C "$ROOT" out-engine
          [ "$status" = PASS ]
          REMOTE
          rc=${PIPESTATUS[0]}; echo "REMOTE_RC=$rc" >> "$GITHUB_ENV"; exit 0
      - name: Retrieve evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          gcloud compute scp "$GCP_BUILDER:~/thf-terra-rc34-gate/engine-evidence.tgz" evidence/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          cp "$RUNNER_TEMP/gate.log" evidence/ || true
          printf 'canonical_sha256=%s\nremote_rc=%s\n' "$FULL_SHA" "${REMOTE_RC:-missing}" > evidence/RUNNER_SUMMARY.txt
      - name: Persist Terra engine evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ReleaseOps/Terra/RC34_ENGINE_GATE /tmp/terra-engine
          [ -f evidence/engine-evidence.tgz ] && tar -xzf evidence/engine-evidence.tgz -C /tmp/terra-engine || true
          cp evidence/RUNNER_SUMMARY.txt ReleaseOps/Terra/RC34_ENGINE_GATE/RUNNER_SUMMARY.txt || true
          cp evidence/gate.log ReleaseOps/Terra/RC34_ENGINE_GATE/GATE_LOG.txt || true
          if [ -d /tmp/terra-engine/out-engine ]; then
            cp /tmp/terra-engine/out-engine/TRUTH.txt ReleaseOps/Terra/RC34_ENGINE_GATE/TRUTH.txt || true
            cp /tmp/terra-engine/out-engine/SHA256SUMS.txt ReleaseOps/Terra/RC34_ENGINE_GATE/REMOTE_SHA256SUMS.txt || true
            for f in editor-import.log headless-boot.log; do
              [ -f "/tmp/terra-engine/out-engine/$f" ] && tail -n 300 "/tmp/terra-engine/out-engine/$f" > "ReleaseOps/Terra/RC34_ENGINE_GATE/${f%.log}-tail.log" || true
            done
          fi
          (cd ReleaseOps/Terra/RC34_ENGINE_GATE && find . -type f -print0 | sort -z | xargs -0 sha256sum > EVIDENCE_SHA256SUMS.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin t/r34
          git rebase origin/t/r34 || { git rebase --abort || true; exit 1; }
          git add ReleaseOps/Terra/RC34_ENGINE_GATE
          git diff --cached --quiet && exit 0
          git commit -m 'releaseops(terra): record RC34 Godot 4.7.2 engine gate'
          git push origin HEAD:t/r34
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Terra-RC34-engine-gate-evidence
          path: evidence/
          retention-days: 14
      - name: Final engine gate
        if: always()
        shell: bash
        run: |
          test "${REMOTE_RC:-missing}" = 0
          echo TERRA_RC34_GODOT472_ENGINE_GATE=PASS
          echo ANDROID_EXPORT=SEPARATE_GATE
          echo PRODUCTION_SIGNING=NOT_PERFORMED
          echo WAVE_UNTOUCHED=TRUE
