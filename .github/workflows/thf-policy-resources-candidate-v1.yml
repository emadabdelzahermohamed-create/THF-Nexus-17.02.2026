name: THF Policy Resources Candidate V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-policy-resources-candidate-v1.yml'
      - 'ReleaseOps/Compliance/thf_policy_resources_candidate_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  INPUT_SHA256: 8b0b892d1f32bdc7d5daa9867a442a349f6306969f29e9771dab2af3a9178784
  INPUT_BASENAME: THF_NEXUS_6_ACCOUNT_CLIENT_CANDIDATE_V1_34723424879.zip

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build isolated policy routing candidate and run HTTP checks
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="THF_NEXUS_6_POLICY_RESOURCES_CANDIDATE_V1_${GITHUB_RUN_ID}.zip"
          gcloud compute scp ReleaseOps/Compliance/thf_policy_resources_candidate_v1.py "${GCP_BUILDER}:/tmp/thf_policy_resources_candidate_v1.py" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command="set -Eeuo pipefail
            C=\"\$HOME/thf-runtime-s1/candidates/$INPUT_BASENAME\"; test -f \"\$C\"
            BEFORE=\$(sha256sum \"\$C\" | awk '{print \$1}'); echo INPUT_SHA256_BEFORE=\$BEFORE; test \"\$BEFORE\" = \"$INPUT_SHA256\"
            O=\"\$HOME/thf-runtime-s1/candidates/$OUT\"; test ! -e \"\$O\"
            python3 /tmp/thf_policy_resources_candidate_v1.py \"\$C\" \"\$O\"
            AFTER=\$(sha256sum \"\$C\" | awk '{print \$1}'); echo INPUT_SHA256_AFTER=\$AFTER; test \"\$AFTER\" = \"$INPUT_SHA256\"
            OSHA=\$(sha256sum \"\$O\" | awk '{print \$1}'); echo POLICY_RESOURCES_CANDIDATE_BASENAME=$OUT; echo POLICY_RESOURCES_CANDIDATE_SHA256=\$OSHA
            TMP=\$(mktemp -d /tmp/thf-policy-resources-e2e-v1.XXXXXX); trap 'rm -rf \"\$TMP\" /tmp/thf_policy_resources_candidate_v1.py' EXIT
            unzip -q \"\$O\" -d \"\$TMP/extracted\"; ROOT=\"\$TMP/extracted/THF_NEXUS_6_FINAL\"
            PYTHONDONTWRITEBYTECODE=1 python3 - \"\$ROOT\" \"\$TMP/e2e.sqlite\" <<'PY'
          from pathlib import Path
          import sys, threading, urllib.request
          root=Path(sys.argv[1]); db=sys.argv[2]; sys.path.insert(0,str(root/'src'))
          from thf.app import make_server
          srv=make_server('127.0.0.1',0,root,db); port=srv.server_address[1]
          th=threading.Thread(target=srv.serve_forever,daemon=True); th.start(); base=f'http://127.0.0.1:{port}'
          def raw(path):
              with urllib.request.urlopen(base+path,timeout=5) as r:return r.status,r.headers.get('Content-Type',''),r.read()
          try:
              s0,ct0,b0=raw('/')
              sp,ctp,bp=raw('/privacy')
              st,ctt,bt=raw('/terms')
              ss,cts,bs=raw('/.well-known/security.txt')
              assert s0==sp==st==ss==200
              assert bp!=b0 and bt!=b0 and bs!=b0
              assert b'THF POLICY DRAFT - NOT APPROVED FOR PRODUCTION' in bp
              assert b'THF POLICY DRAFT - NOT APPROVED FOR PRODUCTION' in bt
              assert b'THF POLICY DRAFT - NOT APPROVED FOR PRODUCTION' in bs
              assert 'text/html' in ctp and 'text/html' in ctt
              assert 'text/plain' in cts
              print('PRIVACY_DISTINCT_ROUTE=PASS')
              print('TERMS_DISTINCT_ROUTE=PASS')
              print('SECURITY_TXT_DISTINCT_ROUTE=PASS')
              print('SECURITY_TXT_CONTENT_TYPE=PASS')
              print('DRAFT_MARKERS_PRESENT=PASS')
          finally:
              srv.shutdown(); srv.server_close(); th.join(timeout=3)
          PY
            if find \"\$ROOT\" \( -path '*wave-mawja*' -o -path '*WAVE_MAWJA*' \) -print -quit | grep -q .; then exit 9; fi
            echo THF_CANDIDATE_WAVE_ISOLATION=PASS
            echo LEGAL_CONTENT_APPROVED=FALSE
            echo PRODUCTION_RUNTIME_MUTATION=FALSE; echo PRODUCTION_DB_MUTATION=FALSE; echo CANONICAL_ARCHIVE_OVERWRITE=FALSE
            echo PRODUCTION_SIGNING_PERFORMED=FALSE; echo PLAY_UPLOAD_PERFORMED=FALSE; echo CLOUDFLARE_PRODUCTION_CUTOVER_PERFORMED=FALSE; echo SOLANA_FINANCIAL_ACTION_PERFORMED=FALSE; echo WAVE_UNTOUCHED=TRUE"
