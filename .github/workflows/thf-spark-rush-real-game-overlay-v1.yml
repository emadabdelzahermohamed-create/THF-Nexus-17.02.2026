name: THF Spark Rush Real Game Overlay V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/games_factory/apply_spark_rush_real_game_overlay_v1.py'
      - '.github/workflows/thf-spark-rush-real-game-overlay-v1.yml'
      - 'ReleaseOps/validators/audit_game_like_real_function.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: spark
            checkpoint: RC4
            profile: learning
            source_sha: 58a32690ea69b6fd62a977145079e0ad6e75061724a786d5db9276b95ec48d43
            package_id: com.topherofit.thf.spark
            drive_id: 1bwvy2huHjkpof3ZcH1QEJK23ep7SKKEm
          - app: rush
            checkpoint: RC4
            profile: fitness
            source_sha: 766936c25700643bcf813d4e754b287f79810eebe859bd45388391bf57bf771c
            package_id: com.topherofit.thf.rush
            drive_id: 1P4Z1r6l08rbCLuDsXX1YRjWo0seC8yQz
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Verify authoritative RC4 source and apply disposable real-game overlay
        id: overlay
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          APP: ${{ matrix.app }}
          CHECKPOINT: ${{ matrix.checkpoint }}
          PROFILE: ${{ matrix.profile }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          PACKAGE_ID: ${{ matrix.package_id }}
          DRIVE_ID: ${{ matrix.drive_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out src/extracted
          code=$(curl -sSLo src/app.zip -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$DRIVE_ID?alt=media&supportsAllDrives=true")
          [ "$code" = 200 ]
          actual=$(sha256sum src/app.zip | awk '{print $1}')
          [ "$actual" = "$SOURCE_SHA" ]
          unzip -tq src/app.zip >/dev/null
          unzip -q src/app.zip -d src/extracted
          root=$(find src/extracted -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
          test -n "$root"
          python -m py_compile ReleaseOps/games_factory/apply_spark_rush_real_game_overlay_v1.py
          python ReleaseOps/games_factory/apply_spark_rush_real_game_overlay_v1.py "$root" --app "$APP" --manifest-out "out/$APP.overlay.sha256"
          find "$root" -type f -not -path '*/.gradle/*' -not -path '*/build/*' -print0 | sort -z | xargs -0 sha256sum > "out/$APP.candidate-tree.sha256"
          candidate_tree_sha=$(sha256sum "out/$APP.candidate-tree.sha256" | awk '{print $1}')
          python ReleaseOps/validators/audit_game_like_real_function.py "$root" --profile "$PROFILE" --json-out "out/$APP.game-like-contract.json" | tee "out/$APP.game-like-contract.log"
          grep -q '"source_contract": "PASS"' "out/$APP.game-like-contract.json"
          printf 'APP=%s\nCHECKPOINT=%s\nSOURCE_SHA256=%s\nCANDIDATE_TREE_MANIFEST_SHA256=%s\nGAME_LIKE_SOURCE_CONTRACT=PASS\nCANONICAL_ARCHIVE_MUTATED=NO\nOFFLINE_AUTHORITY=LOCAL_ONLY_NO_FAKE_ONLINE_STATE\nREADINESS_PROMOTION=NO\nPHYSICAL_DEVICE_REQUIRED=YES\n' "$APP" "$CHECKPOINT" "$SOURCE_SHA" "$candidate_tree_sha" > "out/$APP.overlay-summary.txt"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Compile regression and API36 package evidence
        env:
          APP: ${{ matrix.app }}
          PACKAGE_ID: ${{ matrix.package_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root='${{ steps.overlay.outputs.root }}'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$root/android/local.properties"
          cd "$root/android"
          gradle --no-daemon tasks --all > "$GITHUB_WORKSPACE/out/$APP.gradle-tasks.txt"
          ran=0
          for task in testReleaseUnitTest testDebugUnitTest lintRelease lintDebug; do
            if grep -Eq "(^|:)${task}[[:space:]-]" "$GITHUB_WORKSPACE/out/$APP.gradle-tasks.txt"; then
              gradle --no-daemon "app:$task" --stacktrace
              ran=$((ran+1))
            fi
          done
          test "$ran" -ge 2
          gradle --no-daemon app:assembleRelease --stacktrace
          apk=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -1)
          test -n "$apk"
          unzip -tq "$apk" >/dev/null
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          aapt="$build_tools/aapt"; test -x "$aapt"
          "$aapt" dump badging "$apk" > "$GITHUB_WORKSPACE/out/$APP.badging.txt"
          pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$GITHUB_WORKSPACE/out/$APP.badging.txt" | head -1)
          sdk=$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" "$GITHUB_WORKSPACE/out/$APP.badging.txt" | head -1)
          test "$pkg" = "$PACKAGE_ID"
          test "$sdk" = 36
          cp "$apk" "$GITHUB_WORKSPACE/out/$APP-RC4-real-game-overlay-release.apk"
          printf '%s  %s\n' "$apk_sha" "$APP-RC4-real-game-overlay-release.apk" > "$GITHUB_WORKSPACE/out/$APP.apk.sha256"
          printf 'ANDROID_REGRESSION_TASKS_RUN=%s\nASSEMBLE_RELEASE=PASS\nAPK_ZIP_INTEGRITY=PASS\nAPK_SHA256=%s\nAPK_PACKAGE=%s\nTARGET_SDK=%s\nPRODUCTION_SIGNING=NO\nDEVICE_STATUS=PENDING\nFINAL_STATUS=NOT_FINAL\n' "$ran" "$apk_sha" "$pkg" "$sdk" >> "$GITHUB_WORKSPACE/out/$APP.overlay-summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-${{ matrix.app }}-RC4-REAL-GAME-OVERLAY-V1
          path: out/
          retention-days: 14
