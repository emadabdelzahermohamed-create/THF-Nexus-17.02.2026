name: WAVE RC15.5 VPS Arabic AI Smoke
on:
  push:
    branches: [releaseops/wave-rc15-3-20260917]
    paths:
      - '.github/workflows/wave-rc15-5-vps-arabic-ai-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  DRIVE_FILE_ID: 1B35W6nyNlhpJCv0wjRXleNRXWuoVOn16
  EXPECTED_RC15_SHA256: 71965ff9ed3405304743b4014cbbac269b96d83533557f28381781e67520d41f
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_VM: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  arabic-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Reconstruct RC15.5 media server
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -q google-auth requests
          python3 - <<'PY'
          import os,requests,google.auth
          from google.auth.transport.requests import Request
          c,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive.readonly']); c.refresh(Request())
          r=requests.get('https://www.googleapis.com/drive/v3/files/'+os.environ['DRIVE_FILE_ID']+'?alt=media',headers={'Authorization':'Bearer '+c.token},timeout=120);r.raise_for_status();open('base.zip','wb').write(r.content)
          PY
          echo "$EXPECTED_RC15_SHA256  base.zip" | sha256sum -c -
          mkdir src && unzip -q base.zip -d src
          cd src
          git init -q && git add . && git -c user.name=x -c user.email=x@x.invalid commit -qm base
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          cp -a ../ReleaseOps/WAVE/RC15_3/overlay/. .
          python3 ../ReleaseOps/WAVE/RC15_5/apply_rc15_5.py
          python3 ../ReleaseOps/WAVE/RC15_5/apply_rc15_5_nllb.py
          tar -C . -czf ../wave-media-rc155-ai.tgz media-server
      - name: Copy isolated AI smoke bundle to VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute scp wave-media-rc155-ai.tgz "$GCP_VM:/tmp/wave-media-rc155-ai.tgz" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Run English and Spanish to Arabic translation then Arabic dubbing
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_VM" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command='bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/workspace/wave-mawja-rc15-5-ai-smoke"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/test"
          tar -xzf /tmp/wave-media-rc155-ai.tgz -C "$ROOT"
          cd "$ROOT/media-server"
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq espeak-ng
          fi
          espeak-ng -v en-us -s 135 -w "$ROOT/test/english.wav" 'Hello. This is a real test of automatic translation and Arabic dubbing for Wave Mawja.'
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=640x360:d=8 -i "$ROOT/test/english.wav" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$ROOT/test/english.mp4"

          docker build -q -f Dockerfile.ai -t wave-rc155-ai .
          docker volume create wave-rc155-ai-model-cache >/dev/null
          COMMON='-e DATABASE_URL=postgresql://wave:wave@127.0.0.1:5432/wave -e REDIS_URL=redis://127.0.0.1:6379/0 -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_INTERNAL_ENDPOINT=http://127.0.0.1:9000 -e S3_ACCESS_KEY=smoke -e S3_SECRET_KEY=smoke -e S3_BUCKET=smoke -e S3_SOURCE_BUCKET=smoke -e PUBLIC_MEDIA_BASE_URL=http://127.0.0.1/media'
          # shellcheck disable=SC2086
          docker run --rm $COMMON \
            -e WHISPER_MODEL=tiny -e AI_DEVICE=cpu -e AI_COMPUTE_TYPE=int8 \
            -e TRANSLATION_MODEL=facebook/nllb-200-distilled-600M -e TRANSLATION_BEAMS=2 \
            -v "$ROOT/test:/test" -v wave-rc155-ai-model-cache:/root/.cache/huggingface \
            --entrypoint python wave-rc155-ai - <<'PY'
          import json,re,time
          from pathlib import Path
          import ai_worker as a
          start=time.time()
          segments, language, confidence = a.transcribe(Path('/test/english.mp4'))
          texts=[s.text for s in segments if s.text.strip()]
          assert texts, 'Whisper returned no English text'
          ar=a.translate_texts(texts, language, 'ar')
          es=a.translate_texts(['Hola. Esta es una prueba real de traducción automática para Wave Mawja.'], 'es', 'ar')
          arabic=lambda values: bool(re.search(r'[\u0600-\u06ff]', ' '.join(values)))
          assert language == 'en', f'unexpected source language: {language}'
          assert arabic(ar), ar
          assert arabic(es), es
          Path('/test/arabic.vtt').write_text('WEBVTT\n\n1\n00:00:00.000 --> 00:00:06.000\n'+ar[0].strip()+'\n',encoding='utf-8')
          Path('/test/translation-result.json').write_text(json.dumps({'detected':language,'confidence':confidence,'source':texts,'arabic':ar,'spanish_to_arabic':es,'elapsed_seconds':round(time.time()-start,2)},ensure_ascii=False,indent=2),encoding='utf-8')
          print('TRANSLATION_OK', json.dumps({'detected':language,'confidence':confidence,'source':texts,'arabic':ar,'spanish_to_arabic':es},ensure_ascii=False))
          PY
          echo "AI_MODEL_CACHE_BYTES=$(docker run --rm -v wave-rc155-ai-model-cache:/cache alpine sh -c 'du -sb /cache | cut -f1')"

          # A second translator load uses the persistent cache rather than downloading models again.
          # shellcheck disable=SC2086
          docker run --rm $COMMON \
            -e WHISPER_MODEL=tiny -e AI_DEVICE=cpu -e AI_COMPUTE_TYPE=int8 \
            -e TRANSLATION_MODEL=facebook/nllb-200-distilled-600M -e TRANSLATION_BEAMS=1 \
            -v wave-rc155-ai-model-cache:/root/.cache/huggingface \
            --entrypoint python wave-rc155-ai - <<'PY'
          import re,time
          import ai_worker as a
          t=time.time(); out=a.translate_texts(['Good morning from Wave Mawja.'],'en','ar')
          assert re.search(r'[\u0600-\u06ff]',' '.join(out)), out
          print('CACHE_REUSE_TRANSLATION_OK',round(time.time()-t,2),out)
          PY

          docker build -q -f Dockerfile.dubbing -t wave-rc155-dubbing .
          docker volume create wave-rc155-dubbing-model-cache >/dev/null
          # shellcheck disable=SC2086
          docker run --rm $COMMON \
            -e AI_DEVICE=cpu \
            -v "$ROOT/test:/test" -v wave-rc155-dubbing-model-cache:/root/.cache/huggingface \
            --entrypoint python wave-rc155-dubbing - <<'PY'
          import shutil
          from pathlib import Path
          import dubbing_worker as d
          vtt=Path('/test/arabic.vtt').read_text(encoding='utf-8')
          cues=d.parse_vtt(vtt)
          assert cues, 'Arabic VTT did not parse'
          profile_id, profile=d.choose_profile([])
          work=Path('/test/dub-work'); work.mkdir(parents=True,exist_ok=True)
          output=d.render_dubbing('ar',cues,Path('/test/english.mp4'),work,profile_id,profile)
          final=Path('/test/arabic-dub.m4a'); shutil.copy2(output,final)
          assert final.exists() and final.stat().st_size>1000
          print('DUBBING_OK',profile_id,final.stat().st_size)
          PY
          ffprobe -v error -show_entries format=duration,size -of json "$ROOT/test/arabic-dub.m4a"
          echo "DUB_MODEL_CACHE_BYTES=$(docker run --rm -v wave-rc155-dubbing-model-cache:/cache alpine sh -c 'du -sb /cache | cut -f1')"
          echo '=== translation result ==='
          cat "$ROOT/test/translation-result.json"
          REMOTE
