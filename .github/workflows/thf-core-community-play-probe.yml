name: THF Core Community Play Readiness Probe
on:
  push:
    branches: [agent/codex/play-signing-preflight/20261018]
    paths: [.github/workflows/thf-core-community-play-probe.yml]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe package visibility and tracks without upload
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          packages = ["com.topherofit.thf.core", "com.topherofit.thf.echo"]
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/androidpublisher"])
          api = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)
          out = {"wif": "PASS", "uploadAttempted": False, "commitAttempted": False, "packages": []}
          for package in packages:
              item, edit_id = {"package": package}, None
              try:
                  edit_id = api.edits().insert(packageName=package, body={}).execute()["id"]
                  tracks = api.edits().tracks().list(packageName=package, editId=edit_id).execute().get("tracks", [])
                  item.update({"visible": True, "editInsert": "PASS", "trackList": "PASS", "tracks": [t.get("track") for t in tracks]})
              except HttpError as exc:
                  item.update({"visible": False if exc.resp.status == 404 else None, "httpStatus": exc.resp.status, "error": str(exc)[:600]})
              finally:
                  if edit_id:
                      try:
                          api.edits().delete(packageName=package, editId=edit_id).execute()
                          item["editCleanup"] = "PASS"
                      except Exception as exc:
                          item.update({"editCleanup": "FAIL", "cleanupError": str(exc)[:400]})
              out["packages"].append(item)
          with open("core-community-play-probe.json", "w") as fh:
              json.dump(out, fh, indent=2)
          print(json.dumps(out, indent=2))
          if any(x.get("editInsert") != "PASS" or x.get("trackList") != "PASS" or x.get("editCleanup") != "PASS" for x in out["packages"]):
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-core-community-play-probe
          path: core-community-play-probe.json
          retention-days: 14
