name: THF Core Community Play Readiness Probe
on:
  push:
    branches: [agent/codex/play-signing-preflight/20261018]
    paths: [.github/workflows/thf-core-community-play-probe.yml]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Internal track versions after upload
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build

          expected = {
              "com.topherofit.thf.core": "62200",
              "com.topherofit.thf.echo": "21102",
          }
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/androidpublisher"])
          api = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)
          out = {"wif": "PASS", "uploadAttempted": False, "commitAttempted": False, "packages": []}
          failed = False
          for package, wanted in expected.items():
              edit_id = api.edits().insert(packageName=package, body={}).execute()["id"]
              try:
                  track = api.edits().tracks().get(packageName=package, editId=edit_id, track="internal").execute()
                  releases = []
                  versions = set()
                  for release in track.get("releases", []) or []:
                      codes = [str(v) for v in (release.get("versionCodes") or [])]
                      versions.update(codes)
                      releases.append({"name": release.get("name"), "status": release.get("status"), "versionCodes": codes})
                  present = wanted in versions
                  failed = failed or not present
                  out["packages"].append({"package": package, "expectedVersionCode": wanted, "internalVersionPresent": present, "internalReleases": releases, "trackRead": "PASS"})
              finally:
                  api.edits().delete(packageName=package, editId=edit_id).execute()
          with open("core-community-play-probe.json", "w") as fh:
              json.dump(out, fh, indent=2)
          print(json.dumps(out, indent=2))
          if failed:
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-core-community-play-probe
          path: core-community-play-probe.json
          retention-days: 30
