name: THF Fitness Closed Test Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Fitness 51006 closed test without commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          package='com.topherofit.thf.pulse'; version='51006'; track='alpha'
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          out={'package':package,'versionCode':version,'track':track,'commitAttempted':False,'trackUpdateAttempted':False,'validated':False}
          edit_id=None
          try:
              edit_id=api.edits().insert(packageName=package,body={}).execute()['id']; out['editInsert']='PASS'
              try:
                  testers=api.edits().testers().get(packageName=package,editId=edit_id,track=track).execute()
                  out['testersRead']='PASS'; out['googleGroups']=testers.get('googleGroups',[]) or []
              except HttpError as exc:
                  out['testersRead']='FAIL'; out['testersHttpStatus']=exc.resp.status; out['testersError']=str(exc)[:1200]
              try:
                  ca=api.edits().countryavailability().get(packageName=package,editId=edit_id,track=track).execute()
                  out['countryAvailabilityRead']='PASS'; out['countryAvailability']={'syncWithProduction':ca.get('syncWithProduction'),'countryCount':len(ca.get('countries',[]) or []),'restOfWorld':ca.get('restOfWorld'),'countries':ca.get('countries',[])[:40]}
              except HttpError as exc:
                  out['countryAvailabilityRead']='FAIL'; out['countryAvailabilityHttpStatus']=exc.resp.status; out['countryAvailabilityError']=str(exc)[:1200]
              out['trackUpdateAttempted']=True
              api.edits().tracks().update(packageName=package,editId=edit_id,track=track,body={'releases':[{'name':'THF Fitness 51006 Closed Test Validation','versionCodes':[version],'status':'completed'}]}).execute()
              out['trackUpdate']='PASS'
              validation=api.edits().validate(packageName=package,editId=edit_id).execute(); out['validated']=True; out['validationId']=validation.get('id')
          except HttpError as exc:
              out['httpStatus']=exc.resp.status; out['error']=str(exc)[:2000]
          finally:
              if edit_id:
                  try:
                      api.edits().delete(packageName=package,editId=edit_id).execute(); out['editCleanup']='PASS'
                  except HttpError as exc:
                      out['editCleanup']='ALREADY_DELETED' if exc.resp.status==400 and 'This Edit has been deleted' in str(exc) else 'FAIL'
                      if out['editCleanup']=='FAIL': out['cleanupError']=str(exc)[:1000]
          print(json.dumps(out,indent=2))
          with open('fitness-closed-test-probe.json','w') as fh: json.dump(out,fh,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-fitness-closed-test-probe
          path: fitness-closed-test-probe.json
          if-no-files-found: error
          retention-days: 14
