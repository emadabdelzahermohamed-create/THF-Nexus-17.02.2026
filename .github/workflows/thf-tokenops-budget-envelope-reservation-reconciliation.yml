name: THF TokenOps Budget Envelope Reservation Reconciliation Gate

on:
  push:
    branches:
      - 'tokenops/**'
    paths:
      - 'ReleaseOps/TokenOps/budget_envelope_reservation_reconciliation.py'
      - 'ReleaseOps/TokenOps/test_budget_envelope_reservation_reconciliation.py'
      - 'ReleaseOps/TokenOps/reward_vesting_budget_envelope.py'
      - 'ReleaseOps/TokenOps/policy.json'
      - 'ReleaseOps/TokenOps/treasury_policy.json'
      - '.github/workflows/thf-tokenops-budget-envelope-reservation-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-envelope-reservation-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run reservation/reconciliation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tokenops-reservation-reconciliation
          PYTHONPATH=ReleaseOps/TokenOps python3 ReleaseOps/TokenOps/test_budget_envelope_reservation_reconciliation.py \
            | tee tokenops-reservation-reconciliation/tests.log

      - name: Compile production-policy fail-closed probe
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=ReleaseOps/TokenOps python3 - <<'PY'
          import json
          from pathlib import Path
          from reward_vesting_budget_envelope import canonical_sha256 as envelope_sha, compile_budget_envelope
          from budget_envelope_reservation_reconciliation import compile_reservation_reconciliation

          policy=json.load(open('ReleaseOps/TokenOps/policy.json'))
          treasury=json.load(open('ReleaseOps/TokenOps/treasury_policy.json'))
          mint=policy['mint']
          network=policy['network']
          bound={
            'gate':'THF_TOKENOPS_POLICY_COMPLETION_BOUND_UNSIGNED_ADMISSION_V1',
            'network':network,
            'mint':mint,
            'intent':'reward_epoch',
            'policy_completion_evidence_sha256':'5747de9d10e1fd2894baea38e0690c39a4d220885585ab296b0c1b65200bb190',
            'base_admission_sha256':'0'*64,
            'authoritative_policy_sha256':envelope_sha(policy),
            'treasury_policy_sha256':envelope_sha(treasury),
            'simulation_review_eligible':False,
            'blockers':[
              'anti_whale_caps_not_authoritatively_configured',
              'production_caps_not_approved',
              'policy_completion_not_authoritatively_completed'
            ],
            'simulation_execution_permitted':False,
            'execution_authorized':False,
            'transaction_created':False,
            'transaction_signed':False,
            'transaction_submitted':False,
            'broadcast_allowed':False,
            'financial_effect':False,
            'private_key_used':False,
            'wave_mawja_untouched':True,
          }
          bound['bound_admission_sha256']=envelope_sha(bound)
          budget_req={
            'network':network,
            'mint':mint,
            'intent':'reward_epoch',
            'request_id':'production-reservation-probe-budget',
            'bound_admission_sha256':bound['bound_admission_sha256'],
            'epoch_revenue_minor':'0',
            'entries':[{'subject_id':'probe','wallet':'review-only-wallet-placeholder','amount_raw':'1'}],
          }
          budget=compile_budget_envelope(bound, policy, treasury, budget_req)
          assert budget['review_eligible'] is False
          reservation_req={
            'network':network,
            'mint':mint,
            'request_id':'production-reservation-probe',
            'budget_envelope_sha256':budget['envelope_sha256'],
            'reservations':[{
              'reservation_id':'probe-reservation',
              'subject_id':'probe',
              'wallet':'review-only-wallet-placeholder',
              'amount_raw':'1'
            }],
          }
          out=compile_reservation_reconciliation(budget, reservation_req)
          assert out['reservation_review_eligible'] is False
          assert 'budget_envelope_not_review_eligible' in out['blockers']
          assert out['accounting']['overcommitted'] is False
          for key in ('transaction_created','transaction_signed','transaction_submitted','broadcast_allowed','financial_effect','settlement_executed','private_key_used'):
            assert out['execution'][key] is False
          assert out['execution']['wave_mawja_untouched'] is True
          Path('tokenops-reservation-reconciliation/production-budget-envelope.json').write_text(json.dumps(budget,sort_keys=True,indent=2)+'\n')
          Path('tokenops-reservation-reconciliation/production-reservation-reconciliation.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('THF_TOKENOPS_PRODUCTION_RESERVATION_PROBE=FAIL_CLOSED_AS_EXPECTED')
          print('RESERVATION_RECONCILIATION_SHA256='+out['reservation_reconciliation_sha256'])
          print('TRANSACTION_CREATED=FALSE')
          print('TRANSACTION_SIGNED=FALSE')
          print('TRANSACTION_SUBMITTED=FALSE')
          print('FINANCIAL_EFFECT=FALSE')
          print('PRIVATE_KEY_USED=FALSE')
          print('WAVE_UNTOUCHED=TRUE')
          PY

      - name: Assert hard safety boundary and hash evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -qx 'THF_BUDGET_ENVELOPE_RESERVATION_RECONCILIATION_TESTS=PASS' tokenops-reservation-reconciliation/tests.log
          grep -qx 'TRANSACTION_CREATED=FALSE' tokenops-reservation-reconciliation/tests.log
          grep -qx 'TRANSACTION_SIGNED=FALSE' tokenops-reservation-reconciliation/tests.log
          grep -qx 'TRANSACTION_SUBMITTED=FALSE' tokenops-reservation-reconciliation/tests.log
          grep -qx 'FINANCIAL_EFFECT=FALSE' tokenops-reservation-reconciliation/tests.log
          grep -qx 'PRIVATE_KEY_USED=FALSE' tokenops-reservation-reconciliation/tests.log
          grep -qx 'WAVE_UNTOUCHED=TRUE' tokenops-reservation-reconciliation/tests.log
          sha256sum \
            ReleaseOps/TokenOps/budget_envelope_reservation_reconciliation.py \
            ReleaseOps/TokenOps/test_budget_envelope_reservation_reconciliation.py \
            ReleaseOps/TokenOps/reward_vesting_budget_envelope.py \
            ReleaseOps/TokenOps/policy.json \
            ReleaseOps/TokenOps/treasury_policy.json \
            tokenops-reservation-reconciliation/production-budget-envelope.json \
            tokenops-reservation-reconciliation/production-reservation-reconciliation.json \
            tokenops-reservation-reconciliation/tests.log \
            > tokenops-reservation-reconciliation/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Budget-Envelope-Reservation-Reconciliation-Gate
          path: tokenops-reservation-reconciliation/
          if-no-files-found: error
          retention-days: 30
