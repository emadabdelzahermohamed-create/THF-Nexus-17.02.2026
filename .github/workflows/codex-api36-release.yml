name: Codex API 36 release candidate

on:
  push:
    branches:
      - 'agent/codex/codex-release/**'
    paths:
      - 'Sources/THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip'
      - '.github/workflows/codex-api36-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify exact source and unpack
        shell: bash
        run: |
          set -euo pipefail
          echo "44ff76cca12b6b13febc53e9e0b8748a01949eb07c40b020d76b82f45a094950  Sources/THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip" | sha256sum -c -
          mkdir -p build/codex
          unzip -q Sources/THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip -d build/codex
          ANDROID_DIR="$(find build/codex -type f -path '*/android/settings.gradle' -printf '%h\n' | head -n1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
      - name: Build exact API 36 APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ANDROID_DIR" --no-daemon clean assembleRelease bundleRelease
      - name: Verify package metadata and record hashes
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/release" -name '*.apk' | head -n1)"
          AAB="$(find "$ANDROID_DIR/app/build/outputs/bundle/release" -name '*.aab' | head -n1)"
          test -s "$APK" && test -s "$AAB"
          mkdir -p release
          cp "$APK" release/THF-Codex-2.1.1-phone3-api36.apk
          cp "$AAB" release/THF-Codex-2.1.1-phone3-api36.aab
          sha256sum release/* | tee release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/*.apk | tee release/APK_BADGING.txt
          grep -F "package: name='com.topherofit.thf.codex' versionCode='21102' versionName='2.1.1-phone3'" release/APK_BADGING.txt
          grep -F "targetSdkVersion:'36'" release/APK_BADGING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thf-codex-2.1.1-phone3-api36
          path: release/
          if-no-files-found: error
          retention-days: 30
