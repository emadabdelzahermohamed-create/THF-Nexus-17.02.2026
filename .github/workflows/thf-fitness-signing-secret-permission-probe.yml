name: THF Fitness Signing Secret Permission Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-signing-secret-permission-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  PROBE_SECRET: thf-fitness-signing-permission-probe

jobs:
  permission-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Probe create/use/delete permissions without secret data
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          API="https://secretmanager.googleapis.com/v1"
          PARENT="projects/$GCP_PROJECT_ID"
          SECRET="$PARENT/secrets/$PROBE_SECRET"

          cleanup() {
            curl --silent --show-error -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$API/$SECRET" >/dev/null || true
          }
          trap cleanup EXIT

          CREATE_CODE="$(curl --silent --show-error -o evidence/create.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            "$API/$PARENT/secrets?secretId=$PROBE_SECRET" \
            -d '{"replication":{"automatic":{}}}')"

          echo "create_http=$CREATE_CODE" > evidence/RESULT.txt
          if [[ "$CREATE_CODE" != "200" ]]; then
            echo "create_permission=BLOCKED" >> evidence/RESULT.txt
            exit 0
          fi

          echo "create_permission=PASS" >> evidence/RESULT.txt

          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            "$API/$SECRET:testIamPermissions" \
            -d '{"permissions":["secretmanager.secrets.get","secretmanager.secrets.delete","secretmanager.versions.add","secretmanager.versions.access"]}' \
            > evidence/permissions.json

          python - <<'PY' >> evidence/RESULT.txt
          import json
          p=set(json.load(open("evidence/permissions.json")).get("permissions", []))
          for name in ["secretmanager.secrets.get","secretmanager.secrets.delete","secretmanager.versions.add","secretmanager.versions.access"]:
              print(f"{name}={'PASS' if name in p else 'BLOCKED'}")
          print("secret_values_used=no")
          PY

      - name: Upload permission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-signing-secret-permission-probe
          path: evidence/
          retention-days: 7
