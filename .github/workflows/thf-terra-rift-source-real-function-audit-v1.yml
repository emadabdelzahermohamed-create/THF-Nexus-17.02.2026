name: THF Terra Rift Source Real-Function Audit V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/scripts/thf_game_source_contract_audit_v1.py'
      - '.github/workflows/thf-terra-rift-source-real-function-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Stage auditor in isolated scratch
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=25m --quiet --command='mkdir -p "$HOME/thf-game-source-audit-v1/tool"'
          gcloud compute scp ReleaseOps/scripts/thf_game_source_contract_audit_v1.py "$GCP_BUILDER:~/thf-game-source-audit-v1/tool/audit.py" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Audit canonical Terra and Rift source trees
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=25m --quiet --command='bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-game-source-audit-v1"; TOOL="$ROOT/tool/audit.py"; OUT="$ROOT/out"; rm -rf "$ROOT/work" "$OUT"; mkdir -p "$ROOT/work" "$OUT"
          audit_one() {
            game="$1"; src="$2"; expected="$3"; work="$ROOT/work/$game"; mkdir -p "$work"
            test -f "$src"; echo "$expected  $src" | sha256sum -c -
            python3 -c 'import pathlib,sys,zipfile; p=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(p); bad=[i.filename for i in z.infolist() if pathlib.PurePosixPath(i.filename).is_absolute() or ".." in pathlib.PurePosixPath(i.filename).parts]; assert not bad, bad' "$src"
            unzip -q "$src" -d "$work"
            set +e
            python3 "$TOOL" "$work" --game "$game" --json-out "$OUT/${game}.json" > "$OUT/${game}.log" 2>&1
            rc=$?
            set -e
            echo "$expected  $src" | sha256sum -c -
            printf 'game=%s\ncanonical_sha256=%s\nsource_contract_rc=%s\ndevice_status=PENDING\n' "$game" "$expected" "$rc" > "$OUT/${game}.summary"
          }
          audit_one terra "$HOME/thf-terra-rc34-gate/input/THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip" eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68
          audit_one rift "$HOME/thf-rift-rc37-gate/input/THF_Rift_v4.7.1_RC37_HUMAN_RELOAD_TIMING_PARITY_CUMULATIVE_SOURCE.zip" 3e2407d4aa76d4d23f4f0a0c3ccb02f02f1a9522b42518a38c03e0f01775e914
          REMOTE
      - name: Retrieve evidence
        run: |
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-game-source-audit-v1/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TERRA-RIFT-SOURCE-REAL-FUNCTION-AUDIT
          path: out/
          retention-days: 14
      - name: Source contract result (never device PASS)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat out/terra.summary out/rift.summary
          grep -q '^device_status=PENDING$' out/terra.summary
          grep -q '^device_status=PENDING$' out/rift.summary
          test "$(sed -n 's/^source_contract_rc=//p' out/terra.summary)" = 0
          test "$(sed -n 's/^source_contract_rc=//p' out/rift.summary)" = 0
