name: THF Current Cycle Closed Draft Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare alpha closed-test drafts from already-uploaded versions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build

          apps=[
            ('fitness','com.topherofit.thf.pulse','51006','Top Hero Fit 51006 Closed Test'),
            ('core','com.topherofit.thf.core','62200','THF Hub 62200 Closed Test'),
            ('community','com.topherofit.thf.echo','21102','THF Community 21102 Closed Test'),
          ]
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          out={'track':'alpha','releaseStatus':'draft','productionTouched':False,'apps':[]}
          for key,package,version,name in apps:
              item={'key':key,'package':package,'versionCode':version,'committed':False}
              edit_id=None
              try:
                  edit_id=api.edits().insert(packageName=package,body={}).execute()['id']
                  tracks=api.edits().tracks().list(packageName=package,editId=edit_id).execute().get('tracks',[]) or []
                  existing=set()
                  for t in tracks:
                      for r in t.get('releases',[]) or []:
                          existing.update(str(v) for v in (r.get('versionCodes') or []))
                  item['versionAlreadyInPlay']=version in existing
                  if not item['versionAlreadyInPlay']:
                      raise RuntimeError(f'version {version} is not already uploaded to Play')
                  body={'releases':[{'name':name,'versionCodes':[version],'status':'draft'}]}
                  api.edits().tracks().update(packageName=package,editId=edit_id,track='alpha',body=body).execute()
                  item['trackUpdate']='PASS'
                  v=api.edits().validate(packageName=package,editId=edit_id).execute()
                  item['validated']=True; item['validationId']=v.get('id')
                  c=api.edits().commit(packageName=package,editId=edit_id).execute()
                  item['committed']=True; item['committedEditId']=c.get('id'); edit_id=None
              except Exception as exc:
                  item['error']=str(exc)[:1800]
              finally:
                  if edit_id:
                      try: api.edits().delete(packageName=package,editId=edit_id).execute(); item['cleanup']='PASS'
                      except Exception as exc: item['cleanup']='FAIL'; item['cleanupError']=str(exc)[:1000]
                  out['apps'].append(item)
          print(json.dumps(out,indent=2))
          with open('thf-current-cycle-closed-draft-sync.json','w') as fh: json.dump(out,fh,indent=2)
          if not all(x.get('committed') for x in out['apps']): raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-current-cycle-closed-draft-sync
          path: thf-current-cycle-closed-draft-sync.json
          if-no-files-found: error
          retention-days: 30
