name: THF Game Backend Authenticated Role Authority V2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-game-backend-authenticated-role-authority-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  role-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Isolated authenticated role authority probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='python3 -' > out/role-authority.raw <<'PY'
          import hashlib,http.client,importlib,json,os,pathlib,shutil,socket,sys,tempfile,threading,traceback,uuid
          src=pathlib.Path.home()/"thf-runtime-s1/runtime/THF_NEXUS_6_FINAL/src"
          assert src.is_dir() and (src/'thf/app.py').is_file()
          def tree_sha(root):
              h=hashlib.sha256()
              for p in sorted(root.rglob('*.py')):
                  rel=p.relative_to(root).as_posix()
                  if 'wave' in rel.lower(): continue
                  h.update(rel.encode()+b'\0'+p.read_bytes())
              return h.hexdigest()
          before=tree_sha(src)
          result={'schema':'thf-game-backend-authenticated-role-authority-v2','runtime_source_sha256':before,
                  'external_network_allowed':False,'production_credentials_used':False,'wave_files_read_or_changed':False,
                  'canonical_source_modified':False,'final_or_play_ready':False,'checks':[],
                  'arena_ownership_proof':'PENDING_STRONG_SAME_ACTION_CONTROL'}
          def add(name,status,passed,detail=None):
              d={'name':name,'status':status,'passed':bool(passed)}
              if detail is not None:d['detail']=detail
              result['checks'].append(d)
          with tempfile.TemporaryDirectory(prefix='thf-role-authz-') as td:
              td=pathlib.Path(td); work=td/'src'; data=td/'data'; home=td/'home'
              shutil.copytree(src,work,symlinks=True); data.mkdir(); home.mkdir(); db=data/'authz.sqlite3'
              os.environ.update({'THF_ENV':'test','THF_OFFLINE':'1','THF_DATA_DIR':str(data),'THF_DB_PATH':str(db),
                                 'THF_RUNTIME_DIR':str(td/'runtime'),'HOME':str(home),'THF_HOST':'127.0.0.1','THF_PORT':'0','THF_QUIET':'1'})
              sys.path.insert(0,str(work)); os.chdir(work)
              real_connect=socket.socket.connect; real_create=socket.create_connection
              def loop(h): return h in ('127.0.0.1','::1','localhost')
              def gc(self,address):
                  h=address[0] if isinstance(address,tuple) and address else None
                  if not loop(h): raise RuntimeError('external network blocked')
                  return real_connect(self,address)
              def gcc(address,*a,**kw):
                  h=address[0] if isinstance(address,tuple) and address else None
                  if not loop(h): raise RuntimeError('external network blocked')
                  return real_create(address,*a,**kw)
              socket.socket.connect=gc; socket.create_connection=gcc
              server=thread=None
              try:
                  mod=importlib.import_module('thf.app'); server=mod.make_server('127.0.0.1',0,work,db); port=server.server_address[1]
                  thread=threading.Thread(target=server.serve_forever,daemon=True); thread.start()
                  def req(method,path,payload=None,token=None):
                      body=None if payload is None else json.dumps(payload,separators=(',',':'))
                      hs={'Accept':'application/json','Connection':'close'}
                      if body is not None: hs.update({'Content-Type':'application/json','Content-Length':str(len(body.encode()))})
                      if token: hs['Authorization']='Bearer '+token
                      c=http.client.HTTPConnection('127.0.0.1',port,timeout=5)
                      try:
                          c.request(method,path,body=body,headers=hs); r=c.getresponse(); raw=r.read(65536)
                          try: obj=json.loads(raw.decode() or '{}')
                          except Exception: obj={}
                          return r.status,obj
                      finally:c.close()
                  def pick(obj,names):
                      if isinstance(obj,dict):
                          for k,v in obj.items():
                              if k.lower() in names and isinstance(v,(str,int)): return v
                          for v in obj.values():
                              x=pick(v,names)
                              if x is not None:return x
                      elif isinstance(obj,list):
                          for v in obj:
                              x=pick(v,names)
                              if x is not None:return x
                  suffix=uuid.uuid4().hex[:10]; pw='Qa!'+uuid.uuid4().hex+'9z'; users=[]
                  for tag in ('a','b'):
                      u='qa_role_'+tag+'_'+suffix
                      st,ob=req('POST','/api/auth/register',{'username':u,'password':pw}); add('register_'+tag,st,st in (200,201))
                      uid=pick(ob,{'id','user_id','userid'})
                      st,ob=req('POST','/api/auth/login',{'username':u,'password':pw}); tok=pick(ob,{'token','access_token','session_token'})
                      add('login_'+tag,st,st==200 and isinstance(tok,str) and len(tok)>=8)
                      if uid is None: uid=pick(ob,{'id','user_id','userid'})
                      users.append((uid,tok))
                  (a_id,a_tok),(b_id,b_tok)=users; assert a_tok and b_tok
                  st,_=req('GET','/api/economy/balance',token=a_tok); add('authenticated_balance_a',st,st==200)
                  st,_=req('GET','/api/economy/balance',token='invalid-local-token'); add('invalid_token_balance_rejected',st,st in (401,403))
                  st,_=req('POST','/api/world/environment',{'weather':'qa-probe'},token=a_tok); add('ordinary_user_world_admin_rejected',st,st in (401,403))
                  st,_=req('POST','/api/economy/internal-award',{'user_id':a_id,'amount':1,'reason':'qa-probe'},token=a_tok); add('ordinary_user_internal_award_rejected',st,st in (401,403))
                  avatar_payload={'style':'qa-probe'}
                  bad_st,_=req('POST','/api/avatar/generate',avatar_payload,token='invalid-local-token')
                  good_st,_=req('POST','/api/avatar/generate',avatar_payload,token=a_tok)
                  add('avatar_auth_gate_distinguishes_valid_identity',good_st,bad_st in (401,403) and good_st not in (401,403),
                      'valid token reaches payload validation; this is NOT avatar functional PASS')
                  injected={'user_id':b_id,'x':1.25,'y':2.5,'z':0.0,'zone':'qa'}
                  st,ob=req('POST','/api/social/position',injected,token=a_tok)
                  returned_id=pick(ob,{'user_id','userid','owner_id','ownerid','id'})
                  identity_safe=(st in (200,201,204) and (b_id is None or str(returned_id)!=str(b_id)))
                  add('social_position_body_identity_injection_blocked',st,identity_safe,'actor remains bearer-bound')
                  st,ob=req('POST','/api/arena/start',{},token=a_tok); sid=pick(ob,{'session_id','sessionid','match_id','matchid','id'})
                  add('arena_start_authenticated_a',st,st in (200,201) and sid is not None)
                  result['role_check_count']=len(result['checks']); result['role_passed_count']=sum(1 for c in result['checks'] if c['passed'])
                  result['role_authority_passed']=all(c['passed'] for c in result['checks'])
              except Exception as e:
                  result['tooling_error']=type(e).__name__+': '+str(e); result['trace_tail']=traceback.format_exc().splitlines()[-8:]
              finally:
                  if server is not None: server.shutdown(); server.server_close()
                  if thread is not None: thread.join(timeout=5)
                  socket.socket.connect=real_connect; socket.create_connection=real_create
          after=tree_sha(src); result['canonical_source_modified']=(before!=after); result['runtime_source_sha256_after']=after
          print('__THF_JSON_BEGIN__'); print(json.dumps(result,indent=2,sort_keys=True)); print('__THF_JSON_END__')
          PY
          python3 - <<'PY'
          import json,pathlib
          raw=pathlib.Path('out/role-authority.raw').read_text(errors='ignore')
          a=raw.rfind('__THF_JSON_BEGIN__'); b=raw.rfind('__THF_JSON_END__'); assert a>=0 and b>a
          x=json.loads(raw[a+len('__THF_JSON_BEGIN__'):b].strip())
          pathlib.Path('out/role-authority.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          assert x.get('canonical_source_modified') is False
          assert x.get('external_network_allowed') is False and x.get('production_credentials_used') is False
          assert x.get('wave_files_read_or_changed') is False and 'tooling_error' not in x
          assert x.get('role_authority_passed') is True, x.get('checks')
          assert x.get('arena_ownership_proof') == 'PENDING_STRONG_SAME_ACTION_CONTROL'
          print('AUTHENTICATED_ROLE_AUTHORITY=PASS')
          print('ARENA_OWNERSHIP_PROOF=PENDING_STRONG_SAME_ACTION_CONTROL')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-GAME-BACKEND-AUTHENTICATED-ROLE-AUTHORITY-V2
          path: out/
          retention-days: 14
