name: THF TokenOps RPC Capability Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/TokenOps/**'
      - '.github/workflows/thf-tokenops-rpc-capability-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thf-tokenops-rpc-capability-gate-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-rpc-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Compile and test RPC capability control
        run: |
          set -euo pipefail
          python -m py_compile ReleaseOps/TokenOps/rpc_capability_probe.py
          python -m py_compile ReleaseOps/TokenOps/holder_concentration_probe.py
          python -m pip install --disable-pip-version-check --no-input pytest
          python -m pytest ReleaseOps/TokenOps/test_rpc_capability_probe.py ReleaseOps/TokenOps/test_holder_concentration_probe.py -q

      - name: Build read-only Solana Mainnet RPC capability evidence
        run: |
          set -euo pipefail
          rm -rf out/tokenops-rpc
          python ReleaseOps/TokenOps/rpc_capability_probe.py --out out/tokenops-rpc/rpc-capability.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/tokenops-rpc/rpc-capability.json').read_text())
          assert p['network'] == 'solana-mainnet-beta'
          assert p['execution_authorized'] is False
          assert p['transaction_bytes_created'] is False
          assert p['instruction_bytes_created'] is False
          assert p['signed'] is False
          assert p['submitted'] is False
          assert p['broadcast'] is False
          assert p['financial_effect'] is False
          assert p['private_key_used'] is False
          assert p['wave_touched'] is False
          assert all('/<redacted>' in row['endpoint'] for row in p['candidates'])
          print('RPC_CAPABILITY_STATUS=' + p['status'])
          print('RPC_CANDIDATE_COUNT=' + str(p['candidate_count']))
          print('RPC_HOLDER_CONCENTRATION_STATUS=' + p['holder_concentration_status'])
          print('RPC_CAPABILITY_SHA256=' + p['probe_sha256'])
          PY

      - name: Run failover-aware holder concentration probe
        run: |
          set -euo pipefail
          python ReleaseOps/TokenOps/holder_concentration_probe.py --attempts 4 --out out/tokenops-rpc/holder-concentration.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/tokenops-rpc/holder-concentration.json').read_text())
          assert p['execution_authorized'] is False
          assert p['broadcast'] is False
          assert p['financial_effect'] is False
          assert p['private_key_used'] is False
          assert p['wave_touched'] is False
          print('HOLDER_CONCENTRATION_STATUS=' + p['status'])
          print('HOLDER_CONCENTRATION_ATTEMPTS=' + str(p['attempts']))
          print('HOLDER_CONCENTRATION_SHA256=' + p['probe_sha256'])
          PY

      - name: Create SHA-256 evidence
        run: |
          set -euo pipefail
          cd out/tokenops-rpc
          sha256sum *.json | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload immutable read-only RPC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-RPC-Capability-v1-${{ github.run_id }}
          path: out/tokenops-rpc/
          if-no-files-found: error
          retention-days: 30
