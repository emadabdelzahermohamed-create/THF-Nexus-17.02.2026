name: THF Terra RC34 Runtime-Fixed APK V1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-terra-rc34-runtime-fixed-apk-v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  FULL_NAME: THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip
  FULL_SHA: eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68

jobs:
  build-runtime-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Export complete Godot APK and enforce project payload
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=35m --quiet --command="FULL_NAME='$FULL_NAME' FULL_SHA='$FULL_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          BASE="$HOME"; INPUT="$BASE/thf-terra-rc34-gate/input"; ROOT="$BASE/thf-terra-rc34-runtime-fixed-v1"; WORK="$ROOT/work"; OUT="$ROOT/out"
          rm -rf "$ROOT"; mkdir -p "$WORK" "$OUT"
          SRC="$INPUT/$FULL_NAME"
          echo "$FULL_SHA  $SRC" | sha256sum -c -
          python3 - "$SRC" "$WORK" <<'PY'
import pathlib, shutil, sys, zipfile
src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]).resolve()
with zipfile.ZipFile(src) as z:
    for info in z.infolist():
        rel=pathlib.PurePosixPath(info.filename)
        if rel.is_absolute() or '..' in rel.parts: raise SystemExit('unsafe zip member')
        target=(dst/pathlib.Path(*rel.parts)).resolve()
        if target != dst and dst not in target.parents: raise SystemExit('zip escape')
        if info.is_dir(): target.mkdir(parents=True,exist_ok=True); continue
        target.parent.mkdir(parents=True,exist_ok=True)
        with z.open(info) as r, open(target,'wb') as w: shutil.copyfileobj(r,w)
PY
          test -f "$WORK/project.godot"; test -f "$WORK/export_presets.cfg"
          PRESET="Android AAB Candidate"; grep -q "name=\"$PRESET\"" "$WORK/export_presets.cfg"
          # Candidate-only conversion from AAB output to installable APK. Canonical archive is never changed.
          python3 - "$WORK/export_presets.cfg" <<'PY'
import pathlib,sys,re
p=pathlib.Path(sys.argv[1]); s=p.read_text()
if 'gradle_build/export_format=1' in s: s=s.replace('gradle_build/export_format=1','gradle_build/export_format=0',1)
elif 'gradle_build/export_format=0' not in s: raise SystemExit('missing Android export format marker')
p.write_text(s)
PY
          GODOT="$BASE/thf-tools/godot/4.7.2-stable/godot"; SDK="$BASE/thf-builder-rc16-build/android-sdk"; TEMPLATE_ROOT="$BASE/.local/share/godot/export_templates/4.7.2.stable"
          test -x "$GODOT"; test -x "$SDK/build-tools/36.0.0/aapt2"; test -f "$SDK/platforms/android-36/android.jar"; test -f "$TEMPLATE_ROOT/android_source.zip"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"; ISO="$ROOT/godot-home"; mkdir -p "$ISO/.config/godot" "$ISO/.local/share/godot"
          ln -s "$BASE/.local/share/godot/export_templates" "$ISO/.local/share/godot/export_templates"
          printf '%s\n' '[gd_resource format=3]' '' '[resource]' "export/android/android_sdk_path = \"$SDK\"" "export/android/java_sdk_path = \"$JAVA_HOME_REAL\"" > "$ISO/.config/godot/editor_settings-4.7.tres"
          export HOME="$ISO" ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK" JAVA_HOME="$JAVA_HOME_REAL" PATH="$JAVA_HOME_REAL/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"
          timeout 15m "$GODOT" --headless --editor --path "$WORK" --quit --verbose >"$OUT/import.log" 2>&1
          timeout 5m "$GODOT" --headless --path "$WORK" --quit-after 30 --verbose >"$OUT/boot.log" 2>&1
          timeout 5m "$GODOT" --headless --editor --path "$WORK" --install-android-build-template --quit >"$OUT/template.log" 2>&1 || true
          if [ ! -f "$WORK/android/build/gradlew" ]; then
            python3 - "$TEMPLATE_ROOT/android_source.zip" "$WORK/android/build" <<'PY'
import pathlib,shutil,sys,zipfile
src,dst=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]).resolve(); dst.mkdir(parents=True,exist_ok=True)
with zipfile.ZipFile(src) as z:
  for i in z.infolist():
    r=pathlib.PurePosixPath(i.filename)
    if r.is_absolute() or '..' in r.parts: raise SystemExit('unsafe template member')
    t=(dst/pathlib.Path(*r.parts)).resolve()
    if t!=dst and dst not in t.parents: raise SystemExit('template escape')
    if i.is_dir(): t.mkdir(parents=True,exist_ok=True); continue
    t.parent.mkdir(parents=True,exist_ok=True)
    with z.open(i) as a, open(t,'wb') as b: shutil.copyfileobj(a,b)
PY
            chmod +x "$WORK/android/build/gradlew"
            printf '%s\n' '4.7.2.stable' > "$WORK/android/.build_version"
          fi
          APK="$OUT/THF-Terra-RC34-RUNTIME-FIXED.apk"
          timeout 20m "$GODOT" --headless --path "$WORK" --export-debug "$PRESET" "$APK" >"$OUT/export.log" 2>&1
          test -s "$APK"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose "$APK" >"$OUT/apksigner.txt" 2>&1
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >"$OUT/zipalign.txt" 2>&1
          "$SDK/build-tools/36.0.0/aapt2" dump badging "$APK" >"$OUT/badging.txt"
          grep -q "package: name='com.topherofit.thf.terra'" "$OUT/badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/badging.txt"
          ASSET_COUNT=$(unzip -Z1 "$APK" | grep -c '^assets/' || true)
          test "$ASSET_COUNT" -gt 0
          if unzip -Z1 "$APK" | grep -Eq '(^|/)([^/]+\.pck|project\.binary|\.godot/|assets/)'; then PAYLOAD=PASS; else PAYLOAD=FAIL; fi
          test "$PAYLOAD" = PASS
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$FULL_SHA"
          printf 'status=PASS\ncanonical_sha256=%s\napk_sha256=%s\nasset_count=%s\ngodot_payload=%s\npackage=com.topherofit.thf.terra\ntarget_sdk=36\nproduction_signing=false\ncanonical_archive_mutated=false\nwave_untouched=true\n' "$FULL_SHA" "$APK_SHA" "$ASSET_COUNT" "$PAYLOAD" | tee "$OUT/TRUTH.txt"
          REMOTE
      - name: Retrieve APK and evidence
        shell: bash
        run: |
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-terra-rc34-runtime-fixed-v1/out/*" out/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Terra-RC34-RUNTIME-FIXED-APK
          path: out/
          retention-days: 14
      - name: Final runtime packaging gate
        run: |
          grep -q '^status=PASS$' out/TRUTH.txt
          grep -q '^godot_payload=PASS$' out/TRUTH.txt
          grep -q '^wave_untouched=true$' out/TRUTH.txt
