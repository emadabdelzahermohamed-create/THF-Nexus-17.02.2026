name: THF Terra RC34 Runtime-Fixed APK V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-terra-rc34-runtime-fixed-apk-v1.yml'
      - 'ReleaseOps/scripts/godot_runtime_fixed_apk_v1.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  FULL_NAME: THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip
  FULL_SHA: eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68

jobs:
  build-runtime-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Export complete Godot APK with project payload
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=35m --quiet \
            --command="FULL_NAME='$FULL_NAME' FULL_SHA='$FULL_SHA' INPUT_REL='thf-terra-rc34-gate/input' ROOT_REL='thf-terra-rc34-runtime-fixed-v1' EXPECTED_PACKAGE='com.topherofit.thf.terra' OUTPUT_BASENAME='THF-Terra-RC34-RUNTIME-FIXED.apk' bash -s" \
            < ReleaseOps/scripts/godot_runtime_fixed_apk_v1.sh
      - name: Retrieve APK and evidence
        shell: bash
        run: |
          mkdir -p out
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-terra-rc34-runtime-fixed-v1/out/*" out/ \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-Terra-RC34-RUNTIME-FIXED-APK
          path: out/
          retention-days: 14
      - name: Final runtime packaging gate
        run: |
          grep -q '^status=PASS$' out/TRUTH.txt
          grep -q '^godot_payload=PASS$' out/TRUTH.txt
          grep -q '^wave_untouched=true$' out/TRUTH.txt
