name: WAVE RC15.4 Stream Capability Check

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-4-stream-capability-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Stream API permissions read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for endpoint in "stream?per_page=1" "stream/live_inputs?per_page=1"; do
            code="$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/${endpoint}")"
            success="$(jq -r '.success // false' /tmp/body.json 2>/dev/null || echo false)"
            errors="$(jq -c '[.errors[]? | {code,message}]' /tmp/body.json 2>/dev/null || echo '[]')"
            echo "${endpoint}: http=${code} success=${success} errors=${errors}"
          done
