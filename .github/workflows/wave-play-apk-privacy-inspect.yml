name: WAVE Play APK Privacy Inspect

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-play-apk-privacy-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  WAVE_PACKAGE: com.wave.mawja
  WAVE_VERSION_CODE: '15302'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google Play
        id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Download exact Play-generated APK for 15302
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p play-apk
          meta_url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/generatedApks/$WAVE_VERSION_CODE"
          code="$(curl -sS -o play-apk/generated.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$meta_url")"
          echo "GENERATED_APKS_HTTP=$code"
          test "$code" = 200

          python3 - <<'PY'
          import json, pathlib
          d=json.load(open("play-apk/generated.json"))
          groups=d.get("generatedApks") or []
          candidates=[]
          for gi,g in enumerate(groups):
              u=g.get("generatedUniversalApk") or {}
              if u.get("downloadId"):
                  candidates.append((0,gi,"universal",u.get("downloadId"),u))
              for ai,a in enumerate(g.get("generatedStandaloneApks") or []):
                  if a.get("downloadId"):
                      candidates.append((1,gi,f"standalone-{ai}",a.get("downloadId"),a))
              for ai,a in enumerate(g.get("generatedSplitApks") or []):
                  if not a.get("downloadId"):
                      continue
                  variant=a.get("variantId")
                  module=a.get("moduleName","")
                  split=a.get("splitId","")
                  pri=2 if module=="base" and not split else 3
                  candidates.append((pri,gi,f"split-{ai}",a.get("downloadId"),a))
          if not candidates:
              raise SystemExit("NO_PLAY_GENERATED_APK_DOWNLOAD_ID")
          candidates.sort(key=lambda x:(x[0],x[1],x[2]))
          pri,gi,kind,did,obj=candidates[0]
          pathlib.Path("play-apk/download-id.txt").write_text(str(did))
          pathlib.Path("play-apk/selected.json").write_text(json.dumps({"kind":kind,"groupIndex":gi,"downloadId":did,"metadata":obj},indent=2))
          print("SELECTED_KIND="+kind)
          print("DOWNLOAD_ID="+str(did))
          PY

          download_id="$(cat play-apk/download-id.txt)"
          dl_url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/generatedApks/$WAVE_VERSION_CODE/downloads/$download_id:download?alt=media"
          dl_code="$(curl -L -sS -o play-apk/wave-play-15302.apk -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$dl_url")"
          echo "APK_DOWNLOAD_HTTP=$dl_code"
          case "$dl_code" in 200|206) ;; *) exit 37;; esac
          test -s play-apk/wave-play-15302.apk
          file play-apk/wave-play-15302.apk
          unzip -tq play-apk/wave-play-15302.apk >/dev/null
          sha256sum play-apk/wave-play-15302.apk | tee play-apk/wave-play-15302.apk.sha256

      - name: Inspect manifest permissions and package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          AAPT="$(command -v aapt || true)"
          if [ -z "$AAPT" ]; then
            AAPT="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$AAPT"
          echo "AAPT=$AAPT"

          "$AAPT" dump badging play-apk/wave-play-15302.apk > play-apk/badging.txt
          "$AAPT" dump permissions play-apk/wave-play-15302.apk > play-apk/permissions.txt
          unzip -l play-apk/wave-play-15302.apk > play-apk/entries.txt

          grep -q "package: name='com.wave.mawja'" play-apk/badging.txt
          grep -q "versionCode='15302'" play-apk/badging.txt

          python3 - <<'PY'
          from pathlib import Path
          import re,json,zipfile,subprocess,tempfile,os

          perm_text=Path("play-apk/permissions.txt").read_text(errors="ignore")
          perms=sorted(set(re.findall(r"android\.permission\.[A-Z0-9_]+",perm_text)))

          apk=Path("play-apk/wave-play-15302.apk")
          markers={
            "admob": ["com/google/android/gms/ads","com.google.android.gms.ads","google_mobile_ads","admob"],
            "firebase_analytics": ["com/google/firebase/analytics","com.google.firebase.analytics","firebase-analytics"],
            "ad_id": ["com.google.android.gms.permission.AD_ID","android.permission.AD_ID"],
          }
          hits={k:[] for k in markers}
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              name_blob="\n".join(names).lower()
              for k,vals in markers.items():
                  for v in vals:
                      if v.lower() in name_blob:
                          hits[k].append("entry:"+v)
              dex=[n for n in names if n.startswith("classes") and n.endswith(".dex")]
              for n in dex:
                  data=z.read(n)
                  s=data.decode("latin1","ignore").lower()
                  for k,vals in markers.items():
                      for v in vals:
                          if v.lower() in s and ("dex:"+v) not in hits[k]:
                              hits[k].append("dex:"+v)

          result={
            "package":"com.wave.mawja",
            "versionCode":15302,
            "permissions":perms,
            "has_camera_permission":"android.permission.CAMERA" in perms,
            "has_microphone_permission":"android.permission.RECORD_AUDIO" in perms,
            "has_location_permission":any(p in perms for p in ("android.permission.ACCESS_FINE_LOCATION","android.permission.ACCESS_COARSE_LOCATION")),
            "has_ad_id_permission":"android.permission.AD_ID" in perms or bool(hits["ad_id"]),
            "admob_markers":hits["admob"],
            "firebase_analytics_markers":hits["firebase_analytics"],
            "ad_id_markers":hits["ad_id"],
          }
          Path("WAVE_PLAY_15302_PRIVACY_INSPECTION.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY

      - name: Render evidence summary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          r=json.load(open("WAVE_PLAY_15302_PRIVACY_INSPECTION.json"))
          lines=[
            "# WAVE Play 15302 Privacy Inspection",
            "",
            f"- package: {r['package']}",
            f"- versionCode: {r['versionCode']}",
            f"- permissions: {', '.join(r['permissions']) if r['permissions'] else 'NONE'}",
            f"- camera permission: {r['has_camera_permission']}",
            f"- microphone permission: {r['has_microphone_permission']}",
            f"- location permission: {r['has_location_permission']}",
            f"- AD_ID permission/marker: {r['has_ad_id_permission']}",
            f"- AdMob SDK markers: {len(r['admob_markers'])}",
            f"- Firebase Analytics markers: {len(r['firebase_analytics_markers'])}",
          ]
          pathlib.Path("WAVE_PLAY_15302_PRIVACY_INSPECTION.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WAVE-PLAY-15302-PRIVACY-INSPECTION
          retention-days: 30
          path: |
            WAVE_PLAY_15302_PRIVACY_INSPECTION.json
            WAVE_PLAY_15302_PRIVACY_INSPECTION.md
            play-apk/generated.json
            play-apk/selected.json
            play-apk/badging.txt
            play-apk/permissions.txt
            play-apk/entries.txt
            play-apk/wave-play-15302.apk.sha256
