name: THF Terra RC33 Godot Android Gate

on:
  push:
    branches: ['terra/**']
    paths:
      - '.github/workflows/thf-terra-rc27-godot-gate.yml'
      - 'ReleaseOps/Terra/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  TERRA_ARCHIVE: THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip
  TERRA_SHA256: f50a0489c534306946f39603aaa2fa39e494fac5b4a7af906e03424d8457412b
  TERRA_PART0: THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip.part.00
  TERRA_PART0_SHA256: 02a56c856bbbd47d38169e71b5e68ecfd21282a23130ff9e2bd3ff1581353978
  TERRA_PART1: THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip.part.01
  TERRA_PART1_SHA256: 2f5f5183b6087930b94de8c29fb0eef833bf9b5a7d8f5258fb979394592b345e

jobs:
  terra-godot-android-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify exact RC33 and run Terra-only Godot 4.7.2 + Android test export
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command="bash -s" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/terra-rc33-gate.log"
          set -Eeuo pipefail
          ARCHIVE='THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip'
          EXPECT='f50a0489c534306946f39603aaa2fa39e494fac5b4a7af906e03424d8457412b'
          PART0='THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip.part.00'
          PART0_SHA='02a56c856bbbd47d38169e71b5e68ecfd21282a23130ff9e2bd3ff1581353978'
          PART1='THF_Terra_v4.6.7_RC33_ANDROID_TEXTURE_EXPORT_READINESS_CUMULATIVE_SOURCE.zip.part.01'
          PART1_SHA='2f5f5183b6087930b94de8c29fb0eef833bf9b5a7d8f5258fb979394592b345e'
          ROOT="$HOME/thf-terra-rc33-gate"
          INPUT="$ROOT/input"
          WORK="$ROOT/work"
          OUT="$ROOT/out"
          rm -rf "$ROOT"
          mkdir -p "$INPUT" "$WORK" "$OUT"

          candidates=(
            "$HOME/thf-builder/inputs-rc33-terra"
            "$HOME/thf-builder/inputs-rc32-terra"
            "$HOME/thf-builder/inputs-rc18-terra"
            "$HOME/thf-builder/inputs"
          )
          found=''
          for d in "${candidates[@]}"; do
            if [ -f "$d/$ARCHIVE" ]; then found="$d/$ARCHIVE"; break; fi
          done
          if [ -z "$found" ]; then
            p0=''; p1=''
            for d in "${candidates[@]}"; do
              [ -z "$p0" ] && [ -f "$d/$PART0" ] && p0="$d/$PART0"
              [ -z "$p1" ] && [ -f "$d/$PART1" ] && p1="$d/$PART1"
            done
            if [ -n "$p0" ] && [ -n "$p1" ]; then
              echo "$PART0_SHA  $p0" | sha256sum -c -
              echo "$PART1_SHA  $p1" | sha256sum -c -
              cat "$p0" "$p1" > "$INPUT/$ARCHIVE"
              found="$INPUT/$ARCHIVE"
            fi
          fi
          if [ -z "$found" ]; then
            printf 'status=BLOCKED_MISSING_RC33_INPUT\nexpected_archive=%s\nexpected_sha256=%s\n' "$ARCHIVE" "$EXPECT" | tee "$OUT/TRUTH.txt"
            echo WAVE_UNTOUCHED=TRUE | tee -a "$OUT/TRUTH.txt"
            exit 42
          fi

          echo "$EXPECT  $found" | sha256sum -c -
          cp "$found" "$INPUT/$ARCHIVE"
          unzip -q "$INPUT/$ARCHIVE" -d "$WORK"
          test -f "$WORK/project.godot"
          test -f "$WORK/export_presets.cfg"
          test -f "$WORK/android/app/build.gradle"
          grep -q 'versionCode 42067' "$WORK/android/app/build.gradle"
          grep -q "versionName '4.6.7-rc33'" "$WORK/android/app/build.gradle"
          grep -q 'rendering/textures/vram_compression/import_etc2_astc=true' "$WORK/project.godot"

          GODOT="$HOME/thf-tools/godot/4.7.2-stable/godot"
          if [ ! -x "$GODOT" ]; then
            printf 'status=BLOCKED_GODOT_4_7_2_MISSING\npath=%s\n' "$GODOT" | tee "$OUT/TRUTH.txt"
            exit 43
          fi
          "$GODOT" --version | tee "$OUT/GODOT_VERSION.txt"
          rm -rf "$WORK/.godot"

          set +e
          timeout 15m "$GODOT" --headless --editor --path "$WORK" --quit --verbose > "$OUT/editor-import.log" 2>&1
          import_rc=$?
          timeout 5m "$GODOT" --headless --path "$WORK" --quit-after 30 --verbose > "$OUT/headless-boot.log" 2>&1
          boot_rc=$?
          set -e

          script_errors=0
          for log in "$OUT/editor-import.log" "$OUT/headless-boot.log"; do
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Parser Error|ERROR: Failed to load script|Cannot load script|Compile Error' "$log"; then
              script_errors=$((script_errors+1))
              grep -Ein 'SCRIPT ERROR|Parse Error|Parser Error|ERROR: Failed to load script|Cannot load script|Compile Error' "$log" | head -200 >> "$OUT/script-errors.txt" || true
            fi
          done
          if [ "$import_rc" -ne 0 ] || [ "$boot_rc" -ne 0 ] || [ "$script_errors" -ne 0 ]; then
            printf 'status=FAIL_GODOT\nimport_rc=%s\nboot_rc=%s\nscript_error_logs=%s\n' "$import_rc" "$boot_rc" "$script_errors" | tee "$OUT/TRUTH.txt"
            exit 44
          fi

          # Install only the disposable project Gradle template if absent.
          if [ ! -d "$WORK/android/build" ]; then
            TEMPLATE_ZIP="$HOME/thf-tools/godot/4.7.2-stable/android_source.zip"
            if [ ! -f "$TEMPLATE_ZIP" ]; then
              printf 'status=BLOCKED_ANDROID_GRADLE_TEMPLATE_MISSING\npath=%s\n' "$TEMPLATE_ZIP" | tee "$OUT/TRUTH.txt"
              exit 45
            fi
            mkdir -p "$WORK/android/build"
            unzip -q "$TEMPLATE_ZIP" -d "$WORK/android/build"
          fi

          mkdir -p "$OUT/android"
          set +e
          timeout 20m "$GODOT" --headless --path "$WORK" --export-debug "Android AAB Candidate" "$OUT/android/THF-Terra-RC33-test.aab" > "$OUT/android-export.log" 2>&1
          export_rc=$?
          set -e
          if [ "$export_rc" -ne 0 ] || [ ! -s "$OUT/android/THF-Terra-RC33-test.aab" ]; then
            printf 'status=FAIL_ANDROID_TEST_EXPORT\nexport_rc=%s\n' "$export_rc" | tee "$OUT/TRUTH.txt"
            exit 46
          fi
          unzip -t "$OUT/android/THF-Terra-RC33-test.aab" > "$OUT/aab-integrity.log"
          sha256sum "$OUT/android/THF-Terra-RC33-test.aab" > "$OUT/AAB_SHA256.txt"
          printf 'status=PASS\ncanonical_sha256=%s\nimport_rc=0\nboot_rc=0\nandroid_test_export_rc=0\nproduction_signed=false\ncanonical_archive_mutated=false\nwave_untouched=true\n' "$EXPECT" | tee "$OUT/TRUTH.txt"
          sha256sum "$OUT"/* 2>/dev/null > "$OUT/SHA256SUMS.txt" || true
          REMOTE
          rc=${PIPESTATUS[0]}
          echo "gate_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "TERRA_GATE_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      - name: Retrieve Terra RC33 evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p terra-rc33-evidence "$RUNNER_TEMP/terra-rc33-evidence"
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=15m --quiet --command='set -Eeuo pipefail; ROOT="$HOME/thf-terra-rc33-gate"; [ -d "$ROOT/out" ] && tar -cf "$ROOT/terra-rc33-evidence.tar" -C "$ROOT" out' || true
          gcloud compute scp "$GCP_BUILDER:~/thf-terra-rc33-gate/terra-rc33-evidence.tar" "$RUNNER_TEMP/terra-rc33-evidence/evidence.tar" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          [ -f "$RUNNER_TEMP/terra-rc33-evidence/evidence.tar" ] && tar -xf "$RUNNER_TEMP/terra-rc33-evidence/evidence.tar" -C terra-rc33-evidence || true
          cp "$RUNNER_TEMP/terra-rc33-gate.log" terra-rc33-evidence/ || true
          printf 'workflow_rc=%s\nsource=TERRA-RC33\nsource_sha256=%s\n' "${TERRA_GATE_RC:-missing}" "$TERRA_SHA256" > terra-rc33-evidence/RUNNER_SUMMARY.txt
          exit 0

      - name: Upload Terra RC33 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THF-Terra-RC33-Godot-Android-evidence
          path: terra-rc33-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Terra RC33 gate conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${TERRA_GATE_RC:-missing}" in
            0) echo TERRA_RC33_GODOT_ANDROID_GATE=PASS ;;
            42) echo TERRA_RC33_GATE=BLOCKED_MISSING_EXACT_INPUT; exit 42 ;;
            43) echo TERRA_RC33_GATE=BLOCKED_GODOT_4_7_2_MISSING; exit 43 ;;
            44) echo TERRA_RC33_GATE=FAIL_GODOT_DIAGNOSTIC_REQUIRED; exit 44 ;;
            45) echo TERRA_RC33_GATE=BLOCKED_ANDROID_GRADLE_TEMPLATE_MISSING; exit 45 ;;
            46) echo TERRA_RC33_GATE=FAIL_ANDROID_TEST_EXPORT; exit 46 ;;
            *) echo TERRA_RC33_GATE=FAIL_CI_OR_AUTH_REQUIRED; exit 1 ;;
          esac
          echo CANONICAL_ARCHIVE_MUTATED=FALSE
          echo WAVE_UNTOUCHED=TRUE
