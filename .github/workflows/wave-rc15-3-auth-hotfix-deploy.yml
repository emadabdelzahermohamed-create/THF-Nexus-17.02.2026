name: WAVE RC15.3 Auth Hotfix Deploy

on:
  push:
    branches:
      - releaseops/wave-rc15-3-20260917
    paths:
      - '.github/workflows/wave-rc15-3-auth-hotfix-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DRIVE_FILE_ID: 1B35W6nyNlhpJCv0wjRXleNRXWuoVOn16
  EXPECTED_RC15_SHA256: 71965ff9ed3405304743b4014cbbac269b96d83533557f28381781e67520d41f
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  CLOUDFLARE_D1_DATABASE_NAME: wave-mawja-prod
  WAVE_PUBLIC_URL: https://wave-mawja.p-my.workers.dev

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google WIF for locked baseline read
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Reconstruct exact RC15.3 hotfix source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import os, requests, google.auth
          from google.auth.transport.requests import Request
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          r=requests.get(
              f"https://www.googleapis.com/drive/v3/files/{os.environ['DRIVE_FILE_ID']}?alt=media",
              headers={'Authorization':f'Bearer {creds.token}'}, timeout=120)
          r.raise_for_status()
          open('WAVE_RC15_BASE.zip','wb').write(r.content)
          PY
          echo "$EXPECTED_RC15_SHA256  WAVE_RC15_BASE.zip" | sha256sum -c -
          mkdir wave-src
          unzip -q WAVE_RC15_BASE.zip -d wave-src
          cd wave-src
          git init -q
          git add .
          git -c user.name=wave-builder -c user.email=wave-builder@example.invalid commit -qm baseline
          git apply --check ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_1_SIGNING_CARRYFORWARD.patch
          git apply --check ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          git apply ../ReleaseOps/WAVE/RC15_3/WAVE_RC15_3_EXISTING_FILES.patch
          cp -a ../ReleaseOps/WAVE/RC15_3/overlay/. .
          sha256sum -c RC15_3_CRITICAL_SHA256SUMS.txt
          grep -q 'const DEFAULT_ITERATIONS = 100_000;' lib/wave-auth.ts
          ! grep -q 'const DEFAULT_ITERATIONS = 210_000;' lib/wave-auth.ts
          echo 'HOTFIX_SOURCE=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wave-src/package-lock.json

      - name: Discover existing WAVE D1 binding read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          token_json="$(curl -fsS -H "$auth" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$token_json" | jq -e '.success == true and .result.status == "active"' >/dev/null
          d1="$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
          echo "$d1" | jq -e '.success == true' >/dev/null
          db_id="$(echo "$d1" | jq -r '.result[] | select(.name == "wave-mawja-prod") | .uuid' | head -n1)"
          [ -n "$db_id" ] && [ "$db_id" != null ]
          echo "CLOUDFLARE_D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"
          echo 'D1_BINDING_DISCOVERY=PASS'

      - name: Test and build
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m unittest discover -s tests -p '*_test.py'
          node --test tests/multi-ingest-source.test.mjs tests/service-worker.test.mjs
          npm run typecheck
          npm run build
          jq -e --arg id "$CLOUDFLARE_D1_DATABASE_ID" '
            .name == "wave-mawja"
            and any(.d1_databases[]?; .binding == "DB" and .database_name == "wave-mawja-prod" and .database_id == $id)
          ' dist/server/wrangler.json >/dev/null
          echo 'HOTFIX_BUILD=PASS'

      - name: Confirm auth tables already exist read-only
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler@4.119.0 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('wave_credentials','wave_sessions') ORDER BY name;" | tee ../WAVE_RC15_3_AUTH_TABLES_HOTFIX.txt
          grep -q 'wave_credentials' ../WAVE_RC15_3_AUTH_TABLES_HOTFIX.txt
          grep -q 'wave_sessions' ../WAVE_RC15_3_AUTH_TABLES_HOTFIX.txt
          echo 'AUTH_SCHEMA=PASS'

      - name: Deploy WAVE worker code only
        working-directory: wave-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler@4.119.0 deploy --config dist/server/wrangler.json | tee ../WAVE_RC15_3_AUTH_HOTFIX_DEPLOY.txt
          echo 'AUTH_HOTFIX_DEPLOY=PASS'

      - name: Smoke live auth routes
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(curl -L -sS -o /tmp/root -w '%{http_code}' "$WAVE_PUBLIC_URL/")"
          login_page="$(curl -L -sS -o /tmp/login-page -w '%{http_code}' "$WAVE_PUBLIC_URL/login")"
          bad_register="$(curl -sS -o /tmp/bad-reg -w '%{http_code}' -X POST "$WAVE_PUBLIC_URL/api/auth/register" -H "Origin: $WAVE_PUBLIC_URL" -H 'Content-Type: application/json' --data '{"email":"bad","displayName":"","password":"x"}')"
          [ "$root" = 200 ]
          [ "$login_page" = 200 ]
          [ "$bad_register" = 400 ]
          printf 'root=%s\nlogin_page=%s\nbad_register=%s\n' "$root" "$login_page" "$bad_register" > WAVE_RC15_3_AUTH_HOTFIX_SMOKE.txt
          echo 'AUTH_HOTFIX_SMOKE=PASS'

      - name: Upload non-sensitive evidence
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-RC15-3-AUTH-HOTFIX-DEPLOY
          retention-days: 14
          path: |
            WAVE_RC15_3_AUTH_TABLES_HOTFIX.txt
            WAVE_RC15_3_AUTH_HOTFIX_DEPLOY.txt
            WAVE_RC15_3_AUTH_HOTFIX_SMOKE.txt
