name: THF TokenOps Reward Allocation V1
on:
  push:
    paths:
      - 'ReleaseOps/TokenOps/reward_allocation_engine.py'
      - 'ReleaseOps/TokenOps/test_reward_allocation_engine.py'
      - 'ReleaseOps/TokenOps/reward_eligibility_commitment.py'
      - '.github/workflows/thf-tokenops-reward-allocation-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile ReleaseOps/TokenOps/reward_eligibility_commitment.py ReleaseOps/TokenOps/reward_allocation_engine.py
      - name: Regression
        working-directory: ReleaseOps/TokenOps
        run: python -m unittest -v test_reward_eligibility_commitment.py test_reward_allocation_engine.py
      - name: Financial safety assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ReleaseOps/TokenOps/reward_allocation_engine.py').read_text()
          for x in ['ACTIVE_USER_BPS=3500','"sign":False','"broadcast":False','"financial_execution":False','anti_whale_bps']:
              assert x in p, x
          print('TokenOps reward allocation safety gate PASS')
          PY
