name: THF RC17 Godot Diagnostic Patch V1

on:
  push:
    branches: ['releaseops/**']
    paths: ['.github/workflows/thf-rc17-godot-diagnostic-patch-v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  diagnose-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Apply four type-only diagnostic edits and rerun Godot
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=30m --quiet \
            --command='set -uo pipefail
          GODOT="$HOME/thf-tools/godot/4.7.2-stable/godot"
          ROOT="$HOME/thf-builder-rc17-build/work"
          OUT="$HOME/thf-builder-rc17-build/out/godot-diagnostic-v1"
          T="$ROOT/terra/native/world/WorldMain.gd"
          R="$ROOT/rift/THF_Nexus_Arena_Core/native/arena/RiftAudioFeedback.gd"
          rm -rf "$OUT"; mkdir -p "$OUT"
          sha256sum "$T" "$R" > "$OUT/SHA_BEFORE.txt"
          cp "$T" "$OUT/WorldMain.before.gd"
          cp "$R" "$OUT/RiftAudioFeedback.before.gd"
          python3 - "$T" "$R" <<'"'"'PY'"'"'
          from pathlib import Path
          import sys
          t=Path(sys.argv[1]); r=Path(sys.argv[2])
          ts=t.read_text()
          old='''    var role_label := {\n        "gardener":"Gardener / البستاني",\n        "farmer":"Farmer / المزارع",\n        "fisher":"Fisher / الصياد",\n        "captain":"Captain / القبطان",\n        "shopkeeper":"Shopkeeper / البائع",\n        "barista":"Barista / الباريستا",\n        "auctioneer":"Auctioneer / مسؤول المزاد",\n        "editor":"Editor / المحرر",\n        "director":"Director / المخرج",\n        "career":"Career Guide / مرشد المهن"\n    }.get(role, "Citizen / مواطن")\n    var intent_label := {\n        "greet":"Greeting / تحية",\n        "talk":"Conversation / محادثة",\n        "work":"Working / يعمل",\n        "celebrate":"Celebration / احتفال"\n    }.get(intent, "World cue / تنبيه")'''
          new='''    var role_label: String = str({\n        "gardener":"Gardener / البستاني",\n        "farmer":"Farmer / المزارع",\n        "fisher":"Fisher / الصياد",\n        "captain":"Captain / القبطان",\n        "shopkeeper":"Shopkeeper / البائع",\n        "barista":"Barista / الباريستا",\n        "auctioneer":"Auctioneer / مسؤول المزاد",\n        "editor":"Editor / المحرر",\n        "director":"Director / المخرج",\n        "career":"Career Guide / مرشد المهن"\n    }.get(role, "Citizen / مواطن"))\n    var intent_label: String = str({\n        "greet":"Greeting / تحية",\n        "talk":"Conversation / محادثة",\n        "work":"Working / يعمل",\n        "celebrate":"Celebration / احتفال"\n    }.get(intent, "World cue / تنبيه"))'''
          if old not in ts: raise SystemExit('TERRA_EXPECTED_BLOCK_NOT_FOUND')
          t.write_text(ts.replace(old,new,1))
          rs=r.read_text()
          old1='        var extra := players.pop_back()'
          new1='        var extra: AudioStreamPlayer = players.pop_back() as AudioStreamPlayer'
          old2='''    var spec := {\n        "fire": [105.0, 0.055, 0.72],\n        "reload": [390.0, 0.075, 0.38],\n        "chamber": [520.0, 0.045, 0.30],\n        "hit": [155.0, 0.050, 0.30],\n    }.get(kind, [280.0, 0.045, 0.25])'''
          new2='''    var spec: Array = {\n        "fire": [105.0, 0.055, 0.72],\n        "reload": [390.0, 0.075, 0.38],\n        "chamber": [520.0, 0.045, 0.30],\n        "hit": [155.0, 0.050, 0.30],\n    }.get(kind, [280.0, 0.045, 0.25]) as Array'''
          if old1 not in rs: raise SystemExit('RIFT_EXTRA_LINE_NOT_FOUND')
          if old2 not in rs: raise SystemExit('RIFT_SPEC_BLOCK_NOT_FOUND')
          r.write_text(rs.replace(old1,new1,1).replace(old2,new2,1))
          print('DIAGNOSTIC_TYPE_ONLY_PATCH_APPLIED=PASS')
          PY
          cp "$T" "$OUT/WorldMain.after.gd"
          cp "$R" "$OUT/RiftAudioFeedback.after.gd"
          sha256sum "$T" "$R" > "$OUT/SHA_AFTER.txt"
          diff -u "$OUT/WorldMain.before.gd" "$OUT/WorldMain.after.gd" > "$OUT/TERRA_DIAGNOSTIC.patch" || true
          diff -u "$OUT/RiftAudioFeedback.before.gd" "$OUT/RiftAudioFeedback.after.gd" > "$OUT/RIFT_DIAGNOSTIC.patch" || true
          cat "$OUT/TERRA_DIAGNOSTIC.patch"
          cat "$OUT/RIFT_DIAGNOSTIC.patch"
          fail=0
          gate(){ slug="$1"; p="$2"; log="$OUT/${slug}-import.log"; rm -rf "$p/.godot"; set +e; timeout 15m "$GODOT" --headless --editor --path "$p" --quit --verbose >"$log" 2>&1; rc=$?; set -e; echo "DIAG_IMPORT_RC=$slug:$rc"; if [ "$rc" -ne 0 ]; then fail=$((fail+1)); fi; if grep -Eqi "SCRIPT ERROR|Parse Error|Parser Error|ERROR: Failed to load script|Cannot load script|Compile Error" "$log"; then echo "DIAG_SCRIPT_GATE=$slug:FAIL"; fail=$((fail+1)); grep -Ein "SCRIPT ERROR|Parse Error|Parser Error|ERROR: Failed to load script|Cannot load script|Compile Error" "$log" | head -80; else echo "DIAG_SCRIPT_GATE=$slug:PASS"; fi; }
          gate terra "$ROOT/terra"
          gate rift "$ROOT/rift/THF_Nexus_Arena_Core"
          printf "canonical_terra_sha256=05b7832cdd294f1f8dc90d5d8f967fb7aafcd97b3521a7445f52272e8aa9851d\ncanonical_rift_sha256=1651ff94d42e63c2c1daa1e6d08820d706460bacba7f09c8e77f84a62b11bd41\ndiagnostic_workspace_only=true\ncanonical_archives_mutated=false\n" > "$OUT/TRUTH.txt"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
          echo "DIAGNOSTIC_FAIL_COUNT=$fail"
          [ "$fail" -eq 0 ] && echo THF_RC17_GODOT_DIAGNOSTIC_V1=PASS || echo THF_RC17_GODOT_DIAGNOSTIC_V1=FAIL
          echo CANONICAL_ARCHIVES_MUTATED=FALSE
          echo WAVE_UNTOUCHED=TRUE
          exit "$fail"' 2>&1 | tee "$RUNNER_TEMP/godot-diag-v1.log"
          rc=${PIPESTATUS[0]}; set -e; echo "DIAG_RC=$rc" >> "$GITHUB_ENV"; exit 0
      - name: Pack and retrieve diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=15m --quiet --command='set -Eeuo pipefail; ROOT="$HOME/thf-builder-rc17-build"; tar -cf "$ROOT/godot-diagnostic-v1.tar" -C "$ROOT/out" godot-diagnostic-v1'
          mkdir -p godot-diagnostic-v1 "$RUNNER_TEMP/godotdiag"
          gcloud compute scp "$GCP_BUILDER:~/thf-builder-rc17-build/godot-diagnostic-v1.tar" "$RUNNER_TEMP/godotdiag/godot-diagnostic-v1.tar" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          tar -xf "$RUNNER_TEMP/godotdiag/godot-diagnostic-v1.tar" -C godot-diagnostic-v1
          cp "$RUNNER_TEMP/godot-diag-v1.log" godot-diagnostic-v1/ || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THF-RC17-Godot-diagnostic-v1
          path: godot-diagnostic-v1/
          if-no-files-found: error
          retention-days: 14
      - name: Diagnostic conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DIAG_RC=${DIAG_RC:-missing}"
          if [ "${DIAG_RC:-missing}" = 0 ]; then echo THF_RC17_GODOT_DIAGNOSTIC_V1_GATE=PASS; else echo THF_RC17_GODOT_DIAGNOSTIC_V1_GATE=MORE_SOURCE_FIXES_REQUIRED; fi
          echo CANONICAL_ARCHIVES_MUTATED=FALSE
          echo WAVE_UNTOUCHED=TRUE
