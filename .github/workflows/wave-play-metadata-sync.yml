name: WAVE Play Metadata Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add English listing and normalize developer contact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json,google.auth
          from googleapiclient.discovery import build
          package='com.wave.mawja'
          listing={
            'language':'en-US',
            'title':'WAVE MAWJA',
            'shortDescription':'Flexible streaming with multiple qualities, Arabic subtitles and Data Saver.',
            'fullDescription':'WAVE MAWJA is a mobile viewing experience designed for flexible playback across different network conditions. Choose from available quality levels, use Arabic subtitle support when available, and enable Data Saver behavior to reduce network usage. The app is built around clear playback states, responsive mobile navigation and reliable handling of loading, offline and service states. Connected playback features require network access, while account and service availability depend on the configured WAVE runtime.'
          }
          assert len(listing['title'])<=30 and len(listing['shortDescription'])<=80 and len(listing['fullDescription'])<=4000
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher']); api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          edit=api.edits().insert(packageName=package,body={}).execute()['id']; out={'package':package,'committed':False}
          try:
            details=api.edits().details().get(packageName=package,editId=edit).execute(); details['defaultLanguage']='ar'; details['contactEmail']='TopHeroFit@gmail.com'; api.edits().details().update(packageName=package,editId=edit,body=details).execute()
            api.edits().listings().update(packageName=package,editId=edit,language='en-US',body=listing).execute()
            v=api.edits().validate(packageName=package,editId=edit).execute(); out['validationId']=v.get('id'); c=api.edits().commit(packageName=package,editId=edit).execute(); out.update({'committed':True,'committedEditId':c.get('id'),'title':listing['title']}); edit=None
          finally:
            if edit:
              try: api.edits().delete(packageName=package,editId=edit).execute()
              except Exception: pass
          print(json.dumps(out,indent=2)); open('wave-play-metadata-sync.json','w').write(json.dumps(out,indent=2))
          if not out['committed']: raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-play-metadata-sync
          path: wave-play-metadata-sync.json
          if-no-files-found: error
          retention-days: 30
