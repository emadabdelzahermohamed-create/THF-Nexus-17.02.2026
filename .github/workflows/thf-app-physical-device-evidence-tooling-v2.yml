name: THF App Physical Device Evidence Tooling V2

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/mobile/validate_app_device_evidence_v2.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v2.py'
      - 'ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json'
      - '.github/workflows/thf-app-physical-device-evidence-tooling-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile fail-closed app evidence tooling
        run: |
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v2.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v2.py
      - name: Run installed-byte physical evidence regressions
        working-directory: ReleaseOps/mobile
        run: python -m unittest -v test_validate_app_device_evidence_v2.py
      - name: Preserve authoritative pending truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json')
          d=json.loads(p.read_text())
          assert d['truth_boundary']['all_pending'] is True
          assert d['truth_boundary']['final_or_play_ready'] is False
          rows=d['candidates']
          assert len(rows)==10
          assert all(r['status']=='PENDING_PHYSICAL_PHONE' for r in rows)
          assert len({r['package'] for r in rows})==len(rows)
          assert len({r['name'] for r in rows})==len(rows)
          print('APP_CANDIDATES=10')
          print('PHYSICAL_DEVICE_STATUS=PENDING')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
