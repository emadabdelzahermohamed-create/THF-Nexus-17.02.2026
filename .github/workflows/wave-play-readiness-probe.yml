name: WAVE Play Readiness Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read WAVE Play state without mutation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json, google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          package='com.wave.mawja'
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          out={'package':package,'mode':'read_only','mutationCommitted':False,'recordAccessible':False}
          edit=None
          try:
            edit=api.edits().insert(packageName=package,body={}).execute()['id']; out['recordAccessible']=True
            out['details']=api.edits().details().get(packageName=package,editId=edit).execute()
            listings=api.edits().listings().list(packageName=package,editId=edit).execute().get('listings',[]) or []
            out['listings']=[{'language':x.get('language'),'title':x.get('title'),'shortDescription':x.get('shortDescription'),'fullDescriptionLength':len(x.get('fullDescription') or '')} for x in listings]
            tracks=api.edits().tracks().list(packageName=package,editId=edit).execute().get('tracks',[]) or []
            out['tracks']=[{'track':t.get('track'),'releases':[{'name':r.get('name'),'status':r.get('status'),'versionCodes':[str(v) for v in (r.get('versionCodes') or [])]} for r in (t.get('releases') or [])]} for t in tracks if t.get('releases')]
            out['testers']={}
            for track in ['internal','alpha','beta']:
              try:
                t=api.edits().testers().get(packageName=package,editId=edit,track=track).execute(); out['testers'][track]={'googleGroups':t.get('googleGroups',[]) or []}
              except Exception as exc: out['testers'][track]={'error':str(exc)[:600]}
            out['countries']={}
            for track in ['alpha','beta','production']:
              try:
                c=api.edits().countryavailability().get(packageName=package,editId=edit,track=track).execute(); out['countries'][track]={'syncWithProduction':c.get('syncWithProduction'),'countryCount':len(c.get('countries',[]) or [])}
              except Exception as exc: out['countries'][track]={'error':str(exc)[:600]}
            out['images']={}
            for lang in [x.get('language') for x in listings if x.get('language')]:
              inv={}
              for typ in ['icon','featureGraphic','phoneScreenshots']:
                try:
                  xs=api.edits().images().list(packageName=package,editId=edit,language=lang,imageType=typ).execute().get('images',[]) or []; inv[typ]={'count':len(xs),'sha1s':[x.get('sha1') for x in xs]}
                except Exception as exc: inv[typ]={'error':str(exc)[:600]}
              out['images'][lang]=inv
          except Exception as exc:
            out['error']=str(exc)[:1600]
          finally:
            if edit:
              try: api.edits().delete(packageName=package,editId=edit).execute(); out['editCleanup']='PASS'
              except Exception as exc: out['editCleanup']='FAIL'; out['cleanupError']=str(exc)[:1000]
          print(json.dumps(out,indent=2,ensure_ascii=False))
          with open('wave-play-readiness.json','w') as fh: json.dump(out,fh,indent=2,ensure_ascii=False)
          if out.get('recordAccessible') and out.get('editCleanup')!='PASS': raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-play-readiness
          path: wave-play-readiness.json
          if-no-files-found: error
          retention-days: 14
