name: AI Swarm - Provider Health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-swarm-provider-health.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Probe configured providers without exposing secrets
        shell: bash
        run: |
          set -u
          mkdir -p provider-health
          printf '{"providers":[' > provider-health/health.json
          first=1
          add_result() {
            local id="$1" state="$2" detail="$3"
            if [[ $first -eq 0 ]]; then printf ',' >> provider-health/health.json; fi
            first=0
            jq -cn --arg id "$id" --arg state "$state" --arg detail "$detail" \
              '{id:$id,state:$state,detail:$detail}' >> provider-health/health.json
          }

          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            code=$(curl -sS -o /tmp/gemini-models.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" || true)
            if [[ "$code" == "200" ]]; then
              add_result "gemini-cli" "AUTH_OK" "API key accepted; generation readiness is tracked separately because quota may be exhausted."
            elif [[ "$code" == "429" ]]; then
              add_result "gemini-cli" "RATE_LIMITED" "API reachable but quota/rate limit active."
            else
              add_result "gemini-cli" "AUTH_OR_API_ERROR" "models endpoint HTTP ${code}"
            fi
          else
            add_result "gemini-cli" "MISSING_SECRET" "GEMINI_API_KEY not configured"
          fi

          if [[ -n "${GROQ_API_KEY:-}" ]]; then
            gcode=$(curl -sS -o /tmp/groq-models.json -w '%{http_code}' \
              https://api.groq.com/openai/v1/models \
              -H "Authorization: Bearer ${GROQ_API_KEY}" || true)
            if [[ "$gcode" == "200" ]]; then
              model=$(jq -r '[.data[].id | select(test("llama";"i")) | select(test("guard|whisper";"i")|not)][0] // .data[0].id // empty' /tmp/groq-models.json)
              if [[ -n "$model" ]]; then
                payload=$(jq -cn --arg m "$model" '{model:$m,messages:[{role:"user",content:"Reply with OK only."}],max_tokens:2,temperature:0}')
                icode=$(curl -sS -o /tmp/groq-chat.json -w '%{http_code}' \
                  https://api.groq.com/openai/v1/chat/completions \
                  -H "Authorization: Bearer ${GROQ_API_KEY}" \
                  -H 'Content-Type: application/json' \
                  --data "$payload" || true)
                if [[ "$icode" == "200" ]]; then
                  add_result "groq" "READY" "Authenticated inference succeeded on a current chat model."
                elif [[ "$icode" == "429" ]]; then
                  add_result "groq" "RATE_LIMITED" "Authentication succeeded; inference quota/rate limit active."
                else
                  add_result "groq" "INFERENCE_ERROR" "model list succeeded; chat HTTP ${icode}"
                fi
              else
                add_result "groq" "AUTH_OK" "Authenticated model listing succeeded; no compatible chat model selected."
              fi
            elif [[ "$gcode" == "429" ]]; then
              add_result "groq" "RATE_LIMITED" "Provider reachable; rate limit active."
            else
              add_result "groq" "AUTH_OR_API_ERROR" "models endpoint HTTP ${gcode}"
            fi
          else
            add_result "groq" "MISSING_SECRET" "GROQ_API_KEY not configured"
          fi

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            ocode=$(curl -sS -o /tmp/openrouter-auth.json -w '%{http_code}' \
              https://openrouter.ai/api/v1/auth/key \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" || true)
            if [[ "$ocode" == "200" ]]; then
              payload='{"model":"openrouter/free","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":2,"temperature":0}'
              chcode=$(curl -sS -o /tmp/openrouter-chat.json -w '%{http_code}' \
                https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                -H 'Content-Type: application/json' \
                -H 'HTTP-Referer: https://github.com/emadabdelzahermohamed-create/THF-Nexus-17.02.2026' \
                -H 'X-Title: THF AI Swarm Health Probe' \
                --data "$payload" || true)
              if [[ "$chcode" == "200" ]]; then
                add_result "openrouter-free" "READY" "Authenticated free-router inference succeeded."
              elif [[ "$chcode" == "429" ]]; then
                add_result "openrouter-free" "RATE_LIMITED" "Authentication succeeded; free-router rate limit active."
              else
                add_result "openrouter-free" "INFERENCE_ERROR" "auth succeeded; chat HTTP ${chcode}"
              fi
            elif [[ "$ocode" == "429" ]]; then
              add_result "openrouter-free" "RATE_LIMITED" "Provider reachable; rate limit active."
            else
              add_result "openrouter-free" "AUTH_OR_API_ERROR" "auth endpoint HTTP ${ocode}"
            fi
          else
            add_result "openrouter-free" "MISSING_SECRET" "OPENROUTER_API_KEY not configured"
          fi

          printf ']}' >> provider-health/health.json
          jq . provider-health/health.json
          {
            echo '## AI Swarm provider health'
            echo
            echo '```json'
            jq . provider-health/health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized health report
        uses: actions/upload-artifact@v6
        with:
          name: ai-swarm-provider-health
          path: provider-health/health.json
          if-no-files-found: error
          retention-days: 3
