name: THF Pulse Pytest Gate v1

on:
  push:
    paths:
      - '.github/workflows/thf-pulse-pytest-gate-v1.yml'
      - 'ReleaseOps/Pulse/**'
      - 'ReleaseOps/scripts/build_pulse_phone_baseline_v2.sh'
      - 'ReleaseOps/scripts/run_pulse_phone_baseline_v2_diagnostic.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thf-pulse-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
      GCP_ZONE: europe-west1-b
      GCP_BUILDER: thf-wave-builder
      GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
      GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
      PULSE_SRC: /home/sa_115575029018678177962/thf-apps-rc3-exact-candidate-v2/work/pulse/THF_Pulse_APPS_RC2_SOURCE
      PULSE_SOURCE_SHA: 6a180cf6599f8827e824431caf4566f520cc3796d9366c30abc197b4aeb6ba34
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Run isolated authoritative Pulse pytest gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=30m \
            --quiet \
            --command="set -Eeuo pipefail; SRC='$PULSE_SRC'; EXPECT='$PULSE_SOURCE_SHA'; test -d \"\$SRC\"; ACTUAL=\$(cd \"\$SRC\" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print \$1}'); test \"\$ACTUAL\" = \"\$EXPECT\"; V=/tmp/thf-pulse-pytest-\$RANDOM; python3 -m venv \"\$V\"; \"\$V/bin/python\" -m pip install --disable-pip-version-check --quiet --upgrade pip; if test -f \"\$SRC/requirements.txt\"; then \"\$V/bin/python\" -m pip install --disable-pip-version-check --quiet -r \"\$SRC/requirements.txt\"; fi; \"\$V/bin/python\" -m pip install --disable-pip-version-check --quiet pytest fastapi httpx python-multipart; cd \"\$SRC\"; set +e; \"\$V/bin/python\" -m pytest -q tests | tee /tmp/thf-pulse-pytest.log; RC=\${PIPESTATUS[0]}; set -e; printf 'source_tree_sha256=%s\npytest_exit_code=%s\n' \"\$ACTUAL\" \"\$RC\" > /tmp/thf-pulse-pytest-evidence.txt; exit \"\$RC\""

      - name: Retrieve pytest evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute scp "$GCP_BUILDER:/tmp/thf-pulse-pytest.log" out/pytest.log --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          gcloud compute scp "$GCP_BUILDER:/tmp/thf-pulse-pytest-evidence.txt" out/EVIDENCE.txt --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
          cat out/EVIDENCE.txt 2>/dev/null || true
          cat out/pytest.log 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-PULSE-PYTEST-GATE-${{ github.run_id }}
          path: out/
          retention-days: 14
          compression-level: 0
