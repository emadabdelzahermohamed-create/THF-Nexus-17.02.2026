name: WAVE D1 Account Schema Check

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-d1-account-schema-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Inspect production account schema read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p wave-d1-check

          npx --yes wrangler@4 d1 list --json > wave-d1-check/d1-list.json
          python3 - <<'PY'
          import json
          data=json.load(open("wave-d1-check/d1-list.json"))
          rows=data if isinstance(data,list) else data.get("result",data.get("databases",[]))
          matches=[x for x in rows if x.get("name")=="wave-mawja-prod"]
          if len(matches)!=1:
              raise SystemExit(f"Expected exactly one wave-mawja-prod, found {len(matches)}")
          print("WAVE_D1_FOUND=PASS")
          PY

          npx --yes wrangler@4 d1 execute wave-mawja-prod --remote --json             --command "PRAGMA table_info(user_accounts);" > wave-d1-check/user-accounts-schema.json
          npx --yes wrangler@4 d1 execute wave-mawja-prod --remote --json             --command "PRAGMA table_info(wave_credentials);" > wave-d1-check/wave-credentials-schema.json
          npx --yes wrangler@4 d1 execute wave-mawja-prod --remote --json             --command "PRAGMA table_info(wave_sessions);" > wave-d1-check/wave-sessions-schema.json
          npx --yes wrangler@4 d1 execute wave-mawja-prod --remote --json             --command "SELECT COUNT(*) AS account_count FROM user_accounts;" > wave-d1-check/account-count.json

          python3 - <<'PY'
          import json, pathlib
          def rows(name):
              d=json.load(open("wave-d1-check/"+name))
              if isinstance(d,list) and d:
                  return d[0].get("results") or []
              if isinstance(d,dict):
                  return d.get("results") or d.get("result") or []
              return []
          ua=rows("user-accounts-schema.json")
          cols=[r.get("name") for r in ua]
          required=["email","display_name","locale","role","publisher_id","status","created_at","updated_at","deleted_at"]
          missing=[c for c in required if c not in cols]
          lines=[
              "WAVE_D1_ACCOUNT_SCHEMA_CHECK=PASS",
              "user_accounts_columns="+",".join(x for x in cols if x),
              "missing_expected_columns="+(",".join(missing) if missing else "NONE"),
          ]
          pathlib.Path("WAVE_D1_ACCOUNT_SCHEMA_RESULT.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WAVE-D1-ACCOUNT-SCHEMA-CHECK
          retention-days: 30
          path: |
            WAVE_D1_ACCOUNT_SCHEMA_RESULT.txt
            wave-d1-check/*.json
