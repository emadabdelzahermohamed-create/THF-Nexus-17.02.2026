name: THF Pulse Latest Motion Baseline Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/thf-pulse-latest-motion-baseline-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Audit Pulse motion/avatar truth on builder
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=20m --quiet --command='set -Eeuo pipefail
          echo "=== PULSE FILES ==="
          find "$HOME" -type f -iname "*pulse*" -printf "%TY-%Tm-%Td %TH:%TM %s %p\n" 2>/dev/null | sort -r | head -240 || true
          echo "=== PULSE DIRECTORIES ==="
          find "$HOME" -maxdepth 7 -type d -iname "*pulse*" -print 2>/dev/null | sort | head -160 || true
          echo "=== MOTION / COACH / AVATAR SIGNALS UNDER PULSE TREES ==="
          find "$HOME" -type f \( -iname "*motion*" -o -iname "*coach*" -o -iname "*avatar*" -o -iname "*.glb" -o -iname "*.gltf" -o -iname "*exercise*" -o -iname "*animation*" \) -print 2>/dev/null | grep -iE "/pulse|THF_Pulse" | head -400 || true
          echo "=== CANDIDATE SOURCE TEXT SIGNALS ==="
          for d in $(find "$HOME" -maxdepth 6 -type d -iname "*pulse*" 2>/dev/null | head -40); do
            grep -RIlE "Motion Coach|motion coach|GLB|gltf|avatar|exercise.*motion|animation" "$d" 2>/dev/null | head -40 || true
          done
          echo "=== PULSE ARCHIVE CONTENT SIGNALS ==="
          find "$HOME" -type f -iname "*pulse*.zip" -print0 2>/dev/null | while IFS= read -r -d "" z; do
            echo "--- $z ---"
            unzip -l "$z" 2>/dev/null | grep -iE "motion|coach|avatar|glb|gltf|exercise|animation|render" | head -100 || true
          done
          '
