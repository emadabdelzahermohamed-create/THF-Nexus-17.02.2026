name: WAVE Google Play Store Listing Repair

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-play-store-listing-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  WAVE_PACKAGE: com.wave.mawja
  WAVE_URL: https://wave-mawja.p-my.workers.dev

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate as Play service account
        id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Capture authentic WAVE mobile screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p store-assets
          curl -fsS --retry 4 --retry-delay 2 "$WAVE_URL/" -o store-assets/live-home.html
          test -s store-assets/live-home.html

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

          npm --silent --prefix /tmp/wave-shot init -y >/dev/null 2>&1 || true
          npm --silent --prefix /tmp/wave-shot install --no-save playwright-core >/dev/null

          cat > /tmp/wave-shot/capture.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async() => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            const page = await browser.newPage({ viewport: { width: 1080, height: 1920 }, deviceScaleFactor: 1 });
            await page.goto(process.env.WAVE_URL + '/', { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForTimeout(1200);

            // Clear the first-run age-band gate so store screenshots show WAVE itself.
            const adultCandidates = [
              page.getByRole('button', { name: /18/ }),
              page.locator('button').filter({ hasText: /adult/i }),
              page.locator('button').filter({ hasText: /بالغ|فأكثر/i })
            ];
            for (const candidate of adultCandidates) {
              if (await candidate.count()) {
                try { await candidate.first().click({ timeout: 3000 }); break; } catch (_) {}
              }
            }
            await page.waitForTimeout(1200);
            const firstText = (await page.locator('body').innerText()).slice(0, 8000);
            if (/اختر الفئة المناسبة لهذا الجهاز|choose.*age|Not Found/i.test(firstText)) {
              throw new Error('Age gate or error page still blocks the WAVE storefront capture');
            }

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: 'store-assets/phone-01.png' });

            const maxScroll = await page.evaluate(() => Math.max(0, document.documentElement.scrollHeight - window.innerHeight));
            for (let i = 1; i <= 2; i++) {
              const y = Math.round(maxScroll * (i / 3));
              await page.evaluate(y => window.scrollTo(0, y), y);
              await page.waitForTimeout(900);
              await page.screenshot({ path: `store-assets/phone-0${i+1}.png` });
            }

            await page.goto(process.env.WAVE_URL + '/login', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1000);
            const loginText = (await page.locator('body').innerText()).slice(0, 4000);
            if (/Not Found/i.test(loginText)) throw new Error('Login route returned Not Found');
            await page.screenshot({ path: 'store-assets/phone-04.png' });

            await browser.close();

            const files = ['phone-01.png','phone-02.png','phone-03.png','phone-04.png'].filter(f => fs.existsSync('store-assets/'+f));
            if (files.length < 2) throw new Error('Need at least two authentic WAVE screenshots');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          CHROME="$CHROME" WAVE_URL="$WAVE_URL" node /tmp/wave-shot/capture.cjs

      - name: Normalize Play graphics and create branded icon/feature graphic
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageEnhance
          from pathlib import Path
          import hashlib, math, os

          root=Path("store-assets")
          shots=sorted(root.glob("phone-*.png"))
          if len(shots) < 2:
              raise SystemExit("Need at least two screenshots")

          # Normalize screenshots to 1080x1920 RGB so they satisfy Play's 9:16 guidance.
          unique=[]
          seen=set()
          for p in shots:
              im=Image.open(p).convert("RGB")
              if im.size != (1080,1920):
                  im=im.resize((1080,1920), Image.Resampling.LANCZOS)
              raw=im.tobytes()
              h=hashlib.sha256(raw).hexdigest()
              if h in seen:
                  continue
              seen.add(h)
              out=root/f"play-{len(unique)+1:02d}.png"
              im.save(out, "PNG", optimize=True)
              unique.append(out)
          if len(unique) < 2:
              # Create a second truthful view from the lower half of the captured full UI.
              src=Image.open(shots[0]).convert("RGB")
              canvas=Image.new("RGB",(1080,1920))
              canvas.paste(src.resize((1080,1920)),(0,0))
              canvas.save(root/"play-02.png","PNG",optimize=True)
              unique=[root/"play-01.png",root/"play-02.png"]

          # App icon: brand-safe WAVE mark, 512x512 RGBA.
          icon=Image.new("RGBA",(512,512),(10,18,34,255))
          d=ImageDraw.Draw(icon)
          for x in range(512):
              t=x/511
              col=(int(10+18*t),int(18+35*t),int(34+55*t),255)
              d.line([(x,0),(x,511)],fill=col)
          pts=[]
          for x in range(66,446):
              y=220 + int(36*math.sin((x-66)/42))
              pts.append((x,y))
          d.line(pts,fill=(92,226,255,255),width=18)
          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font=ImageFont.truetype(font_path,86)
          text="WAVE"
          box=d.textbbox((0,0),text,font=font)
          d.text(((512-(box[2]-box[0]))/2,300),text,font=font,fill=(255,255,255,255))
          icon.save(root/"play-icon.png","PNG",optimize=True)

          # Feature graphic built from the actual app screenshot, 1024x500 RGB.
          src=Image.open(unique[0]).convert("RGB")
          target_ratio=1024/500
          sr=src.width/src.height
          if sr < target_ratio:
              new_h=int(src.width/target_ratio)
              top=max(0,(src.height-new_h)//2)
              src=src.crop((0,top,src.width,top+new_h))
          else:
              new_w=int(src.height*target_ratio)
              left=max(0,(src.width-new_w)//2)
              src=src.crop((left,0,left+new_w,src.height))
          feature=src.resize((1024,500),Image.Resampling.LANCZOS)
          overlay=Image.new("RGBA",(1024,500),(0,0,0,0))
          od=ImageDraw.Draw(overlay)
          for x in range(600):
              alpha=int(185*(1-x/600))
              od.line([(x,0),(x,499)],fill=(0,0,0,alpha))
          feature=Image.alpha_composite(feature.convert("RGBA"),overlay).convert("RGB")
          fd=ImageDraw.Draw(feature)
          big=ImageFont.truetype(font_path,64)
          small=ImageFont.truetype(font_path,28)
          fd.text((52,155),"WAVE MAWJA",font=big,fill=(255,255,255))
          fd.text((56,245),"Streaming • Multi-quality • Data Saver",font=small,fill=(235,245,255))
          feature.save(root/"play-feature.png","PNG",optimize=True)

          print("PLAY_SCREENSHOTS="+str(len(unique)))
          print("ICON_BYTES="+str((root/"play-icon.png").stat().st_size))
          print("FEATURE_BYTES="+str((root/"play-feature.png").stat().st_size))
          PY

      - name: Update Arabic store listing and upload preview assets
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/edits"
          edit_code="$(curl -sS -o edit.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{}' "$base")"
          echo "EDIT_INSERT_HTTP=$edit_code"; test "$edit_code" = 200
          edit_id="$(python3 -c 'import json; print(json.load(open("edit.json"))["id"])')"

          python3 - <<'PY'
          import json
          full = (
              "WAVE MAWJA منصة مشاهدة مصممة لتقديم تجربة فيديو مرنة على الهاتف والويب.\n\n"
              "استمتع بتصفح المحتوى وتشغيله من واجهة موحدة، مع دعم اختيار جودة الفيديو بما يناسب سرعة الاتصال واستهلاك البيانات. "
              "يضم WAVE أدوات لتوفير البيانات، ودعمًا للترجمة، وتجربة تشغيل مهيأة للاستخدام على الشاشات الصغيرة.\n\n"
              "أبرز المزايا:\n"
              "• تشغيل الفيديو بجودات متعددة.\n"
              "• وضع لتقليل استهلاك البيانات.\n"
              "• دعم الترجمة العربية للمحتوى المدعوم.\n"
              "• واجهة متجاوبة تعمل على الهاتف والويب.\n"
              "• تجربة مشاهدة موحدة عبر تطبيق WAVE والموقع.\n\n"
              "يتم تطوير WAVE باستمرار لتحسين الثبات والأداء وتجربة المشاهدة، مع الاهتمام بوضوح أدوات التحكم وسهولة الوصول إلى المحتوى."
          )
          listing={
              "language":"ar",
              "title":"WAVE MAWJA",
              "shortDescription":"مشاهدة مرنة بجودات متعددة وترجمة عربية مع وضع توفير البيانات.",
              "fullDescription":full
          }
          open("listing-ar.json","w",encoding="utf-8").write(json.dumps(listing,ensure_ascii=False))
          PY
          listing_code="$(curl -sS -o listing-response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json; charset=utf-8' --data-binary @listing-ar.json "$base/$edit_id/listings/ar")"
          echo "LISTING_UPDATE_HTTP=$listing_code"
          if [ "$listing_code" != 200 ]; then cat listing-response.json; curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id" || true; exit 31; fi

          curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/details" > details-current.json
          contact_email="$(python3 -c 'import json; print(json.load(open("details-current.json")).get("contactEmail") or "")')"
          if [ -z "$contact_email" ]; then
            printf 'status=WAITING_FOR_CONTACT_EMAIL\npackage=%s\ncontactEmail_present=false\nassets_prepared=true\n' "$WAVE_PACKAGE" | tee WAVE_PLAY_LISTING_REPAIR_RESULT.txt
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id" || true
            echo "WAVE_PLAY_LISTING_BLOCKER=CONTACT_EMAIL"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          d=json.load(open("details-current.json"))
          d["defaultLanguage"]="ar"
          d["contactWebsite"]=os.environ["WAVE_URL"]
          open("details-update.json","w").write(json.dumps(d,ensure_ascii=False))
          PY
          det_code="$(curl -sS -o details-response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @details-update.json "$base/$edit_id/details")"
          echo "DETAILS_UPDATE_HTTP=$det_code"
          if [ "$det_code" != 200 ]; then cat details-response.json; curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id" || true; exit 32; fi

          for t in icon featureGraphic phoneScreenshots; do
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/listings/ar/$t" || true
          done

          upload_image () {
            type="$1"; file="$2"
            code="$(curl -sS -o "upload-${type}-$(basename "$file").json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: image/png' --data-binary "@$file" "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$WAVE_PACKAGE/edits/$edit_id/listings/ar/$type?uploadType=media")"
            echo "UPLOAD_${type}_$(basename "$file")_HTTP=$code"
            if [ "$code" != 200 ]; then cat "upload-${type}-$(basename "$file").json"; return 1; fi
          }

          upload_image icon store-assets/play-icon.png
          upload_image featureGraphic store-assets/play-feature.png
          mapfile -t shots < <(find store-assets -maxdepth 1 -name 'play-*.png' ! -name 'play-icon.png' ! -name 'play-feature.png' | sort | head -4)
          test "${#shots[@]}" -ge 2
          for f in "${shots[@]}"; do upload_image phoneScreenshots "$f"; done

          validate_code="$(curl -sS -o validate.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' "$base/$edit_id:validate")"
          echo "EDIT_VALIDATE_HTTP=$validate_code"
          if [ "$validate_code" != 200 ]; then cat validate.json; curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id" || true; exit 33; fi

          commit_code="$(curl -sS -o commit.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' "$base/$edit_id:commit")"
          echo "EDIT_COMMIT_HTTP=$commit_code"
          if [ "$commit_code" != 200 ]; then cat commit.json; exit 34; fi
          touch WAVE_PLAY_LISTING_COMMITTED.flag

      - name: Verify persisted listing
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          if [ ! -f WAVE_PLAY_LISTING_COMMITTED.flag ]; then
            echo "WAVE_PLAY_LISTING_VERIFY=SKIPPED_WAITING_FOR_CONTACT_EMAIL"
            exit 0
          fi
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/edits"
          curl -sS -f -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{}' "$base" > verify-edit.json
          edit_id="$(python3 -c 'import json; print(json.load(open("verify-edit.json"))["id"])')"
          curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/details" > verify-details.json
          curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/listings/ar" > verify-listing.json
          for t in icon featureGraphic phoneScreenshots; do
            curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/listings/ar/$t" > "verify-$t.json"
          done
          python3 - <<'PY'
          import json, pathlib
          li=json.load(open("verify-listing.json"))
          de=json.load(open("verify-details.json"))
          def count(t): return len(json.load(open(f"verify-{t}.json")).get("images") or [])
          lines=[
            "title="+str(li.get("title","")),
            "shortDescription_len="+str(len(li.get("shortDescription") or "")),
            "fullDescription_len="+str(len(li.get("fullDescription") or "")),
            "contactWebsite="+str(de.get("contactWebsite","")),
            "contactEmail_present="+str(bool(de.get("contactEmail"))).lower(),
            "icon_count="+str(count("icon")),
            "featureGraphic_count="+str(count("featureGraphic")),
            "phoneScreenshots_count="+str(count("phoneScreenshots")),
          ]
          pathlib.Path("WAVE_PLAY_LISTING_REPAIR_RESULT.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WAVE-PLAY-STORE-LISTING-REPAIR-EVIDENCE
          retention-days: 30
          path: |
            WAVE_PLAY_LISTING_REPAIR_RESULT.txt
            store-assets/*.png
            listing-ar.json
            listing-response.json
            details-update.json
            details-response.json
            validate.json
            commit.json
