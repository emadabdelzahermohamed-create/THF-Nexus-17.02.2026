name: THF Policy Route Inspect

on:
  push:
    branches: ['cp/v2']
    paths:
      - '.github/workflows/thf-policy-route-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect route implementation only
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=8m --quiet --command='set -Eeuo pipefail
          ROOT="$HOME/thf-runtime-s1/runtime/THF_NEXUS_6_FINAL"
          APP="$ROOT/src/thf/app.py"
          TEST="$ROOT/tests/test_release_contracts.py"
          test -f "$APP"
          echo APP_ROUTE_MATCHES_BEGIN
          grep -nE "privacy|terms|security\.txt|index\.html|FileResponse|HTMLResponse|StaticFiles|@app\.(get|route)|catch|fallback|path:path" "$APP" 2>/dev/null | head -160 || true
          echo APP_ROUTE_CONTEXT_BEGIN
          python3 - "$APP" <<"PY"
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          hits=[i for i,l in enumerate(lines) if re.search(r"privacy|terms|security\.txt|index\.html|FileResponse|HTMLResponse|StaticFiles|path:path|fallback",l,re.I)]
          shown=set()
          for i in hits:
              a=max(0,i-10); b=min(len(lines),i+16)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print(f"--- lines {a+1}-{b} ---")
              for j in range(a,b): print(f"{j+1:04d}: {lines[j]}")
          PY
          echo RELEASE_TEST_MARKERS_BEGIN
          [ -f "$TEST" ] && grep -nEi "privacy|terms|security|web|route" "$TEST" | head -120 || true
          echo WAVE_UNTOUCHED=TRUE
          echo MUTATION_PERFORMED=FALSE'
