name: THF Vault Signal RC4 Build Fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-vault-signal-rc4-buildfix.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Stage corrected exact sources
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          mkdir -p src work out
          cat > src/matrix.tsv <<'EOF'
          vault	RC4-BF1	dd6db86d7532f773a8d1d2662bf466bdcc0f1c64a863602ecdd1267c8f82fa33	com.topherofit.thf.vault	1uxsDgpOF5ZknvCnYIZTgIYNnO2cwVVJI
          signal	RC4-BF1	377044263fa0fc366afe67c6b42ccf4f3e2d1bc75769350f2ee885983f820ddf	com.topherofit.thf.signal	1za4Ibh8Lm5gt0DNe2oNLxmxYp0bb_gLh
          EOF
          printf 'app\tcheckpoint\tdrive_file_id\thttp\texpected_sha256\tactual_sha256\tzip_ok\tresult\n' > out/source-stage.tsv
          stage_fail=0
          while IFS=$'\t' read -r app cp sha pkg fid; do
            f="src/$app.zip"
            code=$(curl -sSLo "$f" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$fid?alt=media&supportsAllDrives=true") || code="curl_error"
            actual="MISSING"
            zip_ok=false
            result=FAIL
            if [ -s "$f" ]; then actual=$(sha256sum "$f" | awk '{print $1}'); fi
            if [ "$code" = 200 ] && [ "$actual" = "$sha" ] && unzip -tq "$f" >/dev/null 2>&1; then
              zip_ok=true
              mkdir -p "work/$app"
              unzip -q "$f" -d "work/$app"
              result=PASS
            else
              stage_fail=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$app" "$cp" "$fid" "$code" "$sha" "$actual" "$zip_ok" "$result" >> out/source-stage.tsv
          done < src/matrix.tsv
          cat out/source-stage.tsv
          sha256sum src/matrix.tsv out/source-stage.tsv | tee out/source-stage.sha256
          [ "$stage_fail" -eq 0 ]
          echo EXACT_RC4_BUILD_FIX_SOURCE=PASS

      - name: Test source and build QA APKs
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install -q --upgrade pip
          req="$RUNNER_TEMP/requirements.txt"; : > "$req"
          find work -name requirements.txt -print0 | xargs -0 cat | sed '/^[[:space:]]*$/d' | sort -u > "$req"
          [ ! -s "$req" ] || python -m pip install -q -r "$req"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"; ZIPALIGN="$BT/zipalign"
          KS="$RUNNER_TEMP/qa.keystore"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=THF QA,C=US' -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          printf 'app\tcheckpoint\tpackage\tbuild\tapk_sha256\ttarget36\tsigned\tdebuggable\tversion_code\tversion_name\n' > out/results.tsv
          while IFS=$'\t' read -r app cp sha pkg fid; do
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            test -n "$root"
            python -m compileall -q "$root"
            if [ -d "$root/tests" ] && find "$root/tests" -name 'test_*.py' | grep -q .; then (cd "$root" && python -m pytest -q) | tee "out/$app.pytest.log"; fi
            python ReleaseOps/validators/validate_mobile_real_function_source.py "$root" --package "$pkg" --json-out "out/$app.source-policy.json"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$root/android/local.properties"
            (cd "$root/android" && gradle --no-daemon clean assembleRelease) | tee "out/$app.gradle.log"
            raw=$(find "$root/android" -type f -name '*.apk' -path '*/build/outputs/apk/release/*' | head -1)
            test -n "$raw"
            aligned="out/$app-aligned.apk"; final="out/THF-${app^^}-${cp}-EXACT-QA.apk"
            "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$final" "$aligned"
            "$APKSIGNER" verify "$final"
            badging=$("$AAPT" dump badging "$final"); printf '%s\n' "$badging" > "out/$app.badging.txt"
            grep -q "package: name='$pkg'" <<<"$badging"
            grep -q "targetSdkVersion:'36'" <<<"$badging"
            ! grep -q application-debuggable <<<"$badging"
            vc=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vn=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            ah=$(sha256sum "$final" | awk '{print $1}')
            printf '%s\t%s\t%s\tPASS\t%s\ttrue\ttrue\tfalse\t%s\t%s\n' "$app" "$cp" "$pkg" "$ah" "$vc" "$vn" >> out/results.tsv
            rm -f "$aligned"
          done < src/matrix.tsv
          cat out/results.tsv
          [ "$(grep -c $'\tPASS\t' out/results.tsv)" -eq 2 ]
          sha256sum out/results.tsv out/*.apk 2>/dev/null | tee out/candidate.sha256 || true
          echo THF_VAULT_SIGNAL_RC4_BUILD_FIX=PASS | tee out/TRUTH.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-VAULT-SIGNAL-RC4-BF1-QA-APKS
          path: out/
          retention-days: 14
          compression-level: 0
