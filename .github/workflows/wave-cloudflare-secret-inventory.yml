name: WAVE Cloudflare Credential Inventory

on:
  push:
    branches:
      - releaseops/wave-recover-20260916
    paths:
      - '.github/workflows/wave-cloudflare-secret-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Inspect credential metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Checking Secret Manager names only; no secret values are read or printed.'
          set +e
          names="$(gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' 2>/tmp/wave-secret-list.err)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "SECRET_LIST_ACCESS=UNAVAILABLE"
            sed -n '1,8p' /tmp/wave-secret-list.err | sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g'
            exit 0
          fi
          echo "SECRET_LIST_ACCESS=PASS"
          found=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "${name,,}" in
              *cloudflare*|*wrangler*|*wave*media*token*|*stream*token*)
                echo "CANDIDATE_SECRET_NAME=$name"
                found=1
                ;;
            esac
          done <<< "$names"
          echo "CLOUDFLARE_CREDENTIAL_CANDIDATE_FOUND=$found"
