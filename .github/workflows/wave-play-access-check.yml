name: WAVE Google Play Release State Check

on:
  push:
    branches:
      - releaseops/wave-rc15-9-admin-rbac-20260918
    paths:
      - '.github/workflows/wave-play-access-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  WAVE_PACKAGE: com.wave.mawja

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate as Play service account
        id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/androidpublisher

      - name: Inspect Play package and release tracks without changing release state
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          test -n "$ACCESS_TOKEN"
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/edits"

          reviews_code="$(curl -sS -o reviews.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$WAVE_PACKAGE/reviews?maxResults=1")"
          echo "PLAY_REVIEWS_HTTP=$reviews_code"

          edit_code="$(curl -sS -o edit.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{}' "$base")"
          echo "PLAY_EDIT_INSERT_HTTP=$edit_code"
          test "$edit_code" = 200
          edit_id="$(python3 -c 'import json; print(json.load(open("edit.json"))["id"])')"
          test -n "$edit_id"

          for track in internal alpha beta production; do
            code="$(curl -sS -o "track-$track.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/tracks/$track")"
            echo "PLAY_TRACK_${track^^}_HTTP=$code"
          done

          listings_code="$(curl -sS -o listings.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/listings")"
          details_code="$(curl -sS -o details.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id/details")"
          echo "PLAY_LISTINGS_HTTP=$listings_code"
          echo "PLAY_DETAILS_HTTP=$details_code"

          python3 - <<'PY'
          import json, pathlib
          out=[]
          for track in ("internal","alpha","beta","production"):
              p=pathlib.Path(f"track-{track}.json")
              try:
                  d=json.loads(p.read_text())
              except Exception:
                  out.append(f"{track}=UNPARSEABLE")
                  continue
              releases=d.get("releases") or []
              if not releases:
                  out.append(f"{track}=EMPTY")
                  continue
              parts=[]
              for r in releases:
                  vcs=",".join(r.get("versionCodes") or [])
                  parts.append(f"{r.get('status','unknown')}:{vcs}")
              out.append(f"{track}={'|'.join(parts)}")
          try:
              listings=json.loads(pathlib.Path("listings.json").read_text()).get("listings") or []
              out.append("listings_languages="+",".join(sorted(x.get("language","") for x in listings if x.get("language"))))
          except Exception:
              out.append("listings_languages=UNPARSEABLE")
          pathlib.Path("WAVE_PLAY_RELEASE_STATE.txt").write_text("\n".join(out)+"\n")
          print("\n".join(out))
          PY

          del_code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$base/$edit_id")"
          echo "PLAY_EDIT_DELETE_HTTP=$del_code"
          test "$del_code" = 204

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WAVE-PLAY-RELEASE-STATE
          retention-days: 30
          path: |
            WAVE_PLAY_RELEASE_STATE.txt
            reviews.json
            track-internal.json
            track-alpha.json
            track-beta.json
            track-production.json
            listings.json
            details.json
