name: THF Apps Auxiliary Artifact Authority Gate V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/apps_factory/THF_AUXILIARY_MOBILE_ARTIFACT_REGISTRY_V1.json'
      - 'ReleaseOps/apps_factory/THF_APPS_FACTORY_STATE_*.json'
      - 'ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json'
      - 'ReleaseOps/apps_factory/THF_CORE_PHONE_UI1_LOCAL_QA_CHECKPOINT_*.md'
      - 'ReleaseOps/phone-apks/THF-CORE-*-LOCAL-QA.apk'
      - 'ReleaseOps/phone-apks/THF-CORE-*-EVIDENCE.txt'
      - 'ReleaseOps/validators/validate_auxiliary_mobile_artifact_authority_v1.py'
      - 'ReleaseOps/validators/test_validate_auxiliary_mobile_artifact_authority_v1.py'
      - 'ReleaseOps/validators/validate_apps_factory_state.py'
      - 'ReleaseOps/validators/test_validate_apps_factory_state.py'
      - '.github/workflows/thf-apps-auxiliary-authority-gate-v1.yml'
  pull_request:
    paths:
      - 'ReleaseOps/apps_factory/THF_AUXILIARY_MOBILE_ARTIFACT_REGISTRY_V1.json'
      - 'ReleaseOps/apps_factory/THF_APPS_FACTORY_STATE_*.json'
      - 'ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json'
      - 'ReleaseOps/apps_factory/THF_CORE_PHONE_UI1_LOCAL_QA_CHECKPOINT_*.md'
      - 'ReleaseOps/phone-apks/THF-CORE-*-LOCAL-QA.apk'
      - 'ReleaseOps/phone-apks/THF-CORE-*-EVIDENCE.txt'
      - 'ReleaseOps/validators/validate_auxiliary_mobile_artifact_authority_v1.py'
      - 'ReleaseOps/validators/test_validate_auxiliary_mobile_artifact_authority_v1.py'
      - 'ReleaseOps/validators/validate_apps_factory_state.py'
      - 'ReleaseOps/validators/test_validate_apps_factory_state.py'
      - '.github/workflows/thf-apps-auxiliary-authority-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve latest authoritative Apps Factory state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(find ReleaseOps/apps_factory -maxdepth 1 -type f -name 'THF_APPS_FACTORY_STATE_*.json' -print | sort | tail -n 1)"
          test -n "$STATE"
          echo "path=$STATE" >> "$GITHUB_OUTPUT"
          echo "Resolved Apps Factory state: $STATE"
      - name: Compile release authority guards
        run: |
          python -m py_compile \
            ReleaseOps/validators/validate_auxiliary_mobile_artifact_authority_v1.py \
            ReleaseOps/validators/validate_apps_factory_state.py
      - name: Validate auxiliary/mobile release authority isolation
        run: |
          python ReleaseOps/validators/validate_auxiliary_mobile_artifact_authority_v1.py \
            ReleaseOps/apps_factory/THF_AUXILIARY_MOBILE_ARTIFACT_REGISTRY_V1.json \
            "${{ steps.state.outputs.path }}" \
            ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json \
            --repo-root .
      - name: Regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q ReleaseOps/validators/test_validate_auxiliary_mobile_artifact_authority_v1.py \
            ReleaseOps/validators/test_validate_apps_factory_state.py
      - name: Revalidate latest production authority state
        run: |
          python ReleaseOps/validators/validate_apps_factory_state.py \
            "${{ steps.state.outputs.path }}" \
            --physical-registry ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json
