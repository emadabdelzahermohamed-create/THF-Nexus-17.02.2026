name: THF Echo Exact Source Gate Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/thf-echo-source-gate-diagnostic-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: {project_id: '${{ env.GCP_PROJECT_ID }}'}
      - name: Capture exact Echo gate evidence
        run: |
          set -Eeuo pipefail
          gcloud compute scp --quiet --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" ReleaseOps/validators/validate_mobile_real_function_source.py "$GCP_BUILDER:/tmp/"
          cat > /tmp/echo-audit.sh <<'REMOTE'
          set -Eeuo pipefail
          SHA=40a197b60563e560cab93ba0a64c859d9b650da222fdaec933993977d63902ab
          OUT="$HOME/thf-echo-source-gate-diagnostic-v1"; rm -rf "$OUT"; mkdir -p "$OUT/work" "$OUT/out"
          src=''
          while IFS= read -r -d '' p; do
            [ "$(sha256sum "$p" | awk '{print $1}')" = "$SHA" ] && { src="$p"; break; }
          done < <(find "$HOME" -type f -name '*.zip' -not -path '*/wave-mawja/*' -not -path '*/terra/*' -not -path '*/rift/*' -not -path '*/arena/*' -print0)
          test -s "$src"; echo "$src" > "$OUT/out/source-path.txt"; sha256sum "$src" > "$OUT/out/source.sha256"
          unzip -q "$src" -d "$OUT/work"
          build=$(find "$OUT/work" -type f \( -path '*/android/app/build.gradle' -o -path '*/android/app/build.gradle.kts' \) | head -1); test -n "$build"
          root=$(dirname "$(dirname "$(dirname "$build")")")
          set +e
          python3 /tmp/validate_mobile_real_function_source.py "$root" --package com.topherofit.thf.echo --json-out "$OUT/out/source-gate.json" > "$OUT/out/source-gate.stdout.txt" 2> "$OUT/out/source-gate.stderr.txt"
          rc=$?
          set -e
          echo "$rc" > "$OUT/out/source-gate.exitcode"
          cat "$OUT/out/source-gate.json" || true
          # Export exact original source bytes and a text inventory for repair analysis.
          cp "$src" "$OUT/out/THF_ECHO_EXACT_AUTHORITY_SOURCE.zip"
          (cd "$root" && find . -type f -not -path '*/build/*' -not -path '*/.gradle/*' -print | sort) > "$OUT/out/source-files.txt"
          exit 0
          REMOTE
          gcloud compute scp --quiet --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" /tmp/echo-audit.sh "$GCP_BUILDER:/tmp/echo-audit.sh"
          gcloud compute ssh "$GCP_BUILDER" --quiet --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --ssh-key-expire-after=20m --command='bash /tmp/echo-audit.sh'
          rm -rf echo-audit && mkdir echo-audit
          gcloud compute scp --quiet --recurse --tunnel-through-iap --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" "$GCP_BUILDER:~/thf-echo-source-gate-diagnostic-v1/out" echo-audit/
          cat echo-audit/out/source-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-ECHO-EXACT-SOURCE-GATE-DIAGNOSTIC-V1
          path: echo-audit/
          retention-days: 7
          compression-level: 0
