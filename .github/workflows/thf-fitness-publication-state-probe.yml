name: THF Fitness Publication State Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
          service_account: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read publication state without mutation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import json
          import google.auth
          from googleapiclient.discovery import build
          package='com.topherofit.thf.pulse'
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api=build('androidpublisher','v3',credentials=creds,cache_discovery=False)
          out={'package':package,'uploadAttempted':False,'commitAttempted':False}
          edit_id=api.edits().insert(packageName=package,body={}).execute()['id']
          try:
              out['details']=api.edits().details().get(packageName=package,editId=edit_id).execute()
              listings=api.edits().listings().list(packageName=package,editId=edit_id).execute().get('listings',[]) or []
              out['listings']=listings
              tracks=api.edits().tracks().list(packageName=package,editId=edit_id).execute().get('tracks',[]) or []
              out['tracks']=[{'track':t.get('track'),'releases':[{'name':r.get('name'),'status':r.get('status'),'versionCodes':[str(v) for v in (r.get('versionCodes') or [])]} for r in (t.get('releases') or [])]} for t in tracks if t.get('releases')]
          finally:
              api.edits().delete(packageName=package,editId=edit_id).execute()
          with open('fitness-publication-state.json','w') as fh: json.dump(out,fh,indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thf-fitness-publication-state
          path: fitness-publication-state.json
          if-no-files-found: ignore
          retention-days: 14
