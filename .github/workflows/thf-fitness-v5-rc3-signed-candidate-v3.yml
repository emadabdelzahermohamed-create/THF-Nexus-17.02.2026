name: THF Fitness V5 RC3 Signed Candidate V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-fitness-v5-rc3-signed-candidate-v3.yml'
      - 'ReleaseOps/FitnessStandalone/RC3/ANDROID_50002_RC3.patch'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  SOURCE_DRIVE_FILE_ID: 1gcOkJ-EXnCEbCHMcBSUWAwVcQxj4j40-
  SOURCE_SHA256: 2290c5897eab827dd778204de03f6f70c49fd162a32d187e4844172ececf7b74
  AVATAR_SHA256: 4f556086e1b7149f6c958f1f399f4368f6ad9b76afd3503d6f848eeeb7bea24f
  RENDERER_SHA256: 283b0672384614b4847636c306fc93fe4b1fcadc76d668b4e47f0ca76bcf033b
  THF_FITNESS_BASE_URL: https://thf-fitness-pulse-ul26f1.v2.appdeploy.ai/

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release operations
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Download immutable Fitness RC2 base
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$SOURCE_DRIVE_FILE_ID?alt=media&supportsAllDrives=true" \
            -o fitness-source.zip
          echo "$SOURCE_SHA256  fitness-source.zip" | sha256sum -c -
          mkdir -p build/fitness
          unzip -q fitness-source.zip -d build/fitness
          echo "$AVATAR_SHA256  build/fitness/static/assets/avatar/thf_mpfb_stage16a_ual12_animated.glb" | sha256sum -c -

      - name: Set up Node for pinned offline renderer
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply reproducible Android 50002 RC3 successor
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/ReleaseOps/FitnessStandalone/RC3/ANDROID_50002_RC3.patch"
          patch --dry-run -p1 -d build/fitness < "$PATCH"
          patch -p1 -d build/fitness < "$PATCH"
          cd build/fitness
          mkdir -p android/app/src/main/assets/offline/vendor
          cp static/assets/avatar/thf_mpfb_stage16a_ual12_animated.glb android/app/src/main/assets/offline/stage16a.glb
          echo "$AVATAR_SHA256  android/app/src/main/assets/offline/stage16a.glb" | sha256sum -c -
          TMP="$(mktemp -d)"
          pushd "$TMP"
          PKG="$(npm pack @google/model-viewer@4.3.1 --silent)"
          tar -xzf "$PKG"
          cp package/dist/model-viewer.min.js "$GITHUB_WORKSPACE/build/fitness/android/app/src/main/assets/offline/vendor/model-viewer.min.js"
          popd
          rm -rf "$TMP"
          echo "$RENDERER_SHA256  android/app/src/main/assets/offline/vendor/model-viewer.min.js" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              ("versionCode 50002", "android/app/build.gradle"),
              ("versionName '5.0.0-standalone-rc3'", "android/app/build.gradle"),
              ("WebViewAssetLoader", "android/app/src/main/java/com/topherofit/thf/pulse/MainActivity.java"),
              ("HealthConnectClient", "android/app/src/main/java/com/topherofit/thf/pulse/HealthConnectBridge.kt"),
              ('android:autoVerify="true"', "android/app/src/main/AndroidManifest.xml"),
          ]
          for needle, path in checks:
              if needle not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"RC3 verification missing {needle!r} in {path}")
              print(f"RC3_CHECK_PASS {path}: {needle}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Materialize production upload signing inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thf-signing"
          gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret thf-fitness-upload-keystore-b64 | base64 -d > "$RUNNER_TEMP/thf-signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/thf-signing/upload.jks"
          echo "THF_UPLOAD_KEYSTORE=$RUNNER_TEMP/thf-signing/upload.jks" >> "$GITHUB_ENV"
          for spec in \
            THF_UPLOAD_STORE_PASSWORD:thf-fitness-upload-store-password \
            THF_UPLOAD_KEY_ALIAS:thf-fitness-upload-key-alias \
            THF_UPLOAD_KEY_PASSWORD:thf-fitness-upload-key-password; do
            var="${spec%%:*}"; secret="${spec#*:}"
            value="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret "$secret")"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$var" "$value" >> "$GITHUB_ENV"
          done
          python ReleaseOps/FitnessStandalone/apply_android_signing.py build/fitness/android/app/build.gradle
          grep -q "signingConfig signingConfigs.release" build/fitness/android/app/build.gradle

      - name: Build signed API 36 candidate
        shell: bash
        env:
          THF_PASS_URL: ${{ vars.THF_PASS_URL }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          cd build/fitness/android
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon clean bundleRelease -PTHF_BASE_URL="$THF_FITNESS_BASE_URL" -PTHF_PASS_URL="$THF_PASS_URL"
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$AAB" "$GITHUB_WORKSPACE/artifacts/THF-Fitness-V5-RC3-50002-signed.aab"
          jarsigner -verify -verbose -certs "$AAB" > "$GITHUB_WORKSPACE/artifacts/jarsigner-verify.txt"

      - name: Run exact-candidate integrity gate
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          zip -q THF-Fitness-V5-RC3-50002-artifact.zip THF-Fitness-V5-RC3-50002-signed.aab
          ARTSHA="$(sha256sum THF-Fitness-V5-RC3-50002-artifact.zip | awk '{print $1}')"
          AABSHA="$(sha256sum THF-Fitness-V5-RC3-50002-signed.aab | awk '{print $1}')"
          printf '%s  %s\n' "$AABSHA" THF-Fitness-V5-RC3-50002-signed.aab > SHA256SUMS.txt
          cd ..
          python3 ReleaseOps/FitnessStandalone/android_candidate_integrity.py \
            --artifact-zip artifacts/THF-Fitness-V5-RC3-50002-artifact.zip \
            --artifact-sha256 "$ARTSHA" \
            --aab-sha256 "$AABSHA" \
            --output artifacts/ANDROID_CANDIDATE_INTEGRITY_50002.json \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --expect PASS \
            --github-run-id "$GITHUB_RUN_ID" --github-job-id 0 --artifact-id 0 \
            --source-commit-sha "$GITHUB_SHA" \
            --version-code 50002
          grep -q '"result": "PASS"' artifacts/ANDROID_CANDIDATE_INTEGRITY_50002.json

      - name: Upload signed RC3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: thf-fitness-v5-rc3-50002-signed-candidate
          path: |
            artifacts/THF-Fitness-V5-RC3-50002-signed.aab
            artifacts/SHA256SUMS.txt
            artifacts/ANDROID_CANDIDATE_INTEGRITY_50002.json
            artifacts/jarsigner-verify.txt
          retention-days: 30
