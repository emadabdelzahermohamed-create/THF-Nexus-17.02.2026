name: WAVE RC14 Authoritative Source Discovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wave-source-discovery-rc14.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read-only WAVE source/version/state discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=15m --quiet --command='bash -s' <<'REMOTE'
          set -u
          echo "=== HOST ==="
          echo "HOME=$HOME USER=$(id -un) HOST=$(hostname)"
          echo "=== WAVE RC13 RECOVERY SCRIPT SAFE REFERENCES ==="
          if [ -f "$HOME/wave-rc13-remote.sh" ]; then
            echo "SCRIPT=$HOME/wave-rc13-remote.sh"
            sha256sum "$HOME/wave-rc13-remote.sh" | sed 's#  .*#  wave-rc13-remote.sh#'
            grep -Ein '(wave|mawja|rc1[234]|archive|bundle|zip|tar|sha256|source|artifact|staging|backup|inbox|workspace|drive|gcs|gs://|download)' "$HOME/wave-rc13-remote.sh" \
              | sed -E 's/((TOKEN|SECRET|PASSWORD|PASS|PRIVATE[_-]?KEY|AUTHORIZATION)[A-Za-z0-9_.-]*[[:space:]]*[:=][[:space:]]*).*/\1<REDACTED>/I' \
              | sed -E 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1<REDACTED>/Ig' \
              | head -300 || true
          else echo 'RC13_SCRIPT=MISSING'; fi

          echo "=== WAVE-NAMED FILESYSTEM CANDIDATES ==="
          for base in "$HOME" /tmp /var/tmp /workspace /mnt /opt; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 7 \
              \( -iname '*wave*mawja*' -o -iname '*wave-rc1[234]*' -o -iname '*WAVE*RC1[234]*' -o -iname 'WAVE_CURRENT_STATE*' -o -iname '*wave*handoff*' \) \
              -not -path '*/THF-Nexus*' -not -path '*/thf-nexus*' -printf '%y %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null \
              | sort -k3,3r | head -500
          done

          echo "=== ARCHIVE CONTENT PROBES ==="
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *THF-Nexus*|*thf-nexus*) continue;; esac
            echo "ARCHIVE=$f"
            sha256sum "$f" 2>/dev/null || true
            case "$f" in
              *.zip) unzip -l "$f" 2>/dev/null | grep -Ei '(package.json|WAVE_CURRENT_STATE|HANDOFF|RC14|android|manifest.webmanifest)' | head -60 || true ;;
              *.tar.gz|*.tgz) tar -tzf "$f" 2>/dev/null | grep -Ei '(package.json|WAVE_CURRENT_STATE|HANDOFF|RC14|android|manifest.webmanifest)' | head -60 || true ;;
              *.tar) tar -tf "$f" 2>/dev/null | grep -Ei '(package.json|WAVE_CURRENT_STATE|HANDOFF|RC14|android|manifest.webmanifest)' | head -60 || true ;;
            esac
          done < <(find "$HOME" /tmp /var/tmp /workspace /mnt /opt -maxdepth 7 -type f \( -iname '*wave*.zip' -o -iname '*wave*.tar.gz' -o -iname '*wave*.tgz' -o -iname '*wave*.tar' \) -not -path '*/THF-Nexus*' -not -path '*/thf-nexus*' 2>/dev/null | head -100)
          echo 'MUTATION_PERFORMED=FALSE'
          echo 'THF_FILES_TOUCHED=FALSE'
          echo 'WAVE_SOURCE_DISCOVERY=COMPLETE'
          REMOTE
