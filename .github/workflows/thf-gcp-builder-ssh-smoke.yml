name: THF GCP Builder SSH Smoke

on:
  push:
    branches:
      - main
      - 'releaseops/**'
    paths:
      - '.github/workflows/thf-gcp-builder-ssh-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  ssh-smoke:
    name: IAP OS Login SSH verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - id: auth
        name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify authenticated principal
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          echo 'THF_GCLOUD_AUTH=PASS'

      - name: SSH to private builder through IAP and run read-only probes
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --ssh-key-expire-after=5m \
            --quiet \
            --command='set -Eeuo pipefail; echo THF_REMOTE_SSH=PASS; printf "ARCH="; uname -m; printf "KERNEL="; uname -sr; if command -v java >/dev/null 2>&1; then java -version 2>&1 | head -n 1; fi; if [ -d "$HOME/thf-builder" ]; then echo THF_BUILDER_ROOT_PRESENT=TRUE; else echo THF_BUILDER_ROOT_PRESENT=FALSE; fi; echo NO_BUILD_EXECUTED=TRUE; echo WAVE_UNTOUCHED=TRUE'

      - name: Gate result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'THF_IAP_OSLOGIN_SSH=PASS'
          echo 'NO_SOURCE_STAGING_PERFORMED=TRUE'
          echo 'NO_BUILD_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_SIGNING_PERFORMED=TRUE'
          echo 'WAVE_UNTOUCHED=TRUE'
