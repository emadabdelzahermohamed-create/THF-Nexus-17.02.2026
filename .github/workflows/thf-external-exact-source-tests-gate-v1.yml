name: THF External Exact Source Tests Gate V1

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/apps_factory/THF_EXTERNAL_EXACT_SOURCE_TESTS_20260914.json'
      - 'ReleaseOps/apps_factory/tests/test_spark_rc3_real.py'
      - 'ReleaseOps/apps_factory/tests/test_rush_rc3_real.py'
      - 'ReleaseOps/validators/validate_external_exact_source_tests.py'
      - 'ReleaseOps/validators/test_validate_external_exact_source_tests.py'
      - '.github/workflows/thf-external-exact-source-tests-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest >/dev/null
      - name: Validate exact-source regression registry
        run: python ReleaseOps/validators/validate_external_exact_source_tests.py ReleaseOps/apps_factory/THF_EXTERNAL_EXACT_SOURCE_TESTS_20260914.json
      - name: Run fail-closed regression tests
        run: python -m pytest -q ReleaseOps/validators/test_validate_external_exact_source_tests.py
