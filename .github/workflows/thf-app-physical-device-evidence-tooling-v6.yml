name: THF App Physical Device Evidence Tooling V6

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/mobile/validate_app_device_evidence_v2.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v2.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v3.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v3.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v4.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v4.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v5.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v5.py'
      - 'ReleaseOps/mobile/validate_app_device_evidence_v6.py'
      - 'ReleaseOps/mobile/test_validate_app_device_evidence_v6.py'
      - 'ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json'
      - '.github/workflows/thf-app-physical-device-evidence-tooling-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tooling-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile fail-closed app evidence tooling V2-V6
        run: |
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v2.py
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v3.py
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v4.py
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v5.py
          python -m py_compile ReleaseOps/mobile/validate_app_device_evidence_v6.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v2.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v3.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v4.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v5.py
          python -m py_compile ReleaseOps/mobile/test_validate_app_device_evidence_v6.py
      - name: Run complete V2 through V6 evidence regressions
        working-directory: ReleaseOps/mobile
        run: |
          python -m unittest -v test_validate_app_device_evidence_v2.py
          python -m unittest -v test_validate_app_device_evidence_v3.py
          python -m unittest -v test_validate_app_device_evidence_v4.py
          python -m unittest -v test_validate_app_device_evidence_v5.py
          python -m unittest -v test_validate_app_device_evidence_v6.py
      - name: Verify V6 preserves authoritative pending truth
        env:
          PYTHONPATH: ReleaseOps/mobile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from validate_app_device_evidence_v5 import APPROVED_METHODS, RAW_MARKERS
          from validate_app_device_evidence_v6 import APPROVED_LIFECYCLE_METHOD, REQUIRED_MARKERS
          p=Path('ReleaseOps/apps_factory/THF_APPS_PHYSICAL_DEVICE_EVIDENCE_REGISTRY_V1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          required=set(d['required_checks'])
          semantic_required=required-{'crash_free'}
          assert set(APPROVED_METHODS)==semantic_required
          assert set(RAW_MARKERS)==semantic_required
          assert {'touch','orientation','background_resume'} <= required
          assert APPROVED_LIFECYCLE_METHOD == 'adb-shell-lifecycle-transcript-v1'
          assert len(REQUIRED_MARKERS) >= 8
          assert d['truth_boundary']['all_pending'] is True
          assert d['truth_boundary']['final_or_play_ready'] is False
          assert len(d['candidates'])==10
          assert all(row['status']=='PENDING_PHYSICAL_PHONE' for row in d['candidates'])
          print('APP_CANDIDATES=10')
          print('LIFECYCLE_TOUCH_ORIENTATION_SINGLE_TRANSCRIPT_REQUIRED=TRUE')
          print('BACKGROUND_RESUME_SAME_PID_REQUIRED=TRUE')
          print('EXACT_CANDIDATE_AND_SOURCE_LINEAGE_REQUIRED=TRUE')
          print('PHYSICAL_DEVICE_STATUS=PENDING')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
