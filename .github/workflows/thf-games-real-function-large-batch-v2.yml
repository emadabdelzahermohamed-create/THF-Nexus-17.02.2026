name: THF Games Real-Function Large Batch V2

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/scripts/thf_game_real_function_audit_v2.py'
      - 'ReleaseOps/tests/test_thf_game_real_function_audit_v2.py'
      - '.github/workflows/thf-games-real-function-large-batch-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Regression tests
        run: |
          python3 -m py_compile ReleaseOps/scripts/thf_game_real_function_audit_v2.py
          python3 -m unittest ReleaseOps/tests/test_thf_game_real_function_audit_v2.py
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: { project_id: '${{ env.GCP_PROJECT_ID }}' }
      - name: Stage read-only audit tool
        run: |
          gcloud compute scp ReleaseOps/scripts/thf_game_real_function_audit_v2.py \
            "$GCP_BUILDER:/tmp/thf_game_real_function_audit_v2.py" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Audit authoritative THF game sources
        shell: bash
        run: |
          set -Eeuo pipefail; mkdir -p out
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='bash -s' > out/large_batch.txt <<'REMOTE'
          set -Eeuo pipefail
          ROOT="$HOME/thf-games-real-function-v2"; rm -rf "$ROOT"; mkdir -p "$ROOT"
          audit_zip() {
            kind="$1"; src="$2"; expected="$3"; tag="$4"; work="$ROOT/$tag"
            echo "=== $tag ==="; echo "kind=$kind"; echo "canonical_sha256=$expected"
            test -f "$src" || { echo source_missing=true; return 0; }
            actual=$(sha256sum "$src"|awk '{print $1}'); echo "actual_sha256=$actual"
            [ "$actual" = "$expected" ] || { echo sha_mismatch=true; return 0; }
            mkdir -p "$work"
            python3 - "$src" "$work" <<'PY'
import pathlib,sys,zipfile,shutil
src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2]).resolve()
with zipfile.ZipFile(src) as z:
  for i in z.infolist():
    r=pathlib.PurePosixPath(i.filename)
    if r.is_absolute() or '..' in r.parts: raise SystemExit('unsafe zip member')
    t=(dst/pathlib.Path(*r.parts)).resolve()
    if t!=dst and dst not in t.parents: raise SystemExit('zip escape')
    if i.is_dir(): t.mkdir(parents=True,exist_ok=True); continue
    t.parent.mkdir(parents=True,exist_ok=True)
    with z.open(i) as a, open(t,'wb') as b: shutil.copyfileobj(a,b)
PY
            find "$work" -type f | wc -l | awk '{print "file_count=" $1}'
            set +e
            python3 /tmp/thf_game_real_function_audit_v2.py "$work" --kind "$kind" --json-out "$ROOT/$tag.json" >/dev/null
            rc=$?
            set -e
            echo "source_contract_exit=$rc"
            python3 - "$ROOT/$tag.json" <<'PY'
import json,sys
x=json.load(open(sys.argv[1])); print('source_contract_status='+x['source_contract_status']); print('device_status='+x['device_status']); print('required_failures='+','.join(x['summary']['required_failures'])); print('pass_count='+str(x['summary']['pass_count']))
PY
            [ "$(sha256sum "$src"|awk '{print $1}')" = "$expected" ] || exit 91
          }
          audit_zip terra "$HOME/thf-terra-rc34-gate/input/THF_Terra_v4.6.8_RC34_REMOTE_LOD_HYSTERESIS_CUMULATIVE_SOURCE.zip" eaa2ae79b4f85781903e7c7909910758344422209baa650cf7cf9fd397bdbd68 terra_rc34
          audit_zip rift "$HOME/thf-rift-rc37-gate/input/THF_Rift_v4.7.1_RC37_HUMAN_RELOAD_TIMING_PARITY_CUMULATIVE_SOURCE.zip" 3e2407d4aa76d4d23f4f0a0c3ccb02f02f1a9522b42518a38c03e0f01775e914 rift_rc37
          audit_zip learn "$HOME/thf-small-learn-games/src/08_THF_LEARN_GAMES/SOURCE/THF_LEARN_GAMES_P49_RC2_SOURCE.zip" dbd259b224924e60902fb0e1b2ebca77bc243e5f29a64d04fd3114438fd41484 learn_rc2
          audit_zip fitness "$HOME/thf-small-fitness-games/src/09_THF_FITNESS_GAMES/SOURCE/THF_FITNESS_GAMES_P49_RC2_SOURCE.zip" da3c865a76848c170d679547e05d6edbc0b5ffd6a48002b12ad0d26415fd0273 fitness_rc2
          echo '=== spark_rush_discovery ==='
          find "$HOME" -type f \( -iname '*spark*.zip' -o -iname '*rush*.zip' \) \
            ! -path '*/wave-mawja/*' ! -path '*/WAVE*/*' 2>/dev/null | head -40 | while read -r f; do
              printf 'candidate=%s sha256=%s\n' "${f#$HOME/}" "$(sha256sum "$f"|awk '{print $1}')"
            done
          echo 'canonical_archives_mutated=false'
          echo 'wave_files_read_or_changed=false'
          echo 'device_acceptance=PENDING'
          REMOTE
      - name: Retrieve JSON evidence
        run: |
          gcloud compute scp --recurse "$GCP_BUILDER:~/thf-games-real-function-v2/*.json" out/ \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-GAMES-REAL-FUNCTION-LARGE-BATCH-V2
          path: out/
          retention-days: 14
      - name: Safety assertions
        run: |
          grep -q '^canonical_archives_mutated=false$' out/large_batch.txt
          grep -q '^wave_files_read_or_changed=false$' out/large_batch.txt
          grep -q '^device_acceptance=PENDING$' out/large_batch.txt
