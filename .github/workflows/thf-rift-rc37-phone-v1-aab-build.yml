name: THF Rift RC37 Superseded Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-rift-rc37-phone-v1-aab-build.yml'
      - 'ReleaseOps/games/LATEST_GAME_AUTHORITY_V1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Refuse stale RC37 build or promotion
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('ReleaseOps/games/LATEST_GAME_AUTHORITY_V1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=d['games']['rift']
          assert r['authoritative_version']=='4.7.5-rc41'
          assert r['authoritative_source_sha256']=='29edaa0eb594a25d0960cb176765663f9bab3d91a60fd98016474ff5695cb95d'
          assert r['eligible_candidate_apk_sha256'] is None
          assert r['physical_device_status']=='PENDING'
          assert d['final_or_play_ready'] is False
          print('RIFT_RC37_BUILD_LANE=RETIRED_SUPERSEDED')
          print('RIFT_LATEST_AUTHORITY=4.7.5-rc41')
          print('RIFT_RC41_CANDIDATE_APK=NONE')
          print('PHYSICAL_DEVICE_STATUS=PENDING')
          print('FINAL_OR_PLAY_READY=FALSE')
          PY
