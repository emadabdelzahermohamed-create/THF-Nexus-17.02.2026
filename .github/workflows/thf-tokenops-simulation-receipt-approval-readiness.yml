name: THF TokenOps Simulation Receipt Approval Readiness Gate

on:
  push:
    branches:
      - 'tokenops/**'
    paths:
      - 'ReleaseOps/TokenOps/simulation_receipt_approval_readiness.py'
      - 'ReleaseOps/TokenOps/test_simulation_receipt_approval_readiness.py'
      - '.github/workflows/thf-tokenops-simulation-receipt-approval-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  THF_TOKEN_MINT: HjCHpu3tLRGCkJtZyUjzCKHv47usxWcMcqwhkaeBpjiv

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run fail-closed unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ReleaseOps/TokenOps
          python3 -m unittest -v test_simulation_receipt_approval_readiness.py |& tee simulation-receipt-approval-readiness-tests.log

      - name: Build deterministic safety evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tokenops-simulation-receipt-approval-readiness-evidence
          cp ReleaseOps/TokenOps/simulation_receipt_approval_readiness.py tokenops-simulation-receipt-approval-readiness-evidence/
          cp ReleaseOps/TokenOps/test_simulation_receipt_approval_readiness.py tokenops-simulation-receipt-approval-readiness-evidence/
          cp ReleaseOps/TokenOps/simulation-receipt-approval-readiness-tests.log tokenops-simulation-receipt-approval-readiness-evidence/
          cat > tokenops-simulation-receipt-approval-readiness-evidence/SAFETY.txt <<'EOF'
          CANONICAL_NETWORK=solana-mainnet-beta
          CANONICAL_MINT=HjCHpu3tLRGCkJtZyUjzCKHv47usxWcMcqwhkaeBpjiv
          SIMULATION_RECEIPT_HASH_BOUND=TRUE
          APPROVER_IDENTITIES_COLLECTED=FALSE
          APPROVALS_COLLECTED=0
          SIGNATURES_COLLECTED=0
          SIGNATURE_MATERIAL_ALLOWED=FALSE
          TRANSACTION_BYTES_CREATED=FALSE
          TRANSACTION_CREATED=FALSE
          TRANSACTION_SIGNED=FALSE
          TRANSACTION_SUBMITTED=FALSE
          BROADCAST_ALLOWED=FALSE
          EXECUTION_AUTHORIZED=FALSE
          FINANCIAL_EFFECT=FALSE
          PRIVATE_KEY_USED=FALSE
          EXTERNAL_MULTISIG_REQUIRED=TRUE
          USER_CONTROLLED_APPROVAL_REQUIRED=TRUE
          WAVE_UNTOUCHED=TRUE
          EOF
          (
            cd tokenops-simulation-receipt-approval-readiness-evidence
            sha256sum simulation_receipt_approval_readiness.py test_simulation_receipt_approval_readiness.py simulation-receipt-approval-readiness-tests.log SAFETY.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Assert safety evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          f=tokenops-simulation-receipt-approval-readiness-evidence/SAFETY.txt
          grep -qx 'SIMULATION_RECEIPT_HASH_BOUND=TRUE' "$f"
          grep -qx 'APPROVER_IDENTITIES_COLLECTED=FALSE' "$f"
          grep -qx 'APPROVALS_COLLECTED=0' "$f"
          grep -qx 'SIGNATURES_COLLECTED=0' "$f"
          grep -qx 'SIGNATURE_MATERIAL_ALLOWED=FALSE' "$f"
          grep -qx 'TRANSACTION_BYTES_CREATED=FALSE' "$f"
          grep -qx 'TRANSACTION_SIGNED=FALSE' "$f"
          grep -qx 'TRANSACTION_SUBMITTED=FALSE' "$f"
          grep -qx 'BROADCAST_ALLOWED=FALSE' "$f"
          grep -qx 'EXECUTION_AUTHORIZED=FALSE' "$f"
          grep -qx 'FINANCIAL_EFFECT=FALSE' "$f"
          grep -qx 'PRIVATE_KEY_USED=FALSE' "$f"
          grep -qx 'WAVE_UNTOUCHED=TRUE' "$f"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Simulation-Receipt-Approval-Readiness-Gate
          path: tokenops-simulation-receipt-approval-readiness-evidence/
          if-no-files-found: error
          retention-days: 30
