name: THF Account Endpoint Contract Inventory V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-account-endpoint-contract-inventory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect request/auth contract through IAP
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command='set -Eeuo pipefail
          ROOT="$HOME/thf-runtime-s1/runtime/THF_NEXUS_6_FINAL"; cd "$ROOT"
          echo THF_ACCOUNT_ENDPOINT_CONTRACT_V1_BEGIN
          echo APP_ROUTE_CONTEXT_BEGIN
          nl -ba src/thf/app.py | sed -n "55,230p"
          echo APP_ROUTE_CONTEXT_END
          echo IDENTITY_CONTEXT_BEGIN
          nl -ba src/thf/identity/service.py | sed -n "1,240p"
          echo IDENTITY_CONTEXT_END
          echo RUNTIME_CONTEXT_BEGIN
          nl -ba src/thf/platform/runtime.py | sed -n "1,200p"
          echo RUNTIME_CONTEXT_END
          printf "DETERMINISTIC_SOURCE_SHA256="; find src clients -type f -not -path "*/wave-mawja/*" -not -path "*/__pycache__/*" -not -name "*.pyc" -not -name "*.pyo" -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | awk "{print \$1}"
          if find . \( -path "*wave-mawja*" -o -path "*WAVE_MAWJA*" \) -print -quit | grep -q .; then exit 9; fi
          echo THF_RUNTIME_WAVE_ISOLATION=PASS
          echo MUTATION_PERFORMED=FALSE
          echo THF_ACCOUNT_ENDPOINT_CONTRACT_V1_END'
