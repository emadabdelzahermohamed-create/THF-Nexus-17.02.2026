name: THF Spark Rush Game-Like Contract V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thf-spark-rush-game-like-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  exact-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: spark
            profile: learning
            source_sha: dc312dc65e681e914c3421a20362cd0fba0c1e692a7becdb66d7d17a0b6299a0
            drive_id: 1FFOkrjtEhKz_Ubj-MErw5UB7tQzZHZ7k
          - app: rush
            profile: fitness
            source_sha: bd7e365ded07fd569020fff1c699d74322fd5c767b16ac6336f2bc99f8b5958b
            drive_id: 1AX9eoqi8I8SJRKmJSb6czFyjIif-JFxD
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - id: audit
        name: Verify exact source and audit game-like contract
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          APP: ${{ matrix.app }}
          PROFILE: ${{ matrix.profile }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          DRIVE_ID: ${{ matrix.drive_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out src/extracted
          code=$(curl -sSLo src/app.zip -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$DRIVE_ID?alt=media&supportsAllDrives=true")
          [ "$code" = 200 ]
          actual=$(sha256sum src/app.zip | awk '{print $1}')
          [ "$actual" = "$SOURCE_SHA" ]
          unzip -tq src/app.zip >/dev/null
          unzip -q src/app.zip -d src/extracted
          root=$(find src/extracted -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
          test -n "$root"
          set +e
          python ReleaseOps/validators/audit_game_like_real_function.py "$root" --profile "$PROFILE" --json-out "out/$APP.game-like-contract.json"
          audit_rc=$?
          set -e
          python - "$APP" "$PROFILE" "$SOURCE_SHA" "out/$APP.game-like-contract.json" "$GITHUB_OUTPUT" > "out/$APP.summary.txt" <<'PY'
          import json,re,sys
          app,profile,sha,path,out=sys.argv[1:]
          d=json.load(open(path))
          missing=d['missing_required_signals']
          key='none' if not missing else '+'.join(re.sub(r'[^A-Za-z0-9_.+-]','_',x) for x in missing)
          print(f'APP={app}')
          print(f'PROFILE={profile}')
          print(f'SOURCE_SHA256={sha}')
          print(f'FILES_SCANNED={d["files_scanned"]}')
          print(f'GAME_LIKE_SOURCE_CONTRACT={d["source_contract"]}')
          print(f'MISSING_REQUIRED_SIGNALS={",".join(missing) if missing else "none"}')
          print('READINESS_PROMOTION=NO')
          print('PHYSICAL_DEVICE_REQUIRED=YES')
          with open(out,'a') as f:
              f.write(f'status={d["source_contract"]}\n')
              f.write(f'missing_key={key}\n')
          PY
          echo "audit_rc=$audit_rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-${{ matrix.app }}-GAME-LIKE-${{ steps.audit.outputs.status }}-${{ steps.audit.outputs.missing_key }}
          path: out/
          retention-days: 14
      - name: Enforce game-like contract
        if: always()
        shell: bash
        run: |
          test "${{ steps.audit.outputs.status }}" = "PASS"
