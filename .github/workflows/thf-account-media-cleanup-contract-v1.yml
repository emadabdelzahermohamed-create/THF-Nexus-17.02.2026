name: THF Account Media Cleanup Contract V1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-account-media-cleanup-contract-v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
  EXPECTED_ARCHIVE_SHA256: 8c060bdb7776ccf485b6294cda513a75b0fd3be28d43a416431d1368260a4884

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Authenticate with WIF
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inspect exact cleanup contracts through IAP
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command="set -Eeuo pipefail
            ARCHIVE=\"\$HOME/thf-runtime-s1/outer/01_THF_NEXUS_SUITE/SOURCE/THF_NEXUS_6_FINAL_SOURCE_20260829.zip\"; test -f \"\$ARCHIVE\"
            SHA=\$(sha256sum \"\$ARCHIVE\" | awk '{print \$1}'); echo CANONICAL_ARCHIVE_SHA256=\$SHA; test \"\$SHA\" = \"$EXPECTED_ARCHIVE_SHA256\"
            TMP=\$(mktemp -d /tmp/thf-media-cleanup-contract-v1.XXXXXX); trap 'rm -rf \"\$TMP\"' EXIT
            unzip -q \"\$ARCHIVE\" -d \"\$TMP/extracted\"; ROOT=\"\$TMP/extracted/THF_NEXUS_6_FINAL\"
            echo THF_ACCOUNT_MEDIA_CLEANUP_CONTRACT_V1_BEGIN
            echo MEDIA_SERVICE_BEGIN; nl -ba \"\$ROOT/src/thf/media/service.py\" | sed -n '1,230p'; echo MEDIA_SERVICE_END
            echo AVATAR_SERVICE_BEGIN; nl -ba \"\$ROOT/src/thf/avatar/service.py\" | sed -n '1,150p'; echo AVATAR_SERVICE_END
            echo DB_MEDIA_AVATAR_SCHEMA_BEGIN; nl -ba \"\$ROOT/src/thf/infrastructure/database.py\" | sed -n '70,175p'; echo DB_MEDIA_AVATAR_SCHEMA_END
            echo RUNTIME_BEGIN; nl -ba \"\$ROOT/src/thf/app.py\" | sed -n '35,60p'; echo RUNTIME_END
            if find \"\$ROOT\" \( -path '*wave-mawja*' -o -path '*WAVE_MAWJA*' \) -print -quit | grep -q .; then exit 9; fi
            echo THF_SOURCE_WAVE_ISOLATION=PASS; echo MUTATION_PERFORMED=FALSE; echo WAVE_UNTOUCHED=TRUE
            echo THF_ACCOUNT_MEDIA_CLEANUP_CONTRACT_V1_END"
