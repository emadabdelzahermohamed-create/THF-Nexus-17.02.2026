name: Rescue Canonical APK AAB Factory
on:
  push:
    branches: ['rescue/one-day-mobile-20261014']
    paths:
      - '.github/workflows/rescue-canonical-aab.yml'
      - 'ReleaseOps/verify_canonical_android_artifacts.sh'
      - 'ReleaseOps/RESCUE_CANONICAL_AAB_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
      GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/drive.readonly
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Fetch SHA-pinned canonical sources
        shell: bash
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          mkdir -p input work canonical-out evidence
          cat > specs <<'EOF'
          Forge THF_Forge_PHONE_FUNDAMENTALS_SRC3.zip 1Fdx6knYWGLAQ7dYnDH5dGu-j8qF32A6E 75c3744af31f16273a174bdac53b9e812613e4d9ef8c2fa260521c7f7c40cbf8
          Echo THF_Echo_PHONE_FUNDAMENTALS_SRC3.zip 1YnRTB_CSUwd7q6myLKkG2Pi_3qJ_A3Vw 3c90b53009d34e9c391bc8f977daf70195a041ba6c0098eca82709932b8734e9
          Codex THF_Codex_PHONE_FUNDAMENTALS_SRC3.zip 1wHhUcCZKvUmxIFOkzSFwqc8QDslW2brn 44ff76cca12b6b13febc53e9e0b8748a01949eb07c40b020d76b82f45a094950
          Vault THF_Vault_PHONE_FUNDAMENTALS_SRC3.zip 1gqG6UVCA4CkpEJpF7fDO5kq2kF-o6cJ7 e33c7c7f1f6d7f913dfe6ca5d674aff2883f7a230c2a323724088c30c4497585
          Signal THF_Signal_PHONE_FUNDAMENTALS_SRC3.zip 10qPO33KG8lL7KWKmoRO2nxJDZSj4eSw4 3b6ba96076decd62e31a90c60d91a101806d6a6e9be329a58baa55ece82227ef
          Command THF_Command_PHONE_FUNDAMENTALS_SRC3.zip 1JtABZ7SNGuJ5jKoYc2xlj5f2nSvdBs2y 314a89f33f62d754edc9cc369fcc35b019d6081c6be0dcfbffa0fe5801ce0ffc
          EOF
          : > evidence/source-sha.txt
          while read -r app name id want; do
            code=$(curl -sS -L --retry 2 -o "input/$name" -w '%{http_code}' -H "Authorization: Bearer $DRIVE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/${id}?alt=media")
            test "$code" = 200
            got=$(sha256sum "input/$name" | awk '{print $1}')
            test "$got" = "$want"
            unzip -tq "input/$name" >/dev/null
            echo "$app $got" | tee -a evidence/source-sha.txt
          done < specs
      - name: Test and build APK plus AAB
        shell: bash
        run: |
          set -u
          : > evidence/build-report.txt
          while read -r app name id want; do
            d="work/$app"; o="canonical-out/$app"
            rm -rf "$d" "$o"; mkdir -p "$d" "$o"
            unzip -q "input/$name" -d "$d"
            wrapper=$(find "$d" -type f -name gradlew -print -quit || true)
            build=$(find "$d" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit || true)
            status=NO_BUILD_ENTRYPOINT
            if [[ -n "$wrapper" ]]; then
              p=$(dirname "$wrapper"); chmod +x "$wrapper"
              (cd "$p" && ./gradlew --no-daemon test assembleDebug bundleRelease); rc=$?
            elif [[ -n "$build" ]]; then
              p=$(dirname "$build")
              (cd "$p" && gradle --no-daemon test assembleDebug bundleRelease); rc=$?
            else
              rc=2
            fi
            [[ $rc -eq 0 ]] && status=BUILD_OK || status=BUILD_FAILED
            find "$d" -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | while IFS= read -r -d '' f; do cp "$f" "$o/$(basename "$f")"; done
            echo "$app status=$status apk=$(find "$o" -name '*.apk' | wc -l) aab=$(find "$o" -name '*.aab' | wc -l)" | tee -a evidence/build-report.txt
          done < specs
      - name: Verify artifacts
        shell: bash
        run: bash ReleaseOps/verify_canonical_android_artifacts.sh canonical-out evidence/package-verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THF-canonical-apk-aab-candidates
          path: |
            canonical-out/
            evidence/
          if-no-files-found: warn
          retention-days: 30
