name: THF TokenOps Autonomous Large Batch v3

on:
  push:
    branches: [main]
    paths:
      - 'ReleaseOps/TokenOps/**'
      - '.github/workflows/thf-tokenops-autonomous-large-batch-v3.yml'
  pull_request:
    paths:
      - 'ReleaseOps/TokenOps/**'
      - '.github/workflows/thf-tokenops-autonomous-large-batch-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thf-tokenops-autonomous-large-batch-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-tokenops-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Compile TokenOps control plane
        run: |
          set -euo pipefail
          python -m py_compile ReleaseOps/TokenOps/tokenops_guard.py
          python -m py_compile ReleaseOps/TokenOps/financial_control_plane.py
          python -m py_compile ReleaseOps/TokenOps/activity_planning.py
          python -m py_compile ReleaseOps/TokenOps/epoch_commitment.py
          python -m py_compile ReleaseOps/TokenOps/revenue_value_basis.py
          python -m py_compile ReleaseOps/TokenOps/blocker_resolution.py
          python -m py_compile ReleaseOps/TokenOps/operation_readiness.py
          python -m py_compile ReleaseOps/TokenOps/recent_activity_semantics.py
          python -m py_compile ReleaseOps/TokenOps/source_provenance.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run TokenOps regression suite
        run: python -m pytest ReleaseOps/TokenOps -q

      - name: Run fresh Solana Mainnet read-only invariant audit
        run: |
          set -euo pipefail
          rm -rf out/tokenops-v3
          python ReleaseOps/TokenOps/tokenops_guard.py --out out/tokenops-v3
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('out/tokenops-v3/token-audit.json').read_text())
          g=json.loads(Path('out/tokenops-v3/invariant-gate.json').read_text())
          r=json.loads(Path('out/tokenops-v3/financial-readiness.json').read_text())
          print('MAINNET_AUDIT_OBSERVED_AT_UTC=' + str(a['observed_at_utc']))
          print('MAINNET_SLOT=' + str(a['slot']))
          print('PROGRAM_ID=' + str(a['program_id']))
          print('DECIMALS=' + str(a['decimals']))
          print('SUPPLY_RAW=' + str(a['supply_raw']))
          print('SUPPLY_UI=' + str(a['supply_ui']))
          print('MINT_AUTHORITY=' + str(a['mint_authority']))
          print('FREEZE_AUTHORITY=' + str(a['freeze_authority']))
          print('RECENT_ACTIVITY_STATUS=' + str(a['recent_address_activity'].get('status')))
          print('RECENT_ACTIVITY_COUNT=' + str(a['recent_address_activity'].get('count')))
          print('HOLDER_CONCENTRATION_STATUS=' + str(a['holder_concentration'].get('status')))
          if a['holder_concentration'].get('status') == 'ok':
              print('TOP1_BPS=' + str(a['holder_concentration'].get('top1_bps')))
              print('TOP5_BPS=' + str(a['holder_concentration'].get('top5_bps')))
              print('TOP20_BPS=' + str(a['holder_concentration'].get('top20_bps')))
          print('INVARIANT_GATE=' + str(g['status']))
          print('FINANCIAL_READINESS=' + str(r['status']))
          print('READINESS_BLOCKERS=' + ','.join(r['blockers']))
          PY

      - name: Classify recent mint-address activity without persisting signatures
        run: |
          set -euo pipefail
          python ReleaseOps/TokenOps/recent_activity_semantics.py --out out/tokenops-v3/recent-activity-semantics.json --limit 10
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/tokenops-v3/recent-activity-semantics.json').read_text())
          assert p['signatures_persisted'] is False
          assert p['financial_effect'] is False
          assert p['broadcast'] is False
          assert p['wave_touched'] is False
          print('SEMANTIC_STATUS=' + str(p['status']))
          print('SEMANTIC_COMPLETE=' + str(p['analysis_complete']))
          print('SEMANTIC_TX_ANALYZED=' + str(p['transactions_analyzed']))
          print('SEMANTIC_MINT_COUNT=' + str(p['mint_instruction_count']))
          print('SEMANTIC_BURN_COUNT=' + str(p['burn_instruction_count']))
          print('SEMANTIC_AUTHORITY_COUNT=' + str(p['set_authority_instruction_count']))
          print('SEMANTIC_TRANSFER_COUNT=' + str(p['transfer_instruction_count']))
          PY

      - name: Bind evidence to deterministic TokenOps source provenance
        run: |
          set -euo pipefail
          python ReleaseOps/TokenOps/source_provenance.py --out out/tokenops-v3/source-provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/tokenops-v3/source-provenance.json').read_text())
          assert p['source_commit_sha']
          assert p['wave_in_inventory'] is False
          assert p['wave_touched'] is False
          assert p['financial_effect'] is False
          assert p['broadcast'] is False
          print('SOURCE_COMMIT_SHA=' + str(p['source_commit_sha']))
          print('TOKENOPS_SOURCE_ROOT_SHA256=' + str(p['tokenops_source_root_sha256']))
          print('TOKENOPS_SOURCE_INVENTORY_COUNT=' + str(p['inventory_count']))
          PY

      - name: Compile exact blocker-resolution and authorization packet
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from ReleaseOps.TokenOps.blocker_resolution import build_resolution_packet, summarize_required_authorizations

          out = Path('out/tokenops-v3')
          readiness = json.loads((out / 'financial-readiness.json').read_text())
          packet = build_resolution_packet(readiness)
          summary = summarize_required_authorizations(packet)
          assert packet['execution']['execution_authorized'] is False
          assert packet['execution']['transaction_bytes_created'] is False
          assert packet['execution']['instruction_bytes_created'] is False
          assert packet['execution']['signed'] is False
          assert packet['execution']['submitted'] is False
          assert packet['execution']['broadcast'] is False
          assert packet['execution']['financial_effect'] is False
          assert packet['execution']['private_key_required'] is False
          assert packet['execution']['wave_touched'] is False
          assert summary['signer_action_now'] == 'NONE'
          (out / 'blocker-resolution.json').write_text(json.dumps(packet, sort_keys=True, indent=2) + '\n')
          (out / 'authorization-summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print('BLOCKER_RESOLUTION_STATUS=' + packet['status'])
          print('BLOCKER_RESOLUTION_COUNT=' + str(packet['blocker_count']))
          print('UNKNOWN_BLOCKER_COUNT=' + str(len(packet['unknown_blockers'])))
          print('SIGNER_ACTION_NOW=' + summary['signer_action_now'])
          PY

      - name: Compile per-operation treasury and multisig readiness matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from ReleaseOps.TokenOps.operation_readiness import build_operation_matrix, summarize_matrix

          out = Path('out/tokenops-v3')
          audit = json.loads((out / 'token-audit.json').read_text())
          readiness = json.loads((out / 'financial-readiness.json').read_text())
          treasury_policy = json.loads(Path('ReleaseOps/TokenOps/treasury_policy.json').read_text())
          treasury_registry = json.loads(Path('ReleaseOps/TokenOps/treasury_registry.json').read_text())
          matrix = build_operation_matrix(
              readiness,
              treasury_policy,
              treasury_registry,
              observed_slot=int(audit['slot']),
              current_supply_raw=int(audit['supply_raw']),
          )
          summary = summarize_matrix(matrix)
          assert matrix['execution_authorized'] is False
          assert matrix['signed'] is False
          assert matrix['submitted'] is False
          assert matrix['broadcast'] is False
          assert matrix['financial_effect'] is False
          assert matrix['private_key_required'] is False
          assert matrix['wave_touched'] is False
          assert matrix['exact_signer_action_now'] == 'NONE'
          assert matrix['unmapped_global_blockers'] == []
          (out / 'operation-readiness.json').write_text(json.dumps(matrix, sort_keys=True, indent=2) + '\n')
          (out / 'operation-readiness-summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print('OPERATION_MATRIX_STATUS=' + matrix['status'])
          print('TREASURY_RECONCILIATION_STATUS=' + matrix['treasury_reconciliation']['status'])
          print('TREASURY_ACCOUNT_COUNT=' + str(matrix['treasury_reconciliation']['account_count']))
          print('OPERATION_UNMAPPED_BLOCKERS=' + str(len(matrix['unmapped_global_blockers'])))
          for name, data in sorted(matrix['operations'].items()):
              print('OPERATION_' + name.upper() + '=' + data['status'])
              print('OPERATION_' + name.upper() + '_MIN_APPROVALS=' + str(data['minimum_approvals']))
          print('EXACT_SIGNER_ACTION_NOW=' + matrix['exact_signer_action_now'])
          PY

      - name: Prove current financial policy remains fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from ReleaseOps.TokenOps.epoch_commitment import build_epoch_commitment, build_double_entry_preview

          policy = json.loads(Path('ReleaseOps/TokenOps/policy.json').read_text())
          treasury_validation = {
              'status': 'FAIL_CLOSED',
              'role_balances_raw': {},
              'source': 'authoritative treasury policy has no verified public treasury accounts yet',
          }
          packet = build_epoch_commitment(
              policy,
              treasury_validation,
              'ci-current-policy-proof',
              1_000_000,
              [{'subject_ref': 'synthetic-ci-subject', 'activity_units': 1}],
              ['0' * 64],
          )
          assert packet['status'] == 'FAIL_CLOSED'
          assert packet['execution_authorized'] is False
          assert packet['signed'] is False
          assert packet['submitted'] is False
          assert packet['broadcast'] is False
          assert packet['financial_effect'] is False
          assert packet['transaction_bytes_created'] is False
          assert packet['instruction_bytes_created'] is False
          accounting = build_double_entry_preview(packet)
          assert accounting['balanced'] is True
          assert accounting['posted'] is False
          assert accounting['financial_effect'] is False
          out = Path('out/tokenops-v3')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'epoch-commitment-failclosed-proof.json').write_text(json.dumps(packet, sort_keys=True, indent=2) + '\n')
          (out / 'accounting-preview.json').write_text(json.dumps(accounting, sort_keys=True, indent=2) + '\n')
          print('CURRENT_POLICY_FAIL_CLOSED=PASS')
          print('EPOCH_PACKET_BLOCKERS=' + ','.join(packet['blockers']))
          PY

      - name: Create SHA-256 evidence manifest
        run: |
          set -euo pipefail
          cd out/tokenops-v3
          sha256sum *.json | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '## THF TokenOps v3 read-only evidence'
            echo ''
            echo "Source SHA: $GITHUB_SHA"
            echo ''
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
            echo ''
            echo 'No signing, submission, broadcast, transfer, burn, authority change, treasury migration, settlement, DAO execution, private-key handling, signature persistence, or WAVE mutation is performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce no executable financial payload files
        run: |
          set -euo pipefail
          if find out/tokenops-v3 -type f \( -name '*.txn' -o -name '*.tx' -o -name '*.key' -o -name '*.keypair' -o -name '*.secret' \) | grep -q .; then
            echo 'Forbidden executable/sensitive payload file detected' >&2
            exit 2
          fi
          echo NON_BROADCAST_PAYLOAD_GATE=PASS

      - name: Upload immutable read-only evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: THF-TokenOps-Autonomous-Large-Batch-v3-${{ github.run_id }}
          path: out/tokenops-v3/
          if-no-files-found: error
          retention-days: 30
