name: THF Apps Vault Signal Buildfix V2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-apps-vault-signal-buildfix-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  repair-build-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - id: auth
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Stage exact Vault and Signal RC3 sources
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          rm -rf src work out && mkdir -p src work out
          cat > src/matrix.tsv <<'EOF'
          vault	RC3	7a2ba4236a0c42d2521fa2eb2c2d7108ceba0d2929ebdf68959a6eacbce4a793	com.topherofit.thf.vault	1OuR6dm89A3aIu0UwcaUVs_VYQJxbReac
          signal	RC3	51d7ce44fed24f7490973bcc7e019a8430157c4d5bfa1541e7cb590b0b7957c0	com.topherofit.thf.signal	1WtqjtPgPxyOPGk5T9FHQTF7lyAzPLBXA
          EOF
          printf 'app\tcheckpoint\tpackage\tsource_sha256\n' > out/source-verified.tsv
          while IFS=$'\t' read -r app cp sha pkg fid; do
            f="src/$app.zip"
            code=$(curl -sSLo "$f" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$fid?alt=media&supportsAllDrives=true")
            [ "$code" = 200 ]
            unzip -tq "$f" >/dev/null
            actual=$(sha256sum "$f" | awk '{print $1}')
            [ "$actual" = "$sha" ]
            mkdir -p "work/$app" && unzip -q "$f" -d "work/$app"
            printf '%s\t%s\t%s\t%s\n' "$app" "$cp" "$pkg" "$actual" >> out/source-verified.tsv
          done < src/matrix.tsv

      - name: Apply deterministic JsonOutput Gradle buildfix overlay
        run: |
          set -Eeuo pipefail
          printf 'app\toriginal_gradle_sha256\tpatched_gradle_sha256\tbuildfix\n' > out/buildfix.tsv
          for app in vault signal; do
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            test -n "$root"
            f="$root/android/app/build.gradle"
            cp "$f" "out/$app.build.gradle.before"
            before=$(sha256sum "$f" | awk '{print $1}')
            python3 - "$f" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          lines=p.read_text().splitlines()
          hits=0
          for i,line in enumerate(lines):
              if "buildConfigField 'String', 'THF_BASE_URL'" in line:
                  lines[i]="        buildConfigField 'String', 'THF_BASE_URL', groovy.json.JsonOutput.toJson(baseUrl)"
                  hits += 1
              elif "buildConfigField 'String', 'THF_PASS_URL'" in line:
                  lines[i]="        buildConfigField 'String', 'THF_PASS_URL', groovy.json.JsonOutput.toJson(passUrl)"
                  hits += 1
          if hits != 2:
              raise SystemExit(f'EXPECTED_TWO_BUILD_CONFIG_LINES_FOUND_{hits}')
          p.write_text('\n'.join(lines)+'\n')
          PY
            cp "$f" "out/$app.build.gradle.after"
            diff -u "out/$app.build.gradle.before" "out/$app.build.gradle.after" > "out/$app.buildfix.diff" || true
            after=$(sha256sum "$f" | awk '{print $1}')
            [ "$before" != "$after" ]
            grep -q 'groovy.json.JsonOutput.toJson(baseUrl)' "$f"
            grep -q 'groovy.json.JsonOutput.toJson(passUrl)' "$f"
            printf '%s\t%s\t%s\tJSON_OUTPUT_BUILD_CONFIG_OVERLAY_V2\n' "$app" "$before" "$after" >> out/buildfix.tsv
          done
          cat out/buildfix.tsv

      - name: Provision test dependencies
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/thf-test-venv"
          . "$RUNNER_TEMP/thf-test-venv/bin/activate"
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          req="$RUNNER_TEMP/requirements.txt"; : > "$req"
          find work -type f -name requirements.txt -print0 | xargs -0 cat | sed '/^[[:space:]]*$/d' | sort -u > "$req"
          python -m pip install -r "$req"

      - name: Run regression and real-function source gates
        run: |
          set -Eeuo pipefail
          . "$RUNNER_TEMP/thf-test-venv/bin/activate"
          printf 'app\tcompileall\tpytest\tsource_policy\n' > out/source-tests.tsv
          for app in vault signal; do
            pkg="com.topherofit.thf.$app"
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            python -m compileall -q "$root"
            py=NO_TESTS
            if [ -d "$root/tests" ] && find "$root/tests" -type f -name 'test_*.py' | grep -q .; then
              (cd "$root" && python -m pytest -q) >"out/$app.pytest.log" 2>&1
              py=PASS
            fi
            python ReleaseOps/validators/validate_mobile_real_function_source.py "$root" --package "$pkg" --json-out "out/$app.source-policy.json" >"out/$app.source-policy.log" 2>&1
            printf '%s\tPASS\t%s\tPASS\n' "$app" "$py" >> out/source-tests.tsv
          done
          cat out/source-tests.tsv

      - name: Build QA-sign and exact inspect repaired candidates
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"; ZIPALIGN="$BT/zipalign"
          KS="$RUNNER_TEMP/qa.keystore"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=THF QA,C=US' -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          printf 'app\tcheckpoint\tpackage\tsource_sha256\tbuildfix\tapk_sha256\tpackage_ok\ttarget36_ok\tsignature_ok\tdebuggable\tmin_sdk\tversion_code\tversion_name\n' > out/results.tsv
          while IFS=$'\t' read -r app cp sha pkg fid; do
            root=$(find "work/$app" -type f -path '*/android/app/build.gradle' -printf '%h\n' | sed 's#/android/app$##' | head -1)
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$root/android/local.properties"
            (cd "$root/android" && gradle --no-daemon clean assembleRelease) >"out/$app.gradle.log" 2>&1
            raw=$(find "$root/android" -type f -name '*.apk' -path '*/build/outputs/apk/release/*' | head -1)
            test -n "$raw"
            aligned="out/$app-aligned.apk"; final="out/THF-${app^^}-${cp}-BUILD_FIX_V2-EXACT-QA.apk"
            "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$final" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$final" >"out/$app.signature.txt"
            badging=$("$AAPT" dump badging "$final"); printf '%s\n' "$badging" >"out/$app.badging.txt"
            grep -q "package: name='$pkg'" <<<"$badging"
            grep -q "targetSdkVersion:'36'" <<<"$badging"
            ! grep -q application-debuggable <<<"$badging"
            "$APKSIGNER" verify "$final" >/dev/null
            min=$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vc=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            vn=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
            ah=$(sha256sum "$final" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\tJSON_OUTPUT_BUILD_CONFIG_OVERLAY_V2\t%s\ttrue\ttrue\ttrue\tfalse\t%s\t%s\t%s\n' "$app" "$cp" "$pkg" "$sha" "$ah" "$min" "$vc" "$vn" >> out/results.tsv
            rm -f "$aligned"
          done < src/matrix.tsv
          cat out/results.tsv

      - name: Write truthful readiness summary
        run: |
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('out/results.tsv'),delimiter='\t'))
          fixes=list(csv.DictReader(open('out/buildfix.tsv'),delimiter='\t'))
          d={'schema':2,'mode':'QA_ONLY_REVERSIBLE','production_signing':False,'public_rollout':False,
             'source_authority':'EXACT_RC3_ARCHIVE_SHA_PLUS_DETERMINISTIC_JSON_OUTPUT_BUILD_CONFIG_OVERLAY_V2',
             'apps':rows,'buildfix':fixes,
             'readiness':'EXACT_PACKAGE_INSPECTION_PASS_NOT_FINAL_PHYSICAL_DEVICE_AND_LIVE_BACKEND_GATES_REQUIRED'}
          assert len(rows)==2 and all(r['package_ok']=='true' and r['target36_ok']=='true' and r['signature_ok']=='true' and r['debuggable']=='false' for r in rows)
          json.dump(d,open('out/summary.json','w'),indent=2)
          print('VAULT_SIGNAL_BUILD_FIX_V2_QA=PASS')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: THF-VAULT-SIGNAL-RC3-BUILD-FIX-V2-QA
          path: out/
          retention-days: 14
          compression-level: 0
