name: THF Terra RC34 Retrieve Builds

on:
  push:
    branches: [main]
    paths: ['.github/workflows/thf-terra-rc34-retrieve-builds.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-b5e10d7e-8ce8-4aa4-a15
  GCP_ZONE: europe-west1-b
  GCP_BUILDER: thf-wave-builder
  GCP_WIF_PROVIDER: projects/1035420130588/locations/global/workloadIdentityPools/thf-github-pool/providers/thf-github-provider
  GCP_SERVICE_ACCOUNT: thf-release-builder@project-b5e10d7e-8ce8-4aa4-a15.iam.gserviceaccount.com

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify AAB and build QA APK on private builder
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh "$GCP_BUILDER" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet --command='set -Eeuo pipefail; ROOT="$HOME/thf-terra-rc34-gate"; AAB="$ROOT/out-android-v3/THF-Terra-RC34-test.aab"; PROJ="$ROOT/work-android-v3/android/build"; SDK="$HOME/thf-builder-rc16-build/android-sdk"; test -f "$AAB"; test -d "$SDK"; echo "976a0dbfae6938deda18c98208ec8631c2f893f4cebb166d3f7a2d5c13e51ca5  $AAB" | sha256sum -c -; export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"; cd "$PROJ"; ./gradlew --no-daemon assembleStandardDebug; APK=$(find . -type f -name "*.apk" -path "*/build/outputs/apk/*" | head -1); test -n "$APK"; cp "$APK" "$ROOT/out-android-v3/THF-Terra-RC34-QA.apk"; sha256sum "$AAB" "$ROOT/out-android-v3/THF-Terra-RC34-QA.apk"; echo TERRA_RC34_QA_APK=PASS'
      - name: Retrieve binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p terra-rc34
          gcloud compute scp "$GCP_BUILDER:~/thf-terra-rc34-gate/out-android-v3/THF-Terra-RC34-test.aab" terra-rc34/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          gcloud compute scp "$GCP_BUILDER:~/thf-terra-rc34-gate/out-android-v3/THF-Terra-RC34-QA.apk" terra-rc34/ --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          sha256sum terra-rc34/* | tee terra-rc34/SHA256SUMS.txt
      - name: Upload Terra RC34 QA binaries
        uses: actions/upload-artifact@v4
        with:
          name: THF-Terra-RC34-QA-binaries
          path: terra-rc34/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
